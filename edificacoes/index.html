<ul><li><strong>Calcular a inclinação de telhados</strong> (para garantir o escoamento de águas pluviais).</li>
<li><strong>Dimensionar rampas</strong> (para acessibilidade, segundo as normas).</li>
<li><strong>Calcular a altura de edifícios</strong> (medições indiretas).</li>
<li><strong>Determinar ângulos de taludes</strong> (estabilidade de terrenos).</li>
<li><strong>Dimensionar escadas</strong> (conforto e segurança).</li></ul>
<p>Em Angola, onde a época das chuvas é intensa, o dimensionamento correto da inclinação de telhados é fundamental para evitar infiltrações e garantir a durabilidade das coberturas. Um telhado com inclinação insuficiente acumula água, causando infiltrações e danos estruturais.</p>
<div class="ib"><strong>Pare e pense:</strong> Se um telhado tem uma inclinação de 30%, qual é o ângulo em graus? (Resposta: arctan(0,30) ≈ 16,7°.)</div>
</div>
<div class="cb"><h2><i class="fas fa-shapes"></i> Revisão das Razões Trigonométricas</h2>
<p>Num triângulo retângulo (um triângulo que tem um ângulo de 90°), as razões trigonométricas são definidas da seguinte forma:</p>
<div class="tw"><table class="dt"><tr><th>Razão</th><th>Fórmula</th><th>Mnemónica</th></tr>
<tr><td><strong>Seno (sin)</strong></td><td>sin(θ) = Cateto Oposto / Hipotenusa</td><td>SOH</td></tr>
<tr><td><strong>Cosseno (cos)</strong></td><td>cos(θ) = Cateto Adjacente / Hipotenusa</td><td>CAH</td></tr>
<tr><td><strong>Tangente (tan)</strong></td><td>tan(θ) = Cateto Oposto / Cateto Adjacente</td><td>TOA</td></tr></table></div>
<div class="ib">Num triângulo retângulo, a Hipotenusa é o lado maior (oposto ao ângulo reto), o Cateto Oposto é o lado em frente ao ângulo θ analisado, e o Cateto Adjacente é o lado junto a esse ângulo (excluindo a hipotenusa).</div>
<p><strong>Nota:</strong> θ (teta) é o ângulo que estamos a analisar.</p>
</div>
<div class="cb"><h2><i class="fas fa-house-chimney"></i> Inclinação de Telhados (Declividade)</h2>
<p>A inclinação de um telhado é a relação entre a altura (elevação) e a distância horizontal (vão). Pode ser expressa em <strong>percentagem (%)</strong> ou em <strong>graus (°)</strong>.</p>
<div class="fbox"><div class="f">Inclinação (%) = (Altura / Vão Horizontal) × 100</div><div class="fd">θ = arctan(Altura / Vão Horizontal)</div></div>
<h3>Exemplo Prático – Telhado de uma Moradia</h3>
<p><strong>Problema:</strong> Uma moradia em Luanda tem um telhado de duas águas. O vão horizontal (metade da largura da casa) é de 4 metros. A altura do telhado (do ponto mais baixo ao mais alto) é de 1,2 metros.</p>
<ol><li>Qual é a inclinação do telhado em percentagem?</li><li>Qual é a inclinação em graus?</li><li>Qual é o comprimento da viga (a "perna" do telhado)?</li></ol>
<p><strong>Solução:</strong></p>
<p>1. Inclinação em percentagem: Inclinação = (1,2 / 4) × 100 = 30%</p>
<p>2. Inclinação em graus: θ = arctan(1,2 / 4) = arctan(0,3) ≈ 16,7°</p>
<p>3. Comprimento da viga (hipotenusa): sin(16,7°) = 1,2 / H → H = 1,2 / sin(16,7°) ≈ 4,18 m. Ou, usando o Teorema de Pitágoras: H = √(4² + 1,2²) = √(16 + 1,44) = √17,44 ≈ 4,18 m</p>
<div class="hi">A inclinação é de <strong>30% (≈ 16,7°)</strong>, e a viga tem <strong>4,18 metros de comprimento</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-wheelchair"></i> Rampas para Acessibilidade</h2>
<p>Em Angola, a legislação exige que edifícios públicos e privados tenham rampas de acesso para pessoas com mobilidade reduzida. A inclinação máxima recomendada é de <strong>8%</strong> (≈ 4,6°), de acordo com as normas de acessibilidade.</p>
<p><strong>Exemplo:</strong> Uma rampa deve vencer um desnível de 0,80 m. Qual é o comprimento mínimo da rampa?</p>
<p>Inclinação máxima = 8% = 0,08. Comprimento = Altura / Inclinação = 0,80 / 0,08 = 10 m</p>
<div class="hi">A rampa deve ter pelo menos <strong>10 metros de comprimento</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-stairs"></i> Escadas</h2>
<p>O dimensionamento de escadas baseia-se na relação entre o <strong>espelho</strong> (altura do degrau) e o <strong>piso</strong> (largura do degrau). A fórmula de Blondel é a mais utilizada:</p>
<div class="fbox"><div class="f">2 × Espelho + Piso = 60 a 64 cm</div><div class="fd">Fórmula de Blondel para o conforto de escadas</div></div>
<p><strong>Exemplo:</strong> Um pé-direito de 3,0 m precisa de uma escada. Cada degrau tem um espelho de 0,17 m.</p>
<p>Número de degraus = 3,0 / 0,17 ≈ 17,6 ≈ 18 degraus. Piso = 64 – 2 × 17 = 64 – 34 = 30 cm</p>
<div class="hi">A escada terá <strong>18 degraus</strong> de 0,17 m de espelho e <strong>0,30 m de piso</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-mountain"></i> Taludes (Inclinação de Terrenos)</h2>
<p>Em terraplanagens, a inclinação do talude (declive do terreno) é calculada para garantir a estabilidade.</p>
<p><strong>Exemplo:</strong> Um talude tem 5 m de altura e 12 m de base. Qual é a inclinação?</p>
<p>Inclinação = Altura / Base = 5 / 12 ≈ 0,4167 = 41,7%. Ângulo = arctan(5/12) ≈ 22,6°</p>
</div>
<div class="cb"><h2><i class="fas fa-warehouse"></i> Exercício Prático — Kwanza Construtora, LDA</h2>
<p>A empresa vai construir um telhado de duas águas para um armazém. O vão total é de 12 m (6 m para cada lado). A inclinação do telhado deve ser de 25%.</p>
<ol><li>Qual é a altura do telhado (no ponto mais alto)?</li><li>Qual é o ângulo de inclinação?</li><li>Qual é o comprimento da viga (tramo)?</li><li>Se o telhado for coberto com telhas de zinco que custam Kz 1.500/m², qual é o custo das telhas para uma das águas (assumindo que a largura do armazém é de 20 m)?</li></ol>
<h3>Gabarito comentado</h3>
<p><strong>1. Altura do telhado:</strong> Inclinação = 25% = 0,25. Altura = Vão Horizontal × Inclinação = 6 × 0,25 = 1,5 m</p>
<div class="hi">Altura: <strong>1,5 m</strong></div>
<p><strong>2. Ângulo de inclinação:</strong> θ = arctan(0,25) ≈ 14,0°</p>
<div class="hi">Ângulo: <strong>14,0°</strong></div>
<p><strong>3. Comprimento da viga (tramo):</strong> H = √(6² + 1,5²) = √(36 + 2,25) = √38,25 ≈ 6,18 m</p>
<div class="hi">Comprimento da viga: <strong>6,18 m</strong></div>
<p><strong>4. Custo das telhas:</strong> Área de uma água = Comprimento do tramo × Largura do armazém = 6,18 × 20 = 123,6 m². Custo = 123,6 × 1.500 = 185.400 Kz</p>
<div class="hi">O custo das telhas para uma água é <strong>185.400 Kz</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul><li>As razões trigonométricas (seno, cosseno, tangente) relacionam ângulos e lados em triângulos retângulos.</li>
<li>A inclinação de telhados, rampas e taludes é calculada usando a tangente (altura / base).</li>
<li>A inclinação pode ser expressa em percentagem ou em graus.</li>
<li>O dimensionamento de escadas segue a fórmula de Blondel (2E + P = 60 a 64 cm).</li>
<li>A trigonometria é essencial para garantir a segurança, a acessibilidade e a durabilidade das construções.</li></ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> aplicar as razões trigonométricas para calcular ângulos, inclinações, alturas e comprimentos em elementos construtivos.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Qual é a razão trigonométrica que relaciona o cateto oposto com a hipotenusa?</div>
<div class="qo" onclick="cq(this,true)">a) Seno</div>
<div class="qo" onclick="cq(this,false)">b) Cosseno</div>
<div class="qo" onclick="cq(this,false)">c) Tangente</div>
<div class="qo" onclick="cq(this,false)">d) Cotangente</div>
<div class="qq">2. Um telhado tem inclinação de 20%. Se o vão horizontal é de 5 m, qual é a altura?</div>
<div class="qo" onclick="cq(this,true)">a) 1 m</div>
<div class="qo" onclick="cq(this,false)">b) 2 m</div>
<div class="qo" onclick="cq(this,false)">c) 0,2 m</div>
<div class="qo" onclick="cq(this,false)">d) 5 m</div>
<div class="qq">3. Qual é a inclinação máxima recomendada para rampas de acessibilidade?</div>
<div class="qo" onclick="cq(this,false)">a) 5%</div>
<div class="qo" onclick="cq(this,true)">b) 8%</div>
<div class="qo" onclick="cq(this,false)">c) 15%</div>
<div class="qo" onclick="cq(this,false)">d) 25%</div>
<div class="qq">4. Uma escada tem espelho de 0,18 m. Qual é o piso recomendado (fórmula de Blondel)?</div>
<div class="qo" onclick="cq(this,false)">a) 20 cm</div>
<div class="qo" onclick="cq(this,false)">b) 26 cm</div>
<div class="qo" onclick="cq(this,true)">c) 28 cm</div>
<div class="qo" onclick="cq(this,false)">d) 35 cm</div>
</div>`},
{t:'Escalas e Proporções em Desenho e Obra', html:`
<div class="cb"><h2><i class="fas fa-ruler"></i> A Importância das Escalas na Construção</h2>
<p>Os projetos de arquitetura e engenharia são desenhados em papel (ou ecrã) numa escala reduzida. Um edifício de 50 metros de comprimento não cabe numa folha A3 na escala 1:1. Por isso, usamos escalas para reduzir (ou ampliar) as dimensões, mantendo as proporções.</p>
<p>Em Angola, a correta interpretação das escalas é fundamental para:</p>
<ul><li><strong>Dimensionar materiais:</strong> saber quantos blocos ou azulejos comprar.</li>
<li><strong>Posicionar elementos:</strong> saber exatamente onde colocar pilares, vigas, portas e janelas.</li>
<li><strong>Verificar distâncias:</strong> confirmar se as medidas no terreno correspondem ao projeto.</li></ul>
<p>Um erro na leitura da escala pode resultar em paredes fora do lugar, portas que não abrem, ou estruturas mal dimensionadas.</p>
<div class="ib"><strong>Pare e pense:</strong> Se uma planta está na escala 1:50 e uma parede mede 8 cm no desenho, qual é o seu comprimento real? (Resposta: 8 cm × 50 = 400 cm = 4 m.)</div>
</div>
<div class="cb"><h2><i class="fas fa-expand"></i> O Conceito de Escala</h2>
<p>A <strong>escala</strong> é a relação entre as dimensões do desenho e as dimensões reais do objeto.</p>
<div class="fbox"><div class="f">Escala = Dimensão no Desenho / Dimensão Real</div></div>
<h3>Tipos de Escala</h3>
<div class="tw"><table class="dt"><tr><th>Tipo</th><th>Descrição</th><th>Exemplo</th></tr>
<tr><td><strong>Escala de Redução</strong></td><td>Desenho menor que a realidade.</td><td>1:50, 1:100, 1:200</td></tr>
<tr><td><strong>Escala Natural</strong></td><td>Desenho igual à realidade.</td><td>1:1 (muito raro em construção)</td></tr>
<tr><td><strong>Escala de Ampliação</strong></td><td>Desenho maior que a realidade.</td><td>2:1, 5:1 (usado em pormenores)</td></tr></table></div>
<h3>Escalas Mais Comuns na Construção</h3>
<div class="tw"><table class="dt"><tr><th>Tipo de Desenho</th><th>Escala</th></tr>
<tr><td><strong>Plantas de Localização</strong></td><td>1:500, 1:1000</td></tr>
<tr><td><strong>Plantas de Arquitectura</strong></td><td>1:50, 1:100</td></tr>
<tr><td><strong>Cortes e Alçados</strong></td><td>1:50, 1:100</td></tr>
<tr><td><strong>Pormenores Construtivos</strong></td><td>1:10, 1:20, 1:5</td></tr></table></div>
</div>
<div class="cb"><h2><i class="fas fa-arrows-left-right-to-line"></i> Interpretação da Escala Numérica</h2>
<p>A escala numérica é representada como uma razão (ex: 1:50). Isto significa que 1 unidade no desenho corresponde a 50 unidades na realidade.</p>
<p><strong>Exemplo:</strong> Escala 1:50 → 1 cm no desenho = 50 cm na realidade = 0,5 m. Escala 1:100 → 1 cm = 1 m. Escala 1:200 → 1 cm = 2 m.</p>
<h3>Como Calcular Dimensões Reais a partir do Desenho</h3>
<div class="fbox"><div class="f">Dimensão Real = Dimensão no Desenho × Denominador da Escala</div></div>
<p><strong>Exemplo:</strong> Uma sala tem 6 cm de comprimento na planta (escala 1:50). Dimensão real = 6 cm × 50 = 300 cm = 3 m</p>
<h3>Como Calcular Dimensões no Desenho a partir da Realidade</h3>
<div class="fbox"><div class="f">Dimensão no Desenho = Dimensão Real ÷ Denominador da Escala</div></div>
<p><strong>Exemplo:</strong> Uma parede tem 4,5 m de comprimento. Quanto mede na planta (escala 1:50)? 4,5 m = 450 cm. Dimensão no desenho = 450 ÷ 50 = 9 cm</p>
</div>
<div class="cb"><h2><i class="fas fa-ruler-horizontal"></i> Escala Gráfica</h2>
<p>A escala gráfica é uma régua desenhada na planta que permite ler dimensões sem fazer cálculos. É especialmente útil quando a planta é fotocopiada ou ampliada (o que altera a escala numérica).</p>
<div class="ib">A escala gráfica é representada como uma régua graduada de 0 a 10 metros (ou outra unidade), desenhada directamente na planta, ao lado da legenda.</div>
<p><strong>Vantagem:</strong> mesmo que a planta seja ampliada, a escala gráfica mantém-se proporcional.</p>
</div>
<div class="cb"><h2><i class="fas fa-scale-balanced"></i> Proporções</h2>
<p>Uma <strong>proporção</strong> é uma igualdade entre duas razões. Na construção, usamos proporções para:</p>
<ul><li><strong>Dimensionar estruturas:</strong> a altura de um pilar é proporcional à sua largura.</li>
<li><strong>Calcular quantidades:</strong> se 1 m² de parede leva 12 blocos, 10 m² levam 120 blocos.</li>
<li><strong>Ajustar receitas:</strong> a proporção de cimento, areia e brita no betão.</li></ul>
<p><strong>Exemplo:</strong> Uma parede de 15 m² precisa de 180 blocos. Quantos blocos são necessários para 25 m²?</p>
<p>Proporção: 15 m² → 180 blocos; 25 m² → X. X = (25 × 180) / 15 = 300 blocos</p>
</div>
<div class="cb"><h2><i class="fas fa-map"></i> Aplicação Prática em Obra</h2>
<h3>Verificação de Medidas no Terreno</h3>
<p><strong>Problema:</strong> Na planta (escala 1:100), a distância entre dois pilares é de 8,5 cm. Qual é a distância real? E se a distância real for 12 m, quanto mede na planta?</p>
<p><strong>Solução:</strong> Distância real = 8,5 cm × 100 = 850 cm = 8,5 m. Distância na planta = 12 m = 1200 cm → 1200 ÷ 100 = 12 cm</p>
<h3>Cálculo de Áreas a partir da Planta</h3>
<p><strong>Problema:</strong> Numa planta à escala 1:50, uma sala retangular mede 10 cm por 6 cm.</p>
<p>Dimensões reais: 10 cm × 50 = 500 cm = 5 m; 6 cm × 50 = 300 cm = 3 m. Área real = 5 m × 3 m = 15 m²</p>
<div class="wb"><strong>Atenção:</strong> a área não é simplesmente multiplicada pela escala – é multiplicada pelo quadrado da escala. Fator de escala = 50. Área real = Área no desenho × 50² = Área no desenho × 2500</div>
</div>
<div class="cb"><h2><i class="fas fa-building"></i> Exercício Prático — Kwanza Construtora, LDA</h2>
<p>A empresa está a analisar a planta de um edifício à escala 1:100. A planta mostra: uma sala de estar com 12 cm de comprimento e 8 cm de largura; uma varanda com 6 cm de comprimento e 3 cm de largura; uma parede que na realidade tem 6,5 m de comprimento.</p>
<ol><li>Calcule as dimensões reais da sala de estar.</li><li>Calcule a área real da varanda.</li><li>Se a parede mede 6,5 m de comprimento na realidade, quanto mede na planta?</li><li>A sala de estar precisa de azulejos. Se cada caixa de azulejos cobre 2 m² e custa Kz 5.000, qual é o custo dos azulejos para a sala (considerando 5% de desperdício)?</li></ol>
<h3>Gabarito comentado</h3>
<p><strong>1. Dimensões reais da sala de estar:</strong> Comprimento: 12 cm × 100 = 1200 cm = 12 m. Largura: 8 cm × 100 = 800 cm = 8 m</p>
<div class="hi">Sala de estar: <strong>12 m × 8 m</strong></div>
<p><strong>2. Área real da varanda:</strong> Dimensões reais: 6 cm × 100 = 600 cm = 6 m; 3 cm × 100 = 300 cm = 3 m. Área = 6 × 3 = 18 m²</p>
<div class="hi">Área da varanda: <strong>18 m²</strong></div>
<p><strong>3. Medida da parede na planta:</strong> 6,5 m = 650 cm. Medida na planta = 650 ÷ 100 = 6,5 cm</p>
<div class="hi">Medida na planta: <strong>6,5 cm</strong></div>
<p><strong>4. Custo dos azulejos:</strong> Área da sala = 12 × 8 = 96 m². Área com desperdício (5%) = 96 × 1,05 = 100,8 m². Número de caixas = 100,8 ÷ 2 = 50,4 ≈ 51 caixas. Custo = 51 × 5.000 = 255.000 Kz</p>
<div class="hi">Custo dos azulejos: <strong>255.000 Kz</strong></div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul><li>A escala relaciona as dimensões do desenho com as dimensões reais.</li>
<li>Escalas de redução (1:50, 1:100) são as mais comuns na construção.</li>
<li>Para calcular dimensões reais, multiplica-se pela escala.</li>
<li>Para calcular dimensões no desenho, divide-se pela escala.</li>
<li>A área real é a área no desenho multiplicada pelo quadrado da escala.</li>
<li>As proporções são usadas para dimensionar materiais e estruturas.</li></ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> interpretar e utilizar escalas e proporções em desenhos de construção.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Uma planta está na escala 1:50. Uma parede mede 4 cm no desenho. Qual é o seu comprimento real?</div>
<div class="qo" onclick="cq(this,false)">a) 1 m</div>
<div class="qo" onclick="cq(this,true)">b) 2 m</div>
<div class="qo" onclick="cq(this,false)">c) 4 m</div>
<div class="qo" onclick="cq(this,false)">d) 8 m</div>
<div class="qq">2. Uma sala real tem 8 m de comprimento. Qual será a sua medida na escala 1:100?</div>
<div class="qo" onclick="cq(this,false)">a) 4 cm</div>
<div class="qo" onclick="cq(this,true)">b) 8 cm</div>
<div class="qo" onclick="cq(this,false)">c) 12 cm</div>
<div class="qo" onclick="cq(this,false)">d) 16 cm</div>
<div class="qq">3. Numa planta à escala 1:50, uma sala mede 10 cm por 8 cm. Qual é a área real?</div>
<div class="qo" onclick="cq(this,true)">a) 20 m²</div>
<div class="qo" onclick="cq(this,false)">b) 40 m²</div>
<div class="qo" onclick="cq(this,false)">c) 80 m²</div>
<div class="qo" onclick="cq(this,false)">d) 400 m²</div>
<div class="qq">4. Se 1 m² de parede leva 12 blocos, quantos blocos são necessários para 15 m²?</div>
<div class="qo" onclick="cq(this,false)">a) 120</div>
<div class="qo" onclick="cq(this,false)">b) 150</div>
<div class="qo" onclick="cq(this,true)">c) 180</div>
<div class="qo" onclick="cq(this,false)">d) 200</div>
</div>`},
{t:'Grandezas Físicas na Construção: Massa, Peso, Densidade e Volume', html:`
<div class="cb"><h2><i class="fas fa-weight-hanging"></i> Por que é Importante Conhecer a Densidade dos Materiais?</h2>
<p>Na construção civil, a densidade dos materiais é um fator crítico para:</p>
<ul><li><strong>Cálculo de cargas:</strong> o peso dos materiais (lajes, paredes, coberturas) é transmitido às fundações. Se subestimar o peso, a estrutura pode colapsar.</li>
<li><strong>Logística e transporte:</strong> saber quanto pesa uma carga de blocos ou betão é essencial para dimensionar os meios de transporte.</li>
<li><strong>Escavação e movimento de terras:</strong> o volume de terra a escavar é calculado em metros cúbicos, mas o peso determina o custo do transporte.</li>
<li><strong>Dimensionamento de equipamentos:</strong> gruas, elevadores e outros equipamentos têm capacidade de carga limitada.</li></ul>
<p>Em Angola, onde muitas obras utilizam materiais importados ou de origem local com características variáveis, é essencial conhecer as densidades típicas para evitar erros de dimensionamento.</p>
<div class="ib"><strong>Pare e pense:</strong> Se um bloco de betão tem densidade de 2.400 kg/m³, quanto pesa um bloco com 0,4 m × 0,2 m × 0,2 m? (Resposta: Volume = 0,4 × 0,2 × 0,2 = 0,016 m³; Peso = 0,016 × 2.400 = 38,4 kg.)</div>
</div>
<div class="cb"><h2><i class="fas fa-cube"></i> Conceitos Fundamentais</h2>
<h3>Massa (m)</h3>
<p>A <strong>massa</strong> é a quantidade de matéria de um corpo. É uma propriedade intrínseca, ou seja, não depende do local onde o corpo se encontra. A unidade de massa no Sistema Internacional (SI) é o <strong>quilograma (kg)</strong>.</p>
<p><strong>Exemplo:</strong> Um saco de cimento tem massa de 50 kg, quer esteja em Luanda, no Lubango ou na Lua.</p>
<h3>Peso (P)</h3>
<p>O <strong>peso</strong> é a força com que a Terra atrai um corpo. Depende da massa e da aceleração da gravidade (g ≈ 9,8 m/s²). A unidade de peso é o <strong>Newton (N)</strong>.</p>
<div class="fbox"><div class="f">P = m × g</div><div class="fd">Exemplo: peso de um corpo de 50 kg → P = 50 × 9,8 ≈ 490 N</div></div>
<p>Na prática, na construção, usamos frequentemente o termo "peso" para nos referirmos à massa, mas a distinção é importante para cálculos estruturais e de elevação.</p>
<h3>Densidade (ρ)</h3>
<p>A <strong>densidade</strong> (ou massa volúmica) é a relação entre a massa e o volume de um material.</p>
<div class="fbox"><div class="f">ρ = m / V</div><div class="fd">A unidade de densidade é o kg/m³ (quilograma por metro cúbico)</div></div>
<h3>Volume (V)</h3>
<p>O <strong>volume</strong> é o espaço ocupado por um corpo. Na construção, as unidades mais comuns são o <strong>metro cúbico (m³)</strong> e o <strong>litro (L)</strong>. 1 m³ = 1.000 L.</p>
</div>
<div class="cb"><h2><i class="fas fa-table"></i> Densidades de Materiais de Construção</h2>
<div class="tw"><table class="dt"><tr><th>Material</th><th>Densidade Aproximada (kg/m³)</th></tr>
<tr><td><strong>Betão (armado)</strong></td><td>2.400 – 2.500</td></tr>
<tr><td><strong>Betão (simples)</strong></td><td>2.200 – 2.400</td></tr>
<tr><td><strong>Aço</strong></td><td>7.850</td></tr>
<tr><td><strong>Alumínio</strong></td><td>2.700</td></tr>
<tr><td><strong>Areia (seca)</strong></td><td>1.400 – 1.600</td></tr>
<tr><td><strong>Areia (húmida)</strong></td><td>1.800 – 2.000</td></tr>
<tr><td><strong>Brita (pedra)</strong></td><td>1.500 – 1.700</td></tr>
<tr><td><strong>Cimento (a granel)</strong></td><td>1.440</td></tr>
<tr><td><strong>Tijolo (cerâmico)</strong></td><td>1.600 – 1.800</td></tr>
<tr><td><strong>Bloco de betão</strong></td><td>1.800 – 2.000</td></tr>
<tr><td><strong>Madeira (pinho)</strong></td><td>500 – 600</td></tr>
<tr><td><strong>Madeira (carvalho)</strong></td><td>700 – 900</td></tr>
<tr><td><strong>Água</strong></td><td>1.000</td></tr>
<tr><td><strong>Terra (solta)</strong></td><td>1.200 – 1.600</td></tr></table></div>
</div>
<div class="cb"><h2><i class="fas fa-truck-ramp-box"></i> Aplicação Prática</h2>
<h3>Cálculo do Peso de uma Laje</h3>
<p><strong>Problema:</strong> Uma laje de betão armado tem 10 m × 8 m × 0,15 m. Qual é o seu peso?</p>
<p><strong>Solução:</strong> Volume = 10 × 8 × 0,15 = 12 m³. Densidade do betão armado ≈ 2.500 kg/m³. Massa = 12 × 2.500 = 30.000 kg = 30 toneladas. Peso = 30.000 × 9,8 = 294.000 N ≈ 294 kN</p>
<div class="hi">A laje pesa cerca de <strong>30 toneladas (294 kN)</strong>.</div>
<h3>Cálculo da Carga de um Pilar</h3>
<p><strong>Problema:</strong> Um pilar de betão armado tem 0,3 m × 0,3 m de secção e 3 m de altura. A laje acima do pilar tem área de 20 m² e a carga (incluindo o peso próprio da laje, revestimentos e sobrecarga) é de 6 kN/m². Qual é a carga total sobre o pilar?</p>
<p><strong>Solução:</strong> Peso do pilar: Volume = 0,3 × 0,3 × 3 = 0,27 m³; Massa = 0,27 × 2.500 = 675 kg; Peso = 675 × 9,8 / 1000 ≈ 6,6 kN. Carga da laje: 20 m² × 6 kN/m² = 120 kN. Carga total no pilar: 6,6 + 120 = 126,6 kN</p>
<div class="hi">A carga total sobre o pilar é de <strong>126,6 kN</strong>.</div>
<h3>Dimensionamento de Transporte</h3>
<p><strong>Problema:</strong> Uma obra precisa de 15 m³ de areia. Se a densidade da areia seca é 1.500 kg/m³, quantas viagens de um camião com capacidade de 5.000 kg são necessárias?</p>
<p><strong>Solução:</strong> Massa total = 15 × 1.500 = 22.500 kg. Número de viagens = 22.500 / 5.000 = 4,5 → 5 viagens</p>
<div class="hi">São necessárias <strong>5 viagens</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-building"></i> Exercício Prático — Kwanza Construtora, LDA</h2>
<p>A empresa precisa de dimensionar o transporte de 20 m³ de blocos de betão para uma obra. Cada bloco mede 0,4 m × 0,2 m × 0,2 m. Densidade do betão: 2.000 kg/m³. Capacidade do camião: 5.000 kg.</p>
<ol><li>Qual é o peso de cada bloco?</li><li>Quantos blocos são necessários para 20 m³?</li><li>Quantas viagens são necessárias?</li></ol>
<h3>Gabarito comentado</h3>
<p><strong>1. Peso de cada bloco:</strong> Volume do bloco = 0,4 × 0,2 × 0,2 = 0,016 m³. Massa = 0,016 × 2.000 = 32 kg. Peso = 32 × 9,8 ≈ 314 N</p>
<div class="hi">Cada bloco pesa <strong>32 kg</strong></div>
<p><strong>2. Número de blocos para 20 m³:</strong> 20 / 0,016 = 1.250 blocos</p>
<div class="hi">São necessários <strong>1.250 blocos</strong></div>
<p><strong>3. Peso total e viagens:</strong> Massa total = 1.250 × 32 = 40.000 kg. Número de viagens = 40.000 / 5.000 = 8 viagens</p>
<div class="hi">Serão necessárias <strong>8 viagens</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul><li><strong>Massa</strong> é a quantidade de matéria (kg). <strong>Peso</strong> é a força gravitacional (N).</li>
<li><strong>Densidade</strong> (ρ) é a relação entre massa e volume (kg/m³).</li>
<li>O conhecimento das densidades dos materiais é essencial para o cálculo de cargas, transporte e dimensionamento.</li>
<li>As densidades típicas variam: betão (2.400 kg/m³), aço (7.850 kg/m³), areia (1.500 kg/m³).</li>
<li>O peso total de um material é calculado multiplicando o volume pela densidade.</li></ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> distinguir massa, peso, densidade e volume, e a calcular o peso de materiais de construção.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Qual é a unidade de densidade no Sistema Internacional (SI)?</div>
<div class="qo" onclick="cq(this,false)">a) kg</div>
<div class="qo" onclick="cq(this,true)">b) kg/m³</div>
<div class="qo" onclick="cq(this,false)">c) N</div>
<div class="qo" onclick="cq(this,false)">d) m³</div>
<div class="qq">2. A densidade do betão armado é aproximadamente:</div>
<div class="qo" onclick="cq(this,false)">a) 1.000 kg/m³</div>
<div class="qo" onclick="cq(this,true)">b) 2.500 kg/m³</div>
<div class="qo" onclick="cq(this,false)">c) 7.850 kg/m³</div>
<div class="qo" onclick="cq(this,false)">d) 500 kg/m³</div>
<div class="qq">3. Uma laje de 10 m³ de betão armado tem massa de:</div>
<div class="qo" onclick="cq(this,false)">a) 5.000 kg</div>
<div class="qo" onclick="cq(this,false)">b) 10.000 kg</div>
<div class="qo" onclick="cq(this,true)">c) 25.000 kg</div>
<div class="qo" onclick="cq(this,false)">d) 50.000 kg</div>
<div class="qq">4. Um bloco de betão com 0,02 m³ de volume e densidade 2.000 kg/m³ tem massa de:</div>
<div class="qo" onclick="cq(this,false)">a) 20 kg</div>
<div class="qo" onclick="cq(this,true)">b) 40 kg</div>
<div class="qo" onclick="cq(this,false)">c) 200 kg</div>
<div class="qo" onclick="cq(this,false)">d) 400 kg</div>
</div>`},
{t:'Forças e Equilíbrio: Noções Fundamentais de Estática', html:`
<div class="cb"><h2><i class="fas fa-arrows-up-down"></i> Por que a Estática é Fundamental na Construção?</h2>
<p>A estática é o ramo da mecânica que estuda o equilíbrio dos corpos sob a ação de forças. Na construção civil, a estática é a base do dimensionamento estrutural. Um edifício, uma ponte ou um muro estão sujeitos a forças (peso, vento, sismos, etc.) e devem permanecer em equilíbrio – ou seja, não podem cair, deformar-se excessivamente ou colapsar.</p>
<p>Em Angola, onde os ventos podem ser fortes (especialmente nas zonas costeiras) e a atividade sísmica é moderada, o conhecimento da estática é essencial para garantir a segurança das estruturas. Um erro no cálculo de forças pode resultar em fissuras, deformações ou mesmo no colapso da construção.</p>
<div class="ib"><strong>Pare e pense:</strong> Se uma viga suporta o peso de uma laje e das pessoas que circulam sobre ela, que tipo de forças atuam sobre a viga? (Resposta: a viga está sujeita a forças de compressão (no topo), tração (na base), e forças de corte (nas extremidades).)</div>
</div>
<div class="cb"><h2><i class="fas fa-diagram-project"></i> Conceitos Fundamentais de Forças</h2>
<h3>Força (F)</h3>
<p>Uma <strong>força</strong> é uma ação que pode alterar o estado de repouso ou de movimento de um corpo, ou deformá-lo. As forças são grandezas vetoriais, ou seja, têm <strong>intensidade, direção e sentido</strong>.</p>
<ul><li><strong>Intensidade:</strong> o valor numérico (ex: 10 kN).</li><li><strong>Direção:</strong> a linha de ação (ex: vertical, horizontal).</li><li><strong>Sentido:</strong> para cima, para baixo, para a esquerda, para a direita.</li></ul>
<p>A unidade de força no Sistema Internacional é o <strong>Newton (N)</strong>. Na construção, usamos frequentemente o <strong>kN (quilonewton)</strong>, onde 1 kN = 1.000 N.</p>
<h3>Tipos de Cargas</h3>
<div class="tw"><table class="dt"><tr><th>Tipo de Carga</th><th>Descrição</th><th>Exemplo</th></tr>
<tr><td><strong>Carga Permanente (Dead Load)</strong></td><td>Peso próprio da estrutura e elementos fixos.</td><td>Peso do betão, alvenaria, revestimentos.</td></tr>
<tr><td><strong>Carga Variável (Live Load)</strong></td><td>Cargas que podem variar ao longo do tempo.</td><td>Peso de pessoas, mobiliário, equipamentos.</td></tr>
<tr><td><strong>Carga Acidental</strong></td><td>Cargas de curta duração, com intensidade elevada.</td><td>Vento, sismos, choques.</td></tr>
<tr><td><strong>Carga de Vento</strong></td><td>Pressão do vento sobre as superfícies.</td><td>Vento forte em zonas costeiras.</td></tr>
<tr><td><strong>Carga de Neve / Chuva</strong></td><td>Acumulação de água ou neve.</td><td>Menos relevante em Angola, mas importante para coberturas.</td></tr></table></div>
<h3>Representação de Forças (Diagrama de Corpo Livre)</h3>
<p>Um <strong>diagrama de corpo livre</strong> é uma representação simplificada de um corpo, mostrando todas as forças que atuam sobre ele. É a ferramenta fundamental da estática.</p>
<div class="ib"><strong>Exemplo:</strong> Uma viga simplesmente apoiada, com uma carga F aplicada no centro (para baixo). No apoio esquerdo atua a reação RA (para cima) e no apoio direito a reação RB (para cima), equilibrando a carga central.</div>
</div>
<div class="cb"><h2><i class="fas fa-scale-balanced"></i> Condições de Equilíbrio</h2>
<p>Para que um corpo esteja em equilíbrio, duas condições devem ser satisfeitas:</p>
<div class="fbox"><div class="f">ΣF = 0 (ΣFx = 0 e ΣFy = 0)</div><div class="fd">Equilíbrio de Forças (Translacional): a soma de todas as forças que atuam sobre o corpo deve ser zero</div></div>
<div class="fbox"><div class="f">ΣM = 0</div><div class="fd">Equilíbrio de Momentos (Rotacional): a soma de todos os momentos (torques) que atuam sobre o corpo deve ser zero</div></div>
<h3>Momento de uma Força (M)</h3>
<p>O <strong>momento</strong> (ou torque) é a tendência de uma força para fazer rodar um corpo em torno de um ponto.</p>
<div class="fbox"><div class="f">M = F × d</div><div class="fd">F é a força aplicada (N); d é a distância (braço) do ponto de aplicação da força ao ponto de rotação (m)</div></div>
<p><strong>Exemplo:</strong> Uma força de 100 N aplicada a uma distância de 2 m do ponto de rotação gera um momento de 100 × 2 = 200 N·m.</p>
</div>
<div class="cb"><h2><i class="fas fa-grip-lines"></i> Cálculo de Reações de Apoio (Exemplos)</h2>
<h3>Viga Simplesmente Apoiada com Carga no Centro</h3>
<p><strong>Problema:</strong> Uma viga de 6 m de comprimento suporta uma carga pontual de 30 kN no centro. Quais são as reações nos apoios (RA e RB)?</p>
<p><strong>Solução:</strong> Simetria: RA = RB. ΣFy = 0 → RA + RB – 30 = 0 → 2RA = 30 → RA = 15 kN. RB = 15 kN</p>
<div class="hi">As reações são de <strong>15 kN</strong> em cada apoio.</div>
<h3>Viga com Carga Deslocada do Centro</h3>
<p><strong>Problema:</strong> Uma viga de 6 m tem uma carga de 40 kN aplicada a 2 m do apoio esquerdo. Quais são as reações?</p>
<p><strong>Solução:</strong> ΣM (em A) = 0 → RB × 6 – 40 × 2 = 0 → RB = 80 / 6 ≈ 13,33 kN. ΣFy = 0 → RA + RB – 40 = 0 → RA = 40 – 13,33 ≈ 26,67 kN</p>
<div class="hi">RA ≈ 26,67 kN e RB ≈ 13,33 kN.</div>
</div>
<div class="cb"><h2><i class="fas fa-house-chimney-crack"></i> Aplicação Prática – Peso de uma Laje</h2>
<p><strong>Problema:</strong> Uma laje de betão armado tem 8 m × 6 m × 0,15 m. A densidade do betão é 2.500 kg/m³.</p>
<ol><li>Qual é o peso total da laje (em kN)?</li><li>Se a laje é apoiada em quatro pilares (um em cada canto), qual é a carga em cada pilar?</li></ol>
<p><strong>Solução:</strong> 1. Volume = 8 × 6 × 0,15 = 7,2 m³. Massa = 7,2 × 2.500 = 18.000 kg = 18 toneladas. Peso = 18.000 × 9,8 / 1000 = 176,4 kN. 2. Carga por pilar = 176,4 / 4 = 44,1 kN</p>
<div class="hi">O peso total é <strong>176,4 kN</strong>, e cada pilar suporta <strong>44,1 kN</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-building"></i> Exercício Prático — Kwanza Construtora, LDA</h2>
<p>Uma viga de 5 m de comprimento suporta uma carga uniformemente distribuída (UDL) de 12 kN/m ao longo de todo o seu comprimento.</p>
<ol><li>Qual é a carga total sobre a viga?</li><li>Quais são as reações nos apoios (considerando a viga simplesmente apoiada)?</li><li>Se a viga for substituída por duas cargas pontuais de 30 kN cada, colocadas a 1,5 m de cada extremidade, quais são as reações?</li></ol>
<h3>Gabarito comentado</h3>
<p><strong>1. Carga total (UDL):</strong> Carga total = 12 kN/m × 5 m = 60 kN</p>
<div class="hi">Carga total: <strong>60 kN</strong></div>
<p><strong>2. Reações (UDL):</strong> Simetria: RA = RB = 60 / 2 = 30 kN</p>
<div class="hi">RA = RB = <strong>30 kN</strong></div>
<p><strong>3. Cargas pontuais (30 kN a 1,5 m de cada extremidade):</strong> Distância da carga 1 a A: 1,5 m; distância da carga 2 a A: 5 – 1,5 = 3,5 m. ΣM (em A) = 0 → RB × 5 – 30 × 1,5 – 30 × 3,5 = 0 → 5RB = 150 → RB = 30 kN. ΣFy = 0 → RA + 30 – 60 = 0 → RA = 30 kN</p>
<div class="hi">Na UDL, as reações são de 30 kN cada. Nas cargas pontuais, as reações também são de 30 kN cada (devido à simetria).</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul><li>A estática estuda o equilíbrio das forças e é essencial para a segurança estrutural.</li>
<li>As forças são vetores com intensidade, direção e sentido.</li>
<li>As cargas podem ser permanentes, variáveis ou acidentais.</li>
<li>As condições de equilíbrio são ΣF = 0 e ΣM = 0.</li>
<li>O momento de uma força é M = F × d.</li>
<li>O cálculo de reações de apoio é fundamental para dimensionar estruturas.</li></ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> compreender os conceitos fundamentais de forças e equilíbrio, e a calcular reações de apoio em estruturas simples.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. O que é necessário para que um corpo esteja em equilíbrio?</div>
<div class="qo" onclick="cq(this,true)">a) ΣF = 0 e ΣM = 0</div>
<div class="qo" onclick="cq(this,false)">b) ΣF = 0 apenas</div>
<div class="qo" onclick="cq(this,false)">c) ΣM = 0 apenas</div>
<div class="qo" onclick="cq(this,false)">d) ΣF = ΣM</div>
<div class="qq">2. Qual é a unidade de momento (torque) no SI?</div>
<div class="qo" onclick="cq(this,false)">a) N</div>
<div class="qo" onclick="cq(this,true)">b) N·m</div>
<div class="qo" onclick="cq(this,false)">c) kg</div>
<div class="qo" onclick="cq(this,false)">d) m/s²</div>
<div class="qq">3. Uma viga de 4 m de comprimento tem uma carga de 20 kN no centro. Qual é a reação em cada apoio?</div>
<div class="qo" onclick="cq(this,false)">a) 5 kN</div>
<div class="qo" onclick="cq(this,true)">b) 10 kN</div>
<div class="qo" onclick="cq(this,false)">c) 20 kN</div>
<div class="qo" onclick="cq(this,false)">d) 40 kN</div>
<div class="qq">4. O peso de uma laje de betão armado de 5 m × 4 m × 0,12 m (densidade 2.500 kg/m³) é aproximadamente:</div>
<div class="qo" onclick="cq(this,true)">a) 60 kN</div>
<div class="qo" onclick="cq(this,false)">b) 120 kN</div>
<div class="qo" onclick="cq(this,false)">c) 30 kN</div>
<div class="qo" onclick="cq(this,false)">d) 15 kN</div>
</div>`},
{t:'Momentos e Reacções de Apoio em Elementos Estruturais Simples', html:`
<div class="cb"><h2><i class="fas fa-arrows-turn-to-dots"></i> A Importância dos Momentos na Estrutura</h2>
<p>Quando uma viga suporta cargas, ela tende a <strong>fletir</strong> (curvar-se). Esta flexão gera <strong>momentos fletores</strong> que devem ser resistidos pela secção da viga. Se o momento fletor for superior à capacidade da viga, ela pode partir-se.</p>
<p>O cálculo de momentos é essencial para:</p>
<ul><li><strong>Dimensionar a armadura (ferragem):</strong> o momento fletor determina a quantidade de aço necessária na viga.</li>
<li><strong>Dimensionar a secção da viga:</strong> a altura e a largura da viga dependem do momento fletor.</li>
<li><strong>Verificar a segurança:</strong> garantir que a viga não colapsa.</li></ul>
<div class="ib"><strong>Pare e pense:</strong> Se uma viga tem um momento fletor muito elevado no centro, que parte da viga deve ser mais reforçada? (Resposta: a parte inferior da viga está sujeita a tração e deve ser reforçada com aço.)</div>
</div>
<div class="cb"><h2><i class="fas fa-grip-lines-vertical"></i> Tipos de Vigas e Apoios</h2>
<div class="tw"><table class="dt"><tr><th>Tipo de Apoio</th><th>Descrição</th><th>Reações</th></tr>
<tr><td><strong>Apoio Simples (Articulação)</strong></td><td>Permite rotação, mas não translação.</td><td>Reação vertical (Ry)</td></tr>
<tr><td><strong>Apoio Fixo (Encastramento)</strong></td><td>Impede rotação e translação.</td><td>Reação vertical (Ry), reação horizontal (Rx), momento (M)</td></tr>
<tr><td><strong>Apoio Móvel (Rolo)</strong></td><td>Permite translação horizontal, mas não vertical.</td><td>Reação vertical (Ry)</td></tr></table></div>
<p>Na construção, as vigas são frequentemente apoiadas em <strong>pilares</strong>, que funcionam como apoios simples.</p>
</div>
<div class="cb"><h2><i class="fas fa-chart-line"></i> Momento Fletor (M)</h2>
<p>O <strong>momento fletor</strong> num ponto da viga é a soma dos momentos de todas as forças à esquerda (ou à direita) desse ponto.</p>
<h3>Viga com Carga Pontual no Centro</h3>
<p><strong>Problema:</strong> Viga de 6 m com carga de 30 kN no centro.</p>
<p><strong>Cálculo do momento máximo:</strong> Reações: RA = RB = 15 kN. Momento no centro: M = RA × (L/2) = 15 × 3 = 45 kN·m</p>
<div class="ib">Diagrama de momento fletor: o momento é zero em cada apoio e sobe linearmente até um pico de 45 kN·m no centro do vão, formando um triângulo.</div>
<h3>Viga com Carga Uniformemente Distribuída (UDL)</h3>
<p><strong>Problema:</strong> Viga de 6 m com UDL de 10 kN/m.</p>
<p><strong>Cálculo do momento máximo:</strong> Carga total = 10 × 6 = 60 kN. Reações: RA = RB = 30 kN. Momento máximo (no centro): M = (w × L²) / 8 = (10 × 6²) / 8 = 360 / 8 = 45 kN·m</p>
<h3>Viga com Carga Deslocada</h3>
<p><strong>Problema:</strong> Viga de 6 m, carga de 40 kN a 2 m do apoio esquerdo.</p>
<p><strong>Cálculo das reações (já feito na aula anterior):</strong> RA = 26,67 kN, RB = 13,33 kN</p>
<p><strong>Cálculo do momento máximo (no ponto de aplicação da carga):</strong> M = RA × 2 = 26,67 × 2 = 53,34 kN·m</p>
</div>
<div class="cb"><h2><i class="fas fa-scissors"></i> Esforço Transverso (V)</h2>
<p>O <strong>esforço transverso</strong> (ou esforço cortante) é a força que atua perpendicularmente ao eixo da viga, causando o "corte" da secção.</p>
<h3>Viga com Carga Pontual no Centro</h3>
<p>Esforço transverso à esquerda do centro: V = RA = 15 kN. Esforço transverso à direita do centro: V = RA – 30 = –15 kN</p>
<div class="ib">Diagrama de esforço transverso: o valor mantém-se constante em +15 kN desde o apoio esquerdo até ao centro, salta abruptamente para -15 kN no ponto da carga, e mantém-se em -15 kN até ao apoio direito.</div>
</div>
<div class="cb"><h2><i class="fas fa-square-root-variable"></i> Relação entre Momento Fletor e Esforço Transverso</h2>
<div class="fbox"><div class="f">V = dM / dx</div><div class="fd">O esforço transverso é a derivada do momento fletor em relação ao comprimento</div></div>
<p>Isto significa que onde o esforço transverso é zero, o momento fletor é máximo.</p>
</div>
<div class="cb"><h2><i class="fas fa-hammer"></i> Aplicação Prática – Dimensionamento de uma Viga</h2>
<p><strong>Problema:</strong> Uma viga de betão armado de 4 m de vão suporta uma carga uniformemente distribuída de 25 kN/m (incluindo o peso próprio). Qual é o momento fletor máximo?</p>
<p><strong>Solução:</strong> M = (w × L²) / 8 = (25 × 4²) / 8 = 400 / 8 = 50 kN·m</p>
<div class="hi">O momento fletor máximo é <strong>50 kN·m</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-building"></i> Exercício Prático — Kwanza Construtora, LDA</h2>
<p>Uma viga de betão armado com 5 m de vão suporta duas cargas pontuais: 20 kN a 1,5 m do apoio esquerdo e 30 kN a 3,5 m do apoio esquerdo.</p>
<ol><li>Calcule as reações de apoio (RA e RB).</li><li>Calcule o momento fletor máximo e a sua localização.</li><li>Calcule o esforço transverso máximo.</li></ol>
<h3>Gabarito comentado</h3>
<p><strong>1. Reações de apoio:</strong> ΣM (em A) = 0 → RB × 5 – 20 × 1,5 – 30 × 3,5 = 0 → 5RB = 30 + 105 = 135 → RB = 27 kN. ΣFy = 0 → RA + 27 – 20 – 30 = 0 → RA = 23 kN</p>
<div class="hi">RA = <strong>23 kN</strong>, RB = <strong>27 kN</strong></div>
<p><strong>2. Momento fletor máximo:</strong> O momento máximo ocorre onde o esforço transverso muda de sinal. Entre A e a primeira carga (x &lt; 1,5 m): V = RA = 23 kN. Entre a primeira e a segunda carga (1,5 &lt; x &lt; 3,5 m): V = 23 – 20 = 3 kN. Após a segunda carga (x &gt; 3,5 m): V = 23 – 20 – 30 = -27 kN. O esforço transverso é positivo até x = 3,5 m, onde se torna negativo. O momento máximo ocorre em x = 3,5 m. M (em x = 3,5) = RA × 3,5 – 20 × 2,0 = 23 × 3,5 – 40 = 80,5 – 40 = 40,5 kN·m</p>
<div class="hi">Momento fletor máximo: <strong>40,5 kN·m</strong> (em x = 3,5 m)</div>
<p><strong>3. Esforço transverso máximo:</strong> Máximo positivo: 23 kN (em A). Máximo negativo: -27 kN (em B)</p>
<div class="hi">Esforço transverso máximo: <strong>23 kN</strong> (positivo) e <strong>-27 kN</strong> (negativo)</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul><li>O momento fletor é a tendência da viga para se curvar.</li>
<li>O esforço transverso é a força de corte na secção da viga.</li>
<li>O momento máximo ocorre onde o esforço transverso é zero.</li>
<li>Para cargas pontuais, o momento é calculado como M = F × d.</li>
<li>Para cargas uniformemente distribuídas, o momento máximo é M = (w × L²) / 8.</li></ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> calcular momentos fletores e esforços transversos em vigas simples, fundamentais para o dimensionamento estrutural.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Onde ocorre o momento fletor máximo numa viga simplesmente apoiada com carga uniformemente distribuída?</div>
<div class="qo" onclick="cq(this,false)">a) Nos apoios</div>
<div class="qo" onclick="cq(this,true)">b) No centro do vão</div>
<div class="qo" onclick="cq(this,false)">c) A 1/3 do vão</div>
<div class="qo" onclick="cq(this,false)">d) Em toda a viga</div>
<div class="qq">2. Uma viga de 4 m com carga pontual de 40 kN no centro. Qual é o momento fletor máximo?</div>
<div class="qo" onclick="cq(this,false)">a) 20 kN·m</div>
<div class="qo" onclick="cq(this,true)">b) 40 kN·m</div>
<div class="qo" onclick="cq(this,false)">c) 80 kN·m</div>
<div class="qo" onclick="cq(this,false)">d) 160 kN·m</div>
<div class="qq">3. O esforço transverso é zero onde:</div>
<div class="qo" onclick="cq(this,true)">a) O momento fletor é máximo</div>
<div class="qo" onclick="cq(this,false)">b) O momento fletor é mínimo</div>
<div class="qo" onclick="cq(this,false)">c) A carga é máxima</div>
<div class="qo" onclick="cq(this,false)">d) A viga está vazia</div>
<div class="qq">4. Uma viga de 6 m com UDL de 15 kN/m. Qual é o momento fletor máximo?</div>
<div class="qo" onclick="cq(this,false)">a) 45 kN·m</div>
<div class="qo" onclick="cq(this,true)">b) 67,5 kN·m</div>
<div class="qo" onclick="cq(this,false)">c) 90 kN·m</div>
<div class="qo" onclick="cq(this,false)">d) 135 kN·m</div>
</div>`},
{t:'Resistência dos Materiais: Tensão, Deformação e Tipos de Esforço', html:`
<div class="cb"><h2><i class="fas fa-vial"></i> Por que os Materiais se Comportam de Forma Diferente?</h2>
<p>A madeira, o aço, o betão e o tijolo têm comportamentos muito diferentes quando sujeitos a forças. O betão é excelente em compressão, mas fraco em tração. O aço é excelente em tração e compressão. A madeira é boa em compressão e tração, mas fraca ao corte.</p>
<p>Para projetar estruturas seguras, o engenheiro e o técnico de edificações precisam de compreender: como cada material se deforma sob carga, qual é a tensão máxima que cada material pode suportar, e que tipo de esforço cada material resiste melhor.</p>
<p>Em Angola, onde os materiais podem ter qualidade variável (ex: betão com dosagem inadequada, madeira com defeitos), o conhecimento da resistência dos materiais é ainda mais crítico. Um erro no dimensionamento pode levar a fissuras, deformações excessivas ou colapso.</p>
<div class="ib"><strong>Pare e pense:</strong> Se uma viga de betão for submetida a uma força de tração, o que pode acontecer? (Resposta: o betão é fraco à tração, por isso a viga pode fissurar ou partir-se. É por isso que as vigas são reforçadas com aço na zona tracionada.)</div>
</div>
<div class="cb"><h2><i class="fas fa-compress"></i> Conceitos Fundamentais</h2>
<h3>Tensão (σ)</h3>
<p>A <strong>tensão</strong> (ou pressão interna) é a força que atua sobre uma determinada área de um material. É uma medida da intensidade da força interna.</p>
<div class="fbox"><div class="f">σ = F / A</div><div class="fd">σ = tensão (Pa ou N/m²); F = força aplicada (N); A = área da secção transversal (m²)</div></div>
<p>Na construção, usamos frequentemente o <strong>MPa (megapascal)</strong>, onde 1 MPa = 1 N/mm² = 1.000.000 Pa.</p>
<p><strong>Exemplo:</strong> Uma força de 100.000 N aplicada numa área de 0,05 m² gera uma tensão de: σ = 100.000 / 0,05 = 2.000.000 Pa = 2 MPa</p>
<h3>Deformação (ε)</h3>
<p>A <strong>deformação</strong> é a alteração relativa do comprimento de um material quando sujeito a uma tensão. É uma medida da "extensão" ou "contração" do material.</p>
<div class="fbox"><div class="f">ε = ΔL / L₀</div><div class="fd">ε = deformação (adimensional); ΔL = variação do comprimento (m); L₀ = comprimento inicial (m)</div></div>
<p><strong>Exemplo:</strong> Uma barra de aço com 2 m de comprimento estica 2 mm (0,002 m) sob carga. A deformação é: ε = 0,002 / 2 = 0,001 = 0,1%</p>
<h3>Lei de Hooke (Relação Tensão-Deformação)</h3>
<p>Para a maioria dos materiais (até um certo limite), a tensão é proporcional à deformação. Esta relação é conhecida como <strong>Lei de Hooke</strong>.</p>
<div class="fbox"><div class="f">σ = E × ε</div><div class="fd">E é o módulo de elasticidade (ou módulo de Young), uma propriedade do material que indica a sua rigidez</div></div>
<div class="tw"><table class="dt"><tr><th>Material</th><th>Módulo de Elasticidade E (GPa)</th></tr>
<tr><td>Aço</td><td>200</td></tr>
<tr><td>Betão</td><td>25 – 30</td></tr>
<tr><td>Madeira (pinho)</td><td>10</td></tr>
<tr><td>Alumínio</td><td>70</td></tr>
<tr><td>Tijolo</td><td>10 – 15</td></tr></table></div>
</div>
<div class="cb"><h2><i class="fas fa-arrows-to-circle"></i> Tipos de Esforços</h2>
<p>Os elementos estruturais estão sujeitos a diferentes tipos de esforços, que provocam diferentes distribuições de tensões.</p>
<h3>Tração</h3>
<p><strong>Descrição:</strong> Força que "puxa" o material, alongando-o. <strong>Exemplo:</strong> Tirantes, cabos de suspensão, barras de aço em vigas (zona inferior). <strong>Materiais adequados:</strong> Aço, madeira (em algumas direções).</p>
<h3>Compressão</h3>
<p><strong>Descrição:</strong> Força que "empurra" o material, comprimindo-o. <strong>Exemplo:</strong> Pilares, colunas, paredes, fundações. <strong>Materiais adequados:</strong> Betão, tijolo, madeira, aço.</p>
<h3>Flexão</h3>
<p><strong>Descrição:</strong> Força que "dobra" o material, criando tração num lado e compressão no outro. <strong>Exemplo:</strong> Vigas, lajes. <strong>Materiais adequados:</strong> Betão armado (betão na compressão, aço na tração), aço, madeira.</p>
<h3>Corte (Esforço Transverso)</h3>
<p><strong>Descrição:</strong> Força que atua perpendicularmente ao eixo do elemento, tentando "cortá-lo". <strong>Exemplo:</strong> Ligações, extremidades de vigas, parafusos. <strong>Materiais adequados:</strong> Aço, madeira (com atenção aos veios).</p>
<h3>Torção</h3>
<p><strong>Descrição:</strong> Força que "torce" o material em torno do seu eixo. <strong>Exemplo:</strong> Eixos de transmissão, vigas sujeitas a cargas excêntricas. <strong>Materiais adequados:</strong> Aço.</p>
</div>
<div class="cb"><h2><i class="fas fa-chart-area"></i> Diagrama Tensão-Deformação</h2>
<div class="ib">O diagrama tensão-deformação mostra como um material se comporta sob carga crescente: começa numa Zona Elástica, onde a curva sobe em linha reta até ao Limite de Elasticidade; depois entra na Zona Plástica, onde a curva continua a subir mas de forma menos acentuada, até atingir a Ruptura, onde o material parte-se.</div>
<ul><li><strong>Zona Elástica:</strong> O material deforma-se, mas volta à forma original quando a carga é removida (Lei de Hooke).</li>
<li><strong>Limite de Elasticidade:</strong> Tensão máxima sem deformação permanente.</li>
<li><strong>Zona Plástica:</strong> O material deforma-se permanentemente (não recupera a forma original).</li>
<li><strong>Ruptura:</strong> O material parte-se.</li></ul>
</div>
<div class="cb"><h2><i class="fas fa-shield-halved"></i> Tensões Admissíveis e Coeficientes de Segurança</h2>
<p>Na prática, os materiais não são dimensionados para trabalhar no limite da sua resistência máxima. É aplicado um <strong>coeficiente de segurança</strong> (geralmente 1,5 a 3,0) para garantir a segurança.</p>
<div class="fbox"><div class="f">Tensão Admissível = Tensão de Rotura / Coeficiente de Segurança</div></div>
<p><strong>Exemplo:</strong> A tensão de rotura do betão à compressão é de 30 MPa. Com um coeficiente de segurança de 2, a tensão admissível é 15 MPa.</p>
</div>
<div class="cb"><h2><i class="fas fa-industry"></i> Aplicação Prática</h2>
<h3>Cálculo da Tensão num Pilar</h3>
<p><strong>Problema:</strong> Um pilar de betão armado tem 0,3 m × 0,3 m de secção e suporta uma carga de 500 kN.</p>
<p><strong>Solução:</strong> Área = 0,3 × 0,3 = 0,09 m². Tensão = 500.000 / 0,09 = 5.555.556 Pa ≈ 5,56 MPa</p>
<div class="hi">A tensão de compressão no pilar é de <strong>5,56 MPa</strong>.</div>
<h3>Dimensionamento de uma Viga de Madeira</h3>
<p><strong>Problema:</strong> Uma viga de madeira de pinho suporta uma carga de 15 kN. A tensão admissível da madeira à flexão é de 10 MPa. Qual é a secção mínima necessária?</p>
<p><strong>Solução:</strong> Área mínima = 15.000 / 10.000.000 = 0,0015 m² = 1.500 mm². Uma viga de 100 mm × 100 mm tem área = 10.000 mm² (suficiente).</p>
<div class="hi">A viga deve ter no mínimo <strong>100 mm × 100 mm</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-building"></i> Exercício Prático — Kwanza Construtora, LDA</h2>
<p>Uma coluna de aço com secção circular de 0,15 m de diâmetro suporta uma carga de 200 kN. A tensão admissível do aço é de 150 MPa.</p>
<ol><li>Qual é a área da secção transversal?</li><li>Qual é a tensão atuante?</li><li>A coluna é segura?</li></ol>
<h3>Gabarito comentado</h3>
<p><strong>1. Área da secção:</strong> A = π × r² = 3,14 × (0,075)² = 3,14 × 0,005625 ≈ 0,01767 m²</p>
<div class="hi">Área da secção: <strong>≈ 0,01767 m²</strong></div>
<p><strong>2. Tensão atuante:</strong> σ = 200.000 / 0,01767 ≈ 11.318.000 Pa ≈ 11,32 MPa</p>
<div class="hi">Tensão atuante: <strong>≈ 11,32 MPa</strong></div>
<p><strong>3. Segurança:</strong> Tensão atuante (11,32 MPa) &lt; Tensão admissível (150 MPa) → <strong>Segura</strong></p>
<div class="hi">A coluna é segura, com uma margem considerável.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul><li><strong>Tensão (σ)</strong> é a força por unidade de área (N/m² ou Pa).</li>
<li><strong>Deformação (ε)</strong> é a variação relativa do comprimento.</li>
<li>A <strong>Lei de Hooke</strong> relaciona tensão e deformação (σ = E × ε).</li>
<li>Os principais esforços são: tração, compressão, flexão, corte e torção.</li>
<li>O betão é bom em compressão; o aço é bom em tração e compressão.</li>
<li>Os coeficientes de segurança garantem a fiabilidade das estruturas.</li></ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> compreender os conceitos de tensão, deformação e os principais tipos de esforço, essenciais para o dimensionamento estrutural.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Qual é a unidade de tensão no Sistema Internacional?</div>
<div class="qo" onclick="cq(this,false)">a) N</div>
<div class="qo" onclick="cq(this,true)">b) Pa</div>
<div class="qo" onclick="cq(this,false)">c) J</div>
<div class="qo" onclick="cq(this,false)">d) m</div>
<div class="qq">2. O betão é excelente em que tipo de esforço?</div>
<div class="qo" onclick="cq(this,false)">a) Tração</div>
<div class="qo" onclick="cq(this,true)">b) Compressão</div>
<div class="qo" onclick="cq(this,false)">c) Torção</div>
<div class="qo" onclick="cq(this,false)">d) Corte</div>
<div class="qq">3. Qual é a fórmula da Lei de Hooke?</div>
<div class="qo" onclick="cq(this,true)">a) σ = E × ε</div>
<div class="qo" onclick="cq(this,false)">b) σ = F / A</div>
<div class="qo" onclick="cq(this,false)">c) ε = ΔL / L₀</div>
<div class="qo" onclick="cq(this,false)">d) M = F × d</div>
<div class="qq">4. A tensão admissível é calculada como:</div>
<div class="qo" onclick="cq(this,false)">a) Tensão de rotura × Coeficiente de segurança</div>
<div class="qo" onclick="cq(this,true)">b) Tensão de rotura / Coeficiente de segurança</div>
<div class="qo" onclick="cq(this,false)">c) Tensão de rotura + Coeficiente de segurança</div>
<div class="qo" onclick="cq(this,false)">d) Tensão de rotura – Coeficiente de segurança</div>
</div>`},
{t:'Hidráulica Básica: Pressão, Caudal e Escoamento em Tubagens', html:`
<div class="cb"><h2><i class="fas fa-droplet"></i> Por que a Hidráulica é Essencial na Construção?</h2>
<p>A água é um elemento fundamental em qualquer edifício. É necessária para o consumo humano, para a limpeza, para o combate a incêndios, para a irrigação de jardins, etc. As instalações hidráulicas (tubagens, reservatórios, bombas, etc.) são uma parte essencial de qualquer projeto de construção.</p>
<p>Em Angola, onde o abastecimento de água pode ser irregular, o dimensionamento correto das instalações hidráulicas é ainda mais crítico. Um sistema mal dimensionado pode resultar em:</p>
<ul><li><strong>Pressão insuficiente:</strong> água a pingar nas torneiras.</li>
<li><strong>Pressão excessiva:</strong> rotura de tubagens e acessórios.</li>
<li><strong>Caudal insuficiente:</strong> impossibilidade de usar vários pontos de água em simultâneo.</li>
<li><strong>Perda de carga elevada:</strong> necessidade de bombas mais potentes.</li></ul>
<div class="ib"><strong>Pare e pense:</strong> Se um edifício tem 10 andares, a água chega ao último piso com a mesma pressão que no rés-do-chão? (Resposta: não. A pressão diminui com a altura. Por isso, é necessário dimensionar as tubagens e, em muitos casos, instalar bombas ou reservatórios elevados.)</div>
</div>
<div class="cb"><h2><i class="fas fa-gauge-high"></i> Conceitos Fundamentais de Hidráulica</h2>
<h3>Pressão (P)</h3>
<p>A <strong>pressão</strong> é a força exercida por um fluido (líquido ou gás) por unidade de área.</p>
<div class="fbox"><div class="f">P = F / A</div><div class="fd">Unidade: Pascal (Pa). Na prática usa-se m.c.a., bar ou kPa. 1 m.c.a. ≈ 9,8 kPa ≈ 0,098 bar</div></div>
<p><strong>Exemplo:</strong> Uma coluna de água de 10 m de altura exerce uma pressão de aproximadamente 10 m.c.a. ≈ 98 kPa.</p>
<h3>Pressão Hidrostática</h3>
<p>A pressão num ponto de um líquido em repouso depende da altura da coluna de água acima desse ponto.</p>
<div class="fbox"><div class="f">P = ρ × g × h</div><div class="fd">ρ = densidade da água (1.000 kg/m³); g = aceleração da gravidade (9,8 m/s²); h = altura da coluna de água (m)</div></div>
<p><strong>Exemplo:</strong> A pressão no fundo de um reservatório de água com 5 m de altura é: P = 1.000 × 9,8 × 5 = 49.000 Pa = 49 kPa ≈ 5 m.c.a.</p>
<h3>Caudal (Q)</h3>
<p>O <strong>caudal</strong> é o volume de fluido que passa por uma secção transversal por unidade de tempo.</p>
<div class="fbox"><div class="f">Q = V / t</div><div class="fd">Unidade: m³/s ou L/s (1 m³/s = 1.000 L/s). Também se usa m³/h</div></div>
<p><strong>Exemplo:</strong> Uma torneira aberta durante 1 minuto (60 s) deita 12 L de água. Q = 12 L / 60 s = 0,2 L/s</p>
<h3>Velocidade (v)</h3>
<p>A <strong>velocidade</strong> do fluido numa tubagem está relacionada com o caudal e com a área da secção da tubagem.</p>
<div class="fbox"><div class="f">Q = A × v</div><div class="fd">A = área da secção transversal (m²); v = velocidade (m/s)</div></div>
<p><strong>Exemplo:</strong> Uma tubagem com diâmetro interno de 0,05 m (50 mm) tem uma área de A = π × r² = 3,14 × (0,025)² ≈ 0,00196 m². Se o caudal for 0,2 L/s (0,0002 m³/s), a velocidade é v = Q / A = 0,0002 / 0,00196 ≈ 0,102 m/s</p>
<h3>Perda de Carga</h3>
<p>A <strong>perda de carga</strong> é a redução de pressão ao longo de uma tubagem, causada pelo atrito da água com as paredes da tubagem e por acessórios (curvas, válvulas, etc.). Depende do comprimento e diâmetro da tubagem, da velocidade da água, da rugosidade da tubagem e do número e tipo de acessórios.</p>
<div class="fbox"><div class="f">ΔP = f × (L / D) × (ρ × v² / 2)</div><div class="fd">Fórmula simplificada de Darcy-Weisbach: f = fator de atrito; L = comprimento (m); D = diâmetro interno (m); ρ = densidade da água; v = velocidade (m/s)</div></div>
</div>
<div class="cb"><h2><i class="fas fa-pipe"></i> Dimensionamento de Instalações Hidráulicas</h2>
<h3>Dimensionamento de Tubagens</h3>
<p>Para dimensionar uma tubagem, é necessário determinar: o <strong>caudal de ponta</strong> (o caudal máximo que pode ser necessário em simultâneo), a <strong>pressão disponível</strong> (fornecida pela rede pública ou pela bomba), e a <strong>perda de carga admissível</strong> (a perda de pressão que pode ser tolerada).</p>
<p><strong>Exemplo:</strong> Um edifício de 10 pisos precisa de um caudal de ponta de 2 L/s. A pressão da rede pública é de 400 kPa (≈ 40 m.c.a.). A perda de carga total admissível é de 100 kPa (≈ 10 m.c.a.).</p>
<h3>Cálculo da Pressão Disponível</h3>
<div class="fbox"><div class="f">P_disponível = P_início – P_perda_carga – P_altura</div></div>
<p><strong>Exemplo:</strong> Pressão na entrada = 400 kPa. Perda de carga total = 100 kPa. Altura do ponto = 15 m (≈ 150 kPa). P_disponível = 400 – 100 – 150 = 150 kPa.</p>
<div class="hi">A pressão disponível no ponto mais desfavorável é <strong>150 kPa (15 m.c.a.)</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-faucet"></i> Aplicação Prática</h2>
<h3>Cálculo da Pressão num Ponto</h3>
<p><strong>Problema:</strong> Um reservatório elevado de 10 m de altura abastece uma torneira. Qual é a pressão na torneira?</p>
<p><strong>Solução:</strong> P = ρ × g × h = 1.000 × 9,8 × 10 = 98.000 Pa = 98 kPa</p>
<div class="hi">A pressão na torneira é de <strong>98 kPa</strong> (≈ 10 m.c.a.).</div>
<h3>Dimensionamento de uma Tubagem</h3>
<p><strong>Problema:</strong> Uma tubagem de 50 mm de diâmetro transporta água a uma velocidade de 1,5 m/s. Caudal = A × v = 0,00196 × 1,5 = 0,00294 m³/s ≈ 2,94 L/s</p>
<div class="hi">O caudal é de <strong>2,94 L/s</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-building"></i> Exercício Prático — Kwanza Construtora, LDA</h2>
<p>Um edifício de 6 pisos tem uma altura total de 18 m. A pressão na rede pública é de 300 kPa. A perda de carga estimada é de 50 kPa.</p>
<ol><li>Qual é a pressão disponível no ponto mais alto (6º piso)?</li><li>É necessária uma bomba de reforço?</li></ol>
<h3>Gabarito comentado</h3>
<p><strong>1. Pressão disponível:</strong> Pressão necessária para elevar a água: P = ρ × g × h = 1.000 × 9,8 × 18 = 176.400 Pa ≈ 176 kPa. Pressão disponível = 300 – 50 – 176 = 74 kPa</p>
<div class="hi">Pressão disponível: <strong>74 kPa</strong></div>
<p><strong>2. Necessidade de bomba:</strong> A pressão disponível (74 kPa) é baixa, mas ainda positiva. No entanto, para garantir o conforto (pressão mínima recomendada: 100 kPa), recomenda-se a instalação de uma bomba de reforço.</p>
<div class="hi">Recomenda-se a instalação de uma <strong>bomba de reforço</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul><li>A <strong>pressão</strong> é a força por unidade de área (P = ρ × g × h).</li>
<li>O <strong>caudal</strong> é o volume de água por unidade de tempo (Q = V / t).</li>
<li>A <strong>velocidade</strong> relaciona-se com o caudal e a área (Q = A × v).</li>
<li>A <strong>perda de carga</strong> é a redução de pressão ao longo da tubagem.</li>
<li>O dimensionamento de instalações hidráulicas considera o caudal de ponta, a pressão disponível e a perda de carga.</li></ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> calcular pressão, caudal e perda de carga em tubagens, essenciais para o dimensionamento de instalações hidráulicas.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Qual é a unidade de pressão no SI?</div>
<div class="qo" onclick="cq(this,false)">a) N</div>
<div class="qo" onclick="cq(this,true)">b) Pa</div>
<div class="qo" onclick="cq(this,false)">c) m³/s</div>
<div class="qo" onclick="cq(this,false)">d) kg/m³</div>
<div class="qq">2. A pressão no fundo de um reservatório de água com 8 m de altura é aproximadamente:</div>
<div class="qo" onclick="cq(this,true)">a) 80 kPa</div>
<div class="qo" onclick="cq(this,false)">b) 8 kPa</div>
<div class="qo" onclick="cq(this,false)">c) 800 kPa</div>
<div class="qo" onclick="cq(this,false)">d) 0,8 kPa</div>
<div class="qq">3. Uma tubagem de 0,04 m de diâmetro transporta água a 1,5 m/s. Qual é o caudal?</div>
<div class="qo" onclick="cq(this,false)">a) 1,5 L/s</div>
<div class="qo" onclick="cq(this,true)">b) 1,88 L/s</div>
<div class="qo" onclick="cq(this,false)">c) 3,0 L/s</div>
<div class="qo" onclick="cq(this,false)">d) 4,5 L/s</div>
<div class="qq">4. O que é a perda de carga?</div>
<div class="qo" onclick="cq(this,false)">a) Aumento de pressão na tubagem</div>
<div class="qo" onclick="cq(this,true)">b) Redução de pressão devido ao atrito e acessórios</div>
<div class="qo" onclick="cq(this,false)">c) Aumento de caudal</div>
<div class="qo" onclick="cq(this,false)">d) Redução do diâmetro da tubagem</div>
</div>`},
{t:'Térmica e Conforto Ambiental em Edifícios', html:`
<div class="cb"><h2><i class="fas fa-temperature-half"></i> A Importância do Conforto Térmico em Angola</h2>
<p>Angola tem um clima tropical, com temperaturas elevadas durante a maior parte do ano. Em Luanda, as temperaturas médias variam entre 22°C e 30°C, com humidade elevada. Em províncias do interior (Huíla, Bié, Huambo), as temperaturas são mais amenas, mas o sol é intenso.</p>
<p>O conforto térmico é essencial para a saúde, o bem-estar e a produtividade. Um edifício mal projetado pode ser demasiado quente, obrigando ao uso excessivo de ar condicionado (caro e consumidor de energia), ou demasiado frio (menos comum em Angola).</p>
<p>Um projeto de arquitetura que considere o clima pode: <strong>reduzir o consumo de energia</strong> (ar condicionado, ventilação), <strong>melhorar o conforto dos ocupantes</strong>, <strong>aumentar a durabilidade</strong> dos materiais, e <strong>diminuir os custos de manutenção</strong>.</p>
<div class="ib"><strong>Pare e pense:</strong> Se uma casa em Luanda tem paredes de tijolo de 0,20 m e um telhado de zinco sem isolamento, qual é a sensação térmica no interior durante o verão? (Resposta: provavelmente muito quente, porque o calor penetra pelas paredes e o telhado aquece significativamente.)</div>
</div>
<div class="cb"><h2><i class="fas fa-fire"></i> Conceitos Fundamentais de Transferência de Calor</h2>
<p>O calor pode ser transferido de três formas:</p>
<h3>Condução</h3>
<p>A <strong>condução</strong> é a transferência de calor através de um material sólido. Os materiais que conduzem bem o calor têm alta condutividade térmica (ex: metais). Os materiais que conduzem mal o calor têm baixa condutividade térmica (ex: madeira, tijolo, isolamento).</p>
<p><strong>Exemplo:</strong> Uma parede de betão conduz calor do exterior para o interior. Uma parede com isolamento (ex: lã de vidro, poliestireno) reduz a condução.</p>
<h3>Convecção</h3>
<p>A <strong>convecção</strong> é a transferência de calor através do movimento de fluidos (ar, água). É o princípio por trás das correntes de convecção (ar quente sobe, ar frio desce).</p>
<p><strong>Exemplo:</strong> O ar quente sobe para o teto, criando uma zona mais quente na parte superior do cômodo.</p>
<h3>Radiação</h3>
<p>A <strong>radiação</strong> é a transferência de calor por ondas eletromagnéticas. O Sol é a principal fonte de radiação (calor radiante). A radiação não precisa de um meio material (pode propagar-se no vácuo).</p>
<p><strong>Exemplo:</strong> O sol aquece o telhado e as paredes exteriores através da radiação.</p>
</div>
<div class="cb"><h2><i class="fas fa-wind"></i> Fatores que Afetam o Conforto Térmico</h2>
<div class="tw"><table class="dt"><tr><th>Fator</th><th>Descrição</th></tr>
<tr><td><strong>Temperatura do ar</strong></td><td>Temperatura ambiente.</td></tr>
<tr><td><strong>Temperatura radiante</strong></td><td>Temperatura das superfícies (paredes, teto, chão).</td></tr>
<tr><td><strong>Humidade</strong></td><td>Quantidade de água no ar (humidade alta dificulta a evaporação do suor).</td></tr>
<tr><td><strong>Velocidade do ar</strong></td><td>Movimento do ar (ventilação) que ajuda a arrefecer.</td></tr>
<tr><td><strong>Vestuário</strong></td><td>Tipo de roupa usada.</td></tr>
<tr><td><strong>Atividade</strong></td><td>Nível de atividade física.</td></tr></table></div>
</div>
<div class="cb"><h2><i class="fas fa-sun"></i> Estratégias de Projeto para Conforto Térmico em Angola</h2>
<h3>Orientação Solar</h3>
<p><strong>Orientação Norte-Sul:</strong> As fachadas principais devem estar viradas a Norte e a Sul, para evitar a radiação solar direta a Oeste (o pior, porque o sol da tarde é mais intenso). <strong>Proteção solar:</strong> utilizar beirais, pérgolas, palas e varandas para sombrear as janelas.</p>
<h3>Isolamento Térmico</h3>
<p><strong>Paredes:</strong> utilizar paredes duplas com isolamento (ex: lã de vidro) ou tijolos furados. <strong>Cobertura:</strong> o telhado deve ter isolamento térmico (ex: lã de rocha, painéis sanduíche); as telhas de zinco aquecem muito e devem ser isoladas por baixo. <strong>Janelas:</strong> utilizar vidro duplo com caixa de ar para reduzir a condução.</p>
<h3>Ventilação Natural</h3>
<p><strong>Desenho de planta:</strong> plantas abertas, com cruzamento de ventos (janelas em fachadas opostas). <strong>Janelas:</strong> janelas grandes para permitir a entrada de ar. <strong>Elementos de sombreamento:</strong> pérgolas, toldos, vegetação.</p>
<h3>Inércia Térmica</h3>
<p>Materiais com alta inércia térmica (betão, tijolo) absorvem calor durante o dia e libertam-no à noite, suavizando as variações de temperatura.</p>
</div>
<div class="cb"><h2><i class="fas fa-building"></i> Exercício Prático — Kwanza Construtora, LDA</h2>
<p>A empresa está a projetar uma moradia em Luanda. O arquiteto propôs as seguintes soluções: janelas de grandes dimensões viradas a Oeste; telhado de zinco sem isolamento; paredes de tijolo de 0,15 m, sem isolamento; ventilação natural apenas com janelas.</p>
<ol><li>Que problemas térmicos pode ter esta moradia?</li><li>Que soluções pode propor para melhorar o conforto térmico?</li></ol>
<h3>Gabarito comentado</h3>
<p><strong>1. Problemas térmicos:</strong> Janelas a Oeste vão receber sol intenso ao fim da tarde, causando sobreaquecimento. Telhado de zinco sem isolamento vai aquecer muito, transmitindo calor para o interior. Paredes de 0,15 m sem isolamento vão conduzir calor para o interior. Ventilação natural apenas com janelas pode ser insuficiente para arrefecer o interior.</p>
<p><strong>2. Soluções propostas:</strong> Orientar as janelas a Norte e Sul. Adicionar isolamento térmico ao telhado (ex: lã de rocha). Usar paredes duplas com isolamento ou tijolos furados. Prever ventilação cruzada (janelas em fachadas opostas). Adicionar elementos de sombreamento (beirais, pérgolas).</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul><li>O conforto térmico é essencial para a saúde, o bem-estar e a eficiência energética.</li>
<li>O calor é transferido por condução, convecção e radiação.</li>
<li>Em Angola, o principal desafio é o sobreaquecimento.</li>
<li>Estratégias de projeto incluem: orientação solar, isolamento, ventilação natural e inércia térmica.</li>
<li>Um projeto que considera o clima pode reduzir o consumo de energia e melhorar o conforto.</li></ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> compreender os princípios de transferência de calor e a aplicar estratégias de projeto para melhorar o conforto térmico em edifícios angolanos.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Qual é a principal fonte de calor num edifício em Angola?</div>
<div class="qo" onclick="cq(this,false)">a) Ar condicionado</div>
<div class="qo" onclick="cq(this,true)">b) Radiação solar</div>
<div class="qo" onclick="cq(this,false)">c) Convecção do ar</div>
<div class="qo" onclick="cq(this,false)">d) Iluminação</div>
<div class="qq">2. O que é a condução térmica?</div>
<div class="qo" onclick="cq(this,false)">a) Transferência de calor através do movimento de fluidos</div>
<div class="qo" onclick="cq(this,true)">b) Transferência de calor através de um material sólido</div>
<div class="qo" onclick="cq(this,false)">c) Transferência de calor por ondas eletromagnéticas</div>
<div class="qo" onclick="cq(this,false)">d) Transferência de calor por evaporação</div>
<div class="qq">3. Que orientação é preferível para as janelas em Angola?</div>
<div class="qo" onclick="cq(this,false)">a) Nascente</div>
<div class="qo" onclick="cq(this,false)">b) Poente</div>
<div class="qo" onclick="cq(this,true)">c) Norte e Sul</div>
<div class="qo" onclick="cq(this,false)">d) Leste</div>
<div class="qq">4. Qual é uma solução para melhorar o isolamento térmico de um telhado de zinco?</div>
<div class="qo" onclick="cq(this,false)">a) Pintar o telhado de branco</div>
<div class="qo" onclick="cq(this,true)">b) Adicionar isolamento térmico por baixo do telhado</div>
<div class="qo" onclick="cq(this,false)">c) Aumentar a espessura do zinco</div>
<div class="qo" onclick="cq(this,false)">d) Não fazer nada</div>
</div>`},
{t:'Cálculos de Quantidades: Materiais, Custos e Rendimentos de Mão-de-Obra', html:`
<div class="cb"><h2><i class="fas fa-clipboard-list"></i> A Importância do Cálculo de Quantidades</h2>
<p>Na construção civil, o cálculo de quantidades é uma das tarefas mais importantes e mais frequentes do Técnico de Edificações. Um erro no cálculo de quantidades pode resultar em:</p>
<ul><li><strong>Falta de materiais:</strong> atrasos na obra e custos adicionais com transporte urgente.</li>
<li><strong>Excesso de materiais:</strong> desperdício financeiro e espaço de armazenamento ocupado.</li>
<li><strong>Orçamento incorreto:</strong> a empresa pode perder dinheiro (se subestimar) ou perder a concorrência (se sobrestimar).</li>
<li><strong>Planeamento errado:</strong> prazos podem ser afetados por falta de mão-de-obra ou materiais.</li></ul>
<p>Em Angola, onde os preços dos materiais podem flutuar significativamente, a precisão nos cálculos é ainda mais crítica. Um bom cálculo de quantidades é a base para um orçamento realista e para uma gestão eficiente da obra.</p>
<div class="ib"><strong>Pare e pense:</strong> Se uma parede tem 20 m de comprimento e 3 m de altura, e o bloco usado tem 0,40 m × 0,20 m, quantos blocos são necessários? (Resposta: Área = 20 × 3 = 60 m²; Área do bloco = 0,40 × 0,20 = 0,08 m²; Blocos = 60 / 0,08 = 750 blocos.)</div>
</div>
<div class="cb"><h2><i class="fas fa-boxes-stacked"></i> Cálculo de Quantidades de Materiais</h2>
<h3>Cálculo de Blocos para Alvenaria</h3>
<div class="fbox"><div class="f">Número de Blocos = Área da Parede / Área de Cada Bloco</div></div>
<p><strong>Exemplo:</strong> Parede de 10 m × 2,5 m = 25 m². Bloco de 0,40 m × 0,20 m = 0,08 m². N = 25 / 0,08 = 312,5 ≈ 313 blocos</p>
<p><strong>Considerar:</strong> juntas de argamassa (geralmente 1 cm) e desperdício (5%).</p>
<h3>Cálculo de Betão</h3>
<div class="fbox"><div class="f">Volume de Betão = Comprimento × Largura × Altura (ou espessura)</div></div>
<p><strong>Exemplo:</strong> Laje de 10 m × 8 m × 0,12 m = 9,6 m³. <strong>Considerar:</strong> desperdício (5%).</p>
<h3>Cálculo de Argamassa (assentamento de blocos)</h3>
<p>O consumo de argamassa é geralmente estimado como <strong>10% a 15% do volume de alvenaria</strong>.</p>
<p><strong>Exemplo:</strong> Volume de alvenaria = 25 m² × 0,20 m (espessura da parede) = 5 m³. Argamassa = 5 × 0,12 = 0,6 m³.</p>
<h3>Cálculo de Ferragens (Aço)</h3>
<p>O cálculo de ferragens é feito em <strong>kg</strong>. A quantidade de aço depende do tipo de estrutura e do dimensionamento.</p>
<p><strong>Valores típicos (estimativa):</strong> Fundações (sapatas): 50 – 80 kg/m³ de betão. Pilares: 100 – 150 kg/m³. Vigas: 100 – 150 kg/m³. Lajes: 80 – 120 kg/m³.</p>
<p><strong>Exemplo:</strong> Uma laje de 10 m³ de betão pode ter cerca de 10 × 100 = 1.000 kg de aço.</p>
<h3>Cálculo de Cimento, Areia e Brita</h3>
<p>Para betão (traço típico 1:2:3 – 1 parte de cimento, 2 de areia, 3 de brita, em volume), para 1 m³ de betão são necessários aproximadamente: Cimento: 350 kg (7 sacos de 50 kg). Areia: 0,5 m³. Brita: 0,7 m³.</p>
<p><strong>Para argamassa de assentamento (traço 1:4):</strong> Cimento: 200 kg/m³. Areia: 0,8 m³/m³.</p>
</div>
<div class="cb"><h2><i class="fas fa-coins"></i> Custos dos Materiais</h2>
<p>O custo dos materiais é calculado multiplicando as quantidades pelos preços unitários.</p>
<div class="fbox"><div class="f">Custo Total = Quantidade × Preço Unitário</div></div>
<p><strong>Exemplo:</strong> 313 blocos × Kz 200/bloco = 62.600 Kz.</p>
</div>
<div class="cb"><h2><i class="fas fa-user-helmet-safety"></i> Rendimentos de Mão-de-Obra</h2>
<p>O <strong>rendimento da mão-de-obra</strong> é a quantidade de trabalho que um trabalhador (ou equipa) consegue executar num determinado período (ex: hora, dia, semana). É essencial para <strong>planear os prazos</strong> e <strong>estimar os custos</strong>.</p>
<h3>Rendimentos Típicos (valores orientadores)</h3>
<div class="tw"><table class="dt"><tr><th>Tarefa</th><th>Unidade</th><th>Rendimento (por dia)</th></tr>
<tr><td>Alvenaria de blocos (um pedreiro)</td><td>m²</td><td>10 – 15 m²</td></tr>
<tr><td>Reboco (um pedreiro)</td><td>m²</td><td>15 – 20 m²</td></tr>
<tr><td>Betonagem de laje (equipa de 4)</td><td>m³</td><td>20 – 30 m³</td></tr>
<tr><td>Colocação de azulejos (um azulejista)</td><td>m²</td><td>10 – 15 m²</td></tr>
<tr><td>Pintura (um pintor)</td><td>m²</td><td>25 – 40 m²</td></tr>
<tr><td>Escavação manual (um trabalhador)</td><td>m³</td><td>2 – 4 m³</td></tr></table></div>
<p><strong>Nota:</strong> Estes valores variam conforme a experiência dos trabalhadores, a complexidade da obra e as condições do estaleiro.</p>
<p><strong>Exemplo:</strong> Uma parede de 60 m² de alvenaria de blocos, com um rendimento de 12 m²/dia, demora 60 / 12 = 5 dias.</p>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Aplicação Prática – Orçamento de uma Parede</h2>
<p><strong>Problema:</strong> Uma parede de 12 m × 3 m = 36 m² vai ser construída com blocos de 0,40 m × 0,20 m.</p>
<p><strong>Dados:</strong> Blocos: Kz 200/unidade. Cimento: Kz 1.500/saco (50 kg). Areia: Kz 5.000/m³. Pedreiro: Kz 3.000/dia. Servente: Kz 1.500/dia. Rendimento do pedreiro: 12 m²/dia.</p>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Número de blocos</h4><p>Área do bloco = 0,40 × 0,20 = 0,08 m². Blocos = 36 / 0,08 = 450 blocos. Com desperdício (5%): 450 × 1,05 ≈ 473 blocos. Custo dos blocos = 473 × 200 = 94.600 Kz.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Argamassa</h4><p>Volume de alvenaria = 36 × 0,20 = 7,2 m³. Argamassa = 7,2 × 0,12 = 0,864 m³. Cimento: 0,864 × 200 = 172,8 kg ≈ 3,5 sacos. Areia: 0,864 × 0,8 = 0,69 m³.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Mão-de-obra</h4><p>Tempo = 36 / 12 = 3 dias. Custo do pedreiro = 3 × 3.000 = 9.000 Kz. Custo do servente (2 serventes por dia) = 3 × 2 × 1.500 = 9.000 Kz.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Custo total</h4><p>Blocos: 94.600 Kz. Cimento: 3,5 × 1.500 = 5.250 Kz. Areia: 0,69 × 5.000 = 3.450 Kz. Mão-de-obra: 18.000 Kz.</p></div></div>
</div>
<div class="hi"><strong>Total: 94.600 + 5.250 + 3.450 + 18.000 = 121.300 Kz.</strong></div>
</div>
<div class="cb"><h2><i class="fas fa-building"></i> Exercício Prático — Kwanza Construtora, LDA</h2>
<p>Uma parede de 10 m × 2,8 m = 28 m² vai ser construída com blocos de 0,40 m × 0,20 m.</p>
<p><strong>Dados:</strong> Blocos: Kz 180/unidade. Cimento: Kz 1.400/saco. Areia: Kz 4.500/m³. Pedreiro: Kz 2.500/dia. Servente: Kz 1.200/dia. Rendimento do pedreiro: 14 m²/dia. Desperdício: 5%.</p>
<ol><li>Quantos blocos são necessários?</li><li>Qual é o custo dos blocos?</li><li>Quanto tempo demora a execução?</li><li>Qual é o custo total da parede (materiais + mão-de-obra)?</li></ol>
<h3>Gabarito comentado</h3>
<p><strong>1. Blocos:</strong> Área do bloco = 0,40 × 0,20 = 0,08 m². Blocos = 28 / 0,08 = 350 blocos. Com desperdício: 350 × 1,05 ≈ 368 blocos. Custo dos blocos = 368 × 180 = 66.240 Kz.</p>
<div class="hi">Blocos necessários: <strong>368</strong>. Custo: <strong>66.240 Kz</strong></div>
<p><strong>2. Argamassa:</strong> Volume de alvenaria = 28 × 0,20 = 5,6 m³. Argamassa = 5,6 × 0,12 = 0,672 m³. Cimento: 0,672 × 200 = 134,4 kg ≈ 2,69 sacos (3 sacos). Areia: 0,672 × 0,8 = 0,54 m³.</p>
<p><strong>3. Mão-de-obra:</strong> Tempo = 28 / 14 = 2 dias. Custo pedreiro = 2 × 2.500 = 5.000 Kz. Custo servente (2 serventes por dia) = 2 × 2 × 1.200 = 4.800 Kz. Custo mão-de-obra = 9.800 Kz.</p>
<div class="hi">Tempo de execução: <strong>2 dias</strong></div>
<p><strong>4. Custo total:</strong> Blocos: 66.240 Kz. Cimento: 3 × 1.400 = 4.200 Kz. Areia: 0,54 × 4.500 = 2.430 Kz. Mão-de-obra: 9.800 Kz.</p>
<div class="hi"><strong>Total: 66.240 + 4.200 + 2.430 + 9.800 = 82.670 Kz.</strong></div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul><li>O cálculo de quantidades é essencial para orçamentação, planeamento e gestão de obra.</li>
<li>As quantidades de materiais são calculadas a partir de áreas, volumes e traços.</li>
<li>O rendimento da mão-de-obra permite estimar os prazos e os custos.</li>
<li>É importante considerar desperdícios e imprevistos (5% a 10%).</li>
<li>Um orçamento bem feito é a base para o sucesso financeiro da obra.</li></ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> calcular quantidades de materiais, custos e rendimentos de mão-de-obra, competências essenciais para a gestão de obras.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Quantos blocos de 0,40 m × 0,20 m são necessários para uma parede de 30 m²?</div>
<div class="qo" onclick="cq(this,true)">a) 375</div>
<div class="qo" onclick="cq(this,false)">b) 300</div>
<div class="qo" onclick="cq(this,false)">c) 450</div>
<div class="qo" onclick="cq(this,false)">d) 500</div>
