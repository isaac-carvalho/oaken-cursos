{t:'Fases de um Projecto de Construção: Do Estudo Prévio à Entrega da Obra', html:`
<div class="cb"><h2><i class="fas fa-timeline"></i> O Ciclo de Vida de um Projecto de Construção</h2>
<p>Um projecto de construção civil é um processo complexo que se desenrola ao longo de várias fases, desde a ideia inicial até à utilização do edifício. Em Angola, a falta de planeamento adequado em cada uma destas fases é uma das principais causas de atrasos, estouros de orçamento e defeitos de construção.</p>
<div class="ib"><strong>Pare e pense:</strong> Se um projecto for lançado sem um estudo de viabilidade adequado, que riscos corre? A empresa pode investir tempo e dinheiro num projecto que não é economicamente viável, que não cumpre as exigências legais, ou que não tem procura no mercado.</div>
</div>
<div class="cb"><h2><i class="fas fa-magnifying-glass-chart"></i> Fase 0 – Estudo Prévio e Viabilidade</h2>
<h3>Análise de Necessidades</h3>
<p>O que se pretende construir? Para que fim? Quem vai utilizar? Qual o orçamento disponível? Exemplo: um promotor imobiliário em Luanda quer construir um edifício de escritórios. Precisa de saber se há procura por escritórios na zona, qual o preço de mercado, e se o investimento é viável.</p>
<h3>Estudo de Viabilidade</h3>
<p>Viabilidade Técnica: o terreno é adequado? Há acesso a água, electricidade, saneamento? Viabilidade Económica: o projecto é rentável? Qual o retorno do investimento (ROI)? Viabilidade Legal: o terreno está legalizado? Há restrições urbanísticas?</p>
<h3>Estudo de Impacto Ambiental (EIA)</h3>
<p>Em Angola, certos projectos (grandes infraestruturas, zonas industriais) exigem um Estudo de Impacto Ambiental, que avalia os potenciais impactos ambientais e propõe medidas de mitigação.</p>
<h3>Escolha da Equipa Técnica</h3>
<p>Nesta fase, o Dono de Obra contrata a equipa técnica: arquiteto, engenheiro, fiscal, etc. Documentos produzidos: Estudo de Viabilidade, Programa de Necessidades, Orçamento preliminar.</p>
</div>
<div class="cb"><h2><i class="fas fa-drafting-compass"></i> Fase 1 – Projecto de Arquitectura e Especialidades</h2>
<h3>Anteprojecto</h3>
<p>Esboços iniciais, plantas de conceito. Definição da volumetria e organização espacial. Discussão com o Dono de Obra.</p>
<h3>Projecto de Arquitectura</h3>
<p>Plantas, cortes e alçados (desenhos detalhados). Definição de materiais e acabamentos. Memória descritiva e justificativa.</p>
<h3>Projecto de Especialidades</h3>
<p>Estruturas: dimensionamento de fundações, pilares, vigas, lajes. Instalações Eléctricas: iluminação, tomadas, quadros, sistemas de segurança. Instalações Hidráulicas e Sanitárias: água fria, água quente, esgotos, drenagem pluvial. Climatização (AVAC): sistemas de ventilação e ar condicionado. Telecomunicações: rede de dados, telefone, TV.</p>
<h3>Coordenação entre Especialidades</h3>
<p>O projectista deve garantir que todas as especialidades são compatíveis entre si (ex: o percurso das tubagens de água não colide com as vigas estruturais). Documentos produzidos: peças desenhadas (plantas, cortes, alçados, pormenores), memória descritiva e justificativa, caderno de encargos, orçamento detalhado.</p>
</div>
<div class="cb"><h2><i class="fas fa-file-signature"></i> Fase 2 – Licenciamento e Aprovações</h2>
<h3>Licenciamento na Câmara Municipal / Governo Provincial</h3>
<p>Aprovação do projecto de arquitectura. Licença de construção. Licença de ocupação do solo.</p>
<h3>Aprovação de Especialidades</h3>
<p>Bombeiros: aprovação do projecto de segurança contra incêndios. Águas e Saneamento: aprovação das redes de água e esgotos. Eletricidade: aprovação do projecto eléctrico pela ENDE.</p>
<h3>Licenciamento Ambiental (se aplicável)</h3>
<p>Avaliação de Impacto Ambiental (EIA) e licença ambiental. Documentos produzidos: licenças e alvarás, pareceres técnicos favoráveis.</p>
<div class="ib"><strong>Importante:</strong> em Angola, o processo de licenciamento pode ser moroso e burocrático, exigindo paciência e persistência. Recomenda-se iniciar este processo o mais cedo possível.</div>
</div>
<div class="cb"><h2><i class="fas fa-person-digging"></i> Fase 3 – Execução da Obra (Construção)</h2>
<h3>Preparação do Estaleiro</h3>
<p>Montagem do estaleiro: contentores, arrecadação, sanitários, ligações provisórias de água e luz. Limpeza e preparação do terreno. Instalação de vedações e sinalização.</p>
<h3>Execução da Obra (Sequência Típica)</h3>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Movimentação de terras</h4><p>Escavação para fundações.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Fundações</h4><p>Sapatas, estacas ou sapatas contínuas (dependendo do tipo de solo).</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Estrutura</h4><p>Pilares, vigas, lajes (betão armado).</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Alvenarias</h4><p>Paredes de tijolo/bloco.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Cobertura</h4><p>Telhado ou laje de cobertura.</p></div></div>
<div class="tli"><div class="tld">6</div><div class="tlc"><h4>Revestimentos</h4><p>Reboco, pintura, cerâmica, soalho.</p></div></div>
<div class="tli"><div class="tld">7</div><div class="tlc"><h4>Instalações técnicas</h4><p>Elétrica, hidráulica, sanitária.</p></div></div>
<div class="tli"><div class="tld">8</div><div class="tlc"><h4>Acabamentos e equipamentos</h4><p>Portas, janelas, cozinhas, casas de banho.</p></div></div>
</div>
<h3>Gestão da Obra</h3>
<p>Controlo de prazos: cumprir o cronograma. Controlo de custos: evitar estouros de orçamento. Controlo de qualidade: garantir a conformidade com o projeto. Gestão de subempreiteiros: coordenar as várias equipas. Documentos produzidos: livro de obra (registo diário), autos de medição (para pagamentos), relatórios de progresso, ensaios de materiais (betão, aço, etc.).</p>
</div>
<div class="cb"><h2><i class="fas fa-magnifying-glass"></i> Fase 4 – Fiscalização e Controlo de Qualidade</h2>
<h3>Verificação da Conformidade</h3>
<p>Confirmar que a execução segue o projeto e as especificações. Verificar a qualidade dos materiais e da mão-de-obra.</p>
<h3>Medições e Pagamentos</h3>
<p>Realizar medições periódicas do trabalho executado. Aprovar pagamentos ao empreiteiro (com base no trabalho realizado).</p>
<h3>Gestão de Alterações</h3>
<p>Avaliar e aprovar pedidos de alteração ao projeto. Documentar todas as alterações.</p>
<h3>Elaboração de Relatórios</h3>
<p>Relatórios periódicos para o Dono de Obra.</p>
</div>
<div class="cb"><h2><i class="fas fa-key"></i> Fase 5 – Conclusão e Entrega da Obra</h2>
<h3>Vistorias e Ensaios Finais</h3>
<p>Vistoria das autoridades (bombeiros, câmara municipal, ENDE). Ensaios finais (ex: estanquidade das coberturas, teste das instalações).</p>
<h3>Receção Provisória</h3>
<p>O Dono de Obra vistoria a obra e verifica se está conforme o projeto. Se houver defeitos, são listados e o empreiteiro deve corrigi-los (período de garantia).</p>
<h3>Receção Definitiva</h3>
<p>Após a correção dos defeitos, a obra é formalmente aceite. São emitidos os autos de receção definitiva.</p>
<h3>Entrega da Documentação Final</h3>
<p>Plantas "as built" (projeto final, com as alterações feitas em obra). Manuais de utilização e manutenção. Garantias dos equipamentos.</p>
</div>
<div class="cb"><h2><i class="fas fa-house-chimney"></i> Fase 6 – Utilização e Manutenção</h2>
<h3>Utilização</h3>
<p>O edifício é ocupado pelos seus utilizadores. O Dono de Obra deve garantir que a utilização respeita as condições previstas.</p>
<h3>Manutenção Preventiva</h3>
<p>Inspeções periódicas. Limpeza, lubrificação, reparações menores. Manutenção de equipamentos (AVAC, elevadores, etc.).</p>
<h3>Reabilitação (se necessário)</h3>
<p>Com o tempo, pode ser necessário reabilitar o edifício (modernizar, reparar danos, adaptar a novas funções).</p>
</div>
<div class="cb"><h2><i class="fas fa-clipboard-question"></i> Exercício Prático</h2>
<p><strong>Caso: "Kwanza Construtora, LDA".</strong> A empresa foi contratada para construir um edifício de 6 pisos no centro de Luanda, para um promotor imobiliário privado.</p>
<ol>
<li>Identifique as fases do projecto e descreva as principais atividades de cada fase.</li>
<li>Que tipo de licenças a empresa precisa de obter antes de iniciar a obra?</li>
<li>Quem é responsável pela fiscalização da obra?</li>
<li>O que acontece se o empreiteiro encontrar um problema técnico durante a execução (ex: solo mais fraco do que o previsto)?</li>
</ol>
<div class="hi"><strong>Gabarito:</strong> Estudo Prévio (análise de viabilidade, estudo de mercado, escolha do terreno), Projecto (arquitectura, estruturas e especialidades), Licenciamento (licenças na Câmara Municipal, Bombeiros, ENDE, etc.), Execução (estaleiro, fundações, estrutura, alvenarias, cobertura, revestimentos, instalações, acabamentos), Fiscalização (conformidade, medições, controlo de qualidade), Entrega (vistorias finais, receção provisória e definitiva, documentação), Utilização (ocupação, manutenção preventiva, reabilitação futura).</div>
<p>Licenças necessárias: licença de construção (Câmara Municipal de Luanda), aprovação do projecto de segurança contra incêndios (Bombeiros), aprovação do projecto eléctrico (ENDE), aprovação do projecto de águas e esgotos, licença ambiental (se aplicável).</p>
<p>Responsável pela fiscalização: um engenheiro ou arquiteto contratado pelo Dono de Obra (promotor imobiliário), atuando em sua representação.</p>
<p>Se surgir um problema técnico: o empreiteiro deve suspender os trabalhos na zona afetada, notificar o fiscal e o Dono de Obra, solicitar um estudo complementar do solo. O projectista deve rever o projeto de fundações. O Dono de Obra e o projectista decidem se a obra prossegue com fundações mais profundas (custos adicionais) ou se o projeto é alterado.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>O ciclo de vida de um projecto de construção inclui: estudo prévio, projecto, licenciamento, execução, fiscalização, entrega, utilização e manutenção.</li>
<li>Cada fase tem objetivos, atividades e documentos específicos.</li>
<li>O planeamento adequado de cada fase é essencial para evitar atrasos, estouros de orçamento e defeitos.</li>
<li>A coordenação entre os intervenientes é fundamental em todas as fases.</li>
<li>A fase de estudo prévio é a mais importante: é aqui que se evita investir em projetos inviáveis.</li>
</ul>
<div class="hi">Hoje você aprendeu a: identificar e descrever as fases de um projecto de construção civil, compreendendo a sua sequência lógica e interdependência.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Em que fase do projeto se decide se o projeto deve avançar ou não?</div>
<div class="qo" onclick="cq(this,false)">a) Projecto de Arquitectura</div>
<div class="qo" onclick="cq(this,true)">b) Estudo Prévio e Viabilidade</div>
<div class="qo" onclick="cq(this,false)">c) Execução da Obra</div>
<div class="qo" onclick="cq(this,false)">d) Utilização e Manutenção</div>
<div class="qq">Qual é o documento que descreve as especificações técnicas dos materiais e da execução da obra?</div>
<div class="qo" onclick="cq(this,false)">a) Planta de arquitectura</div>
<div class="qo" onclick="cq(this,true)">b) Caderno de encargos</div>
<div class="qo" onclick="cq(this,false)">c) Licença de construção</div>
<div class="qo" onclick="cq(this,false)">d) Auto de medição</div>
<div class="qq">Antes de iniciar a obra, o empreiteiro deve obter:</div>
<div class="qo" onclick="cq(this,false)">a) Aprovação do projeto de estruturas</div>
<div class="qo" onclick="cq(this,false)">b) Licença de construção</div>
<div class="qo" onclick="cq(this,false)">c) Aprovação do projeto de arquitectura</div>
<div class="qo" onclick="cq(this,true)">d) Todas as anteriores</div>
<div class="qq">O que é um "Auto de Medição"?</div>
<div class="qo" onclick="cq(this,true)">a) Um documento que regista a quantidade de trabalho executado</div>
<div class="qo" onclick="cq(this,false)">b) Um desenho técnico</div>
<div class="qo" onclick="cq(this,false)">c) Uma licença para construir</div>
<div class="qo" onclick="cq(this,false)">d) Um manual de utilização</div>
</div>`},

{t:'Enquadramento Legal da Construção em Angola: Licenciamento e Alvarás', html:`
<div class="cb"><h2><i class="fas fa-gavel"></i> Por que o Enquadramento Legal é Fundamental?</h2>
<p>A lei estabelece regras para: quem pode projetar e construir (apenas profissionais licenciados e empresas registadas), o que pode ser construído (restrições de uso, altura, área, distâncias), como se constrói (normas técnicas, segurança, qualidade, impacto ambiental), onde se constrói (planos de urbanização, zoneamento).</p>
<p>O não cumprimento da lei pode ter consequências graves: multas, embargo da obra, demolição, responsabilidade civil e criminal.</p>
<div class="ib"><strong>Pare e pense:</strong> Se uma empresa constrói uma casa sem licença, o que pode acontecer? Pode ser multada, a obra pode ser embargada ou mesmo demolida, e o técnico responsável pode ser responsabilizado civilmente por danos.</div>
</div>
<div class="cb"><h2><i class="fas fa-scroll"></i> Principais Diplomas Legais da Construção em Angola</h2>
<div class="tw"><table class="dt">
<tr><th>Diploma</th><th>Designação</th><th>Âmbito</th></tr>
<tr><td>Lei n.º 3/17, de 23 de Maio</td><td>Código de Urbanismo e Edificação</td><td>Estabelece as regras de urbanismo e construção</td></tr>
<tr><td>Lei n.º 10/15, de 15 de Junho</td><td>Lei do Ordenamento do Território e Urbanismo</td><td>Define políticas de ocupação do solo</td></tr>
<tr><td>Decreto n.º 65/16, de 22 de Agosto</td><td>Regulamento das Obras de Construção Civil</td><td>Regula a execução de obras</td></tr>
<tr><td>Decreto n.º 40/04, de 27 de Maio</td><td>Regulamento de Licenciamento de Técnicos</td><td>Regula o licenciamento de técnicos de edificações</td></tr>
<tr><td>Decreto n.º 45/15, de 22 de Maio</td><td>Regulamento de Segurança em Estaleiros</td><td>Define regras de segurança no trabalho</td></tr>
<tr><td>Lei n.º 10/19, de 1 de Abril</td><td>Lei do Licenciamento de Actividades Económicas</td><td>Simplifica o licenciamento de atividades</td></tr>
</table></div>
<div class="wb"><strong>Atenção:</strong> Os números e as datas destes diplomas ainda não foram confirmados contra o Diário da República. Trate-os como referência a confirmar, não como certeza — não os use para decisões legais reais sem verificar primeiro na fonte oficial.</div>
</div>
<div class="cb"><h2><i class="fas fa-stamp"></i> Licenciamento de Obras</h2>
<p>O licenciamento é o processo pelo qual a Administração Pública (Câmara Municipal, Governo Provincial) autoriza a realização de uma obra.</p>
<h3>Documentos Necessários para o Licenciamento</h3>
<div class="tw"><table class="dt">
<tr><th>Documento</th><th>Descrição</th></tr>
<tr><td>Requerimento</td><td>Pedido formal de licença, com identificação do requerente e da obra.</td></tr>
<tr><td>Título de Propriedade ou Direito de Superfície</td><td>Comprovativo de que o requerente é dono do terreno ou tem direito a construir.</td></tr>
<tr><td>Planta de Localização</td><td>Planta que mostra a localização do terreno e da obra.</td></tr>
<tr><td>Projecto de Arquitectura</td><td>Plantas, cortes e alçados do edifício.</td></tr>
<tr><td>Projecto de Especialidades</td><td>Projetos de estruturas, instalações elétricas, hidráulicas, etc.</td></tr>
<tr><td>Estudo de Impacto Ambiental</td><td>Se aplicável (obras de grande porte).</td></tr>
<tr><td>Certidão de Registo Predial</td><td>Comprovativo da situação legal do imóvel.</td></tr>
<tr><td>Licença de Utilização</td><td>Para obras que alteram o uso do edifício.</td></tr>
</table></div>
<h3>O Processo de Licenciamento</h3>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Submissão</h4><p>O requerente entrega a documentação na Câmara Municipal ou Governo Provincial.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Análise</h4><p>A entidade analisa a documentação.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Pareceres Técnicos</h4><p>Pode solicitar pareceres a outras entidades.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Aprovação</h4><p>É emitida a Licença de Construção.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Vistoria Final</h4><p>Após conclusão, emite-se a Licença de Utilização.</p></div></div>
</div>
<h3>Prazos e Custos</h3>
<p>Em Angola, o processo pode levar de 1 a 6 meses. Os custos incluem taxas de licenciamento, pareceres técnicos e publicações.</p>
</div>
<div class="cb"><h2><i class="fas fa-id-card"></i> Alvarás</h2>
<p>Um alvará é um documento que autoriza uma pessoa ou empresa a exercer uma atividade profissional ou comercial.</p>
<h3>Alvará de Construção (ou Alvará de Obra)</h3>
<p>Autoriza a execução de uma obra específica. Tem uma validade limitada (geralmente 1 a 2 anos). Deve ser renovado se a obra não estiver concluída no prazo.</p>
<h3>Alvará de Técnico de Edificações</h3>
<p>Autoriza um técnico a exercer a profissão. É emitido pelo Ministério das Obras Públicas, Habitação e Urbanismo. O técnico deve ter formação adequada e estar inscrito na ordem profissional (se existir). Categorias de técnicos (exemplo): Técnico Auxiliar (Categoria A) para obras simples; Técnico de Edificações (Categoria B) para obras de média dimensão; Técnico Superior / Engenheiro (Categoria C) para obras complexas.</p>
<h3>Alvará de Empresa de Construção</h3>
<p>Autoriza uma empresa a atuar como empreiteira. A empresa deve ter capacidade técnica e financeira. O alvará define a classe da empresa (ex: classe 1 para grandes obras, classe 5 para pequenas obras).</p>
</div>
<div class="cb"><h2><i class="fas fa-user-shield"></i> Responsabilidade Técnica</h2>
<p>O técnico responsável pela obra é responsável pela conformidade do projeto e da execução. Responsabilidade Civil: pode ser responsabilizado por danos causados por defeitos. Responsabilidade Criminal: em casos de negligência grave. Responsabilidade Profissional: pode ser alvo de processos disciplinares.</p>
<div class="ib"><strong>Importante:</strong> o técnico deve sempre assinar os documentos técnicos e assumir a responsabilidade pelo seu trabalho.</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Fiscalização e Sanções</h2>
<h3>Entidades Fiscalizadoras</h3>
<div class="tw"><table class="dt">
<tr><th>Entidade</th><th>Função</th></tr>
<tr><td>Ministério das Obras Públicas, Habitação e Urbanismo</td><td>Supervisão geral do sector</td></tr>
<tr><td>Governos Provinciais / Câmaras Municipais</td><td>Licenciamento e fiscalização local</td></tr>
<tr><td>Bombeiros</td><td>Segurança contra incêndios</td></tr>
<tr><td>Tribunal de Contas</td><td>Fiscalização de obras públicas</td></tr>
<tr><td>AGT</td><td>Fiscalização fiscal (IVA, IRT, etc.)</td></tr>
</table></div>
<h3>Sanções</h3>
<div class="tw"><table class="dt">
<tr><th>Infração</th><th>Sanção</th></tr>
<tr><td>Construir sem licença</td><td>Multa + embargo + eventual demolição</td></tr>
<tr><td>Não cumprir o projeto aprovado</td><td>Multa + obrigação de corrigir</td></tr>
<tr><td>Utilizar materiais de qualidade inferior</td><td>Multa + obrigação de substituir</td></tr>
<tr><td>Trabalhar sem alvará</td><td>Multa + suspensão da obra</td></tr>
<tr><td>Não cumprir normas de segurança</td><td>Multa + paralisação da obra</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-clipboard-question"></i> Exercício Prático</h2>
<p><strong>Caso: "Kwanza Construtora, LDA".</strong> A empresa pretende construir um edifício de escritórios de 5 pisos no bairro da Maianga, Luanda.</p>
<ol>
<li>Que tipo de licenças a empresa precisa obter antes de iniciar a obra?</li>
<li>Que documentos deve apresentar para obter a licença de construção?</li>
<li>Quem é o responsável técnico pela obra?</li>
<li>O que pode acontecer se a empresa iniciar a obra sem licença?</li>
</ol>
<div class="hi"><strong>Gabarito:</strong> Licença de construção, licença de ocupação do solo (se aplicável), aprovação do projeto de segurança contra incêndios (Bombeiros), aprovação do projeto eléctrico (ENDE), aprovação do projeto de águas e esgotos.</div>
<p>Documentos: requerimento, título de propriedade, planta de localização, projeto de arquitectura, projetos de especialidades, estudo de impacto ambiental (se exigido), certidão de registo predial.</p>
<p>Responsável técnico: um arquiteto, engenheiro civil ou técnico de edificações licenciado, que assina o projeto e acompanha a obra.</p>
<p>Se a obra iniciar sem licença: a Câmara Municipal pode embargar a obra, a empresa pode ser multada, a obra pode ser demolida, o técnico responsável pode perder a licença profissional.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>O enquadramento legal da construção em Angola é definido por vários diplomas legais.</li>
<li>O licenciamento é o processo de obter autorização para construir.</li>
<li>Os alvarás autorizam pessoas ou empresas a exercer atividades na construção.</li>
<li>A responsabilidade técnica é do profissional que assina os projetos e acompanha a obra.</li>
<li>O incumprimento da lei pode resultar em multas, embargo, demolição e responsabilidade civil e criminal.</li>
</ul>
<div class="hi">Hoje você aprendeu a: compreender o enquadramento legal da construção em Angola e o processo de licenciamento.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Qual é o principal diploma legal que regula o urbanismo e a edificação em Angola?</div>
<div class="qo" onclick="cq(this,false)">a) Código do Trabalho</div>
<div class="qo" onclick="cq(this,true)">b) Código de Urbanismo e Edificação</div>
<div class="qo" onclick="cq(this,false)">c) Lei do Orçamento Geral do Estado</div>
<div class="qo" onclick="cq(this,false)">d) Código do IVA</div>
<div class="qq">Que documento autoriza a execução de uma obra específica?</div>
<div class="qo" onclick="cq(this,false)">a) Alvará de técnico</div>
<div class="qo" onclick="cq(this,true)">b) Licença de construção</div>
<div class="qo" onclick="cq(this,false)">c) Certidão de registo predial</div>
<div class="qo" onclick="cq(this,false)">d) Estudo de Impacto Ambiental</div>
<div class="qq">Quem é o principal responsável técnico pela conformidade do projeto e da execução?</div>
<div class="qo" onclick="cq(this,false)">a) O Dono de Obra</div>
<div class="qo" onclick="cq(this,false)">b) O Empreiteiro</div>
<div class="qo" onclick="cq(this,true)">c) O Projectista (arquiteto/engenheiro)</div>
<div class="qo" onclick="cq(this,false)">d) O Fiscal</div>
<div class="qq">O que pode acontecer se uma empresa construir sem licença?</div>
<div class="qo" onclick="cq(this,false)">a) Apenas uma advertência</div>
<div class="qo" onclick="cq(this,true)">b) Multa, embargo e eventual demolição</div>
<div class="qo" onclick="cq(this,false)">c) Nada, porque a lei não é aplicada</div>
<div class="qo" onclick="cq(this,false)">d) A obra fica isenta de impostos</div>
</div>`},

{t:'Tipos de Empreitada: Preço Global, Série de Preços e Administração Directa', html:`
<div class="cb"><h2><i class="fas fa-file-contract"></i> O Que é uma Empreitada?</h2>
<p>Uma empreitada é um contrato pelo qual uma pessoa (empreiteiro) se obriga a executar uma obra para outra (dono de obra), mediante um preço determinado.</p>
<div class="ib"><strong>Pare e pense:</strong> Se o dono de obra não tem a certeza exata do que quer construir, que tipo de empreitada é mais adequado? Uma empreitada com série de preços, que permite ajustar as quantidades à medida que a obra avança.</div>
</div>
<div class="cb"><h2><i class="fas fa-tag"></i> Empreitada a Preço Global (ou Preço Fixo)</h2>
<p>O empreiteiro obriga-se a executar a obra por um preço fixo e determinado, definido no contrato, baseado no projeto completo.</p>
<h3>Características</h3>
<p>Preço fixo: não varia, independentemente dos custos reais. Projeto completo: deve estar 100% definido antes do início. Risco do empreiteiro: assume o risco de erros de cálculo ou aumentos de preços.</p>
<h3>Vantagens</h3>
<p>Segurança para o Dono de Obra (sabe quanto vai pagar). Simplicidade (sem renegociações). Incentivo à eficiência (lucro depende do controlo de custos).</p>
<h3>Desvantagens</h3>
<p>Risco para o empreiteiro (se custos subirem, pode ter prejuízo). Pouca flexibilidade (alterações exigem negociação). Projeto completo necessário (atrasa o início).</p>
<h3>Quando Usar</h3>
<p>Obras com projeto bem definido e estável. Obras de curta duração. Donos de obra que querem certeza de custos. Exemplo em Angola: construção de uma escola com projeto já aprovado pela Direção Provincial da Educação.</p>
</div>
<div class="cb"><h2><i class="fas fa-ruler-combined"></i> Empreitada com Série de Preços (ou Preços Unitários)</h2>
<p>O contrato define uma lista de preços unitários para cada tipo de trabalho (ex: Kz X por metro cúbico de betão). O preço final é calculado multiplicando os preços unitários pelas quantidades efetivamente executadas.</p>
<h3>Características</h3>
<p>Preços unitários fixos, quantidades variáveis. Risco partilhado: Dono de Obra assume risco de variação das quantidades; empreiteiro assume risco de variação dos custos unitários.</p>
<h3>Vantagens</h3>
<p>Flexibilidade (permite ajustar o projeto). Transparência. Menos risco para o empreiteiro.</p>
<h3>Desvantagens</h3>
<p>Incerteza do custo final. Complexidade (exige medições rigorosas). Risco de litígio sobre quantidades medidas.</p>
<h3>Quando Usar</h3>
<p>Obras com projeto que pode sofrer alterações. Obras de longa duração. Trabalhos difíceis de quantificar à partida (ex: escavações em terrenos desconhecidos). Exemplo em Angola: construção de uma estrada, onde a quantidade de terra a escavar só é conhecida durante a obra.</p>
</div>
<div class="cb"><h2><i class="fas fa-people-carry-box"></i> Empreitada em Regime de Administração Directa</h2>
<p>O Dono de Obra contrata os trabalhadores, compra os materiais e equipamentos, e gere diretamente a obra. O empreiteiro (se houver) atua apenas como gestor ou coordenador.</p>
<h3>Características</h3>
<p>O Dono de Obra assume todos os riscos. O empreiteiro (se houver) recebe remuneração fixa ou percentual.</p>
<h3>Vantagens</h3>
<p>Controlo total. Transparência total. Menos margem de lucro para o empreiteiro (custo pode ser menor).</p>
<h3>Desvantagens</h3>
<p>Risco total para o Dono de Obra. Exige capacidade de gestão. Menos incentivo à eficiência.</p>
<h3>Quando Usar</h3>
<p>Obras pequenas ou de manutenção. Donos de obra com capacidade técnica interna. Situações de emergência. Exemplo em Angola: um condomínio contrata uma equipa para pequenas reparações, comprando os materiais e pagando diretamente os trabalhadores.</p>
</div>
<div class="cb"><h2><i class="fas fa-table-columns"></i> Comparação dos Tipos de Empreitada</h2>
<div class="tw"><table class="dt">
<tr><th>Característica</th><th>Preço Global</th><th>Série de Preços</th><th>Administração Directa</th></tr>
<tr><td>Preço final</td><td>Fixo</td><td>Variável</td><td>Variável</td></tr>
<tr><td>Risco do Dono de Obra</td><td>Baixo</td><td>Médio</td><td>Alto</td></tr>
<tr><td>Risco do Empreiteiro</td><td>Alto</td><td>Médio</td><td>Baixo</td></tr>
<tr><td>Flexibilidade</td><td>Baixa</td><td>Alta</td><td>Muito Alta</td></tr>
<tr><td>Complexidade</td><td>Baixa</td><td>Média</td><td>Alta</td></tr>
<tr><td>Adequação a</td><td>Projetos estáveis</td><td>Projetos com alterações</td><td>Pequenas obras, emergências</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-list-ol"></i> Outros Tipos de Empreitada (Menos Comuns)</h2>
<div class="tw"><table class="dt">
<tr><th>Tipo</th><th>Descrição</th></tr>
<tr><td>Empreitada por Lotes</td><td>A obra é dividida em lotes e cada lote é adjudicado separadamente.</td></tr>
<tr><td>Empreitada com Revisão de Preços</td><td>O preço é ajustado com base em índices (inflação, variação do preço do cimento).</td></tr>
<tr><td>Empreitada de Mão-de-Obra</td><td>O Dono de Obra fornece os materiais e o empreiteiro fornece apenas a mão-de-obra.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-clipboard-question"></i> Exercício Prático</h2>
<p><strong>Caso: "Kwanza Construtora, LDA".</strong> A empresa foi contratada para construir uma moradia de 3 pisos em Luanda. O projeto está bem definido, mas o cliente já avisou que pode querer alterar a cozinha e os acabamentos durante a obra.</p>
<ol>
<li>Que tipo de empreitada recomenda para este projeto? Justifique.</li>
<li>Se o cliente optar por uma empreitada a preço global, que riscos corre?</li>
<li>Se optar por uma empreitada com série de preços, que cuidados deve ter?</li>
</ol>
<div class="hi"><strong>Gabarito:</strong> empreitada com série de preços — o cliente quer flexibilidade para alterar a cozinha e os acabamentos, e a série de preços permite ajustar quantidades sem renegociar todo o contrato.</div>
<p>Riscos da empreitada a preço global: se pedir alterações, o empreiteiro pode cobrar um valor elevado por já ter o contrato fechado; pode subcontratar materiais de menor qualidade para proteger a margem; se o preço dos materiais subir, o empreiteiro pode ter prejuízo.</p>
<p>Cuidados com série de preços: definir claramente os preços unitários, estabelecer processo rigoroso de medição, incluir cláusulas sobre alterações, prever orçamento de contingência.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>Os três principais tipos de empreitada são: preço global, série de preços e administração directa.</li>
<li>A empreitada a preço global tem preço fixo e risco para o empreiteiro.</li>
<li>A empreitada com série de preços oferece flexibilidade, com preços unitários e quantidades variáveis.</li>
<li>A administração directa coloca o Dono de Obra no controlo total, mas com risco total.</li>
<li>A escolha depende do projeto, do grau de definição, da flexibilidade desejada e da capacidade de gestão do Dono de Obra.</li>
</ul>
<div class="hi">Hoje você aprendeu a: distinguir os principais tipos de empreitada e a escolher o mais adequado para diferentes situações.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Numa empreitada a preço global, quem assume o risco de aumento dos preços dos materiais?</div>
<div class="qo" onclick="cq(this,false)">a) Dono de Obra</div>
<div class="qo" onclick="cq(this,true)">b) Empreiteiro</div>
<div class="qo" onclick="cq(this,false)">c) Projectista</div>
<div class="qo" onclick="cq(this,false)">d) Fiscal</div>
<div class="qq">Que tipo de empreitada é mais flexível para alterações durante a obra?</div>
<div class="qo" onclick="cq(this,false)">a) Preço Global</div>
<div class="qo" onclick="cq(this,true)">b) Série de Preços</div>
<div class="qo" onclick="cq(this,false)">c) Administração Directa</div>
<div class="qo" onclick="cq(this,false)">d) Preço Fixo</div>
<div class="qq">Na administração directa, quem compra os materiais e paga os trabalhadores?</div>
<div class="qo" onclick="cq(this,false)">a) O empreiteiro</div>
<div class="qo" onclick="cq(this,true)">b) O Dono de Obra</div>
<div class="qo" onclick="cq(this,false)">c) O projectista</div>
<div class="qo" onclick="cq(this,false)">d) O fiscal</div>
<div class="qq">Uma obra com projeto bem definido e sem previsão de alterações é adequada para:</div>
<div class="qo" onclick="cq(this,false)">a) Empreitada com série de preços</div>
<div class="qo" onclick="cq(this,true)">b) Empreitada a preço global</div>
<div class="qo" onclick="cq(this,false)">c) Administração directa</div>
<div class="qo" onclick="cq(this,false)">d) Empreitada de mão-de-obra</div>
</div>`},

{t:'Contratos de Empreitada: Cláusulas Essenciais e Obrigações das Partes', html:`
<div class="cb"><h2><i class="fas fa-file-signature"></i> A Importância do Contrato de Empreitada</h2>
<p>O contrato de empreitada é o documento que formaliza a relação entre o Dono de Obra e o Empreiteiro. Um contrato mal redigido é uma fonte inesgotável de conflitos, atrasos e custos adicionais.</p>
<div class="ib"><strong>Pare e pense:</strong> Se o contrato não especifica o prazo de conclusão da obra, o que pode acontecer? O empreiteiro pode atrasar a obra indefinidamente, e o Dono de Obra não tem base legal para exigir a conclusão ou aplicar penalidades.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Elementos Essenciais de um Contrato de Empreitada</h2>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Descrição</th></tr>
<tr><td>Identificação das Partes</td><td>Nome, NIF, morada, representantes legais.</td></tr>
<tr><td>Objeto do Contrato</td><td>Descrição clara e detalhada da obra a executar.</td></tr>
<tr><td>Preço e Forma de Pagamento</td><td>Valor total, condições de pagamento, prazos, retenções.</td></tr>
<tr><td>Prazo de Execução</td><td>Data de início e conclusão prevista, com possibilidade de prorrogação.</td></tr>
<tr><td>Condições de Receção</td><td>Critérios para aceitação da obra, vistorias, prazos de garantia.</td></tr>
<tr><td>Penalidades</td><td>Multas por atraso, incumprimento, defeitos de construção.</td></tr>
<tr><td>Alterações ao Contrato</td><td>Como são tratadas as alterações ao projeto.</td></tr>
<tr><td>Resolução de Conflitos</td><td>Como resolver litígios (arbitragem, tribunal, mediação).</td></tr>
<tr><td>Lei Aplicável</td><td>A lei angolana (Código Civil, Código de Urbanismo, etc.).</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-user-tie"></i> Obrigações do Dono de Obra</h2>
<div class="tw"><table class="dt">
<tr><th>Obrigação</th><th>Descrição</th></tr>
<tr><td>Pagar o preço</td><td>Pagar o empreiteiro conforme acordado.</td></tr>
<tr><td>Fornecer o projeto</td><td>Entregar ao empreiteiro o projeto completo.</td></tr>
<tr><td>Entregar o terreno</td><td>Disponibilizar o terreno nas condições acordadas.</td></tr>
<tr><td>Não interferir na execução</td><td>Não dar instruções contraditórias sem seguir os procedimentos de alteração.</td></tr>
<tr><td>Receber a obra</td><td>Vistoriar e aceitar a obra quando concluída.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-helmet-safety"></i> Obrigações do Empreiteiro</h2>
<div class="tw"><table class="dt">
<tr><th>Obrigação</th><th>Descrição</th></tr>
<tr><td>Executar a obra</td><td>Construir de acordo com o projeto, as normas e as especificações.</td></tr>
<tr><td>Cumprir os prazos</td><td>Concluir a obra dentro do prazo estipulado.</td></tr>
<tr><td>Garantir a qualidade</td><td>Utilizar materiais e mão-de-obra adequados.</td></tr>
<tr><td>Gerir a obra</td><td>Organizar o estaleiro, gerir recursos, garantir a segurança.</td></tr>
<tr><td>Reparar defeitos</td><td>Corrigir defeitos detetados durante o período de garantia.</td></tr>
<tr><td>Cumprir a lei</td><td>Respeitar todas as leis e regulamentos aplicáveis.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-map-location-dot"></i> Cláusulas Específicas para Angola</h2>
<div class="tw"><table class="dt">
<tr><th>Cláusula</th><th>Descrição</th></tr>
<tr><td>Revisão de Preços</td><td>Mecanismo para ajustar o preço em caso de variação significativa do custo dos materiais.</td></tr>
<tr><td>Disponibilidade de Materiais</td><td>O empreiteiro não pode ser responsabilizado por atrasos devidos à falta de materiais no mercado.</td></tr>
<tr><td>Condições Climáticas</td><td>Prever a possibilidade de atrasos devido a chuvas intensas.</td></tr>
<tr><td>Licenciamento</td><td>Definir quem é responsável pela obtenção das licenças.</td></tr>
<tr><td>Mão-de-obra Local</td><td>Incentivar a contratação de trabalhadores locais.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-shield-halved"></i> Garantias e Penalidades</h2>
<h3>Garantias</h3>
<p>Garantia de Bom Funcionamento: durante um período determinado. Garantia de Defeitos: obrigação de reparar defeitos manifestados durante a garantia. Caução: depósito de garantia (ex: 5% do valor do contrato).</p>
<h3>Penalidades</h3>
<p>Multa por Atraso: percentagem do valor do contrato por dia de atraso (ex: 0,1% ao dia). Multa por Defeitos: dedução se a obra não cumprir especificações. Rescisão do Contrato: possibilidade em caso de incumprimento grave.</p>
</div>
<div class="cb"><h2><i class="fas fa-clipboard-question"></i> Exercício Prático</h2>
<p><strong>Caso: "Kwanza Construtora, LDA".</strong> A empresa assinou um contrato com um cliente para construir uma moradia. O contrato estipula um prazo de 12 meses e uma multa de 0,1% ao dia por atraso. A obra está agora com 3 meses de atraso devido a problemas de fornecimento de cimento.</p>
<ol>
<li>O empreiteiro pode ser penalizado pelo atraso?</li>
<li>Que cláusula do contrato pode proteger o empreiteiro nesta situação?</li>
<li>O que deve fazer o empreiteiro para minimizar o impacto do atraso?</li>
</ol>
<div class="hi"><strong>Gabarito:</strong> pode ser penalizado, a menos que o contrato preveja isenção por causas alheias à sua vontade.</div>
<p>Cláusula de Força Maior ou Caso Fortuito — pode ser invocada se a falta de cimento for imprevista e inevitável, mas não é automaticamente considerada força maior.</p>
<p>O empreiteiro deve notificar imediatamente o Dono de Obra por escrito, explicar a causa, apresentar novo plano, procurar fornecedores alternativos, solicitar prorrogação justificada.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>O contrato de empreitada é o documento fundamental que rege a relação entre Dono de Obra e Empreiteiro.</li>
<li>Um contrato claro e detalhado previne conflitos.</li>
<li>As cláusulas essenciais incluem: objeto, preço, prazo, obrigações, garantias, penalidades.</li>
<li>Em Angola, os contratos devem considerar especificidades locais.</li>
</ul>
<div class="hi">Hoje você aprendeu a: identificar as cláusulas essenciais de um contrato de empreitada e compreender as obrigações das partes.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Qual é o documento que formaliza a relação entre o Dono de Obra e o Empreiteiro?</div>
<div class="qo" onclick="cq(this,false)">a) Planta de arquitectura</div>
<div class="qo" onclick="cq(this,true)">b) Contrato de empreitada</div>
<div class="qo" onclick="cq(this,false)">c) Caderno de encargos</div>
<div class="qo" onclick="cq(this,false)">d) Auto de medição</div>
<div class="qq">Qual é a principal obrigação do Dono de Obra?</div>
<div class="qo" onclick="cq(this,false)">a) Executar a obra</div>
<div class="qo" onclick="cq(this,true)">b) Pagar o preço acordado</div>
<div class="qo" onclick="cq(this,false)">c) Projetar a obra</div>
<div class="qo" onclick="cq(this,false)">d) Fiscalizar a obra</div>
<div class="qq">O que é uma cláusula de revisão de preços?</div>
<div class="qo" onclick="cq(this,false)">a) Uma cláusula que permite ao Dono de Obra reduzir o preço</div>
<div class="qo" onclick="cq(this,true)">b) Uma cláusula que ajusta o preço em caso de variação significativa dos custos</div>
<div class="qo" onclick="cq(this,false)">c) Uma cláusula que fixa o preço para sempre</div>
<div class="qo" onclick="cq(this,false)">d) Uma cláusula que elimina o preço</div>
<div class="qq">Se o empreiteiro atrasar a obra, o que pode acontecer?</div>
<div class="qo" onclick="cq(this,true)">a) O Dono de Obra pode aplicar uma multa</div>
<div class="qo" onclick="cq(this,false)">b) O empreiteiro é automaticamente despedido</div>
<div class="qo" onclick="cq(this,false)">c) A obra é cancelada</div>
<div class="qo" onclick="cq(this,false)">d) O Dono de Obra é multado</div>
</div>`},

{t:'Organização do Estaleiro de Obra: Layout e Logística', html:`
<div class="cb"><h2><i class="fas fa-warehouse"></i> O Que é um Estaleiro de Obra?</h2>
<p>O estaleiro de obra é o espaço físico onde se desenvolve a construção — o "coração" da obra. Um estaleiro bem organizado permite fluxo eficiente de materiais e trabalhadores, redução de perdas, maior segurança e melhor controlo.</p>
<div class="ib"><strong>Pare e pense:</strong> Se o estaleiro não tiver um local definido para descarga de materiais, o que pode acontecer? Os camiões ficam à espera, os materiais são deixados em locais inadequados, há perdas e atrasos.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-ol"></i> Fases de Instalação do Estaleiro</h2>
<div class="tw"><table class="dt">
<tr><th>Fase</th><th>Descrição</th></tr>
<tr><td>1. Levantamento</td><td>Analisar o terreno e as condições de acesso.</td></tr>
<tr><td>2. Planeamento</td><td>Definir o layout do estaleiro.</td></tr>
<tr><td>3. Montagem</td><td>Instalar contentores, vedações, ligações de água e luz.</td></tr>
<tr><td>4. Operação</td><td>Gerir o estaleiro durante a obra.</td></tr>
<tr><td>5. Desmontagem</td><td>Remover o estaleiro no final da obra.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-border-all"></i> Zonas do Estaleiro</h2>
<div class="tw"><table class="dt">
<tr><th>Zona</th><th>Descrição</th><th>Exemplos</th></tr>
<tr><td>Zona de Acesso e Circulação</td><td>Entrada e saída de veículos, caminhos internos.</td><td>Portão, rampa, estrada de acesso.</td></tr>
<tr><td>Zona de Armazenamento</td><td>Armazenamento de materiais.</td><td>Paletes, silos, estantes.</td></tr>
<tr><td>Zona de Produção</td><td>Local onde se executam trabalhos.</td><td>Betoneira, serração, oficina.</td></tr>
<tr><td>Zona de Apoio</td><td>Instalações sanitárias, refeitório, vestiários.</td><td>Sanitários químicos, contentores.</td></tr>
<tr><td>Zona Administrativa</td><td>Escritório da obra, sala de reuniões, arquivo.</td><td>Contentor ou caravana.</td></tr>
<tr><td>Zona de Segurança</td><td>Extintores, postos de primeiros socorros, EPI.</td><td>Caixa de primeiros socorros, extintores.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-ruler"></i> Dimensionamento do Estaleiro</h2>
<p>Para uma obra de média dimensão (ex: edifício de 10 pisos): área total do estaleiro entre 10% a 20% da área de implantação da obra; armazenamento de materiais entre 20% a 30% da área total; circulação e acessos entre 15% a 20% da área total; áreas de apoio e administrativas entre 10% a 15% da área total.</p>
</div>
<div class="cb"><h2><i class="fas fa-truck-ramp-box"></i> Logística do Estaleiro</h2>
<h3>Receção de Materiais</h3>
<p>Definir horários de receção. Verificar qualidade e quantidade. Registar entradas.</p>
<h3>Armazenamento</h3>
<p>Armazenar por tipo. Proteger da chuva e humidade. Controlar saídas.</p>
<h3>Distribuição Interna</h3>
<p>Transportar materiais do armazém para os locais de trabalho, com meios adequados.</p>
<h3>Gestão de Resíduos</h3>
<p>Separar resíduos (metal, madeira, plástico, entulho). Destinar para reciclagem ou aterro.</p>
</div>
<div class="cb"><h2><i class="fas fa-hard-hat"></i> Segurança no Estaleiro</h2>
<div class="tw"><table class="dt">
<tr><th>Medida</th><th>Descrição</th></tr>
<tr><td>EPI</td><td>Capacete, colete, luvas, botas, óculos.</td></tr>
<tr><td>Sinalização</td><td>Placas de aviso, zonas de perigo, rotas de evacuação.</td></tr>
<tr><td>Proteção de Vãos</td><td>Redes de proteção, guardas-corpos, tapumes.</td></tr>
<tr><td>Prevenção de Incêndios</td><td>Extintores, saídas de emergência, plano de evacuação.</td></tr>
<tr><td>Formação</td><td>Formação em segurança para todos os trabalhadores.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-clipboard-question"></i> Exercício Prático</h2>
<p><strong>Caso: "Kwanza Construtora, LDA".</strong> A empresa vai iniciar a construção de um edifício de 8 pisos no centro de Luanda. O terreno tem 500 m² e está numa zona de elevada densidade urbana.</p>
<ol>
<li>Que zonas deve incluir o estaleiro?</li>
<li>Que desafios específicos pode enfrentar devido à localização urbana?</li>
<li>Como deve ser feita a gestão de resíduos?</li>
</ol>
<div class="hi"><strong>Gabarito:</strong> zonas — acesso e circulação, armazenamento, produção, apoio, administrativa, segurança.</div>
<p>Desafios da localização urbana: espaço limitado, restrições de horário de trânsito, perturbação dos vizinhos, necessidade de proteger transeuntes (tapumes).</p>
<p>Gestão de resíduos: separar por tipo (metal, madeira, plástico, entulho), destinar para aterro licenciado, reutilizar sempre que possível, manter o estaleiro limpo.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>O estaleiro é o centro operacional da obra.</li>
<li>Deve ser planeado com zonas definidas.</li>
<li>A logística garante o fluxo eficiente de materiais e pessoas.</li>
<li>A segurança é uma prioridade absoluta.</li>
<li>A gestão de resíduos é essencial.</li>
</ul>
<div class="hi">Hoje você aprendeu a: planear a organização de um estaleiro de obra e compreender a logística e a segurança.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Qual é a principal função do estaleiro de obra?</div>
<div class="qo" onclick="cq(this,false)">a) Servir como escritório da empresa</div>
<div class="qo" onclick="cq(this,true)">b) Concentrar materiais, equipamentos e trabalhadores para a execução da obra</div>
<div class="qo" onclick="cq(this,false)">c) Armazenar resíduos da construção</div>
<div class="qo" onclick="cq(this,false)">d) Alojar os trabalhadores</div>
<div class="qq">Que zona do estaleiro é responsável pelo armazenamento de materiais?</div>
<div class="qo" onclick="cq(this,false)">a) Zona de produção</div>
<div class="qo" onclick="cq(this,true)">b) Zona de armazenamento</div>
<div class="qo" onclick="cq(this,false)">c) Zona administrativa</div>
<div class="qo" onclick="cq(this,false)">d) Zona de segurança</div>
<div class="qq">Qual é um equipamento de proteção individual (EPI) obrigatório no estaleiro?</div>
<div class="qo" onclick="cq(this,true)">a) Capacete</div>
<div class="qo" onclick="cq(this,false)">b) Computador</div>
<div class="qo" onclick="cq(this,false)">c) Telemóvel</div>
<div class="qo" onclick="cq(this,false)">d) Máquina fotográfica</div>
<div class="qq">Como deve ser feita a gestão de resíduos no estaleiro?</div>
<div class="qo" onclick="cq(this,false)">a) Todos os resíduos devem ser misturados</div>
<div class="qo" onclick="cq(this,true)">b) Os resíduos devem ser separados e destinados adequadamente</div>
<div class="qo" onclick="cq(this,false)">c) Os resíduos devem ser enterrados no terreno</div>
<div class="qo" onclick="cq(this,false)">d) Os resíduos devem ser queimados</div>
</div>`},

{t:'Profissões Técnicas da Construção: o Técnico de Edificações e a sua Actuação', html:`
<div class="cb"><h2><i class="fas fa-people-group"></i> O Ecossistema de Profissões da Construção</h2>
<p>A construção civil reúne uma grande diversidade de profissões. Cada uma tem um papel específico, e todas são interdependentes.</p>
<div class="ib"><strong>Pare e pense:</strong> Qual é a diferença entre um Técnico de Edificações e um Engenheiro Civil? O Engenheiro Civil tem formação mais teórica e abrangente, projetando estruturas complexas; o Técnico de Edificações tem formação mais prática, focada na execução e gestão da obra.</div>
</div>
<div class="cb"><h2><i class="fas fa-users-line"></i> Principais Profissões Técnicas da Construção</h2>
<div class="tw"><table class="dt">
<tr><th>Profissão</th><th>Função Principal</th></tr>
<tr><td>Engenheiro Civil</td><td>Projeta estruturas, fundações, estradas, pontes.</td></tr>
<tr><td>Arquiteto</td><td>Concebe a forma, a função e a estética do edifício.</td></tr>
<tr><td>Técnico de Edificações</td><td>Planeia, organiza e fiscaliza a execução da obra.</td></tr>
<tr><td>Desenhador Projectista</td><td>Elabora os desenhos técnicos.</td></tr>
<tr><td>Topógrafo</td><td>Faz o levantamento do terreno e a implantação da obra.</td></tr>
<tr><td>Técnico de Segurança</td><td>Garante o cumprimento das normas de segurança no estaleiro.</td></tr>
<tr><td>Orçamentista</td><td>Calcula os custos da obra.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-hard-hat"></i> O Técnico de Edificações</h2>
<h3>Formação</h3>
<p>Desenho técnico, materiais de construção, técnicas construtivas, orçamentação, gestão de obras, segurança no trabalho.</p>
<h3>Funções do Técnico de Edificações</h3>
<div class="tw"><table class="dt">
<tr><th>Função</th><th>Descrição</th></tr>
<tr><td>Planeamento</td><td>Analisar projetos, planear a execução, definir cronogramas.</td></tr>
<tr><td>Coordenação</td><td>Coordenar as equipas de trabalho.</td></tr>
<tr><td>Fiscalização</td><td>Verificar a conformidade com o projeto e as normas técnicas.</td></tr>
<tr><td>Controlo</td><td>Controlar a qualidade, os custos e os prazos.</td></tr>
<tr><td>Documentação</td><td>Elaborar autos de medição, relatórios, livro de obra.</td></tr>
<tr><td>Segurança</td><td>Garantir a segurança no estaleiro.</td></tr>
</table></div>
<h3>Perfil do Técnico de Edificações</h3>
<p>Técnica: conhecimento profundo de materiais, técnicas, normas. Gestão: capacidade de planear, organizar, controlar. Comunicação: capacidade de comunicar com todos os intervenientes. Liderança: capacidade de liderar equipas. Rigor: atenção aos detalhes e cumprimento de prazos.</p>
</div>
<div class="cb"><h2><i class="fas fa-route"></i> A Actuação do Técnico de Edificações em Angola</h2>
<div class="tw"><table class="dt">
<tr><th>Fase</th><th>Atuação</th></tr>
<tr><td>Antes da Obra</td><td>Análise do projeto, levantamento de quantidades, orçamento.</td></tr>
<tr><td>Durante a Obra</td><td>Coordenação das equipas, controlo de qualidade, gestão de materiais.</td></tr>
<tr><td>Após a Obra</td><td>Vistorias, correção de defeitos, entrega da obra.</td></tr>
</table></div>
<h3>Desafios em Angola</h3>
<p>Mão-de-obra pouco qualificada (o técnico deve formar e orientar). Falta de materiais (deve planear e encontrar alternativas). Condições climáticas (adaptar o planeamento à época das chuvas). Burocracia (licenciamentos e autorizações).</p>
</div>
<div class="cb"><h2><i class="fas fa-briefcase"></i> Oportunidades de Carreira</h2>
<div class="tw"><table class="dt">
<tr><th>Área</th><th>Exemplo</th></tr>
<tr><td>Construção Civil</td><td>Obras públicas, construção privada, reabilitação.</td></tr>
<tr><td>Fiscalização</td><td>Fiscal de obras para donos de obra ou entidades públicas.</td></tr>
<tr><td>Orçamentação</td><td>Orçamentista em empresas de construção.</td></tr>
<tr><td>Gestão de Obras</td><td>Gestor de projetos, coordenador de obra.</td></tr>
<tr><td>Docência</td><td>Formação de novos técnicos.</td></tr>
</table></div>
<div class="ib"><strong>Salário médio em Angola:</strong> um Técnico de Edificações com experiência pode esperar um salário entre 300.000 Kz e 600.000 Kz/mês, podendo ultrapassar 1.000.000 Kz/mês em cargos de gestão.</div>
</div>
<div class="cb"><h2><i class="fas fa-clipboard-question"></i> Exercício Prático</h2>
<p><strong>Caso: "Kwanza Construtora, LDA".</strong> A empresa contratou um Técnico de Edificações para coordenar a construção de um condomínio residencial de 20 moradias.</p>
<ol>
<li>Quais são as principais funções do técnico nesta obra?</li>
<li>Que desafios específicos o técnico pode enfrentar em Angola?</li>
<li>Que competências são mais importantes para o sucesso deste projeto?</li>
</ol>
<div class="hi"><strong>Gabarito:</strong> funções — planeamento (analisar o projeto e definir cronograma), coordenação (gerir as equipas), controlo de qualidade, gestão de materiais, segurança.</div>
<p>Desafios: disponibilidade de materiais, mão-de-obra pouco qualificada, condições climáticas, burocracia.</p>
<p>Competências: conhecimento técnico, capacidade de gestão, comunicação, resiliência.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>A construção civil reúne uma grande diversidade de profissões técnicas.</li>
<li>O Técnico de Edificações é um profissional versátil, com competências técnicas e de gestão.</li>
<li>As funções incluem planeamento, coordenação, fiscalização e controlo.</li>
<li>Em Angola, o técnico enfrenta desafios como falta de materiais e mão-de-obra pouco qualificada.</li>
<li>As oportunidades de carreira são vastas.</li>
</ul>
<div class="hi">Hoje você aprendeu a: identificar as principais profissões técnicas da construção e compreender o papel do Técnico de Edificações.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Qual é a principal função do Técnico de Edificações?</div>
<div class="qo" onclick="cq(this,false)">a) Projetar estruturas complexas</div>
<div class="qo" onclick="cq(this,true)">b) Coordenar e fiscalizar a execução da obra</div>
<div class="qo" onclick="cq(this,false)">c) Projetar a arquitetura do edifício</div>
<div class="qo" onclick="cq(this,false)">d) Vender materiais de construção</div>
<div class="qq">Que profissional é responsável por projetar estruturas, fundações, estradas e pontes?</div>
<div class="qo" onclick="cq(this,false)">a) Arquiteto</div>
<div class="qo" onclick="cq(this,true)">b) Engenheiro Civil</div>
<div class="qo" onclick="cq(this,false)">c) Técnico de Edificações</div>
<div class="qo" onclick="cq(this,false)">d) Topógrafo</div>
<div class="qq">Qual é um desafio específico do Técnico de Edificações em Angola?</div>
<div class="qo" onclick="cq(this,false)">a) Excesso de mão-de-obra qualificada</div>
<div class="qo" onclick="cq(this,true)">b) Disponibilidade limitada de materiais de construção</div>
<div class="qo" onclick="cq(this,false)">c) Clima frio</div>
<div class="qo" onclick="cq(this,false)">d) Baixa procura por construção</div>
<div class="qq">Um Técnico de Edificações com experiência pode esperar um salário médio de:</div>
<div class="qo" onclick="cq(this,false)">a) 50.000 a 100.000 Kz</div>
<div class="qo" onclick="cq(this,true)">b) 300.000 a 600.000 Kz</div>
<div class="qo" onclick="cq(this,false)">c) 1.500.000 a 2.000.000 Kz</div>
<div class="qo" onclick="cq(this,false)">d) Mais de 3.000.000 Kz</div>
</div>`},

{t:'Documentação Técnica da Obra: Livro de Obra, Cadernos de Encargos, Autos de Medição', html:`
<div class="cb"><h2><i class="fas fa-book-open"></i> A Importância da Documentação Técnica</h2>
<p>A documentação técnica não é apenas "papel" — é a memória da obra. Permite controlar a execução, comunicar entre intervenientes, provar o que foi acordado, garantir qualidade e cumprir obrigações legais.</p>
<div class="ib"><strong>Pare e pense:</strong> Se o Dono de Obra e o Empreiteiro discordarem sobre a quantidade de trabalho executado, que documento deve ser consultado? O Auto de Medição.</div>
</div>
<div class="cb"><h2><i class="fas fa-folder-open"></i> Principais Documentos Técnicos</h2>
<div class="tw"><table class="dt">
<tr><th>Documento</th><th>Função</th></tr>
<tr><td>Projeto</td><td>Define o que construir.</td></tr>
<tr><td>Caderno de Encargos</td><td>Define as especificações técnicas e as condições de execução.</td></tr>
<tr><td>Livro de Obra</td><td>Registo diário da obra.</td></tr>
<tr><td>Autos de Medição</td><td>Registo das quantidades executadas, para pagamento.</td></tr>
<tr><td>Relatórios de Progresso</td><td>Relatórios periódicos sobre o estado da obra.</td></tr>
<tr><td>Ensaios de Materiais</td><td>Resultados de ensaios (betão, aço, etc.).</td></tr>
<tr><td>Plantas "As Built"</td><td>Projeto final, com as alterações feitas em obra.</td></tr>
<tr><td>Manual de Utilização</td><td>Instruções para uso e manutenção do edifício.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-book"></i> Livro de Obra</h2>
<p>O Livro de Obra é um documento obrigatório em muitas obras, especialmente públicas, preenchido diariamente pelo responsável.</p>
<h3>Conteúdo do Livro de Obra</h3>
<div class="tw"><table class="dt">
<tr><th>Item</th><th>Descrição</th></tr>
<tr><td>Identificação da Obra</td><td>Nome, localização, dono de obra, empreiteiro.</td></tr>
<tr><td>Data</td><td>Dia, mês e ano.</td></tr>
<tr><td>Condições Meteorológicas</td><td>Tempo, temperatura.</td></tr>
<tr><td>Trabalhos Executados</td><td>O que foi feito no dia.</td></tr>
<tr><td>Mão-de-Obra</td><td>Número de trabalhadores e funções.</td></tr>
<tr><td>Materiais Utilizados</td><td>Quantidades e tipos de materiais.</td></tr>
<tr><td>Equipamentos Utilizados</td><td>Máquinas e equipamentos em uso.</td></tr>
<tr><td>Ocorrências</td><td>Problemas, acidentes, decisões tomadas.</td></tr>
<tr><td>Observações</td><td>Notas adicionais, recomendações.</td></tr>
</table></div>
<h3>Importância do Livro de Obra</h3>
<p>Registo histórico, prova documental em litígios, controlo do progresso.</p>
</div>
<div class="cb"><h2><i class="fas fa-file-lines"></i> Caderno de Encargos</h2>
<p>Define as características técnicas dos materiais e da execução da obra; é parte integrante do contrato.</p>
<h3>Conteúdo do Caderno de Encargos</h3>
<div class="tw"><table class="dt">
<tr><th>Item</th><th>Descrição</th></tr>
<tr><td>Materiais</td><td>Tipo, qualidade, marca, dimensões.</td></tr>
<tr><td>Técnicas Construtivas</td><td>Como executar cada trabalho.</td></tr>
<tr><td>Acabamentos</td><td>Tipo de revestimentos, pinturas, esquadrias.</td></tr>
<tr><td>Ensaios</td><td>Ensaios a realizar.</td></tr>
<tr><td>Condições de Execução</td><td>Prazos, segurança, gestão de resíduos.</td></tr>
</table></div>
<h3>Importância do Caderno de Encargos</h3>
<p>Garantia de qualidade, base para fiscalização, prevenção de conflitos.</p>
</div>
<div class="cb"><h2><i class="fas fa-ruler-combined"></i> Autos de Medição</h2>
<p>Registam as quantidades de trabalho efetivamente executadas e são a base para pagamento.</p>
<h3>Como são Elaborados</h3>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Medição</h4><p>O fiscal (ou empreiteiro) mede as quantidades executadas.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Registo</h4><p>As quantidades são registadas no Auto.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Conferência</h4><p>Dono de Obra e Empreiteiro conferem e assinam.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Pagamento</h4><p>Com base no auto, emite-se a fatura e efetua-se o pagamento.</p></div></div>
</div>
<h3>Conteúdo do Auto de Medição</h3>
<div class="tw"><table class="dt">
<tr><th>Item</th><th>Descrição</th></tr>
<tr><td>Identificação da Obra</td><td>Nome, localização.</td></tr>
<tr><td>Período</td><td>Período a que se refere.</td></tr>
<tr><td>Trabalhos Medidos</td><td>Descrição e quantidades.</td></tr>
<tr><td>Preços Unitários</td><td>Preço de cada item.</td></tr>
<tr><td>Valor Total</td><td>Quantidade × Preço Unitário.</td></tr>
<tr><td>Assinaturas</td><td>Empreiteiro, Fiscal, Dono de Obra.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-folder-tree"></i> Outros Documentos Importantes</h2>
<p>Relatórios de Progresso, Ensaios de Materiais, Plantas "As Built", Manual de Utilização.</p>
</div>
<div class="cb"><h2><i class="fas fa-clipboard-question"></i> Exercício Prático</h2>
<p><strong>Caso: "Kwanza Construtora, LDA".</strong> O fiscal de uma obra está a elaborar o Auto de Medição do mês de Julho. Durante o mês, foram executados: 100 m³ de betão para a laje, 200 m² de alvenaria de tijolo, 150 m² de reboco. Preços unitários: Betão Kz 15.000/m³, Alvenaria Kz 8.000/m², Reboco Kz 5.000/m².</p>
<ol>
<li>Calcule o valor total do Auto de Medição.</li>
<li>Quem deve assinar o Auto de Medição?</li>
<li>Qual é a importância deste documento?</li>
</ol>
<div class="hi"><strong>Gabarito:</strong> Betão: 100 × 15.000 = 1.500.000 Kz. Alvenaria: 200 × 8.000 = 1.600.000 Kz. Reboco: 150 × 5.000 = 750.000 Kz. Total = 1.500.000 + 1.600.000 + 750.000 = <strong>3.850.000 Kz</strong>.</div>
<p>Devem assinar: Empreiteiro, Fiscal, Dono de Obra.</p>
<p>Importância: regista as quantidades executadas, é a base para o pagamento ao empreiteiro, serve como prova documental em litígios.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>A documentação técnica é essencial para o controlo e a gestão da obra.</li>
<li>O Livro de Obra regista diariamente o que acontece.</li>
<li>O Caderno de Encargos define as especificações técnicas.</li>
<li>Os Autos de Medição registam quantidades executadas e são base para pagamentos.</li>
</ul>
<div class="hi">Hoje você aprendeu a: identificar e descrever os principais documentos técnicos de uma obra.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Qual documento regista diariamente os acontecimentos na obra?</div>
<div class="qo" onclick="cq(this,false)">a) Caderno de Encargos</div>
<div class="qo" onclick="cq(this,true)">b) Livro de Obra</div>
<div class="qo" onclick="cq(this,false)">c) Auto de Medição</div>
<div class="qo" onclick="cq(this,false)">d) Planta "As Built"</div>
<div class="qq">O que define as especificações técnicas dos materiais e da execução?</div>
<div class="qo" onclick="cq(this,false)">a) Livro de Obra</div>
<div class="qo" onclick="cq(this,true)">b) Caderno de Encargos</div>
<div class="qo" onclick="cq(this,false)">c) Auto de Medição</div>
<div class="qo" onclick="cq(this,false)">d) Relatório de Progresso</div>
<div class="qq">Os Autos de Medição são a base para:</div>
<div class="qo" onclick="cq(this,false)">a) O licenciamento da obra</div>
<div class="qo" onclick="cq(this,true)">b) O pagamento ao empreiteiro</div>
<div class="qo" onclick="cq(this,false)">c) A conceção arquitetónica</div>
<div class="qo" onclick="cq(this,false)">d) A segurança no estaleiro</div>
<div class="qq">As Plantas "As Built" são:</div>
<div class="qo" onclick="cq(this,false)">a) O projeto inicial</div>
<div class="qo" onclick="cq(this,true)">b) O projeto final, com as alterações feitas em obra</div>
<div class="qo" onclick="cq(this,false)">c) Plantas do edifício vizinho</div>
<div class="qo" onclick="cq(this,false)">d) Plantas do terreno</div>
</div>`},

{t:'Sustentabilidade e Impacto Ambiental na Construção em Angola', html:`
<div class="cb"><h2><i class="fas fa-leaf"></i> A Construção Civil e o Ambiente</h2>
<p>A construção civil consome grandes quantidades de recursos naturais, gera resíduos e emissões, e altera a paisagem. Mas também pode ser parte da solução, através de práticas sustentáveis.</p>
<div class="ib"><strong>Pare e pense:</strong> Qual é o impacto ambiental de uma obra de construção de uma estrada? Alteração da paisagem, desflorestação, emissões de CO2, consumo de energia e materiais, e incentivo à expansão urbana.</div>
</div>
<div class="cb"><h2><i class="fas fa-cloud"></i> Principais Impactos Ambientais da Construção</h2>
<div class="tw"><table class="dt">
<tr><th>Impacto</th><th>Descrição</th></tr>
<tr><td>Consumo de Recursos</td><td>Extração de areia, pedra, madeira, água, energia.</td></tr>
<tr><td>Emissões de CO2</td><td>Produção de cimento e aço, transporte, funcionamento de equipamentos.</td></tr>
<tr><td>Resíduos</td><td>Entulho, sobras de materiais, plásticos, madeira.</td></tr>
<tr><td>Poluição</td><td>Poeira, ruído, poluição da água.</td></tr>
<tr><td>Alteração da Paisagem</td><td>Desflorestação, impermeabilização do solo, perda de biodiversidade.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-scroll"></i> Legislação Ambiental em Angola</h2>
<div class="tw"><table class="dt">
<tr><th>Diploma</th><th>Descrição</th></tr>
<tr><td>Lei n.º 5/98, de 16 de Junho</td><td>Lei de Bases do Ambiente.</td></tr>
<tr><td>Decreto n.º 33/04, de 31 de Maio</td><td>Avaliação de Impacto Ambiental (EIA).</td></tr>
<tr><td>Decreto n.º 37/10, de 26 de Novembro</td><td>Gestão de Resíduos.</td></tr>
</table></div>
<div class="wb"><strong>Atenção:</strong> Os números e as datas destes diplomas ainda não foram confirmados contra o Diário da República. Trate-os como referência a confirmar, não como certeza — não os use para decisões legais reais sem verificar primeiro na fonte oficial.</div>
<h3>Avaliação de Impacto Ambiental (EIA)</h3>
<p>Certos projetos exigem uma EIA antes de serem licenciados, incluindo identificação de impactos, medidas de mitigação e plano de monitorização.</p>
<h3>Licenciamento Ambiental</h3>
<p>Após a EIA, a entidade competente emite a Licença Ambiental, que autoriza o projeto sob determinadas condições.</p>
</div>
<div class="cb"><h2><i class="fas fa-seedling"></i> Construção Sustentável – Boas Práticas</h2>
<h3>Planeamento e Projeto</h3>
<p>Escolher terrenos com menor impacto. Projetar edifícios eficientes (orientação solar, ventilação natural). Utilizar materiais sustentáveis (locais, reciclados, renováveis).</p>
<h3>Durante a Obra</h3>
<p>Reduzir consumo de água e energia. Controlar poeira e ruído. Gerir resíduos. Proteger solo e vegetação.</p>
<h3>Após a Obra</h3>
<p>Plantar vegetação. Aproveitar águas pluviais. Instalar painéis solares.</p>
</div>
<div class="cb"><h2><i class="fas fa-hand-holding-dollar"></i> Benefícios da Construção Sustentável</h2>
<div class="tw"><table class="dt">
<tr><th>Benefício</th><th>Descrição</th></tr>
<tr><td>Económico</td><td>Redução de custos (energia, água, manutenção).</td></tr>
<tr><td>Ambiental</td><td>Redução do consumo de recursos e emissões.</td></tr>
<tr><td>Social</td><td>Edifícios mais saudáveis e confortáveis.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-clipboard-question"></i> Exercício Prático</h2>
<p><strong>Caso: "Kwanza Construtora, LDA".</strong> A empresa vai construir um edifício de escritórios com certificação ambiental (sustentável).</p>
<ol>
<li>Que medidas de sustentabilidade devem ser consideradas no projeto?</li>
<li>Como deve ser feita a gestão de resíduos durante a obra?</li>
<li>Que benefícios a certificação ambiental pode trazer?</li>
</ol>
<div class="hi"><strong>Gabarito:</strong> projeto com orientação solar adequada, materiais locais e sustentáveis, captação de águas pluviais, painéis solares, ventilação natural.</div>
<p>Gestão de resíduos: separar por tipo, destinar para reciclagem ou aterro licenciado, reutilizar sempre que possível.</p>
<p>Benefícios: redução de custos operacionais, melhor imagem da empresa, valorização do imóvel, atração de inquilinos/investidores.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>A construção civil tem um grande impacto ambiental, mas pode ser mais sustentável.</li>
<li>A legislação angolana exige Avaliação de Impacto Ambiental para certos projetos.</li>
<li>Boas práticas incluem planeamento sustentável, gestão de resíduos, eficiência energética.</li>
<li>A construção sustentável traz benefícios económicos, ambientais e sociais.</li>
</ul>
<div class="hi">Hoje você aprendeu a: compreender a importância da sustentabilidade na construção e reconhecer boas práticas.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Qual é o principal impacto ambiental da construção civil?</div>
<div class="qo" onclick="cq(this,true)">a) Emissão de CO2 e consumo de recursos</div>
<div class="qo" onclick="cq(this,false)">b) Criação de emprego</div>
<div class="qo" onclick="cq(this,false)">c) Melhoria da paisagem</div>
<div class="qo" onclick="cq(this,false)">d) Aumento da biodiversidade</div>
<div class="qq">Que lei exige a Avaliação de Impacto Ambiental (EIA) para certos projetos?</div>
<div class="qo" onclick="cq(this,false)">a) Código de Urbanismo</div>
<div class="qo" onclick="cq(this,true)">b) Lei de Bases do Ambiente</div>
<div class="qo" onclick="cq(this,false)">c) Lei do Orçamento Geral do Estado</div>
<div class="qo" onclick="cq(this,false)">d) Lei do Trabalho</div>
<div class="qq">Qual é uma boa prática de construção sustentável durante a obra?</div>
<div class="qo" onclick="cq(this,false)">a) Queimar os resíduos no local</div>
<div class="qo" onclick="cq(this,true)">b) Separar e reciclar os resíduos</div>
<div class="qo" onclick="cq(this,false)">c) Enterrar os resíduos no terreno</div>
<div class="qo" onclick="cq(this,false)">d) Deitar os resíduos no rio</div>
<div class="qq">Um edifício sustentável pode trazer que benefício económico?</div>
<div class="qo" onclick="cq(this,false)">a) Aumento dos custos de energia</div>
<div class="qo" onclick="cq(this,true)">b) Redução dos custos de água e energia</div>
<div class="qo" onclick="cq(this,false)">c) Aumento dos impostos</div>
<div class="qo" onclick="cq(this,false)">d) Desvalorização do imóvel</div>
</div>`},

{t:'Estudo de Caso — Ciclo Completo de uma Obra Residencial em Luanda', html:`
<div class="cb"><h2><i class="fas fa-house-chimney-window"></i> Apresentação do Caso</h2>
<p>Empreendimento: moradia unifamiliar de 2 pisos, no município do Kilamba Kiaxi, Luanda. Dono de Obra: Família Silva. Empreiteiro: Kwanza Construtora, LDA. Projectista: Arquiteto e Engenheiro Civil de Luanda. Orçamento: Kz 80.000.000 (aproximadamente 110.000 USD, taxa indicativa de referência — não confirmada). Prazo: 12 meses. Área de Construção: 300 m².</p>
</div>
<div class="cb"><h2><i class="fas fa-magnifying-glass-chart"></i> Fase 1 – Estudo Prévio e Viabilidade</h2>
<p>A família Silva decide construir uma moradia num terreno que já possui. Consulta um arquiteto para avaliar a viabilidade. Estuda o mercado imobiliário e os custos. Define o orçamento (Kz 80.000.000) e o prazo (12 meses). Contrata o arquiteto e o engenheiro.</p>
</div>
<div class="cb"><h2><i class="fas fa-drafting-compass"></i> Fase 2 – Projecto</h2>
<p>O arquiteto elabora o projeto de arquitectura. O engenheiro elabora o projeto de estruturas. Outros projetistas elaboram as especialidades. O projeto é discutido e aprovado pela família Silva.</p>
</div>
<div class="cb"><h2><i class="fas fa-stamp"></i> Fase 3 – Licenciamento</h2>
<p>A família Silva, com o arquiteto, submete o projeto à Câmara Municipal de Luanda. Obtém a Licença de Construção, a aprovação do projeto de segurança contra incêndios, e a aprovação do projeto eléctrico.</p>
</div>
<div class="cb"><h2><i class="fas fa-person-digging"></i> Fase 4 – Execução da Obra</h2>
<div class="tl">

{t:'Álgebra e Geometria Aplicadas ao Cálculo de Áreas e Volumes', html:`
<div class="cb"><h2><i class="fas fa-calculator"></i> Por que a Matemática é Essencial na Construção Civil?</h2>
<p>A construção civil é, na sua essência, uma atividade profundamente matemática. Cada decisão – desde a quantidade de betão necessária para uma laje até ao dimensionamento de um telhado – envolve cálculos. Um erro matemático pode resultar em:</p>
<ul><li><strong>Falta de materiais:</strong> atrasos e custos adicionais.</li><li><strong>Excesso de materiais:</strong> desperdício e aumento de custos.</li><li><strong>Erros estruturais:</strong> comprometimento da segurança.</li><li><strong>Problemas de planeamento:</strong> prazos não cumpridos.</li></ul>
<p>Para o Técnico de Edificações, dominar a matemática aplicada não é uma opção – é uma obrigação. A capacidade de calcular rapidamente áreas, volumes, inclinações e quantidades é o que distingue um profissional competente de um amador.</p>
<p>Em Angola, onde muitos materiais são importados e sujeitos a flutuações de preço, a precisão nos cálculos é ainda mais crítica. Um erro de cálculo pode significar a diferença entre o lucro e o prejuízo numa obra.</p>
<div class="ib"><strong>Pare e pense:</strong> Se uma laje tem 10 metros de comprimento e 8 metros de largura, e a espessura do betão é de 0,15 metros, quantos metros cúbicos de betão são necessários? (Resposta: 10 × 8 × 0,15 = 12 m³.)</div>
</div>
<div class="cb"><h2><i class="fas fa-square-root-variable"></i> Revisão de Álgebra Básica</h2>
<p>Antes de mergulharmos na geometria, é essencial recordar alguns conceitos algébricos fundamentais que serão usados ao longo de todo o módulo.</p>
<h3>Operações Básicas</h3>
<div class="tw"><table class="dt"><tr><th>Operação</th><th>Símbolo</th><th>Exemplo</th></tr>
<tr><td>Adição</td><td>+</td><td>5 + 3 = 8</td></tr>
<tr><td>Subtração</td><td>−</td><td>10 − 4 = 6</td></tr>
<tr><td>Multiplicação</td><td>×</td><td>6 × 7 = 42</td></tr>
<tr><td>Divisão</td><td>÷</td><td>20 ÷ 5 = 4</td></tr></table></div>
<h3>Potências e Raízes</h3>
<p><strong>Potência:</strong> 3² = 3 × 3 = 9 (lê-se "três elevado ao quadrado"). <strong>Raiz quadrada:</strong> √16 = 4 (porque 4 × 4 = 16).</p>
<h3>Expressões Algébricas</h3>
<p>Uma expressão algébrica combina números, variáveis (letras) e operações. Na construção, usamos variáveis para representar dimensões desconhecidas. <strong>Exemplo:</strong> a área de um retângulo é A = comprimento × largura = C × L.</p>
<h3>Resolução de Equações Simples</h3>
<p>Para encontrar um valor desconhecido, isolamos a variável. <strong>Exemplo:</strong> se a área de um retângulo é 50 m² e a largura é 5 m, qual é o comprimento?</p>
<div class="fbox"><div class="f">A = C × L → 50 = C × 5 → C = 10 m</div><div class="fd">Isolando C: C = 50 ÷ 5</div></div>
</div>
<div class="cb"><h2><i class="fas fa-ruler-combined"></i> Geometria Plana – Áreas de Figuras Comuns</h2>
<p>O cálculo de áreas é uma das tarefas mais frequentes na construção civil: área de paredes, pisos, telhados, terrenos, etc.</p>
<h3>Quadrado</h3>
<div class="fbox"><div class="f">A = L × L = L²</div><div class="fd">L = 4 m → A = 4² = 16 m² | Perímetro: P = 4 × L = 16 m</div></div>
<p><strong>Aplicação:</strong> calcular a área de um piso quadrado para saber quantos azulejos comprar.</p>
<h3>Retângulo</h3>
<div class="fbox"><div class="f">A = C × L</div><div class="fd">C = 8 m, L = 5 m → A = 40 m² | Perímetro: P = 2 × (C + L) = 26 m</div></div>
<p><strong>Aplicação:</strong> calcular a área de uma parede para saber a quantidade de tinta necessária.</p>
<h3>Triângulo</h3>
<div class="fbox"><div class="f">A = (b × h) ÷ 2</div><div class="fd">b = 6 m, h = 4 m → A = (6 × 4) ÷ 2 = 12 m²</div></div>
<p><strong>Aplicação:</strong> calcular a área de uma empena (parte triangular de uma parede sob o telhado).</p>
<h3>Círculo</h3>
<div class="fbox"><div class="f">A = π × r² | C = 2 × π × r</div><div class="fd">r = 3 m → A = 3,14 × 3² = 28,26 m² | C = 2 × 3,14 × 3 = 18,84 m</div></div>
<p><strong>Aplicação:</strong> calcular a área de uma coluna circular ou de uma janela redonda.</p>
<div class="ib"><strong>Nota:</strong> π (pi) ≈ 3,1416. Para cálculos práticos, usamos 3,14.</div>
<h3>Trapézio</h3>
<div class="fbox"><div class="f">A = [(B + b) × h] ÷ 2</div><div class="fd">B = 8 m, b = 4 m, h = 3 m → A = [(8 + 4) × 3] ÷ 2 = 18 m²</div></div>
<p><strong>Aplicação:</strong> calcular a área de um terreno com forma trapezoidal.</p>
</div>
<div class="cb"><h2><i class="fas fa-cubes"></i> Geometria Espacial – Volumes de Sólidos Comuns</h2>
<p>O cálculo de volumes é essencial para determinar a quantidade de materiais como betão, terra, areia, etc.</p>
<h3>Cubo</h3>
<div class="fbox"><div class="f">V = L × L × L = L³</div><div class="fd">L = 2 m → V = 2³ = 8 m³</div></div>
<h3>Paralelepípedo (Bloco Retangular)</h3>
<div class="fbox"><div class="f">V = C × L × A</div><div class="fd">C = 5 m, L = 3 m, A = 2 m → V = 5 × 3 × 2 = 30 m³</div></div>
<p><strong>Aplicação:</strong> calcular o volume de betão necessário para uma laje.</p>
<h3>Cilindro</h3>
<div class="fbox"><div class="f">V = π × r² × h</div><div class="fd">r = 0,5 m, h = 3 m → V = 3,14 × 0,5² × 3 = 2,355 m³</div></div>
<p><strong>Aplicação:</strong> calcular o volume de uma coluna cilíndrica ou de um tubo.</p>
<h3>Cone e Pirâmide</h3>
<div class="tw"><table class="dt"><tr><th>Sólido</th><th>Fórmula do Volume</th><th>Exemplo</th></tr>
<tr><td>Cone</td><td>V = (π × r² × h) ÷ 3</td><td>r = 1 m, h = 3 m → V = (3,14 × 1² × 3) ÷ 3 = 3,14 m³</td></tr>
<tr><td>Pirâmide</td><td>V = (A_base × h) ÷ 3</td><td>A_base = 9 m², h = 4 m → V = (9 × 4) ÷ 3 = 12 m³</td></tr></table></div>
</div>
<div class="cb"><h2><i class="fas fa-trowel"></i> Aplicação Prática em Obra</h2>
<h3>Cálculo de Betão para uma Laje</h3>
<p><strong>Problema:</strong> Uma laje tem 12 m de comprimento, 8 m de largura e 0,15 m de espessura. Quantos metros cúbicos de betão são necessários?</p>
<p><strong>Solução:</strong> Volume = C × L × A = 12 × 8 × 0,15 = 14,4 m³. Considerando um desperdício de 5%: 14,4 × 1,05 = 15,12 m³.</p>
<div class="hi">São necessários aproximadamente <strong>15,12 m³ de betão</strong>.</div>
<h3>Cálculo de Tinta para uma Parede</h3>
<p><strong>Problema:</strong> Uma parede tem 6 m de comprimento e 2,8 m de altura. Tem uma janela de 1,2 m × 1,5 m. Quantos metros quadrados de parede precisam de ser pintados?</p>
<p><strong>Solução:</strong> Área da parede = 6 × 2,8 = 16,8 m². Área da janela = 1,2 × 1,5 = 1,8 m². Área a pintar = 16,8 – 1,8 = 15 m².</p>
<div class="hi">A área a pintar é de <strong>15 m²</strong>.</div>
<h3>Cálculo de Blocos para uma Parede</h3>
<p><strong>Problema:</strong> Uma parede de 10 m de comprimento e 2,5 m de altura vai ser construída com blocos de 0,40 m × 0,20 m (incluindo a junta de argamassa). Quantos blocos são necessários?</p>
<p><strong>Solução:</strong> Área da parede = 10 × 2,5 = 25 m². Área de cada bloco = 0,40 × 0,20 = 0,08 m². Número de blocos = 25 ÷ 0,08 = 312,5 ≈ 313 blocos.</p>
<div class="hi">São necessários aproximadamente <strong>313 blocos</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-building"></i> Exercício Prático — Kwanza Construtora, LDA</h2>
<p>A empresa vai construir uma laje de cobertura com as seguintes dimensões: comprimento 15 m, largura 10 m, espessura 0,12 m.</p>
<ol><li>Calcule o volume de betão necessário.</li><li>Se o betão custa Kz 25.000/m³, qual é o custo do betão para a laje?</li><li>Acrescente 5% para desperdício e calcule o custo total.</li></ol>
<h3>Gabarito comentado</h3>
<p><strong>1. Volume de betão:</strong> V = 15 × 10 × 0,12 = 18 m³</p>
<div class="hi">Volume de betão: <strong>18 m³</strong></div>
<p><strong>2. Custo do betão:</strong> Custo = 18 × 25.000 = 450.000 Kz</p>
<div class="hi">Custo do betão: <strong>450.000 Kz</strong></div>
<p><strong>3. Custo com desperdício (5%):</strong> Volume com desperdício = 18 × 1,05 = 18,9 m³. Custo total = 18,9 × 25.000 = 472.500 Kz</p>
<div class="hi">O custo total do betão é de <strong>472.500 Kz</strong>.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul><li>A álgebra e a geometria são ferramentas essenciais na construção civil.</li>
<li>As fórmulas de área permitem calcular superfícies (pisos, paredes, telhados).</li>
<li>As fórmulas de volume permitem calcular quantidades de materiais (betão, terra, areia).</li>
<li>A precisão nos cálculos é fundamental para evitar desperdícios e custos adicionais.</li>
<li>Praticar com exercícios reais é a melhor forma de dominar estes conceitos.</li></ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> aplicar conceitos de álgebra e geometria para calcular áreas e volumes, essenciais para o dimensionamento de materiais e espaços na construção civil.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Qual é a fórmula da área de um retângulo?</div>
<div class="qo" onclick="cq(this,true)">a) A = C × L</div>

</div>`},
{t:'Trigonometria Aplicada: Ângulos, Inclinações e Coberturas', html:`
<div class="cb"><h2><i class="fas fa-drafting-compass"></i> Por que a Trigonometria é Essencial na Construção?</h2>
<p>A trigonometria é a área da matemática que estuda as relações entre os ângulos e os lados dos triângulos. Na construção civil, é utilizada diariamente para:</p>
