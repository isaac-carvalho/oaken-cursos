<div class="qq">2. Qual é o custo de 450 blocos a Kz 180/unidade?</div>
<div class="qo" onclick="cq(this,true)">a) 81.000 Kz</div>
<div class="qo" onclick="cq(this,false)">b) 90.000 Kz</div>
<div class="qo" onclick="cq(this,false)">c) 72.000 Kz</div>
<div class="qo" onclick="cq(this,false)">d) 100.000 Kz</div>
<div class="qq">3. Uma parede de 40 m² com um rendimento de 10 m²/dia demora:</div>
<div class="qo" onclick="cq(this,false)">a) 2 dias</div>
<div class="qo" onclick="cq(this,false)">b) 3 dias</div>
<div class="qo" onclick="cq(this,true)">c) 4 dias</div>
<div class="qo" onclick="cq(this,false)">d) 5 dias</div>
<div class="qq">4. Que percentagem de desperdício é geralmente considerada nos cálculos?</div>
<div class="qo" onclick="cq(this,false)">a) 1%</div>
<div class="qo" onclick="cq(this,true)">b) 5%</div>
<div class="qo" onclick="cq(this,false)">c) 20%</div>
<div class="qo" onclick="cq(this,false)">d) 50%</div>
</div>`},
{t:'Exercício Integrador — Cálculos Aplicados a um Projeto Simples', html:`
<div class="cb"><h2><i class="fas fa-house"></i> Apresentação do Projeto</h2>
<p><strong>Empreendimento:</strong> Moradia unifamiliar térrea, no município de Belas, Luanda. <strong>Dono de Obra:</strong> Família Santos. <strong>Área de Construção:</strong> 120 m² (12 m × 10 m).</p>
<p><strong>Características:</strong> fundações em sapatas de betão armado; paredes em alvenaria de blocos de betão; laje de cobertura em betão armado; telhado de telha metálica (zinco); pisos em cerâmica; acabamentos com pintura de paredes e tetos.</p>
<p><strong>Dados:</strong> preço do terreno já adquirido; orçamento disponível: Kz 15.000.000; prazo desejado: 6 meses.</p>
</div>
<div class="cb"><h2><i class="fas fa-square-root-variable"></i> Cálculos Integradores</h2>
<h3>Cálculo de Áreas</h3>
<p>Área da moradia: 12 × 10 = 120 m². Área de paredes exteriores (altura: 3 m, espessura: 0,20 m): Perímetro = 2 × (12 + 10) = 44 m. Área bruta = 44 × 3 = 132 m². Área de vãos (portas + janelas): estimar 20% da área bruta. Área líquida = 132 × 0,80 = 105,6 m².</p>
<h3>Cálculo de Blocos</h3>
<p>Bloco de 0,40 m × 0,20 m (área = 0,08 m²). Blocos = 105,6 / 0,08 = 1.320 blocos. Com desperdício (5%): 1.320 × 1,05 ≈ 1.386 blocos.</p>
<h3>Cálculo de Betão para a Laje</h3>
<p>Laje: 12 × 10 × 0,12 = 14,4 m³. Com desperdício (5%): 14,4 × 1,05 = 15,12 m³.</p>
<h3>Cálculo de Ferragens (Aço)</h3>
<p>Estimativa: 100 kg/m³ de betão. Aço = 15,12 × 100 ≈ 1.512 kg.</p>
<h3>Cálculo de Argamassa (assentamento)</h3>
<p>Volume de alvenaria = 105,6 × 0,20 = 21,12 m³. Argamassa = 21,12 × 0,12 = 2,53 m³. Cimento: 2,53 × 200 = 506 kg ≈ 10,1 sacos. Areia: 2,53 × 0,8 = 2,02 m³.</p>
<h3>Cálculo de Reboco</h3>
<p>Área de reboco: 105,6 m² (paredes interiores + exteriores). Espessura do reboco: 0,02 m. Volume de argamassa de reboco = 105,6 × 0,02 = 2,11 m³.</p>
</div>
<div class="cb"><h2><i class="fas fa-file-invoice-dollar"></i> Estimativa de Custos</h2>
<div class="tw"><table class="dt"><tr><th>Material</th><th>Quantidade</th><th>Preço Unitário</th><th>Custo (Kz)</th></tr>

{t:'Introdução ao Desenho Técnico: Normas, Formatos e Legendas', html:`
<div class="cb"><h2><i class="fas fa-compass-drafting"></i> Por que o Desenho Técnico é Essencial na Construção?</h2>
<p>O desenho técnico é a "língua" da construção civil. É através dele que arquitetos, engenheiros, técnicos de edificações e empreiteiros comunicam entre si. Um desenho técnico bem executado transmite, de forma clara e inequívoca, todas as informações necessárias para construir um edifício: dimensões, formas, materiais, acabamentos e detalhes construtivos.</p>
<p>Em Angola, a qualidade do desenho técnico é muitas vezes um ponto fraco. Muitas obras são executadas com base em desenhos rudimentares, à mão ou sem cotas, o que gera erros, desperdícios e conflitos. Um desenho técnico bem feito é a base de uma obra bem executada.</p>
<div class="ib"><strong>Pare e pense:</strong> Se um desenho não tem cotas (medidas), como pode o empreiteiro saber as dimensões exatas de uma parede? Resposta: não pode. Vai ter de medir no terreno, o que pode levar a erros e a uma obra fora do projeto.</div>
</div>
<div class="cb"><h2><i class="fas fa-ruler"></i> O Que é o Desenho Técnico?</h2>
<p>O <strong>desenho técnico</strong> é uma representação gráfica normalizada de um objeto, estrutura ou sistema, com o objetivo de transmitir informações técnicas precisas. Ao contrário do desenho artístico (que é subjetivo e expressivo), o desenho técnico é objetivo e rigoroso.</p>
<p><strong>Características do desenho técnico:</strong></p>
<ul>
<li><strong>Precisão:</strong> as medidas são exatas.</li>
<li><strong>Clareza:</strong> a informação é transmitida de forma inequívoca.</li>
<li><strong>Normalização:</strong> segue regras e convenções estabelecidas.</li>
<li><strong>Objectividade:</strong> não há espaço para interpretações subjetivas.</li>
</ul>
</div>
<div class="cb"><h2><i class="fas fa-book"></i> Normas de Desenho Técnico</h2>
<p>As normas de desenho técnico garantem que todos os profissionais utilizem a mesma linguagem. Em Angola, as normas mais relevantes são:</p>
<div class="tw"><table class="dt">
<tr><th>Norma</th><th>Descrição</th></tr>
<tr><td>ISO 128</td><td>Princípios gerais de representação.</td></tr>
<tr><td>ISO 129</td><td>Cotagem (indicação de medidas).</td></tr>
<tr><td>ISO 5456</td><td>Projeções ortogonais (vistas).</td></tr>
<tr><td>NP (Normas Portuguesas)</td><td>Muitas normas usadas em Angola são de origem portuguesa.</td></tr>
<tr><td>NBR (Normas Brasileiras)</td><td>Também usadas em alguns projetos.</td></tr>
</table></div>
<p><strong>Importância:</strong> O cumprimento das normas facilita a leitura e a interpretação dos desenhos por todos os intervenientes.</p>
</div>
<div class="cb"><h2><i class="fas fa-file"></i> Formatos de Papel</h2>
<p>Os desenhos são impressos em formatos normalizados. A série A (ISO 216) é a mais comum:</p>
<div class="tw"><table class="dt">
<tr><th>Formato</th><th>Dimensões (mm)</th><th>Uso Típico</th></tr>
<tr><td>A0</td><td>841 × 1189</td><td>Plantas gerais, grandes projetos.</td></tr>
<tr><td>A1</td><td>594 × 841</td><td>Plantas de pisos, cortes.</td></tr>
<tr><td>A2</td><td>420 × 594</td><td>Plantas de piso, detalhes.</td></tr>
<tr><td>A3</td><td>297 × 420</td><td>Desenhos de pormenor, cortes.</td></tr>
<tr><td>A4</td><td>210 × 297</td><td>Documentação, legendas, pormenores.</td></tr>
</table></div>
<p><strong>Dobra de folhas:</strong> Para arquivo, as folhas de formato superior a A4 são dobradas para A4, com a legenda sempre visível.</p>
</div>
<div class="cb"><h2><i class="fas fa-stamp"></i> Legenda (Carimbo)</h2>
<p>A <strong>legenda</strong> (ou carimbo) é uma tabela localizada no canto inferior direito do desenho. Contém informações essenciais:</p>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Descrição</th></tr>
<tr><td>Título</td><td>Designação do desenho (ex: "Planta do Piso Térreo").</td></tr>
<tr><td>Projeto</td><td>Nome do projeto e do cliente.</td></tr>
<tr><td>Escala</td><td>Escala do desenho (ex: 1:50).</td></tr>
<tr><td>Data</td><td>Data de elaboração ou revisão.</td></tr>
<tr><td>Desenhado por</td><td>Nome do desenhador.</td></tr>
<tr><td>Verificado por</td><td>Nome do revisor.</td></tr>
<tr><td>Aprovado por</td><td>Nome do responsável.</td></tr>
<tr><td>Número do desenho</td><td>Código único (ex: ARQ-01).</td></tr>
<tr><td>Revisão</td><td>Número da revisão (ex: 00, 01, 02).</td></tr>
<tr><td>Normas</td><td>Normas aplicáveis.</td></tr>
<tr><td>Escala gráfica</td><td>Régua gráfica para medição direta.</td></tr>
</table></div>
<div class="ib"><strong>Exemplo de legenda preenchida:</strong> Título: "Planta do Piso Térreo" — Projeto: Moradia Família Santos — Escala: 1:50 — Data: 15/03/2026 — Desenhado por: J. Silva — Verificado por: M. Santos — Aprovado por: A. Paulo — Nº: ARQ-01, Rev: 00 — Normas: ISO 128 / NP 183.</div>
</div>
<div class="cb"><h2><i class="fas fa-layer-group"></i> Organização de um Conjunto de Desenhos</h2>
<p>Um projeto de arquitetura é composto por vários desenhos, organizados de forma lógica:</p>
<div class="tw"><table class="dt">
<tr><th>Tipo</th><th>Designação</th><th>Conteúdo</th></tr>
<tr><td>Folha de Rosto</td><td>Capa</td><td>Identificação do projeto.</td></tr>
<tr><td rowspan="4">Plantas</td><td>Planta de Localização</td><td>Situação do terreno.</td></tr>
<tr><td>Planta de Implantação</td><td>Terreno com o edifício.</td></tr>
<tr><td>Planta de Piso</td><td>Distribuição dos espaços.</td></tr>
<tr><td>Planta de Cobertura</td><td>Telhado e cobertura.</td></tr>
<tr><td rowspan="2">Cortes</td><td>Corte Transversal</td><td>Vista em corte do edifício.</td></tr>
<tr><td>Corte Longitudinal</td><td>Vista em corte longitudinal.</td></tr>
<tr><td rowspan="2">Alçados</td><td>Alçado Principal</td><td>Fachada principal.</td></tr>
<tr><td>Alçado Lateral</td><td>Fachada lateral.</td></tr>
<tr><td>Pormenores</td><td>Detalhes Construtivos</td><td>Pormenores de ligações, materiais, etc.</td></tr>
<tr><td rowspan="2">Quadros</td><td>Quadro de Áreas</td><td>Áreas de cada divisão.</td></tr>
<tr><td>Quadro de Acabamentos</td><td>Materiais e acabamentos.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-briefcase"></i> Exercício Prático: Kwanza Construtora, LDA</h2>
<p>A empresa recebeu um conjunto de desenhos para a construção de uma moradia. Um dos desenhos tem a legenda preenchida com os seguintes dados: Título: "Planta do Piso Térreo"; Escala: 1:50; Data: 10/02/2026; Número: ARQ-03, Revisão 01.</p>
<p><strong>Perguntas:</strong> 1) Que informações estão na legenda? 2) Qual é a escala do desenho? O que significa? 3) Para que serve a revisão 01? 4) Onde deve ser colocado o carimbo no desenho?</p>
<div class="hi"><strong>1. Informações na legenda:</strong> Título, escala, data, número do desenho, revisão.</div>
<div class="hi"><strong>2. Escala 1:50:</strong> Significa que 1 cm no desenho corresponde a 50 cm na realidade (0,5 m).</div>
<div class="hi"><strong>3. Revisão 01:</strong> Indica que o desenho já foi alterado uma vez em relação à versão original (00).</div>
<div class="hi"><strong>4. Localização do carimbo:</strong> O carimbo deve estar no canto inferior direito do desenho, para ser facilmente visível quando as folhas estão dobradas.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>O desenho técnico é a linguagem universal da construção civil.</li>
<li>É objetivo, preciso e normalizado.</li>
<li>As normas (ISO, NP, NBR) garantem a uniformidade.</li>
<li>Os formatos de papel seguem a série A (A0 a A4).</li>
<li>A legenda contém informações essenciais sobre o desenho.</li>
<li>Um projeto é composto por várias peças (plantas, cortes, alçados, pormenores).</li>
</ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> compreender a importância do desenho técnico, identificar os formatos de papel e interpretar legendas em peças desenhadas.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Qual é a principal característica do desenho técnico?</div>
<div class="qo" onclick="cq(this,false)">a) Expressividade artística</div>
<div class="qo" onclick="cq(this,true)">b) Precisão e normalização</div>
<div class="qo" onclick="cq(this,false)">c) Subjetividade</div>

<div class="qq">2. Qual é o formato de papel mais comum para plantas de arquitectura?</div>
<div class="qo" onclick="cq(this,false)">a) A0</div>
<div class="qo" onclick="cq(this,true)">b) A1</div>
<div class="qo" onclick="cq(this,false)">c) A4</div>

<div class="qo" onclick="cq(this,false)">a) No centro</div>
<div class="qo" onclick="cq(this,false)">b) No canto superior esquerdo</div>

<div class="qo" onclick="cq(this,false)">d) 1 cm no desenho = 0,1 cm na realidade</div>
</div>`},

{t:'Tipos de Linhas, Cotagem e Escalas em Desenho de Construção', html:`
<div class="cb"><h2><i class="fas fa-ruler-horizontal"></i> A Importância das Linhas e das Cotas</h2>
<p>Um desenho técnico é composto por linhas. Cada tipo de linha transmite uma informação diferente:</p>
<ul>
<li><strong>Linhas grossas:</strong> contornos e arestas visíveis.</li>
<li><strong>Linhas finas:</strong> linhas de cota, linhas de referência, linhas de eixo.</li>
<li><strong>Linhas tracejadas:</strong> arestas ocultas (por trás de outros elementos).</li>
<li><strong>Linhas de eixo:</strong> eixos de simetria ou de referência.</li>
</ul>
<p>As <strong>cotas</strong> (medidas) são a informação mais importante do desenho. Sem cotas, o desenho é apenas uma imagem, não um documento técnico.</p>
<div class="ib"><strong>Pare e pense:</strong> Se um desenho não tiver cotas, como pode o empreiteiro saber a distância entre duas paredes? Resposta: não pode. Vai ter de adivinhar ou medir no terreno, o que pode levar a erros.</div>
</div>
<div class="cb"><h2><i class="fas fa-slash"></i> Tipos de Linhas (ISO 128)</h2>
<div class="tw"><table class="dt">
<tr><th>Tipo de Linha</th><th>Utilização</th></tr>
<tr><td>Linha Contínua Grossa</td><td>Contornos visíveis, arestas.</td></tr>
<tr><td>Linha Contínua Fina</td><td>Linhas de cota, linhas de referência, hachuras.</td></tr>
<tr><td>Linha Contínua Média</td><td>Linhas de eixo (em alguns casos).</td></tr>
<tr><td>Linha Tracejada</td><td>Arestas ocultas (não visíveis).</td></tr>
<tr><td>Linha Traço-Ponto</td><td>Linhas de eixo, planos de corte.</td></tr>
<tr><td>Linha Traço-Ponto Fina</td><td>Eixos de simetria.</td></tr>
<tr><td>Linha Traço-Ponto com Dois Pontos</td><td>Superfícies de corte.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-arrows-left-right"></i> Cotagem (Indicação de Medidas)</h2>
<p>A <strong>cotagem</strong> é o processo de indicar as dimensões no desenho. As regras de cotagem são definidas pela ISO 129.</p>
<h3>Elementos da Cotagem</h3>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Descrição</th></tr>
<tr><td>Linha de Cota</td><td>Linha fina que indica a direção da medida.</td></tr>
<tr><td>Linha de Referência</td><td>Linha fina que liga a cota ao elemento medido.</td></tr>
<tr><td>Cota</td><td>Número que indica a medida (em mm ou m).</td></tr>
<tr><td>Seta</td><td>Indica o início e o fim da linha de cota.</td></tr>
</table></div>
<h3>Regras de Cotagem</h3>
<ul>
<li>As cotas devem ser colocadas <strong>fora</strong> do desenho (à direita e por baixo).</li>
<li>As cotas devem ser <strong>legíveis</strong> (tamanho de letra adequado).</li>
<li>As cotas devem ser <strong>uniformes</strong> (usar sempre a mesma unidade).</li>
<li>Em Angola, a unidade mais comum é o <strong>milímetro (mm)</strong> para dimensões e o <strong>metro (m)</strong> para áreas e volumes.</li>
</ul>
<div class="ib">Exemplo: um retângulo cotado mostra a cota geral de 6,000 m no topo e a cota de 4,000 m na base, indicando o comprimento e a largura do espaço representado.</div>
</div>
<div class="cb"><h2><i class="fas fa-percent"></i> Escalas (Revisão)</h2>
<p>A escala relaciona as dimensões do desenho com as dimensões reais. Já foi abordada no Módulo 2 (Aula 3), mas é importante recordar.</p>
<div class="tw"><table class="dt">
<tr><th>Escala</th><th>Significado</th></tr>
<tr><td>1:1</td><td>Tamanho real (muito raro).</td></tr>
<tr><td>1:50</td><td>1 cm = 0,5 m.</td></tr>
<tr><td>1:100</td><td>1 cm = 1 m.</td></tr>
<tr><td>1:200</td><td>1 cm = 2 m.</td></tr>
</table></div>
<p><strong>Regra:</strong> A escala deve ser indicada na legenda e, idealmente, também na escala gráfica.</p>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Aplicação Prática</h2>
<h3>Leitura de Cotas</h3>
<p><strong>Problema:</strong> Numa planta à escala 1:50, uma parede mede 8 cm no desenho. Qual é a dimensão real?</p>
<p><strong>Solução:</strong> 8 cm × 50 = 400 cm = 4 m. <strong>Resposta:</strong> A parede tem 4 m de comprimento.</p>
<h3>Indicação de Cotas</h3>
<p><strong>Problema:</strong> Desenhe uma parede de 3 m de comprimento na escala 1:50.</p>
<p><strong>Solução:</strong> 3 m = 300 cm → 300 / 50 = 6 cm no desenho. <strong>Resposta:</strong> A parede mede 6 cm no desenho.</p>
</div>
<div class="cb"><h2><i class="fas fa-briefcase"></i> Exercício Prático: Kwanza Construtora, LDA</h2>
<p>A empresa está a analisar a planta de uma sala. A planta está à escala 1:50. A sala mede 10 cm × 8 cm no desenho.</p>
<p><strong>Perguntas:</strong> 1) Quais são as dimensões reais da sala? 2) Qual é a área real da sala? 3) Se a planta tiver uma parede com 5 cm de comprimento no desenho, qual é o seu comprimento real?</p>
<div class="hi"><strong>1. Dimensões reais da sala:</strong> Comprimento: 10 cm × 50 = 500 cm = 5 m. Largura: 8 cm × 50 = 400 cm = 4 m.</div>
<div class="hi"><strong>2. Área real da sala:</strong> 5 m × 4 m = 20 m².</div>
<div class="hi"><strong>3. Comprimento real da parede:</strong> 5 cm × 50 = 250 cm = 2,5 m.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>Os diferentes tipos de linhas transmitem informações específicas.</li>
<li>A cotagem indica as medidas de forma clara e normalizada.</li>
<li>As regras de cotagem garantem a legibilidade e a uniformidade.</li>
<li>A escala relaciona as dimensões do desenho com a realidade.</li>
</ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> identificar os tipos de linhas, aplicar regras de cotagem e interpretar escalas em desenhos de construção.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Que tipo de linha é usado para indicar arestas ocultas?</div>
<div class="qo" onclick="cq(this,false)">a) Linha contínua grossa</div>
<div class="qo" onclick="cq(this,true)">b) Linha tracejada</div>
<div class="qo" onclick="cq(this,false)">c) Linha de eixo</div>
<div class="qo" onclick="cq(this,false)">d) Linha de cota</div>
<div class="qq">2. Qual é a unidade de medida mais comum para cotas em desenho de arquitectura?</div>
<div class="qo" onclick="cq(this,false)">a) Metro</div>
<div class="qo" onclick="cq(this,true)">b) Milímetro</div>
<div class="qo" onclick="cq(this,false)">c) Centímetro</div>
<div class="qo" onclick="cq(this,false)">d) Quilómetro</div>
<div class="qq">3. Uma cota de 4 m numa escala 1:100 corresponde a:</div>
<div class="qo" onclick="cq(this,true)">a) 4 cm</div>
<div class="qo" onclick="cq(this,false)">b) 40 cm</div>
<div class="qo" onclick="cq(this,false)">c) 0,4 cm</div>
<div class="qo" onclick="cq(this,false)">d) 4 mm</div>
<div class="qq">4. As cotas devem ser colocadas:</div>
<div class="qo" onclick="cq(this,false)">a) Dentro do desenho</div>
<div class="qo" onclick="cq(this,true)">b) Fora do desenho (à direita e por baixo)</div>
<div class="qo" onclick="cq(this,false)">c) Em qualquer lugar</div>
<div class="qo" onclick="cq(this,false)">d) Apenas no canto inferior</div>
</div>`},

{t:'Projecções Ortogonais: Plantas, Cortes e Alçados', html:`
<div class="cb"><h2><i class="fas fa-cube"></i> O Sistema de Projecções Ortogonais</h2>
<p>O sistema de projecções ortogonais (ou projecções em diedro) é a base do desenho técnico. Consiste em projetar um objeto sobre planos perpendiculares entre si, obtendo várias vistas.</p>
<p>No sistema europeu (1º diedro), as vistas são organizadas da seguinte forma:</p>
<ul>
<li><strong>Vista de frente (Alçado Principal):</strong> projeção no plano vertical (plano frontal).</li>
<li><strong>Vista de cima (Planta):</strong> projeção no plano horizontal (plano superior).</li>
<li><strong>Vista de lado (Alçado Lateral):</strong> projeção no plano vertical lateral.</li>
</ul>
<div class="ib"><strong>Pare e pense:</strong> Se olharmos para um edifício de frente, vemos o alçado principal. Se olharmos de cima, vemos a planta. Se cortarmos o edifício ao meio, vemos um corte.</div>
</div>
<div class="cb"><h2><i class="fas fa-map"></i> Planta</h2>
<p>A <strong>planta</strong> é a representação de um objeto (ou edifício) visto de cima, como se fosse cortado a uma determinada altura (geralmente 1,5 m do piso) e olhado de cima para baixo.</p>
<h3>Tipos de Plantas</h3>
<div class="tw"><table class="dt">
<tr><th>Tipo</th><th>Descrição</th></tr>
<tr><td>Planta de Localização</td><td>Mostra a localização do terreno e o edifício.</td></tr>
<tr><td>Planta de Implantação</td><td>Mostra o edifício implantado no terreno.</td></tr>
<tr><td>Planta de Piso</td><td>Mostra a distribuição dos espaços num piso.</td></tr>
<tr><td>Planta de Cobertura</td><td>Mostra o telhado ou a cobertura.</td></tr>
</table></div>
<h3>Elementos de uma Planta</h3>
<ul>
<li><strong>Paredes:</strong> representadas por linhas grossas.</li>
<li><strong>Portas:</strong> representadas por um arco (indica o movimento de abertura).</li>
<li><strong>Janelas:</strong> representadas por linhas finas (no interior da parede).</li>
<li><strong>Equipamento:</strong> mobiliário, cozinha, casas de banho.</li>
<li><strong>Cotas:</strong> medidas (comprimentos, larguras, distâncias).</li>
</ul>
<div class="ib">Exemplo de uma planta de piso: o perímetro exterior delimita o edifício; internamente, paredes divisórias separam a sala e o quarto (ambos na frente) da cozinha (ao centro-fundo), ligados por um corredor central.</div>
</div>
<div class="cb"><h2><i class="fas fa-scissors"></i> Corte</h2>
<p>O <strong>corte</strong> é a representação de um objeto (ou edifício) seccionado por um plano vertical. Mostra o interior, as alturas e a relação entre os espaços.</p>
<h3>Tipos de Cortes</h3>
<div class="tw"><table class="dt">
<tr><th>Tipo</th><th>Descrição</th></tr>
<tr><td>Corte Transversal</td><td>Corte perpendicular ao eixo principal.</td></tr>
<tr><td>Corte Longitudinal</td><td>Corte paralelo ao eixo principal.</td></tr>
</table></div>
<h3>Elementos de um Corte</h3>
<ul>
<li><strong>Linha de corte:</strong> indica onde o edifício foi cortado.</li>
<li><strong>Hachuras:</strong> indicam os materiais (betão, alvenaria, terra).</li>
<li><strong>Cotas:</strong> alturas (pé-direito, vãos).</li>
<li><strong>Elementos:</strong> lajes, vigas, pilares, escadas, telhados.</li>
</ul>
<div class="ib">Exemplo de um corte: de cima para baixo, o desenho empilha o telhado, a laje de cobertura, o volume interior (sala e quarto lado a lado) e a fundação na base.</div>
</div>
<div class="cb"><h2><i class="fas fa-building-columns"></i> Alçado</h2>
<p>O <strong>alçado</strong> é a representação da fachada do edifício, como se fosse visto de frente, de lado ou de trás.</p>
<h3>Tipos de Alçados</h3>
<div class="tw"><table class="dt">
<tr><th>Tipo</th><th>Descrição</th></tr>
<tr><td>Alçado Principal</td><td>Fachada principal (geralmente a entrada).</td></tr>
<tr><td>Alçado Lateral</td><td>Fachada lateral (esquerda ou direita).</td></tr>
<tr><td>Alçado Posterior</td><td>Fachada traseira.</td></tr>
</table></div>
<h3>Elementos de um Alçado</h3>
<ul>
<li><strong>Janelas:</strong> com indicação do tipo e dimensões.</li>
<li><strong>Portas:</strong> com indicação do tipo e dimensões.</li>
<li><strong>Acabamentos:</strong> texturas, cores, materiais.</li>
<li><strong>Cotas:</strong> alturas, dimensões dos vãos.</li>
</ul>
</div>
<div class="cb"><h2><i class="fas fa-object-group"></i> Relação entre Planta, Corte e Alçado</h2>
<p>Planta, corte e alçado são representações complementares. A planta mostra a organização horizontal; o corte mostra a organização vertical; o alçado mostra as fachadas.</p>
<p><strong>Exemplo:</strong> Para entender uma casa, precisamos: <strong>Planta:</strong> para saber a distribuição dos quartos. <strong>Corte:</strong> para saber o pé-direito e a relação entre pisos. <strong>Alçado:</strong> para saber a aparência exterior.</p>
</div>
<div class="cb"><h2><i class="fas fa-briefcase"></i> Exercício Prático: Kwanza Construtora, LDA</h2>
<p>A empresa está a analisar o projeto de uma moradia. O arquiteto forneceu a planta, o corte e o alçado.</p>
<p><strong>Perguntas:</strong> 1) O que permite ver a planta que o corte não mostra? 2) O que permite ver o corte que a planta não mostra? 3) Se a planta mostra a distribuição dos quartos, onde se vê a altura dos mesmos?</p>
<div class="hi"><strong>1. Planta vs. Corte:</strong> A planta mostra a distribuição horizontal (disposição dos espaços), que o corte não mostra.</div>
<div class="hi"><strong>2. Corte vs. Planta:</strong> O corte mostra as alturas (pé-direito, vãos), que a planta não mostra.</div>
<div class="hi"><strong>3. Altura dos quartos:</strong> A altura dos quartos é vista no corte (ou alçado), não na planta.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>As projecções ortogonais são a base do desenho técnico.</li>
<li>A <strong>planta</strong> mostra a distribuição horizontal.</li>
<li>O <strong>corte</strong> mostra a organização vertical.</li>
<li>O <strong>alçado</strong> mostra as fachadas.</li>
<li>Estes três tipos de representação são complementares.</li>
</ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> compreender o sistema de projecções ortogonais e a distinguir plantas, cortes e alçados.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Qual é a representação de um edifício visto de cima?</div>
<div class="qo" onclick="cq(this,false)">a) Alçado</div>
<div class="qo" onclick="cq(this,true)">b) Planta</div>
<div class="qo" onclick="cq(this,false)">c) Corte</div>
<div class="qo" onclick="cq(this,false)">d) Perspectiva</div>
<div class="qq">2. O que mostra um corte?</div>
<div class="qo" onclick="cq(this,false)">a) A distribuição horizontal</div>
<div class="qo" onclick="cq(this,true)">b) A organização vertical e o interior</div>
<div class="qo" onclick="cq(this,false)">c) A fachada</div>
<div class="qo" onclick="cq(this,false)">d) O telhado</div>
<div class="qq">3. Qual é o alçado que mostra a fachada principal?</div>
<div class="qo" onclick="cq(this,false)">a) Alçado Lateral</div>
<div class="qo" onclick="cq(this,true)">b) Alçado Principal</div>
<div class="qo" onclick="cq(this,false)">c) Alçado Posterior</div>
<div class="qo" onclick="cq(this,false)">d) Alçado de Corte</div>
<div class="qq">4. A altura dos quartos é vista em:</div>
<div class="qo" onclick="cq(this,false)">a) Planta</div>
<div class="qo" onclick="cq(this,true)">b) Corte</div>
<div class="qo" onclick="cq(this,false)">c) Alçado</div>
<div class="qo" onclick="cq(this,false)">d) Nenhum</div>
</div>`},

{t:'Simbologia Normalizada em Desenho de Arquitectura', html:`
<div class="cb"><h2><i class="fas fa-icons"></i> A Importância da Simbologia</h2>
<p>A simbologia é a "linguagem" do desenho técnico. Permite representar elementos complexos de forma simplificada e normalizada, garantindo que todos os profissionais interpretam o desenho da mesma forma.</p>
<p>Em Angola, a simbologia utilizada segue as normas ISO, NP e, em alguns casos, a NBR. É essencial que o técnico de edificações domine esta simbologia para ler e interpretar corretamente os desenhos.</p>
<div class="ib"><strong>Pare e pense:</strong> Se um desenho mostra um círculo com um "C" no interior, o que pode significar? Resposta: provavelmente, uma sanita ou um lavatório. Mas só sabendo a simbologia correta é que se pode ter a certeza.</div>
</div>
<div class="cb"><h2><i class="fas fa-door-open"></i> Símbolos de Portas e Janelas</h2>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Representação</th></tr>
<tr><td>Porta Simples</td><td>Linha que representa o batente e arco de abertura.</td></tr>
<tr><td>Porta de Correr</td><td>Duas folhas que deslizam.</td></tr>
<tr><td>Porta Dupla</td><td>Duas folhas com abertura central.</td></tr>
<tr><td>Janela Simples</td><td>Linha fina dentro da parede.</td></tr>
<tr><td>Janela de Correr</td><td>Indicação de deslizamento.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-toilet"></i> Símbolos de Equipamentos Sanitários</h2>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Representação</th></tr>
<tr><td>Lavatório</td><td>Círculo ou retângulo com a letra C no interior.</td></tr>
<tr><td>Sanita</td><td>Círculo ou retângulo com a letra C (ou B) no interior.</td></tr>
<tr><td>Bidete</td><td>Círculo ou retângulo com a letra B no interior.</td></tr>
<tr><td>Banheira</td><td>Retângulo grande com indicação.</td></tr>
<tr><td>Chuveiro</td><td>Círculo com a letra S no interior.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-kitchen-set"></i> Símbolos de Equipamentos de Cozinha</h2>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Representação</th></tr>
<tr><td>Fogão</td><td>Retângulo com a letra F no interior.</td></tr>
<tr><td>Frigorífico</td><td>Retângulo com a letra F (ou FR) no interior.</td></tr>
<tr><td>Máquina de Lavar</td><td>Retângulo com as letras ML no interior.</td></tr>
<tr><td>Lava-louças</td><td>Retângulo com as letras LL no interior.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-couch"></i> Símbolos de Mobiliário</h2>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Representação</th></tr>
<tr><td>Cama</td><td>Retângulo com indicação do travesseiro.</td></tr>
<tr><td>Sofá</td><td>Retângulo com divisões (assentos).</td></tr>
<tr><td>Secretária</td><td>Retângulo simples.</td></tr>
<tr><td>Estante</td><td>Retângulo com divisões internas.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-trowel-bricks"></i> Símbolos de Materiais (Hachuras)</h2>
<div class="tw"><table class="dt">
<tr><th>Material</th><th>Hachura</th></tr>
<tr><td>Betão</td><td>Pequenos triângulos ou círculos.</td></tr>
<tr><td>Betão Armado</td><td>Betão com círculos (ferragem).</td></tr>
<tr><td>Alvenaria</td><td>Linhas paralelas verticais ou horizontais.</td></tr>
<tr><td>Terra</td><td>Pontos ou linhas diagonais.</td></tr>
<tr><td>Madeira</td><td>Linhas curvas paralelas.</td></tr>
<tr><td>Água</td><td>Linhas onduladas.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-bolt"></i> Símbolos de Instalações</h2>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Representação</th></tr>
<tr><td>Interruptor</td><td>Letra X no circuito.</td></tr>
<tr><td>Tomada</td><td>Letra T no circuito.</td></tr>
<tr><td>Ponto de Luz</td><td>Círculo no circuito.</td></tr>
<tr><td>Tubagem de Água</td><td>Linha contínua.</td></tr>
<tr><td>Tubagem de Esgoto</td><td>Linha tracejada.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-briefcase"></i> Exercício Prático: Kwanza Construtora, LDA</h2>
<p>A empresa está a analisar uma planta de arquitectura. Na planta, estão representados os seguintes símbolos: um retângulo com um "L" no interior (no local da cozinha); um círculo com "S" no interior (numa parede); um retângulo com "ML" no interior (numa divisão); um círculo com "C" no interior (noutra divisão).</p>
<p><strong>Perguntas:</strong> 1) O que significa cada símbolo? 2) Que informações adicionais são necessárias para interpretar corretamente a planta? 3) O que deve fazer se encontrar um símbolo que não reconhece?</p>
<div class="hi"><strong>1. Significado dos símbolos:</strong> Retângulo com "L": lava-louças. Círculo com "S": sanita ou chuveiro (dependendo do contexto). Retângulo com "ML": máquina de lavar. Círculo com "C": lavatório (ou sanita).</div>
<div class="hi"><strong>2. Informações adicionais:</strong> É necessário consultar a legenda da planta, onde todos os símbolos estão explicados.</div>
<div class="hi"><strong>3. Símbolo não reconhecido:</strong> Consultar a legenda da planta, consultar o caderno de encargos, e perguntar ao projetista.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>A simbologia é a linguagem do desenho técnico.</li>
<li>Cada elemento construtivo tem um símbolo normalizado.</li>
<li>A legenda é essencial para interpretar os símbolos.</li>
<li>A simbologia facilita a leitura e a comunicação entre os intervenientes.</li>
</ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> identificar e interpretar os símbolos normalizados usados em desenho de arquitectura.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. O que significa um círculo com um "C" no interior numa planta?</div>
<div class="qo" onclick="cq(this,false)">a) Cama</div>
<div class="qo" onclick="cq(this,true)">b) Lavatório</div>
<div class="qo" onclick="cq(this,false)">c) Cozinha</div>
<div class="qo" onclick="cq(this,false)">d) Chuveiro</div>
<div class="qq">2. Que símbolo é usado para representar uma tomada eléctrica?</div>
<div class="qo" onclick="cq(this,false)">a) X</div>
<div class="qo" onclick="cq(this,true)">b) T</div>
<div class="qo" onclick="cq(this,false)">c) O</div>
<div class="qo" onclick="cq(this,false)">d) S</div>
<div class="qq">3. O que são hachuras?</div>
<div class="qo" onclick="cq(this,false)">a) Símbolos de mobiliário</div>
<div class="qo" onclick="cq(this,true)">b) Representações de materiais (ex: betão, alvenaria)</div>
<div class="qo" onclick="cq(this,false)">c) Símbolos de portas</div>
<div class="qo" onclick="cq(this,false)">d) Símbolos de instalações</div>
<div class="qq">4. Onde se encontra a explicação dos símbolos?</div>
<div class="qo" onclick="cq(this,false)">a) No rodapé</div>
<div class="qo" onclick="cq(this,true)">b) Na legenda (ou quadro de símbolos)</div>
<div class="qo" onclick="cq(this,false)">c) No título</div>
<div class="qo" onclick="cq(this,false)">d) No alçado</div>
</div>`},

{t:'Desenho de Plantas de Implantação e Localização', html:`
<div class="cb"><h2><i class="fas fa-map-location-dot"></i> A Importância das Plantas de Implantação e Localização</h2>
<p>As plantas de localização e de implantação são os primeiros desenhos de um projeto. Elas mostram a relação do edifício com o seu entorno: o terreno, as vias de acesso, os edifícios vizinhos, a orientação solar, etc.</p>
<p>Em Angola, onde muitos terrenos não têm uma topografia regular e o acesso pode ser difícil, uma boa planta de implantação é essencial para planear a construção.</p>
<ul>
<li><strong>Planta de Localização:</strong> mostra a posição do terreno em relação à região (bairro, cidade).</li>
<li><strong>Planta de Implantação:</strong> mostra a posição do edifício dentro do terreno.</li>
</ul>
<div class="ib"><strong>Pare e pense:</strong> Se o terreno for inclinado, como deve ser representado na planta de implantação? Resposta: com curvas de nível, para mostrar a topografia.</div>
</div>
<div class="cb"><h2><i class="fas fa-location-dot"></i> Planta de Localização</h2>
<p>A <strong>planta de localização</strong> (ou planta de situação) mostra a localização do terreno no contexto da cidade ou bairro. É uma planta de pequena escala (1:5.000, 1:2.000, 1:1.000).</p>
<h3>Elementos da Planta de Localização</h3>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Descrição</th></tr>
<tr><td>Ruas e arruamentos</td><td>Principais vias de acesso.</td></tr>
<tr><td>Terreno</td><td>Delimitado por uma linha grossa.</td></tr>
<tr><td>Edifícios vizinhos</td><td>Representados de forma simplificada.</td></tr>
<tr><td>Pontos de referência</td><td>Escolas, igrejas, hospitais, etc.</td></tr>
<tr><td>Rosa dos ventos</td><td>Orientação Norte.</td></tr>
</table></div>
<div class="ib">Exemplo: o terreno aparece delimitado por uma linha grossa dentro do quarteirão, com a Rua Principal a correr ao longo de um dos seus limites e os edifícios vizinhos representados de forma simplificada nos lotes adjacentes.</div>
</div>
<div class="cb"><h2><i class="fas fa-draw-polygon"></i> Planta de Implantação</h2>
<p>A <strong>planta de implantação</strong> mostra a posição do edifício no terreno, com todos os detalhes relevantes. É uma planta de maior escala (1:500, 1:200).</p>
<h3>Elementos da Planta de Implantação</h3>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Descrição</th></tr>
<tr><td>Terreno</td><td>Limites, dimensões, orientação.</td></tr>
<tr><td>Edifício</td><td>Implantação no terreno (distâncias aos limites).</td></tr>
<tr><td>Acessos</td><td>Entrada de veículos e peões.</td></tr>
<tr><td>Jardins e áreas verdes</td><td>Vegetação, árvores.</td></tr>
<tr><td>Curvas de nível</td><td>Se o terreno for inclinado.</td></tr>
<tr><td>Cotas</td><td>Níveis (altitudes) do terreno.</td></tr>
<tr><td>Orientação solar</td><td>Seta Norte.</td></tr>
</table></div>
<h3>Distâncias Mínimas (Afastamentos)</h3>
<ul>
<li><strong>Afastamento frontal:</strong> distância mínima à rua (geralmente 3 a 5 m).</li>
<li><strong>Afastamento lateral:</strong> distância mínima aos limites laterais (geralmente 1,5 a 3 m).</li>
<li><strong>Afastamento posterior:</strong> distância mínima ao fundo do terreno (geralmente 3 a 5 m).</li>
</ul>
<div class="ib">Exemplo: num terreno com 15,00 m de frente, o edifício fica centrado e recuado dos limites, com a rua a correr ao longo do limite frontal do lote.</div>
</div>
<div class="cb"><h2><i class="fas fa-mountain"></i> Curvas de Nível</h2>
<p>As <strong>curvas de nível</strong> são linhas que unem pontos com a mesma altitude. Representam a topografia do terreno.</p>
<ul>
<li><strong>Curvas de nível próximas:</strong> terreno inclinado.</li>
<li><strong>Curvas de nível afastadas:</strong> terreno plano.</li>
</ul>
<div class="ib">Exemplo: três curvas de nível concêntricas, identificadas com as cotas 100, 105 e 110, mostram um terreno que sobe progressivamente de um canto para o outro.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-ol"></i> Roteiro para Desenhar uma Planta de Implantação</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Desenhar os limites do terreno</h4><p>Com as respectivas cotas.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Desenhar o edifício</h4><p>Com as suas dimensões.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Indicar os afastamentos</h4><p>Distâncias aos limites.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Desenhar os acessos</h4><p>Entrada de veículos e peões.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Indicar a orientação</h4><p>Seta Norte.</p></div></div>
<div class="tli"><div class="tld">6</div><div class="tlc"><h4>Indicar as curvas de nível</h4><p>Se aplicável.</p></div></div>
<div class="tli"><div class="tld">7</div><div class="tlc"><h4>Adicionar a legenda</h4><p>Símbolos e materiais.</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-briefcase"></i> Exercício Prático: Kwanza Construtora, LDA</h2>
<p>A empresa vai construir uma moradia num terreno retangular de 20 m × 30 m. A moradia tem 12 m × 10 m. O afastamento frontal é de 5 m, o lateral de 3 m e o posterior de 4 m.</p>
<p><strong>Perguntas:</strong> 1) Desenhe a planta de implantação (esquema). 2) Calcule a área livre (jardim) do terreno. 3) Indique a distância do edifício à rua.</p>
<div class="hi"><strong>1. Esquema da planta de implantação:</strong> terreno de 20,00 m × 30,00 m com a rua a correr junto ao limite frontal; o edifício de 12 × 10 m fica recuado 5 m da rua, 3 m dos limites laterais e 4 m do limite posterior.</div>
<div class="hi"><strong>2. Área livre:</strong> Área do terreno = 20 × 30 = 600 m². Área do edifício = 12 × 10 = 120 m². Área livre = 600 – 120 = 480 m².</div>
<div class="hi"><strong>3. Distância à rua:</strong> Afastamento frontal = 5 m (conforme o projeto).</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>A planta de localização mostra o terreno no seu contexto.</li>
<li>A planta de implantação mostra o edifício no terreno.</li>
<li>Os afastamentos são distâncias mínimas aos limites do terreno.</li>
<li>As curvas de nível representam a topografia.</li>
<li>A orientação solar (Norte) é essencial.</li>
</ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> elaborar e interpretar plantas de localização e de implantação.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. O que mostra a planta de implantação?</div>
<div class="qo" onclick="cq(this,false)">a) A localização do edifício na cidade</div>
<div class="qo" onclick="cq(this,true)">b) A posição do edifício no terreno</div>
<div class="qo" onclick="cq(this,false)">c) O interior do edifício</div>
<div class="qo" onclick="cq(this,false)">d) As fachadas</div>
<div class="qq">2. O que são curvas de nível?</div>
<div class="qo" onclick="cq(this,true)">a) Linhas que representam a inclinação do terreno</div>
<div class="qo" onclick="cq(this,false)">b) Linhas que representam as paredes</div>
<div class="qo" onclick="cq(this,false)">c) Linhas que representam as portas</div>
<div class="qo" onclick="cq(this,false)">d) Linhas que representam o telhado</div>
<div class="qq">3. Qual é o afastamento frontal típico?</div>
<div class="qo" onclick="cq(this,false)">a) 1 m</div>
<div class="qo" onclick="cq(this,true)">b) 5 m</div>
<div class="qo" onclick="cq(this,false)">c) 10 m</div>
<div class="qo" onclick="cq(this,false)">d) 20 m</div>
<div class="qq">4. A seta Norte é essencial para:</div>
<div class="qo" onclick="cq(this,true)">a) Indicar a orientação do edifício</div>
<div class="qo" onclick="cq(this,false)">b) Indicar a entrada de veículos</div>
<div class="qo" onclick="cq(this,false)">c) Indicar a saída de emergência</div>
<div class="qo" onclick="cq(this,false)">d) Indicar a localização do jardim</div>
</div>`},

{t:'Desenho de Plantas de Arquitectura por Piso', html:`
<div class="cb"><h2><i class="fas fa-house"></i> A Importância da Planta de Piso</h2>
<p>A planta de piso é o desenho mais importante de um projeto de arquitectura. Mostra a distribuição dos espaços num determinado piso: paredes, portas, janelas, escadas, equipamentos, etc. É a base para a execução da obra e para a coordenação com as especialidades (estruturas, instalações).</p>
<p>Uma boa planta de piso é:</p>
<ul>
<li><strong>Funcional:</strong> os espaços estão organizados de forma lógica.</li>
<li><strong>Clara:</strong> fácil de ler e interpretar.</li>
<li><strong>Completa:</strong> inclui todas as informações necessárias.</li>
</ul>
<div class="ib"><strong>Pare e pense:</strong> Se uma cozinha estiver no extremo oposto da sala de jantar, isso é funcional? Resposta: não, porque a comida terá de ser transportada através de outros espaços. Uma cozinha próxima da sala de jantar é mais funcional.</div>
</div>
<div class="cb"><h2><i class="fas fa-layer-group"></i> Elementos de uma Planta de Piso</h2>
<h3>Paredes</h3>
<ul>
<li><strong>Paredes exteriores:</strong> espessura maior (geralmente 0,20 m a 0,30 m).</li>
<li><strong>Paredes interiores:</strong> espessura menor (geralmente 0,15 m a 0,20 m).</li>
<li><strong>Representação:</strong> linhas grossas.</li>
</ul>
<h3>Portas</h3>
<ul>
<li><strong>Portas interiores:</strong> 0,80 m a 1,00 m de largura.</li>
<li><strong>Portas exteriores:</strong> 1,00 m a 1,20 m de largura.</li>
<li><strong>Representação:</strong> arco de abertura (indica o movimento).</li>
<li><strong>Tipo:</strong> porta simples, porta de correr, porta dupla.</li>
</ul>
<h3>Janelas</h3>
<ul>
<li><strong>Janelas:</strong> abertura na parede para luz e ventilação.</li>
<li><strong>Representação:</strong> linhas finas no interior da parede.</li>
</ul>
<h3>Equipamentos</h3>
<ul>
<li><strong>Cozinha:</strong> fogão, lava-louças, frigorífico.</li>
<li><strong>Casas de banho:</strong> sanita, lavatório, bidete, banheira/chuveiro.</li>
<li><strong>Representação:</strong> simbologia normalizada.</li>
</ul>
<h3>Escadas</h3>
<p><strong>Escadas:</strong> representadas por degraus e setas (indicação de subida/descida).</p>
<h3>Cotas</h3>
<ul>
<li><strong>Cotas lineares:</strong> comprimentos e larguras.</li>
<li><strong>Cotas de nível:</strong> alturas (em cortes).</li>
</ul>
</div>
<div class="cb"><h2><i class="fas fa-sitemap"></i> Organização Funcional dos Espaços</h2>
<h3>Zonas da Casa</h3>
<ul>
<li><strong>Zona Social:</strong> sala de estar, sala de jantar, cozinha.</li>
<li><strong>Zona Privada:</strong> quartos, casas de banho.</li>
<li><strong>Zona de Serviço:</strong> lavandaria, despensa, garagem.</li>
</ul>
<h3>Circulação</h3>
<ul>
<li><strong>Fluxos:</strong> os percursos entre os espaços devem ser fluidos.</li>
<li><strong>Circulação vertical:</strong> escadas (se houver mais de um piso).</li>
</ul>
<div class="ib">Exemplo de organização de uma casa térrea: numa metade ficam a sala de estar e a cozinha; na outra, os quartos 1, 2 e a suíte (quarto 3); a casa de banho comum fica junto à cozinha.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-ol"></i> Passo a Passo para Desenhar uma Planta de Piso</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Definir a escala</h4><p>Ex: 1:50.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Desenhar as paredes exteriores</h4><p>Perímetro.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Desenhar as paredes interiores</h4><p>Divisórias.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Colocar as portas</h4><p>Com arco de abertura.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Colocar as janelas</h4><p></p></div></div>
<div class="tli"><div class="tld">6</div><div class="tlc"><h4>Colocar os equipamentos</h4><p>Cozinha, casas de banho.</p></div></div>
<div class="tli"><div class="tld">7</div><div class="tlc"><h4>Cotas</h4><p>Indicar as medidas.</p></div></div>
<div class="tli"><div class="tld">8</div><div class="tlc"><h4>Legenda</h4><p>Indicar a simbologia.</p></div></div>
<div class="tli"><div class="tld">9</div><div class="tlc"><h4>Título e escala</h4><p>No carimbo.</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-ruler-combined"></i> Cotagem da Planta</h2>
<p>As cotas devem ser colocadas <strong>fora</strong> do desenho (à direita e por baixo).</p>
<ul>
<li><strong>Cotas lineares:</strong> comprimentos e larguras.</li>
<li><strong>Cotas de referência:</strong> distâncias entre eixos ou paredes.</li>
</ul>
<div class="ib">Exemplo: um espaço rectangular cotado com 6,00 m no topo e 4,00 m no lado, as cotas colocadas fora do contorno do desenho.</div>
</div>
<div class="cb"><h2><i class="fas fa-briefcase"></i> Exercício Prático: Kwanza Construtora, LDA</h2>
<p>A empresa está a projetar uma moradia térrea com 3 quartos, sala, cozinha e 2 casas de banho.</p>
<p><strong>Perguntas:</strong> 1) Organize a moradia em zonas (social, privada, serviço). 2) Desenhe a planta de piso (esquema). 3) Indique as dimensões e as portas.</p>
<div class="hi"><strong>1. Organização:</strong> Zona Social: sala, cozinha. Zona Privada: 3 quartos, 2 casas de banho. Zona de Serviço: lavandaria (anexa à cozinha).</div>
<div class="hi"><strong>2. Esquema da planta:</strong> a moradia com 10,00 m de frente e 8,00 m de fundo distribui, num alinhamento, a sala e o quarto 1, e no outro, a cozinha e o quarto 2, com o W.C. e o quarto 3 (suíte) no fundo.</div>
<div class="hi"><strong>3. Dimensões e portas:</strong> Sala: 4,0 m × 4,0 m. Quartos: 3,0 m × 3,0 m. Portas: 0,80 m (interiores) e 1,00 m (exteriores). Cozinha: 4,0 m × 3,0 m.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>A planta de piso é o documento mais importante do projeto.</li>
<li>Deve ser funcional, clara e completa.</li>
<li>A organização dos espaços deve considerar as zonas social, privada e de serviço.</li>
<li>A cotagem e a simbologia são essenciais para a interpretação.</li>
</ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> elaborar e interpretar plantas de arquitectura por piso.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Qual é o elemento mais importante de uma planta de piso?</div>
<div class="qo" onclick="cq(this,false)">a) O telhado</div>
<div class="qo" onclick="cq(this,true)">b) A distribuição dos espaços</div>
<div class="qo" onclick="cq(this,false)">c) As cores</div>
<div class="qo" onclick="cq(this,false)">d) A legenda</div>
<div class="qq">2. O que indica o arco de abertura numa porta?</div>
<div class="qo" onclick="cq(this,true)">a) A direção de abertura</div>
<div class="qo" onclick="cq(this,false)">b) A altura da porta</div>
<div class="qo" onclick="cq(this,false)">c) O material da porta</div>
<div class="qo" onclick="cq(this,false)">d) A largura da porta</div>
<div class="qq">3. Onde devem ser colocadas as cotas?</div>
<div class="qo" onclick="cq(this,false)">a) Dentro do desenho</div>
<div class="qo" onclick="cq(this,true)">b) Fora do desenho (à direita e por baixo)</div>
<div class="qo" onclick="cq(this,false)">c) No centro</div>
<div class="qo" onclick="cq(this,false)">d) Em qualquer lugar</div>
<div class="qq">4. Uma cozinha deve estar próxima de:</div>
<div class="qo" onclick="cq(this,false)">a) Da garagem</div>
<div class="qo" onclick="cq(this,true)">b) Da sala de jantar</div>
<div class="qo" onclick="cq(this,false)">c) Dos quartos</div>
<div class="qo" onclick="cq(this,false)">d) Do telhado</div>
</div>`},

{t:'Desenho de Cortes Construtivos e Pormenores', html:`
<div class="cb"><h2><i class="fas fa-scissors"></i> A Importância dos Cortes e Pormenores</h2>
<p>Enquanto a planta mostra a organização horizontal de um edifício, o <strong>corte</strong> mostra a sua organização vertical. É o desenho que revela o "interior" da construção: a altura dos pisos, a espessura das lajes, a composição das paredes, a estrutura da cobertura, e a relação entre todos estes elementos.</p>
<p>Os <strong>pormenores construtivos</strong> (ou detalhes) são ampliações de partes específicas do corte, mostrando com grande detalhe como os diferentes materiais e componentes se articulam. São essenciais para garantir a correta execução da obra, especialmente em zonas críticas como:</p>
<ul>
<li><strong>Ligação entre paredes e lajes.</strong></li>
<li><strong>Encontro entre cobertura e paredes (platibandas, rufos).</strong></li>
<li><strong>Juntas de dilatação.</strong></li>
<li><strong>Zonas de isolamento térmico e impermeabilização.</strong></li>
</ul>
<p>Em Angola, onde muitos construtores não têm formação técnica aprofundada, os pormenores construtivos são fundamentais para evitar erros de execução que podem comprometer a durabilidade e a segurança da obra.</p>
<div class="ib"><strong>Pare e pense:</strong> Se um desenho mostra apenas a parede e a laje, mas não mostra como a parede se apoia na laje (ex: com ou sem viga de betão), o que pode acontecer? Resposta: o construtor pode executar a ligação de forma incorreta, comprometendo a estabilidade da estrutura.</div>
</div>
<div class="cb"><h2><i class="fas fa-cubes-stacked"></i> O Que Mostra um Corte?</h2>
<p>Um corte mostra o edifício seccionado por um plano vertical imaginário. Este plano pode ser:</p>
<ul>
<li><strong>Corte Transversal:</strong> perpendicular ao eixo principal do edifício.</li>
<li><strong>Corte Longitudinal:</strong> paralelo ao eixo principal do edifício.</li>
</ul>
<h3>Elementos Representados num Corte</h3>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Descrição</th></tr>
<tr><td>Fundações</td><td>Sapatas, estacas, vigas de fundação.</td></tr>
<tr><td>Pilares</td><td>Secção e posição.</td></tr>
<tr><td>Vigas</td><td>Secção e posição.</td></tr>
<tr><td>Lajes</td><td>Espessura, armadura (se aplicável).</td></tr>
<tr><td>Paredes</td><td>Espessura, materiais.</td></tr>
<tr><td>Cobertura</td><td>Telhado, laje de cobertura, isolamento.</td></tr>
<tr><td>Pisos</td><td>Revestimentos, contrapiso.</td></tr>
<tr><td>Vãos</td><td>Portas, janelas.</td></tr>
<tr><td>Escadas</td><td>Degraus, patamares.</td></tr>
<tr><td>Cotas de nível</td><td>Alturas (ex: 0,00 m; 3,00 m; 6,00 m).</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-list-ol"></i> Como Elaborar um Corte</h2>
<h3>Passos para Desenhar um Corte</h3>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Definir a linha de corte</h4><p>Na planta, indicar onde o corte será feito (linha de corte com setas).</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Desenhar o perfil do terreno</h4><p>A base do corte.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Desenhar as fundações</h4><p>A partir do terreno.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Desenhar os elementos estruturais</h4><p>Pilares, vigas, lajes.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Desenhar as paredes</h4><p>Com as suas espessuras.</p></div></div>
<div class="tli"><div class="tld">6</div><div class="tlc"><h4>Desenhar a cobertura</h4><p>Telhado ou laje de cobertura.</p></div></div>
<div class="tli"><div class="tld">7</div><div class="tlc"><h4>Indicar os vãos</h4><p>Portas, janelas.</p></div></div>
<div class="tli"><div class="tld">8</div><div class="tlc"><h4>Adicionar as cotas de nível</h4><p>Alturas.</p></div></div>
<div class="tli"><div class="tld">9</div><div class="tlc"><h4>Adicionar hachuras</h4><p>Para identificar materiais.</p></div></div>
<div class="tli"><div class="tld">10</div><div class="tlc"><h4>Adicionar a legenda e a escala</h4><p></p></div></div>
</div>
<div class="ib">Exemplo de corte de uma moradia térrea: de cima para baixo, o desenho mostra o telhado, a laje, o volume interior com a sala e o quarto lado a lado, a laje do térreo e a fundação na base.</div>
</div>
<div class="cb"><h2><i class="fas fa-magnifying-glass"></i> Pormenores Construtivos</h2>
<p>Os pormenores construtivos são ampliações (normalmente na escala 1:5, 1:10 ou 1:20) de partes específicas do corte.</p>
<h3>Exemplo de Pormenor – Ligação Parede-Laje</h3>
<p><strong>Descrição:</strong> Como a parede se apoia na laje? Há uma viga de betão? A parede é de alvenaria ou de betão?</p>
<div class="ib">O pormenor amplia, de cima para baixo, a laje superior (com a viga de betão embutida), a parede de alvenaria que se apoia nela, e a laje do térreo por baixo — evidenciando exactamente como cada elemento se liga ao seguinte.</div>
</div>
<div class="cb"><h2><i class="fas fa-fill-drip"></i> Hachuras em Cortes e Pormenores</h2>
<p>As hachuras identificam os materiais:</p>
<div class="tw"><table class="dt">
<tr><th>Material</th><th>Hachura</th></tr>
<tr><td>Betão</td><td>Pequenos triângulos ou círculos.</td></tr>
<tr><td>Betão Armado</td><td>Betão com círculos (aço).</td></tr>
<tr><td>Alvenaria</td><td>Linhas paralelas.</td></tr>
<tr><td>Terra</td><td>Pontos.</td></tr>
<tr><td>Madeira</td><td>Linhas curvas paralelas.</td></tr>
<tr><td>Aço</td><td>Cruz diagonal.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-briefcase"></i> Exercício Prático: Kwanza Construtora, LDA</h2>
<p>A empresa está a analisar um corte de uma moradia de 2 pisos. O corte mostra: fundação: sapata de 0,80 m × 0,80 m; piso térreo: 3,00 m de altura; piso superior: 3,00 m de altura; lajes: 0,20 m de espessura; cobertura: telhado de duas águas.</p>
<p><strong>Perguntas:</strong> 1) Qual é a altura total do edifício (da fundação ao cume do telhado)? 2) Que elementos devem ser representados no pormenor da ligação parede-laje? 3) Se a parede for de betão armado, como deve ser representada a hachura?</p>
<div class="hi"><strong>1. Altura total:</strong> Sapata: 0,40 m (estimado). Térreo: 3,00 m. Laje: 0,20 m. Superior: 3,00 m. Laje de cobertura: 0,20 m. Telhado: 1,50 m (estimado). Total: ≈ 8,30 m.</div>
<div class="hi"><strong>2. Pormenor parede-laje:</strong> A parede (alvenaria ou betão), a laje (betão armado), a viga de betão (se existir), o isolamento (se aplicável) e as armaduras (se aplicável).</div>
<div class="hi"><strong>3. Hachura de betão armado:</strong> Betão com círculos (que representam as armaduras de aço).</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>O <strong>corte</strong> mostra a organização vertical do edifício.</li>
<li>Os <strong>pormenores</strong> são ampliações de partes específicas.</li>
<li>As <strong>hachuras</strong> identificam os materiais.</li>
<li>Os cortes e pormenores são essenciais para a correta execução da obra.</li>
</ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> elaborar e interpretar cortes construtivos e pormenores.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. O que mostra um corte construtivo?</div>
<div class="qo" onclick="cq(this,false)">a) A distribuição horizontal dos espaços</div>
<div class="qo" onclick="cq(this,true)">b) A organização vertical do edifício</div>
<div class="qo" onclick="cq(this,false)">c) A fachada do edifício</div>
<div class="qo" onclick="cq(this,false)">d) A localização do terreno</div>
<div class="qq">2. Qual é a escala típica para pormenores construtivos?</div>
<div class="qo" onclick="cq(this,false)">a) 1:100</div>
<div class="qo" onclick="cq(this,false)">b) 1:50</div>
<div class="qo" onclick="cq(this,true)">c) 1:10</div>
<div class="qo" onclick="cq(this,false)">d) 1:500</div>
<div class="qq">3. O que representam as hachuras?</div>
<div class="qo" onclick="cq(this,false)">a) As portas</div>
<div class="qo" onclick="cq(this,true)">b) Os materiais</div>
<div class="qo" onclick="cq(this,false)">c) As janelas</div>
<div class="qo" onclick="cq(this,false)">d) As cotas</div>
<div class="qq">4. Uma parede de betão armado deve ser hachurada com:</div>
<div class="qo" onclick="cq(this,false)">a) Linhas paralelas</div>
<div class="qo" onclick="cq(this,false)">b) Pontos</div>
<div class="qo" onclick="cq(this,true)">c) Betão com círculos (armaduras)</div>
<div class="qo" onclick="cq(this,false)">d) Linhas onduladas</div>
</div>`},

{t:'Desenho de Alçados e Representação de Fachadas', html:`
<div class="cb"><h2><i class="fas fa-building"></i> A Importância dos Alçados</h2>
<p>O <strong>alçado</strong> (ou fachada) é a representação da face exterior do edifício. É o desenho que mostra como o edifício será visto a partir do exterior. Os alçados são essenciais para:</p>
<ul>
<li><strong>Compreender a imagem do edifício:</strong> a sua estética, proporções e relação com o entorno.</li>
<li><strong>Verificar a conformidade com o projeto:</strong> as aberturas (janelas, portas) e os acabamentos.</li>
<li><strong>Comunicar com o cliente:</strong> os alçados são a "imagem" do projeto.</li>
<li><strong>Obter licenciamento:</strong> as câmaras municipais exigem alçados para aprovar projetos.</li>
</ul>
<p>Em Angola, a qualidade dos alçados é muitas vezes descurada, o que leva a edifícios com fachadas desproporcionais ou pouco harmoniosas. Um bom alçado é essencial para a valorização do imóvel.</p>
<div class="ib"><strong>Pare e pense:</strong> Se o alçado mostra janelas de dimensões diferentes, o que pode acontecer? Resposta: o edifício pode ter uma aparência desequilibrada e pouco estética.</div>
</div>
<div class="cb"><h2><i class="fas fa-building-columns"></i> Tipos de Alçados</h2>
<div class="tw"><table class="dt">
<tr><th>Tipo</th><th>Descrição</th></tr>
<tr><td>Alçado Principal</td><td>Fachada principal (geralmente a que tem a entrada).</td></tr>
<tr><td>Alçado Lateral</td><td>Fachada lateral (esquerda ou direita).</td></tr>
<tr><td>Alçado Posterior</td><td>Fachada traseira.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-window-restore"></i> Elementos de um Alçado</h2>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Descrição</th></tr>
<tr><td>Paredes</td><td>A superfície da fachada.</td></tr>
<tr><td>Janelas</td><td>Aberturas, com indicação do tipo e dimensões.</td></tr>
<tr><td>Portas</td><td>Aberturas, com indicação do tipo e dimensões.</td></tr>
<tr><td>Cobertura</td><td>Telhado, platibanda, beiral.</td></tr>
<tr><td>Acabamentos</td><td>Texturas, cores, materiais (ex: reboco pintado, pedra, madeira).</td></tr>
<tr><td>Elementos decorativos</td><td>Cornijas, molduras, varandas, guardas.</td></tr>
<tr><td>Cotas</td><td>Alturas, dimensões dos vãos.</td></tr>
<tr><td>Nível do terreno</td><td>A relação com o solo.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-list-ol"></i> Como Elaborar um Alçado</h2>
<h3>Passos para Desenhar um Alçado</h3>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Partir da planta e do corte</h4><p>O alçado é uma projeção do edifício sobre um plano vertical.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Definir a escala</h4><p>Normalmente a mesma da planta e do corte (ex: 1:50).</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Desenhar o perfil do edifício</h4><p>A silhueta.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Marcar as aberturas</h4><p>Janelas, portas, portões.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Adicionar os elementos de cobertura</h4><p>Telhado, platibanda.</p></div></div>
<div class="tli"><div class="tld">6</div><div class="tlc"><h4>Adicionar os acabamentos</h4><p>Texturas, cores, materiais.</p></div></div>
<div class="tli"><div class="tld">7</div><div class="tlc"><h4>Adicionar as cotas</h4><p>Alturas e dimensões.</p></div></div>
<div class="tli"><div class="tld">8</div><div class="tlc"><h4>Adicionar a legenda e a escala</h4><p></p></div></div>
</div>
<div class="ib">Exemplo de alçado principal: a fachada mostra duas janelas na fila superior e, na fila inferior, a porta principal e mais uma janela, todas alinhadas e com dimensões consistentes.</div>
</div>
<div class="cb"><h2><i class="fas fa-swatchbook"></i> Representação de Acabamentos</h2>
<p>Os acabamentos são representados por <strong>texturas e hachuras</strong>:</p>
<div class="tw"><table class="dt">
<tr><th>Acabamento</th><th>Representação</th></tr>
<tr><td>Reboco pintado</td><td>Superfície lisa, sem textura.</td></tr>
<tr><td>Pedra</td><td>Pequenos círculos ou pontos.</td></tr>
<tr><td>Madeira</td><td>Linhas verticais ou horizontais.</td></tr>
<tr><td>Cerâmica (azulejo)</td><td>Linhas diagonais.</td></tr>
<tr><td>Telha</td><td>Linhas paralelas inclinadas.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-ruler-vertical"></i> Cotagem em Alçados</h2>
<p>As cotas nos alçados indicam:</p>
<ul>
<li><strong>Altura total do edifício.</strong></li>
<li><strong>Altura dos pisos (pé-direito).</strong></li>
<li><strong>Altura e largura das janelas e portas.</strong></li>
<li><strong>Distâncias entre elementos.</strong></li>
</ul>
<div class="ib">Exemplo: com a altura total de 9,00 m cotada no topo, o alçado indica as janelas com 1,20 × 1,50 m e a porta com 1,00 × 2,20 m.</div>
</div>
<div class="cb"><h2><i class="fas fa-briefcase"></i> Exercício Prático: Kwanza Construtora, LDA</h2>
<p>A empresa está a elaborar o alçado principal de uma moradia. A moradia tem: 2 pisos; 4 janelas (1,20 m × 1,50 m) por piso; 1 porta principal (1,20 m × 2,20 m); 1 porta de garagem (2,50 m × 2,20 m); pé-direito: 3,00 m; telhado: 1,50 m de altura (média).</p>
<p><strong>Perguntas:</strong> 1) Desenhe o alçado principal (esquema). 2) Indique as cotas. 3) Se o alçado for pintado com uma cor clara, como deve ser representado?</p>
<div class="hi"><strong>1. Esquema do alçado principal:</strong> a fachada, com 9,00 m de altura total, mostra duas janelas de 1,20 × 1,50 m na fila superior e, na fila inferior, a porta de 1,20 × 2,20 m e mais uma janela de 1,20 × 1,50 m.</div>
<div class="hi"><strong>2. Cotas:</strong> Altura total: 9,00 m (3 + 3 + 1,5 + 1,5). Pé-direito: 3,00 m. Janelas: 1,20 m × 1,50 m. Porta: 1,20 m × 2,20 m.</div>
<div class="hi"><strong>3. Representação da cor clara:</strong> Superfície lisa, sem textura, com indicação da cor (ex: "Tinta branca") na legenda.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>O alçado mostra a fachada do edifício.</li>
<li>Deve incluir todos os elementos: paredes, janelas, portas, cobertura, acabamentos.</li>
<li>As cotas nos alçados indicam alturas e dimensões.</li>
<li>Os acabamentos são representados por texturas e hachuras.</li>
</ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> elaborar e interpretar alçados e fachadas.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. O que mostra o alçado principal?</div>
<div class="qo" onclick="cq(this,true)">a) A fachada principal do edifício</div>
<div class="qo" onclick="cq(this,false)">b) A distribuição interna dos espaços</div>
<div class="qo" onclick="cq(this,false)">c) A cobertura do edifício</div>
<div class="qo" onclick="cq(this,false)">d) As fundações</div>
<div class="qq">2. Qual é a altura de uma porta interior típica?</div>
<div class="qo" onclick="cq(this,false)">a) 1,80 m</div>
<div class="qo" onclick="cq(this,false)">b) 2,00 m</div>
<div class="qo" onclick="cq(this,true)">c) 2,20 m</div>
<div class="qo" onclick="cq(this,false)">d) 2,50 m</div>
<div class="qq">3. O que representam as texturas em um alçado?</div>
<div class="qo" onclick="cq(this,false)">a) As cotas</div>
<div class="qo" onclick="cq(this,true)">b) Os acabamentos</div>
<div class="qo" onclick="cq(this,false)">c) As portas</div>
<div class="qo" onclick="cq(this,false)">d) As janelas</div>
<div class="qq">4. Um pé-direito de 3,00 m significa:</div>
<div class="qo" onclick="cq(this,false)">a) A altura do telhado</div>
<div class="qo" onclick="cq(this,true)">b) A altura entre pisos</div>
<div class="qo" onclick="cq(this,false)">c) A largura da porta</div>
<div class="qo" onclick="cq(this,false)">d) A profundidade da fundação</div>
</div>`},

{t:'Desenho de Estruturas: Fundações, Lajes, Vigas e Pilares', html:`
<div class="cb"><h2><i class="fas fa-industry"></i> A Importância do Desenho de Estruturas</h2>
<p>O desenho de estruturas é o documento que define a "espinha dorsal" do edifício. Enquanto a arquitectura define a forma e a função, a estrutura define a resistência e a estabilidade. Os desenhos de estruturas são elaborados pelo engenheiro civil e devem ser coordenados com os desenhos de arquitectura.</p>
<p>Em Angola, a falta de coordenação entre arquitectura e estruturas é uma causa comum de problemas em obra. Uma viga que não está prevista na planta arquitectónica pode "aparecer" na estrutura, cortando um vão de porta. Um pilar pode estar colocado no meio de uma sala, comprometendo a sua utilização.</p>
<div class="ib"><strong>Pare e pense:</strong> Se a planta arquitectónica mostra uma sala de 4 m × 5 m, mas a estrutura mostra um pilar no centro da sala, o que acontece? Resposta: o espaço fica condicionado, e a solução é alterar o projeto, com custos e atrasos.</div>
</div>
<div class="cb"><h2><i class="fas fa-cubes"></i> Elementos Estruturais Básicos</h2>
<h3>Fundações</h3>
<p>As fundações são os elementos que transmitem as cargas da estrutura para o solo.</p>
<div class="tw"><table class="dt">
<tr><th>Tipo de Fundação</th><th>Descrição</th><th>Representação</th></tr>
<tr><td>Sapata Isolada</td><td>Base de betão armado que suporta um pilar.</td><td>Planta: quadrado/retângulo; Corte: trapézio.</td></tr>
<tr><td>Sapata Contínua</td><td>Base de betão armado que suporta uma parede.</td><td>Planta: faixa contínua; Corte: trapézio.</td></tr>
<tr><td>Estacas</td><td>Elementos profundos que transmitem a carga a camadas mais resistentes.</td><td>Planta: círculos; Corte: linha vertical.</td></tr>
<tr><td>Viga de Fundação</td><td>Viga que liga as sapatas entre si.</td><td>Planta: linha; Corte: retângulo.</td></tr>
</table></div>
<h3>Pilares</h3>
<p>Os pilares são elementos verticais que suportam as cargas das lajes e das vigas.</p>
<ul>
<li><strong>Representação:</strong> quadrado, retângulo ou círculo.</li>
<li><strong>Cotas:</strong> secção (ex: 0,30 m × 0,30 m).</li>
</ul>
<h3>Vigas</h3>
<p>As vigas são elementos horizontais que suportam as lajes e transmitem as cargas aos pilares.</p>
<ul>
<li><strong>Representação:</strong> linhas grossas (planta).</li>
<li><strong>Cotas:</strong> secção (ex: 0,20 m × 0,50 m).</li>
</ul>
<h3>Lajes</h3>
<p>As lajes são elementos horizontais que constituem os pisos e as coberturas.</p>
<ul>
<li><strong>Representação:</strong> superfície (planta), com indicação da espessura.</li>
<li><strong>Cotas:</strong> espessura (ex: 0,15 m).</li>
</ul>
</div>
<div class="cb"><h2><i class="fas fa-anchor"></i> Desenho de Estruturas – Planta de Fundações</h2>
<p>A <strong>planta de fundações</strong> mostra a localização e as dimensões das sapatas, estacas e vigas de fundação.</p>
<div class="ib">Exemplo: quatro sapatas de 1,20 × 1,20 m, dispostas em duas filas, ligadas entre si por uma viga de fundação contínua.</div>
</div>
<div class="cb"><h2><i class="fas fa-grip"></i> Desenho de Estruturas – Planta de Piso (Lajes, Vigas, Pilares)</h2>
<p>A <strong>planta de piso</strong> mostra a localização dos pilares, a distribuição das vigas e a espessura das lajes.</p>
<div class="ib">Exemplo: uma malha de pilares (identificados com "P") organizada em três filas de três, ligados entre si por vigas nas duas direções, formando uma grelha regular.</div>
</div>
<div class="cb"><h2><i class="fas fa-people-arrows"></i> Coordenação entre Arquitectura e Estruturas</h2>
<p>A coordenação entre a arquitectura e as estruturas é essencial para evitar conflitos.</p>
<div class="tw"><table class="dt">
<tr><th>Verificação</th><th>O que verificar</th></tr>
<tr><td>Pilares</td><td>Não devem estar no meio de espaços importantes.</td></tr>
<tr><td>Vigas</td><td>Não devem cortar vãos de portas ou janelas.</td></tr>
<tr><td>Lajes</td><td>A espessura deve ser compatível com as cotas de nível.</td></tr>
<tr><td>Aberturas</td><td>Os vãos (portas, janelas) devem estar alinhados com a estrutura.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-briefcase"></i> Exercício Prático: Kwanza Construtora, LDA</h2>
<p>A empresa está a analisar a planta de estrutura de um edifício de 2 pisos. A planta mostra: pilares de 0,30 m × 0,30 m, espaçados de 4,00 m em 4,00 m; vigas de 0,20 m × 0,50 m; laje com 0,15 m de espessura.</p>
<p><strong>Perguntas:</strong> 1) Qual é a distância entre os pilares? 2) Qual é a secção das vigas? 3) Se a laje tiver 0,15 m de espessura, qual é a altura disponível entre o teto e o piso superior?</p>
<div class="hi"><strong>1. Distância entre pilares:</strong> 4,00 m (conforme a planta).</div>
<div class="hi"><strong>2. Secção das vigas:</strong> 0,20 m × 0,50 m (largura × altura).</div>
<div class="hi"><strong>3. Altura disponível:</strong> Se o pé-direito é 3,00 m, e a laje tem 0,15 m, a altura disponível é 3,00 – 0,15 = 2,85 m.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Resumo</h2>
<ul>
<li>O desenho de estruturas define a resistência e a estabilidade do edifício.</li>
<li>Os principais elementos são: fundações, pilares, vigas e lajes.</li>
<li>A coordenação com a arquitectura é essencial para evitar conflitos.</li>
<li>As cotas e as secções devem ser claramente indicadas.</li>
</ul>
<div class="hi"><strong>Hoje você aprendeu a:</strong> elaborar e interpretar desenhos de estruturas e a coordená-los com a arquitectura.</div>
</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">1. Qual é o elemento estrutural que transmite as cargas ao solo?</div>
<div class="qo" onclick="cq(this,false)">a) Pilar</div>
<div class="qo" onclick="cq(this,false)">b) Viga</div>
<div class="qo" onclick="cq(this,true)">c) Fundação</div>
<div class="qo" onclick="cq(this,false)">d) Laje</div>
<div class="qq">2. Qual é a secção típica de um pilar?</div>
<div class="qo" onclick="cq(this,false)">a) 0,10 m × 0,10 m</div>
<div class="qo" onclick="cq(this,true)">b) 0,30 m × 0,30 m</div>
<div class="qo" onclick="cq(this,false)">c) 1,00 m × 1,00 m</div>
<div class="qo" onclick="cq(this,false)">d) 0,50 m × 0,50 m</div>
<div class="qq">3. O que faz uma viga?</div>
<div class="qo" onclick="cq(this,true)">a) Suporta as lajes e transmite cargas aos pilares</div>
<div class="qo" onclick="cq(this,false)">b) Transmite cargas ao solo</div>
<div class="qo" onclick="cq(this,false)">c) Suporta as paredes exteriores</div>
<div class="qo" onclick="cq(this,false)">d) Forma o telhado</div>
<div class="qq">4. A espessura típica de uma laje é:</div>
<div class="qo" onclick="cq(this,false)">a) 0,05 m</div>
<div class="qo" onclick="cq(this,true)">b) 0,15 m</div>
<div class="qo" onclick="cq(this,false)">c) 0,50 m</div>
<div class="qo" onclick="cq(this,false)">d) 1,00 m</div>
</div>`},

{t:'Desenho de Redes Técnicas: Águas, Esgotos e Electricidade em Planta', html:`
<div class="cb"><h2><i class="fas fa-droplet"></i> A Importância das Redes Técnicas</h2>
<p>Um edifício não é apenas paredes e telhado. É também um sistema complexo de tubagens, cabos e equipamentos que garantem o seu funcionamento: água, esgotos, electricidade, telecomunicações, gás, etc. As redes técnicas são essenciais para o conforto, a segurança e a habitabilidade do edifício.</p>
<p>Em Angola, as instalações técnicas são muitas vezes executadas de forma improvisada, sem projeto adequado. Isto leva a problemas como:</p>
<ul>
<li><strong>Falta de água:</strong> pressão insuficiente ou tubagens mal dimensionadas.</li>
<li><strong>Entupimentos:</strong> esgotos mal projetados.</li>
<li><strong>Sobrecarga eléctrica:</strong> disjuntores a disparar ou cabos sobreaquecidos.</li>
<li><strong>Conflitos:</strong> tubagens e cabos que "chocam" com vigas ou pilares.</li>
</ul>
<div class="ib"><strong>Pare e pense:</strong> Se a tubagem de água passar por cima de uma viga, sem previsão de abertura, o que acontece? Resposta: a tubagem pode ser danificada durante a execução, ou a viga pode ter de ser entalhada, comprometendo a sua resistência.</div>
</div>
<div class="cb"><h2><i class="fas fa-toolbox"></i> Especialidades Técnicas</h2>
<div class="tw"><table class="dt">
<tr><th>Especialidade</th><th>Descrição</th></tr>
<tr><td>Instalações Hidráulicas</td><td>Água fria, água quente, abastecimento de incêndio.</td></tr>
<tr><td>Instalações Sanitárias</td><td>Esgotos domésticos, drenagem pluvial.</td></tr>
<tr><td>Instalações Eléctricas</td><td>Iluminação, tomadas, quadros, sistemas de segurança.</td></tr>
<tr><td>Instalações de Telecomunicações</td><td>Rede de dados, telefone, TV, intercom.</td></tr>
<tr><td>Gás</td><td>Canalização de gás (cozinha, aquecimento).</td></tr>
<tr><td>AVAC</td><td>Climatização e ventilação.</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-faucet-drip"></i> Desenho de Instalações Hidráulicas</h2>
<h3>Elementos</h3>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Descrição</th></tr>
<tr><td>Tubagem de água fria</td><td>Linha contínua (azul ou preta).</td></tr>
<tr><td>Tubagem de água quente</td><td>Linha contínua (vermelha).</td></tr>
<tr><td>Tubagem de esgoto</td><td>Linha tracejada.</td></tr>
<tr><td>Tubagem de drenagem pluvial</td><td>Linha tracejada (com setas).</td></tr>
<tr><td>Pontos de água</td><td>Lavatório, sanita, banheira, chuveiro.</td></tr>
<tr><td>Válvulas</td><td>Válvulas de corte, válvulas de retenção.</td></tr>
<tr><td>Bombas</td><td>Bombas de pressurização.</td></tr>
<tr><td>Reservatórios</td><td>Reservatórios de água (elevado e subterrâneo).</td></tr>
</table></div>
<h3>Simbologia</h3>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Símbolo</th></tr>
<tr><td>Tubagem água fria</td><td>Linha contínua.</td></tr>

/* ───────── ÁREA DO ALUNO ───────── */
function renderAluno(){
  if(!ST.logado){
    app.innerHTML = `
    <div class="login-wrap"><div class="login-box">
      <div class="login-icon"><i class="fas fa-trowel-bricks"></i></div>
      <h2>Área do Aluno</h2>
      <p>Entre com as suas credenciais para aceder à plataforma de estudos.</p>
      <div class="field"><label>E-mail</label><input type="email" id="li-mail" placeholder="seuemail@exemplo.com"></div>
      <div class="field"><label>Senha</label><input type="password" id="li-pass" placeholder="••••••••"></div>
      <button class="btn-login" onclick="doLogin()"><i class="fas fa-right-to-bracket"></i> Entrar na plataforma</button>
      <div class="login-alt">Ainda não é aluno? <a onclick="nav('home')">Ver mais sobre o curso</a></div>
      <div class="demo-hint"><i class="fas fa-circle-info"></i> Entrada liberada nesta fase. O seu progresso fica guardado neste dispositivo.</div>
    </div></div>`;
    const inp=document.getElementById('li-pass');
    if(inp) inp.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
    window.scrollTo(0,0); return;
  }

  const done = ST.desbloqueado-1;
  const pct = COURSE.length ? Math.round(done/COURSE.length*100) : 0;
  let lista='';
  if(COURSE.length){
    lista += `<div class="phase-head">Módulos disponíveis</div><div class="mod-list">`;
    COURSE.forEach(m=>{
      const st = m.n<ST.desbloqueado?'done':(m.n===ST.desbloqueado?'unlocked':'locked');
      const ic = st==='done'?'<i class="fas fa-check"></i>':(st==='locked'?'<i class="fas fa-lock"></i>':m.n);
      const bd = st==='done'?'Concluído':(st==='unlocked'?'Continuar →':'Bloqueado');
      const nota = ST.notas[m.n]?` · ${ST.notas[m.n]}%`:'';
      const click = st!=='locked'?`onclick="nav('modulo-${m.n}')"`:'';
      lista += `<div class="mod-card ${st}" ${click}>
        <div class="mod-ic ${st}">${ic}</div>
        <div class="mod-info"><h4>Módulo ${m.n} — ${m.titulo}</h4>
        <span>${m.aulas.length} aulas${nota}</span></div>
        <span class="mod-badge ${st}">${bd}</span></div>`;
    });
    lista += `</div>`;
  }
  lista += `<div class="phase-head">Currículo completo — em preparação</div><div class="mod-list">`;
  MODULOS_FUTUROS.forEach(m=>{
    lista += `<div class="mod-card locked">
      <div class="mod-ic locked"><i class="fas fa-lock"></i></div>
      <div class="mod-info"><h4>Módulo ${m.n} — ${m.titulo}</h4>
      <span>${m.aulas} aulas planeadas</span></div>
      <span class="mod-badge locked">Em preparação</span></div>`;
  });
  lista += `</div>`;

  app.innerHTML = `
  <div class="dash-header"><div class="container dash-in">
    <div><h1>Olá, ${ST.nome}! 👋</h1><p>Curso de Técnico em Edificações</p></div>
    <button class="btn-logout" onclick="doLogout()"><i class="fas fa-right-from-bracket"></i> Sair</button>
  </div></div>
  <div class="dash-body"><div class="container">
    <div class="progress-card">
      <div class="pc-head"><h3><i class="fas fa-chart-line" style="color:var(--secondary)"></i> O seu progresso</h3><span class="pct">${pct}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-stats">
        <div><b>${done}</b> de <b>${COURSE.length}</b> módulos disponíveis concluídos</div>
        <div><b>${TOTAL_AULAS}</b> aulas disponíveis agora (<b>${TOTAL_HORAS}h</b>) · <b>${TOTAL_AULAS_PLANEADAS}</b> no currículo completo</div>
        <div><b>70%</b> mínimo por exame</div>
      </div>
    </div>
    ${lista}
  </div></div>`;
  window.scrollTo(0,0);
}

  ST.nome = mail.split('@')[0] || 'Aluno';
