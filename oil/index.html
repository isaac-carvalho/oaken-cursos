    const diffMap = { 'Muito Fácil': 20, 'Fácil': 40, 'Intermediário': 60, 'Avançado': 80, 'Especialista': 100 };
    const diffVal = diffMap[mod.dificuldade] || 50;
    html += `<div class="modal-section"><h3><i class="fas fa-chart-simple"></i> Grau de Dificuldade</h3><div class="progress-bar"><div class="fill" style="width:${diffVal}%;"></div></div><span style="color:var(--text-light);">${mod.dificuldade}</span></div>`;

    html += `<div class="modal-section"><h3><i class="fas fa-hourglass-half"></i> Tempo Estimado</h3>
        <ul>
            <li>Instalação: ${mod.tempo.instalacao}</li>
            <li>Estudo: ${mod.tempo.estudo}</li>
            <li>Exercício: ${mod.tempo.exercicio}</li>
            <li>Questionário: ${mod.tempo.questionario}</li>
            <li><strong>Total: ${mod.tempo.total}</strong></li>
        </ul>
    </div>`;

    html += `<div class="modal-section"><h3><i class="fas fa-paperclip"></i> Recursos Extras</h3>
        <div class="btn-group">
            ${mod.recursos.manual ? `<a href="${mod.recursos.manual}" target="_blank" class="btn-sm primary"><i class="fas fa-file-pdf"></i> Manual</a>` : ''}
            ${mod.recursos.video ? `<a href="${mod.recursos.video}" target="_blank" class="btn-sm"><i class="fab fa-youtube"></i> Vídeo</a>` : ''}
            ${mod.recursos.github ? `<a href="${mod.recursos.github}" target="_blank" class="btn-sm"><i class="fab fa-github"></i> GitHub</a>` : ''}
            <button class="btn-sm"><i class="fas fa-question-circle"></i> Questionário</button>
            <button class="btn-sm"><i class="fas fa-file-alt"></i> Estudo de Caso</button>
        </div>
    </div>`;

    html += `<div class="modal-section"><h3><i class="fas fa-graduation-cap"></i> Conhecimentos Necessários</h3><p>${mod.preRequisitos}</p></div>`;

    const nextMod = modulosData.find(m => m.id === mod.proximo);
    html += `<div class="modal-section"><h3><i class="fas fa-arrow-circle-right"></i> Próximo Laboratório</h3><p><strong>${nextMod ? nextMod.nome : 'Concluído'}</strong></p></div>`;

    html += `<div class="modal-section"><div class="btn-group">
        <button class="btn-sm primary"><i class="fas fa-play"></i> Abrir Simulador</button>
        <button class="btn-sm"><i class="fas fa-download"></i> Baixar</button>
        <button class="btn-sm"><i class="fas fa-book"></i> Tutorial</button>
        <button class="btn-sm"><i class="fas fa-file-alt"></i> Exercício</button>
    </div></div>`;

    modalBody.innerHTML = html;
    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
  modalOverlay.classList.remove('active');
  document.body.style.overflow = '';
}
function fecharLabModal() {
  if (modalOverlay) modalOverlay.classList.remove('active');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', function (e) { if (e.target === this) closeModal(); });

function navigateModulo(delta) {
  const ids = modulosData.map(m => m.id).sort((a, b) => a - b);
  let idx = ids.indexOf(currentModuloId);
  idx = (idx + delta + ids.length) % ids.length;
  openModal(ids[idx]);
}
modalPrev.addEventListener('click', () => navigateModulo(-1));
modalNext.addEventListener('click', () => navigateModulo(1));

document.addEventListener('click', function (e) {
  const btn = e.target.closest('.btn-modulo');
  if (btn) {
    e.preventDefault();
    const id = parseInt(btn.dataset.id, 10);
    if (id) openModal(id);
  }
});

/* ═══════════════════════════════════════════════════════════════
   CERTIFICADO — só depois dos 17 módulos aprovados
   ═══════════════════════════════════════════════════════════════ */
let CURRENT = { nome: '', nota: '', acertos: '', total: String(TOTAL_MODULES), codigo: '', data: '' };

function renderCertificado() {
  if (totalAprovados() < TOTAL_MODULES) {
    abrirVista('certificado', `
      <div class="cert-locked">
        <i class="fas fa-lock"></i>
        <h2>Certificado ainda bloqueado</h2>
        <p>O certificado só fica disponível depois de aprovar os <strong>${TOTAL_MODULES} módulos</strong> do curso.
        Já aprovou <strong>${totalAprovados()}</strong>.</p>
        <button onclick="nav('aluno')"><i class="fas fa-table-cells"></i> Ir para a Área do Aluno</button>
      </div>`);
    return;
  }
  abrirVista('certificado', '<div class="cert-view">' + HTML_CERT + '</div>');
  initCert();
}

function formatDate() {
  const d = new Date();
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
}
function formatDateShort() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
}
function randomCode() { return 'OAKEN-' + Math.random().toString(36).substr(2, 9).toUpperCase(); }

// URL de verificação: mesma página, com os dados na query string e a rota #verificar.
function verifyBaseUrl() {
  return location.href.split('#')[0].split('?')[0];
}
function buildVerifyUrl() {
  const s = getCourseStats();
  const p = new URLSearchParams({
    codigo: CURRENT.codigo,
    nome: CURRENT.nome || 'Aluno Oaken Oil',
    nota: CURRENT.nota || '0',
    acertos: CURRENT.acertos || '0',
    total: CURRENT.total || String(TOTAL_MODULES),
    data: CURRENT.data,
    horas: s.hours,
    modulos: s.modules
  });
  return verifyBaseUrl() + '?' + p.toString() + '#verificar';
}

function renderAppendix() {
  const s = getCourseStats();
  const syllabus = getCourseSyllabus();
  document.getElementById('certHours').textContent = s.hours;
  document.getElementById('certModules').textContent = s.modules;
  document.getElementById('certLessons').textContent = s.lessons;
  document.getElementById('apxHours').textContent = s.hours;
  document.getElementById('apxModules').textContent = s.modules;
  document.getElementById('apxLessons').textContent = s.lessons;

  document.getElementById('apxModuleGrid').innerHTML = syllabus.map(m => `
    <div class="cert-appendix-row">
      <span class="apx-id">${m.id}.</span>
      <span class="apx-title">${m.title}</span>
      <span class="apx-hours">${m.hours}h</span>
    </div>
  `).join('');
}

function renderQR() {
  const box = document.getElementById('qrBox');
  if (!box) return;
  const url = buildVerifyUrl();
  if (window.QRCode) {
    box.innerHTML = '';
    const canvas = document.createElement('canvas');
    box.appendChild(canvas);
    QRCode.toCanvas(canvas, url, { width: 150, margin: 0, color: { dark: '#0B1F3A', light: '#FFFFFF' } }, function (err) {
      if (err) box.innerHTML = '<div style="font-size:9px;color:#94A3B8;padding:4px;">' + CURRENT.codigo + '</div>';
    });
  } else {
    box.innerHTML = '<div style="font-size:9px;color:#94A3B8;padding:4px;word-break:break-all;">' + CURRENT.codigo + '</div>';
  }
}

function updateCert() {
  const input = document.getElementById('studentName');
  if (!input) return;
  const name = input.value.trim();
  CURRENT.nome = name;
  document.getElementById('certName').textContent = name ? name : '— aguardando —';
  document.getElementById('apxName').textContent = name ? name : '— aguardando —';
  localStorage.setItem(NAME_KEY, name);
  renderQR();
}

function initCert() {
  let nota = localStorage.getItem('oaken_exame_nota');
  let acertos = localStorage.getItem('oaken_exame_acertos');
  let total = localStorage.getItem('oaken_exame_total');

  document.getElementById('certDate').textContent = formatDate();
  CURRENT.data = formatDateShort();

  let code = localStorage.getItem('oaken_cert_code');
  if (!code) { code = randomCode(); localStorage.setItem('oaken_cert_code', code); }
  const fullCode = code + '-' + new Date().getFullYear();
  document.getElementById('certCode').textContent = fullCode;
  document.getElementById('apxCode').textContent = fullCode;
  CURRENT.codigo = fullCode;

  renderAppendix();

  if (nota && acertos && total) {
    document.getElementById('certScore').textContent = nota + '%';
    document.getElementById('certRatio').textContent = acertos;
    document.getElementById('certTotalQ').textContent = total;
    CURRENT.nota = nota; CURRENT.acertos = acertos; CURRENT.total = total;
  } else {
    document.getElementById('certScore').textContent = '—%';
    document.getElementById('certRatio').textContent = '—';
    const aviso = document.getElementById('avisoNaoAprovado');
    if (aviso) aviso.style.display = 'block';
  }

  const savedName = localStorage.getItem(NAME_KEY);
  if (savedName) document.getElementById('studentName').value = savedName;
  updateCert();
  document.getElementById('studentName').addEventListener('input', updateCert);
}

/* ═══════════════════════════════════════════════════════════════
   VERIFICAÇÃO DO CERTIFICADO — lê a query string do QR
   ═══════════════════════════════════════════════════════════════ */
function renderVerificar() {
  abrirVista('verificar', '<div class="verify-view">' + HTML_VERIFY + '</div>');
  const p = new URLSearchParams(window.location.search);
  if (!p.get('codigo')) {
    const st = app.querySelector('.verify-status');
    st.textContent = 'Verificação de Certificado';
    st.style.color = '#64748B';
    app.querySelector('.verify-badge circle').setAttribute('fill', '#CBD5E1');
    app.querySelector('.verify-title').textContent = 'Nenhum certificado para verificar';
    app.querySelector('.verify-name').previousElementSibling.textContent =
      'Para verificar um certificado, digitalize o código QR impresso no próprio certificado.';
  }
  document.getElementById('vNome').textContent = p.get('nome') || '—';
  document.getElementById('vNota').textContent = (p.get('nota') || '—') + '%';
  document.getElementById('vAcertos').textContent = (p.get('acertos') || '—') + ' / ' + (p.get('total') || '—');
  document.getElementById('vData').textContent = p.get('data') || '—';
  document.getElementById('vCodigo').textContent = p.get('codigo') || '—';
  document.getElementById('vHoras').textContent = p.get('horas') ? p.get('horas') + ' horas' : '—';
  document.getElementById('vModulos').textContent = p.get('modulos') || '—';
}

router();

</script>
