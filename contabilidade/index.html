<p>O capital social representa o investimento inicial dos sócios e é a contrapartida contábil de tudo o que entra na empresa no arranque. As entradas podem ser em <strong>dinheiro</strong> (numerário depositado no banco da empresa) ou em <strong>espécie</strong> (bens, como uma viatura, um terreno ou equipamento, avaliados a valor justo e entregues em vez de dinheiro).</p>
<p>No caso da Construnorte, o capital social fica fixado em <strong>Kz 3.000.000</strong>, dividido da seguinte forma: o Sr. Fernando entra com 60% (Kz 1.800.000, em dinheiro, para a conta bancária da empresa). A Sra. Beatriz entra com 40% (Kz 1.200.000), sendo Kz 800.000 em dinheiro e Kz 400.000 sob a forma de uma viatura de caixa aberta que já possuía, avaliada por um perito independente.</p>
<div class="tw"><table class="dt"><tr><th>Sócio</th><th>%</th><th>Dinheiro</th><th>Bens (viatura)</th><th>Total</th></tr>
<tr><td>Fernando</td><td>60%</td><td>Kz 1.800.000</td><td>—</td><td>Kz 1.800.000</td></tr>
<tr><td>Beatriz</td><td>40%</td><td>Kz 800.000</td><td>Kz 400.000</td><td>Kz 1.200.000</td></tr>
<tr><td><strong>Total</strong></td><td>100%</td><td><strong>Kz 2.600.000</strong></td><td><strong>Kz 400.000</strong></td><td><strong>Kz 3.000.000</strong></td></tr></table></div>
<div class="hi"><strong>Lançamento de abertura:</strong> Débito Bancos Kz 2.600.000 + Débito Imobilizado Corpóreo (viatura) Kz 400.000 = Crédito Capital Social Kz 3.000.000.</div>
<p>Repare que a entrada em espécie não passa pela conta de Bancos nem de Caixa — a viatura entra directamente como <strong>activo fixo tangível</strong>, já pronta a ser amortizada nos exercícios seguintes, tal como estudado no Módulo 1 nas aulas de imobilizado e amortizações.</p>
</div>
<div class="cb"><h2><i class="fas fa-file-invoice"></i> Despesas de Constituição: Gasto do Exercício</h2>
<p>Abrir uma empresa tem custos próprios: reconhecimento de firma no notário, registo comercial, publicação de actos, taxas de emissão do NIF e do alvará. Estes custos <strong>não fazem parte do capital social</strong> e não devem ser confundidos com ele — são um gasto do período em que ocorrem, pago normalmente pelos sócios antes de a conta bancária da empresa estar activa, e depois reembolsado pela própria empresa assim que possível.</p>
<p>No caso da Construnorte, as despesas de constituição totalizaram <strong>Kz 180.000</strong> (notário, registo comercial e publicação), pagas em dinheiro do fundo de maneio inicial deixado em caixa.</p>
<div class="hi"><strong>Lançamento:</strong> Débito Gastos de Constituição/FSE Kz 180.000 — Crédito Caixa Kz 180.000.</div>
<div class="ib">Tratar despesas de constituição como se fossem parte do capital social é um erro frequente em empresas recém-abertas geridas sem apoio contábil — infla artificialmente o valor do investimento dos sócios e distorce o balanço desde o primeiro dia.</div>
</div>
<div class="tl"><div class="tli"><div class="tld">1</div><div class="tlc"><h4>Reserva de nome e escritura</h4><p>Reservar a denominação social e outorgar o acto constitutivo (estatutos, quotas, gerência).</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Registo comercial</h4><p>Inscrever a sociedade no registo comercial, que lhe atribui personalidade jurídica plena.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>NIF e domicílio fiscal</h4><p>Obter o Número de Identificação Fiscal junto da AGT e definir o domicílio fiscal da empresa.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Inscrição na Segurança Social</h4><p>Registar a empresa e os futuros trabalhadores para efeitos de contribuições de INSS.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Alvará e licenciamento de actividade</h4><p>Obter o alvará comercial e as licenças específicas da actividade (ex: sanitária, ambiental).</p></div></div>
<div class="tli"><div class="tld">6</div><div class="tlc"><h4>Abertura da conta bancária e do plano de contas</h4><p>Abrir a conta bancária em nome da empresa e configurar o plano de contas no software contábil, tema da próxima aula.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Misturar o Bolso do Sócio com o da Empresa</h2>
<p>Um erro muito frequente em pequenas empresas angolanas é o sócio continuar a pagar despesas da empresa directamente do seu bolso, sem que isso seja lançado como um empréstimo de sócio ou reembolsado formalmente. Isto quebra a separação entre patrimónios (o mesmo princípio da <strong>entidade contábil</strong> estudado no Módulo 1) e cria um emaranhado difícil de desfazer quando chega a fiscalização ou uma auditoria: a AGT pode questionar a origem de fundos usados para pagar despesas da empresa que não passaram pela contabilidade.</p>
<div class="wb"><strong>Atenção:</strong> pagamentos feitos pelo sócio em nome da empresa, sem registo, geram um passivo oculto (empresa deve ao sócio) que, se não regularizado, é um dos primeiros pontos que uma fiscalização da AGT ou uma auditoria externa detecta.</div>
<div class="hi"><strong>Como evitar:</strong> qualquer valor adiantado pelo sócio deve ser lançado numa conta de "Empréstimos de Sócios" (passivo), nunca directamente em gastos ou em capital social, até formalização.</div>
</div>
<div class="lawbox"><div class="lt">PGCA — Plano Geral de Contabilidade Angolano</div><blockquote>Estabelece a estrutura de classes de contas que toda empresa angolana deve seguir, incluindo as contas de Capital Próprio onde o capital social é reconhecido desde a constituição.</blockquote></div>
<div class="lawbox"><div class="lt">Lei n.º 7/19, de 24 de Abril</div><blockquote>Regula a facturação em Angola — a partir do momento em que a empresa está constituída e activa, todas as suas vendas passam a estar sujeitas a este regime de facturação.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Na Construnorte, Lda, a sócia Beatriz entrou com Kz 800.000 em dinheiro e uma viatura avaliada em Kz 400.000. Qual o lançamento correcto para a entrada da viatura?</div>
<div class="qo" onclick="cq(this,false)">a) Débito Caixa Kz 400.000 / Crédito Capital Social Kz 400.000</div>
<div class="qo" onclick="cq(this,true)">b) Débito Imobilizado Corpóreo Kz 400.000 / Crédito Capital Social Kz 400.000</div>
<div class="qo" onclick="cq(this,false)">c) Débito Capital Social Kz 400.000 / Crédito Imobilizado Corpóreo Kz 400.000</div>
<div class="qo" onclick="cq(this,false)">d) Débito Gastos de Constituição Kz 400.000 / Crédito Caixa Kz 400.000</div>
</div>`},
{t:'Plano de Contas Personalizado e Parametrização do Software Contábil', html:`
<div class="cb"><h2><i class="fas fa-sitemap"></i> O Caso da Distribel, em Benguela</h2>
<p>A Distribel é uma distribuidora de produtos alimentares com três pontos de venda em Benguela: a loja do centro, a loja do Lobito e a loja da Catumbela. O PGCA, tal como estudado no Módulo 1, dá a estrutura geral de classes de contas — mas essa estrutura sozinha não diz nada sobre quanto cada loja vende, quanto cada cliente deve, ou quanto custa administrar cada ponto de venda. Para isso, a Distribel precisa de um <strong>plano de contas personalizado</strong>: uma extensão analítica do PGCA, construída em cima da estrutura oficial, mas desdobrada ao nível de detalhe que a gestão da empresa exige.</p>
</div>
<div class="cb"><h2><i class="fas fa-layer-group"></i> Do Plano Geral ao Plano Analítico</h2>
<p>O plano de contas personalizado não substitui o PGCA — ele desdobra cada conta principal em <strong>subcontas analíticas</strong> que respondem às perguntas de gestão do dia-a-dia. Por exemplo, em vez de uma única conta "Clientes", a Distribel cria uma subconta por cliente relevante, para saber exactamente quem deve o quê. Em vez de uma única conta "Existências", desdobra por armazém (Benguela, Lobito, Catumbela), para saber onde está o stock parado.</p>
<div class="tw"><table class="dt"><tr><th>Conta PGCA (nível geral)</th><th>Subconta analítica (nível de gestão)</th></tr>
<tr><td>Clientes</td><td>Clientes — Supermercado Central, Clientes — Mercearia Nova, etc.</td></tr>
<tr><td>Existências</td><td>Existências — Armazém Benguela, Armazém Lobito, Armazém Catumbela</td></tr>
<tr><td>Gastos com Pessoal</td><td>Pessoal — Loja Centro, Pessoal — Lobito, Pessoal — Catumbela</td></tr>
</table></div>
<div class="hi"><strong>Regra de ouro:</strong> a conta-mãe do PGCA nunca é alterada — só é desdobrada em subcontas mais finas, para que o balancete geral continue a bater certo com a estrutura oficial.</div>
<p>Este desdobramento tem um efeito prático imediato na gestão de cobranças: em vez de a Distribel saber apenas que "os clientes devem, no total, Kz 3.400.000", a contabilista consegue extrair de imediato uma lista ordenada por cliente, identificando quem está a atrasar pagamentos e há quanto tempo. Sem subcontas analíticas, esta informação existiria apenas em folhas soltas fora do sistema contábil — duplicando trabalho e criando risco de divergência entre o que a equipa comercial "acha" que o cliente deve e o que a contabilidade efectivamente regista.</p>
</div>
<div class="cb"><h2><i class="fas fa-percent"></i> Parametrização do IVA no Software</h2>
<p>Outra tarefa central na parametrização é configurar correctamente o <strong>IVA</strong> no software contábil: taxa normal de 14% aplicada às vendas (IVA liquidado) e às compras (IVA dedutível), além de eventuais operações isentas. Se o software não estiver bem parametrizado, cada venda pode gerar um valor de IVA errado — um erro que só aparece no fim do mês, quando já é tarde para corrigir facilmente todas as facturas emitidas.</p>
<p>Uma venda de mercadoria de Kz 500.000 (valor sem IVA) na Distribel gera, com a taxa parametrizada correctamente, um IVA liquidado de Kz 500.000 × 14% = <strong>Kz 70.000</strong>, totalizando uma factura de Kz 570.000. Se o software estivesse parametrizado com uma taxa errada, todas as facturas do mês sairiam incorrectas, gerando divergências no apuramento periódico do IVA.</p>
</div>
<div class="cb"><h2><i class="fas fa-store"></i> Centros de Custo: Rateio de Despesas Administrativas</h2>
<p>Centros de custo são divisões dentro da empresa (neste caso, cada loja) às quais se atribuem custos, para saber qual delas é realmente rentável. A Distribel tem despesas administrativas partilhadas — contabilidade, gerência geral, telecomunicações — que totalizam <strong>Kz 900.000/mês</strong> e que precisam de ser rateadas pelas três lojas, proporcionalmente ao peso de cada uma nas vendas totais.</p>
<p>Em Julho, a loja do Centro representou 50% das vendas, a do Lobito 30% e a da Catumbela 20%. O rateio das despesas administrativas fica assim:</p>
<div class="tw"><table class="dt"><tr><th>Loja</th><th>% das vendas</th><th>Custo administrativo alocado</th></tr>
<tr><td>Centro</td><td>50%</td><td>Kz 450.000</td></tr>
<tr><td>Lobito</td><td>30%</td><td>Kz 270.000</td></tr>
<tr><td>Catumbela</td><td>20%</td><td>Kz 180.000</td></tr>
<tr><td><strong>Total</strong></td><td>100%</td><td><strong>Kz 900.000</strong></td></tr></table></div>
<div class="hi"><strong>Resultado:</strong> só depois deste rateio a gerência sabe se a loja da Catumbela, apesar de vender menos, ainda é lucrativa depois de absorver a sua parte dos custos fixos administrativos.</div>
</div>
<div class="tl"><div class="tli"><div class="tld">1</div><div class="tlc"><h4>Levantar as necessidades de gestão</h4><p>Que perguntas a gerência precisa de responder (por loja, por cliente, por produto)?</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Desenhar a codificação</h4><p>Definir prefixos e sufixos numéricos que identifiquem loja, centro de custo ou cliente dentro de cada conta do PGCA.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Configurar no software</h4><p>Criar as subcontas e os centros de custo no sistema, associando-os às contas-mãe do PGCA.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Testar com lançamentos reais</h4><p>Lançar operações de teste e conferir se os relatórios por loja/centro de custo batem com o balancete geral.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Migrar saldos e formar a equipa</h4><p>Transferir os saldos existentes para a nova estrutura e treinar quem lança dados no dia-a-dia.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Codificação Inconsistente</h2>
<p>Um erro típico é misturar, no mesmo nível de codificação, contas de gastos e contas de activo, ou usar o mesmo número de subconta para coisas diferentes em meses diferentes. Isto parece inofensivo no dia-a-dia, mas destrói a fiabilidade dos relatórios por centro de custo: a gerência da Distribel pode concluir, por engano, que a loja do Lobito é a mais lucrativa, quando na verdade parte dos seus custos foi lançada por erro na conta da Catumbela.</p>
<div class="wb"><strong>Atenção:</strong> uma codificação inconsistente não gera erro nenhum no balancete geral (as contas-mãe do PGCA continuam certas) — o problema só aparece nos relatórios analíticos, que é exactamente onde a gerência toma decisões.</div>
<div class="hi"><strong>Como evitar:</strong> documentar por escrito as regras de codificação do plano de contas personalizado e não as alterar sem rever todos os lançamentos já feitos com a estrutura antiga.</div>
</div>
<div class="lawbox"><div class="lt">PGCA — Plano Geral de Contabilidade Angolano</div><blockquote>Define a estrutura de classes e contas-mãe que qualquer plano de contas personalizado deve respeitar e desdobrar, nunca substituir.</blockquote></div>
<div class="lawbox"><div class="lt">IVA — taxa normal de 14%</div><blockquote>Deve estar correctamente parametrizada no software para todas as operações tributáveis de compra e venda.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Distribel tem despesas administrativas de Kz 900.000/mês, rateadas pelas 3 lojas proporcionalmente às vendas: Centro 50%, Lobito 30%, Catumbela 20%. Quanto é alocado à loja do Lobito?</div>
<div class="qo" onclick="cq(this,false)">a) Kz 450.000</div>
<div class="qo" onclick="cq(this,true)">b) Kz 270.000</div>
<div class="qo" onclick="cq(this,false)">c) Kz 180.000</div>
<div class="qo" onclick="cq(this,false)">d) Kz 900.000</div>
</div>`},
{t:'Contabilidade de Gestão: Custos, Margens e Preços de Venda', html:`
<div class="cb"><h2><i class="fas fa-chart-line"></i> O Caso da Móveis Planalto, em Huambo</h2>
<p>A Móveis Planalto fabrica cadeiras em Huambo. O gerente sabe quanto gasta a fabricar cada cadeira e quanto quer ganhar de margem, mas não sabe ao certo quantas cadeiras precisa vender por mês só para "não perder dinheiro". Este é o tipo de pergunta que a contabilidade financeira (Módulos 1 e 2) não responde directamente — é território da <strong>contabilidade de gestão</strong>, que usa os mesmos dados contábeis para apoiar decisões internas de preço, volume e rentabilidade.</p>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Custos Fixos, Variáveis e Custo Total</h2>
<p><strong>Custos variáveis</strong> mudam com o volume produzido — madeira, tecido, mão-de-obra directa por cadeira. <strong>Custos fixos</strong> não mudam com o volume dentro de certos limites — renda da fábrica, salário da gerência, seguros. A soma dos dois dá o custo total.</p>
<p>Na Móveis Planalto, cada cadeira consome Kz 1.200 de custo variável (madeira, verniz, tecido, mão-de-obra directa). Os custos fixos mensais da fábrica somam Kz 3.000.000. A produção mensal prevista é de 5.000 cadeiras.</p>
<div class="tw"><table class="dt"><tr><th>Componente</th><th>Valor</th></tr>
<tr><td>Custo variável por unidade</td><td>Kz 1.200</td></tr>
<tr><td>Custo fixo mensal total</td><td>Kz 3.000.000</td></tr>
<tr><td>Custo fixo por unidade (÷ 5.000)</td><td>Kz 600</td></tr>
<tr><td><strong>Custo total por unidade</strong></td><td><strong>Kz 1.800</strong></td></tr></table></div>
<div class="hi"><strong>Custo total unitário = Custo variável + Custo fixo por unidade = 1.200 + 600 = Kz 1.800.</strong></div>
</div>
<div class="cb"><h2><i class="fas fa-tag"></i> Formação do Preço de Venda</h2>
<p>Definido o custo total, a Móveis Planalto aplica uma margem de lucro de 30% sobre o custo para chegar ao preço de venda:</p>
<div class="hi"><strong>Preço de Venda = Custo Total × (1 + margem) = 1.800 × 1,30 = Kz 2.340 por cadeira.</strong></div>
<p>A diferença entre o preço de venda e o custo variável — não o custo total — é o que se chama <strong>margem de contribuição</strong>: o valor que cada cadeira vendida "contribui" primeiro para cobrir os custos fixos e, depois de os cobrir, para gerar lucro.</p>
<div class="hi"><strong>Margem de contribuição unitária = 2.340 − 1.200 = Kz 1.140 por cadeira.</strong></div>
</div>
<div class="cb"><h2><i class="fas fa-scale-balanced"></i> Ponto de Equilíbrio (Break-Even)</h2>
<p>O <strong>ponto de equilíbrio</strong> é a quantidade de vendas necessária para que a margem de contribuição total cubra exactamente os custos fixos — nem lucro, nem prejuízo. Calcula-se dividindo os custos fixos pela margem de contribuição unitária:</p>
<div class="hi"><strong>Ponto de Equilíbrio = Custos Fixos ÷ Margem de Contribuição Unitária = 3.000.000 ÷ 1.140 = 2.631,6 → 2.632 cadeiras/mês.</strong></div>
<p>Em valor de vendas, isto corresponde a 2.632 × Kz 2.340 = <strong>Kz 6.158.880</strong>. Abaixo deste volume, a Móveis Planalto perde dinheiro; acima, cada cadeira adicional gera Kz 1.140 de lucro puro, porque os custos fixos já estão totalmente cobertos.</p>
<div class="ib">Note que o ponto de equilíbrio (2.632 un.) é bem abaixo da produção prevista (5.000 un.) — isso dá à gerência uma margem de segurança de 2.368 unidades antes de entrar em prejuízo.</div>
</div>
<div class="cb"><h2><i class="fas fa-cart-shopping"></i> Preço Não É Só Custo Mais Margem</h2>
<p>O cálculo de "custo total mais margem" dá um preço tecnicamente correcto, mas não garante que o mercado o aceite. Antes de fixar definitivamente os Kz 2.340 por cadeira, a gerência da Móveis Planalto compara esse valor com o preço praticado pela concorrência directa em Huambo, que ronda os Kz 2.500 por um produto de qualidade semelhante. Como o preço calculado fica abaixo da concorrência, a empresa tem margem para manter os Kz 2.340 (posicionando-se como opção mais barata) ou subir ligeiramente o preço, aumentando a margem de contribuição sem se afastar do mercado.</p>
<p>Este cruzamento entre <strong>custo interno</strong> e <strong>preço de mercado</strong> é o que separa a contabilidade de gestão de um simples exercício de somar números: o custo dá o limite mínimo abaixo do qual a empresa perde dinheiro, mas o mercado é quem, no fim, decide se o preço calculado é competitivo.</p>
</div>
<div class="tl"><div class="tli"><div class="tld">1</div><div class="tlc"><h4>Levantar todos os custos variáveis por unidade</h4><p>Matéria-prima, mão-de-obra directa, embalagem, comissões de venda.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Levantar todos os custos fixos mensais</h4><p>Renda, salários administrativos, seguros, depreciações de equipamento.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Definir o volume de produção esperado</h4><p>Para calcular o custo fixo unitário e o custo total unitário.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Aplicar a margem desejada</h4><p>Chegar ao preço de venda e calcular a margem de contribuição.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Calcular o ponto de equilíbrio</h4><p>E comparar com o volume de vendas real ou esperado.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Usar o Custo Total em Vez do Variável no Ponto de Equilíbrio</h2>
<p>Um erro clássico é calcular o ponto de equilíbrio usando a margem "preço menos custo total" (2.340 − 1.800 = 540) em vez da margem de contribuição correcta (preço menos custo variável = 1.140). Isso daria um ponto de equilíbrio de 3.000.000 ÷ 540 = 5.556 unidades — acima da própria capacidade de produção prevista, levando o gestor a concluir, erradamente, que a fábrica está condenada ao prejuízo.</p>
<div class="wb"><strong>Atenção:</strong> o custo fixo já está "dentro" do custo total, por isso não pode ser subtraído duas vezes — uma no custo unitário, outra na fórmula do ponto de equilíbrio.</div>
<div class="hi"><strong>Como evitar:</strong> no ponto de equilíbrio, usar sempre a margem de contribuição (preço menos custo variável), nunca o lucro unitário sobre o custo total.</div>
</div>
<div class="lawbox"><div class="lt">PGCA — Plano Geral de Contabilidade Angolano</div><blockquote>Fornece a base de dados de custos (classes de gastos) que alimenta os cálculos de contabilidade de gestão, mesmo sem regular directamente estas técnicas de análise interna.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Móveis Planalto tem custo variável de Kz 1.200/cadeira, custos fixos de Kz 3.000.000/mês e preço de venda de Kz 2.340. Quantas cadeiras precisa vender por mês para atingir o ponto de equilíbrio?</div>
<div class="qo" onclick="cq(this,false)">a) 5.556 cadeiras</div>
<div class="qo" onclick="cq(this,true)">b) 2.632 cadeiras</div>
<div class="qo" onclick="cq(this,false)">c) 1.667 cadeiras</div>
<div class="qo" onclick="cq(this,false)">d) 3.000 cadeiras</div>
</div>`},
{t:'Contabilidade de Construção Civil e Empreitadas', html:`
<div class="cb"><h2><i class="fas fa-hard-hat"></i> O Caso da Rocha Firme, Construções</h2>
<p>A Rocha Firme, com obras em Cabinda, ganhou uma empreitada para construir um armazém industrial por <strong>Kz 40.000.000</strong>, com um custo orçado total de <strong>Kz 30.000.000</strong>. A obra vai demorar 10 meses. A pergunta central desta aula é: quando é que a Rocha Firme pode reconhecer a receita desses Kz 40.000.000 — tudo de uma vez no fim, ou aos poucos, à medida que a obra avança?</p>
<p>Em contratos de construção de longa duração, reconhecer toda a receita só no fim distorce completamente os resultados de cada exercício: a empresa pareceria não ter actividade nenhuma durante 9 meses e depois um lucro gigante no mês 10. Por isso, usa-se o <strong>método do percentual de conclusão</strong>.</p>
</div>
<div class="cb"><h2><i class="fas fa-percent"></i> O Método do Percentual de Conclusão</h2>
<p>Este método reconhece receita e custo <strong>proporcionalmente ao avanço físico ou financeiro da obra</strong>, medido tipicamente pela relação entre os custos já incorridos e o custo total orçado. É uma aplicação directa do princípio da especialização de exercícios: os proveitos e os gastos devem ser reconhecidos no período em que o trabalho realmente acontece, não apenas quando o dinheiro entra ou sai.</p>
<p>Ao final do terceiro mês, a Rocha Firme apurou custos incorridos de <strong>Kz 12.000.000</strong> na obra.</p>
<div class="tw"><table class="dt"><tr><th>Elemento</th><th>Valor</th></tr>
<tr><td>Valor total do contrato</td><td>Kz 40.000.000</td></tr>
<tr><td>Custo total orçado da obra</td><td>Kz 30.000.000</td></tr>
<tr><td>Custo incorrido até ao mês 3</td><td>Kz 12.000.000</td></tr>
<tr><td>% de conclusão (12.000.000 ÷ 30.000.000)</td><td>40%</td></tr>
</table></div>
<div class="hi"><strong>Receita a reconhecer no mês 3 = 40% × Kz 40.000.000 = Kz 16.000.000.</strong></div>
<div class="hi"><strong>Lucro reconhecido no mês 3 = Receita reconhecida − Custo incorrido = 16.000.000 − 12.000.000 = Kz 4.000.000.</strong></div>
</div>
<div class="cb"><h2><i class="fas fa-file-contract"></i> Facturação, Autos de Medição e Adiantamentos</h2>
<p>Na prática, a Rocha Firme não emite uma única factura no fim — factura mensalmente com base em <strong>autos de medição</strong> assinados pelo dono da obra, que certificam o trabalho fisicamente executado. Estas facturas seguem obrigatoriamente o regime da Lei n.º 7/19, tal como qualquer outra venda em Angola. É comum também existirem <strong>adiantamentos</strong> do cliente no início da obra, que não são receita — são um passivo (adiantamento de cliente) até corresponderem a trabalho efectivamente executado.</p>
<div class="ib">Se a Rocha Firme recebeu um adiantamento de Kz 5.000.000 no início da obra, esse valor entra como passivo e só vai sendo "consumido" à medida que a receita é reconhecida pelo percentual de conclusão — nunca é reconhecido como proveito de uma só vez no momento do recebimento.</div>
</div>
<div class="cb"><h2><i class="fas fa-people-carry-box"></i> Subempreiteiros e Retenções de Garantia</h2>
<p>É comum a Rocha Firme subcontratar parte da obra a subempreiteiros especializados (electricidade, canalização). Estes custos entram normalmente no cálculo do custo incorrido da obra, tal como qualquer outro gasto directo. Por outro lado, é frequente o dono da obra reter uma percentagem de cada factura paga à Rocha Firme — por exemplo, 5% — como <strong>retenção de garantia</strong>, só libertada depois da entrega final e do período de garantia da obra. Se a Rocha Firme facturou Kz 16.000.000 no mês 3, mas o dono da obra reteve 5%, o valor efectivamente recebido é 16.000.000 − (16.000.000 × 5%) = Kz 15.200.000, ficando Kz 800.000 registados como um valor a receber a prazo mais longo, e não como perda.</p>
<p>Esta distinção importa porque uma retenção de garantia não é um desconto nem um custo — é apenas um adiamento do recebimento de um valor que já foi facturado e já gerou receita reconhecida.</p>
</div>
<div class="tl"><div class="tli"><div class="tld">1</div><div class="tlc"><h4>Orçar o custo total da obra</h4><p>Antes de começar, estimar com rigor todos os custos previstos (materiais, mão-de-obra, subempreiteiros, equipamento).</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Registar custos incorridos mensalmente</h4><p>Lançar todos os gastos reais da obra, separados por centro de custo (a própria empreitada).</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Calcular o percentual de conclusão</h4><p>Custos incorridos ÷ custo total orçado, revisto todos os meses.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Reconhecer receita e custo proporcionais</h4><p>Aplicar o percentual ao valor total do contrato e lançar a receita correspondente.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Facturar com base no auto de medição</h4><p>Emitir a factura mensal certificada pelo dono da obra, dentro do regime da Lei 7/19.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Confundir Orçamento Inicial com Custo Real</h2>
<p>Um erro grave e frequente é continuar a calcular o percentual de conclusão com o orçamento inicial mesmo depois de se saber que o custo real da obra vai ser maior (por exemplo, se subiu o preço do cimento ou surgiram trabalhos a mais). Se a Rocha Firme descobrir no mês 6 que o custo real total vai ser Kz 33.000.000 em vez de Kz 30.000.000 e não actualizar a base do cálculo, vai reconhecer lucro a mais nos primeiros meses e um prejuízo inesperado no fim da obra.</p>
<div class="wb"><strong>Atenção:</strong> obras que "davam lucro todos os meses e de repente dão prejuízo no último mês" são normalmente sintoma de um custo orçado desactualizado — um dos primeiros pontos que uma auditoria a empresas de construção civil investiga.</div>
<div class="hi"><strong>Como evitar:</strong> rever o custo total orçado da obra em cada fecho mensal, ajustando o percentual de conclusão à melhor estimativa disponível, nunca ao orçamento original congelado.</div>
</div>
<div class="lawbox"><div class="lt">Lei n.º 7/19, de 24 de Abril</div><blockquote>Regula a facturação — os autos de medição e as facturas mensais de uma empreitada devem cumprir os requisitos gerais desta lei, como qualquer outra operação tributável.</blockquote></div>
<div class="lawbox"><div class="lt">PGCA — Plano Geral de Contabilidade Angolano</div><blockquote>Enquadra os adiantamentos de clientes como passivo até corresponderem a receita reconhecida, e os custos de obra em curso como existências/produção em curso.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Rocha Firme tem um contrato de Kz 40.000.000, custo orçado de Kz 30.000.000 e já incorreu em Kz 12.000.000 de custos. Qual o lucro a reconhecer neste momento pelo método do percentual de conclusão?</div>
<div class="qo" onclick="cq(this,false)">a) Kz 16.000.000</div>
<div class="qo" onclick="cq(this,true)">b) Kz 4.000.000</div>
<div class="qo" onclick="cq(this,false)">c) Kz 10.000.000</div>
<div class="qo" onclick="cq(this,false)">d) Kz 12.000.000</div>
</div>`},
{t:'Operações Bancárias, Seguros e Instituições Financeiras', html:`
<div class="cb"><h2><i class="fas fa-university"></i> O Caso da Soyo Marine Services</h2>
<p>A Soyo Marine Services presta apoio logístico a embarcações no porto do Soyo. Como qualquer empresa que movimenta muito dinheiro por banco, precisa de dominar três frentes: a <strong>reconciliação bancária</strong> mensal, o tratamento de <strong>seguros</strong> pagos antecipadamente, e a contabilização de <strong>empréstimos bancários</strong> com juros. Nenhuma destas três é nova em termos de contas — usam-se as mesmas contas do PGCA vistas no Módulo 1 — mas a complexidade prática destas operações merece um caso dedicado.</p>
</div>
<div class="cb"><h2><i class="fas fa-scale-balanced"></i> Reconciliação Bancária: Fechando as Contas com o Banco</h2>
<p>A reconciliação bancária confirma que o saldo da contabilidade da empresa e o saldo do extrato do banco, apesar de poderem ser diferentes num dado momento, representam a mesma realidade — a diferença deve ser inteiramente explicada por itens em trânsito ou lançamentos ainda não reflectidos.</p>
<p>No fecho de Junho, a Soyo Marine tinha um saldo contabilístico de Kz 4.265.000. Ao rever o extrato bancário, a contabilista encontrou um encargo bancário (comissões de manutenção de conta) de Kz 15.000, debitado directamente pelo banco mas ainda não lançado nos livros da empresa.</p>
<div class="hi"><strong>Lançamento de ajuste:</strong> Débito Gastos Bancários Kz 15.000 — Crédito Bancos Kz 15.000. Novo saldo contabilístico: 4.265.000 − 15.000 = Kz 4.250.000.</div>
<p>Do lado do banco, o extrato mostrava um saldo de Kz 4.630.000, mas havia um cheque de Kz 380.000 emitido pela Soyo Marine a um fornecedor que ainda não tinha sido levantado.</p>
<div class="tw"><table class="dt"><tr><th>Origem</th><th>Valor</th></tr>
<tr><td>Saldo contabilístico ajustado</td><td>Kz 4.250.000</td></tr>
<tr><td>Saldo do extrato bancário</td><td>Kz 4.630.000</td></tr>
<tr><td>Menos: cheque emitido em trânsito</td><td>− Kz 380.000</td></tr>
<tr><td><strong>Saldo bancário ajustado</strong></td><td><strong>Kz 4.250.000</strong></td></tr></table></div>
<div class="hi"><strong>Os dois saldos ajustados batem: Kz 4.250.000 = Kz 4.250.000. A reconciliação está fechada.</strong></div>
</div>
<div class="cb"><h2><i class="fas fa-shield-halved"></i> Seguros Pagos Antecipadamente</h2>
<p>Em Janeiro, a Soyo Marine pagou de uma só vez a apólice de seguro anual da sua frota de rebocadores, no valor de <strong>Kz 1.200.000</strong>. Pagar tudo de uma vez não significa que todo o gasto pertence a Janeiro — o seguro cobre os 12 meses seguintes, por isso o valor deve ser reconhecido como gasto <strong>mês a mês</strong>, à razão de Kz 1.200.000 ÷ 12 = <strong>Kz 100.000/mês</strong>.</p>
<p>O valor ainda não "consumido" fica registado num activo (Gastos Antecipados / Diferidos). Em Abril, passados 4 meses, a empresa já reconheceu Kz 400.000 de gasto de seguro e mantém Kz 800.000 como activo, à espera de ser consumido nos 8 meses restantes.</p>
<div class="ib">Este é o mesmo princípio da especialização de exercícios aplicado antes às amortizações e aos gastos de constituição: o momento do pagamento não determina o momento do gasto.</div>
</div>
<div class="cb"><h2><i class="fas fa-hand-holding-dollar"></i> Empréstimos Bancários e Juros</h2>
<p>Para financiar a compra de um novo rebocador, a Soyo Marine contraiu um empréstimo bancário de <strong>Kz 5.000.000</strong>, a uma taxa de juro de 18% ao ano. O juro mensal calcula-se dividindo a taxa anual por 12:</p>
<div class="hi"><strong>Juro mensal = 5.000.000 × 18% ÷ 12 = 5.000.000 × 0,015 = Kz 75.000/mês.</strong></div>
<p>Cada prestação mensal paga ao banco tem, normalmente, duas partes: <strong>amortização de capital</strong> (reduz a dívida) e <strong>juro</strong> (é um gasto financeiro do período). Só a parte do juro entra na demonstração de resultados; a parte do capital apenas reduz o passivo no balanço.</p>
</div>
<div class="cb"><h2><i class="fas fa-file-shield"></i> Seguros de Responsabilidade e Sinistros</h2>
<p>Além do seguro da frota, a Soyo Marine mantém um seguro de responsabilidade civil que cobre eventuais danos causados a embarcações de terceiros durante as operações portuárias. Se, num incidente, um rebocador da empresa danifica um navio cliente e a seguradora reconhece o sinistro, a indemnização recebida da seguradora não é uma venda nem um proveito operacional comum — é registada separadamente como um ressarcimento, compensando o gasto ou a perda que o incidente provocou. Se o dano causado foi estimado em Kz 600.000 e a seguradora reembolsa integralmente esse valor, o efeito líquido no resultado do exercício é nulo: o gasto com a reparação e o proveito da indemnização anulam-se, mas ambos devem ser lançados de forma visível, nunca compensados directamente numa única conta, para que o histórico do sinistro fique claro nas demonstrações financeiras.</p>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Lançar a Prestação Bancária Inteira Como Gasto</h2>
<p>Um erro muito comum em empresas com empréstimos é lançar o valor total da prestação mensal como "gasto financeiro", sem separar a parte de capital da parte de juro. Se a Soyo Marine pagasse uma prestação mensal de Kz 200.000 (sendo Kz 125.000 de amortização de capital e Kz 75.000 de juro) e lançasse tudo como gasto, estaria a sobrestimar os gastos do mês em Kz 125.000 e a esconder que a dívida ao banco já baixou.</p>
<div class="wb"><strong>Atenção:</strong> esta confusão distorce simultaneamente o resultado do exercício (gasto a mais) e o balanço (passivo a mais, porque a amortização de capital nunca reduziu a dívida nos livros).</div>
<div class="hi"><strong>Como evitar:</strong> exigir sempre ao banco o mapa de amortização do empréstimo, que separa capital e juro em cada prestação, e lançar cada parte na conta correspondente.</div>
</div>
<div class="lawbox"><div class="lt">PGCA — Plano Geral de Contabilidade Angolano</div><blockquote>Define as contas de Meios Monetários (Bancos), Gastos Antecipados e Financiamentos Obtidos usadas nestas operações.</blockquote></div>
<div class="ib">Um mapa de amortização bem organizado, com capital e juro separados mês a mês, também facilita a reconciliação bancária estudada no início desta aula — cada prestação paga pode ser conferida directamente contra o extrato do banco, evitando que uma prestação mal lançada se torne, ela própria, uma futura diferença de reconciliação por explicar.</div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Soyo Marine contraiu um empréstimo de Kz 5.000.000 a uma taxa de 18% ao ano. Qual o valor do juro correspondente a um único mês?</div>
<div class="qo" onclick="cq(this,false)">a) Kz 900.000</div>
<div class="qo" onclick="cq(this,true)">b) Kz 75.000</div>
<div class="qo" onclick="cq(this,false)">c) Kz 15.000</div>
<div class="qo" onclick="cq(this,false)">d) Kz 150.000</div>
</div>`},
{t:'Fusões, Aquisições e Encerramento de Empresas', html:`
<div class="cb"><h2><i class="fas fa-handshake"></i> O Caso da AgroLub e da Terra Fértil</h2>
<p>A AgroLub, agroindústria sediada no Lubango, decide adquirir a totalidade da concorrente Terra Fértil por <strong>Kz 25.000.000</strong>. Antes de fechar o negócio, a AgroLub manda avaliar os activos e passivos da Terra Fértil a <strong>valor justo</strong> (o valor real de mercado, não o valor contabilístico histórico que a Terra Fértil tinha nos seus livros). Esta avaliação aponta para activos de Kz 32.000.000 e passivos de Kz 12.000.000.</p>
</div>
<div class="cb"><h2><i class="fas fa-scale-balanced"></i> Activos Líquidos a Valor Justo e o Goodwill</h2>
<p>O <strong>valor líquido dos activos</strong> de uma empresa a adquirir é simplesmente activos menos passivos, ambos avaliados a valor justo — não aos valores que constam da contabilidade histórica da empresa comprada:</p>
<div class="tw"><table class="dt"><tr><th>Elemento</th><th>Valor (a valor justo)</th></tr>
<tr><td>Activos totais da Terra Fértil</td><td>Kz 32.000.000</td></tr>
<tr><td>Passivos totais da Terra Fértil</td><td>Kz 12.000.000</td></tr>
<tr><td><strong>Activos líquidos (32.000.000 − 12.000.000)</strong></td><td><strong>Kz 20.000.000</strong></td></tr>
<tr><td>Preço pago pela AgroLub</td><td>Kz 25.000.000</td></tr>
</table></div>
<p>Quando o preço pago é maior do que o valor líquido dos activos adquiridos, a diferença chama-se <strong>goodwill</strong> (trespasse ou "valor de negócio em curso") — representa o que a AgroLub está disposta a pagar a mais por factores que não aparecem isoladamente no balanço da Terra Fértil: carteira de clientes fiéis, marca reconhecida, equipa treinada, posição de mercado.</p>
<div class="hi"><strong>Goodwill = Preço pago − Activos líquidos a valor justo = 25.000.000 − 20.000.000 = Kz 5.000.000.</strong></div>
<div class="ib">Se o preço pago fosse inferior ao valor líquido dos activos, a diferença seria um "goodwill negativo" (compra vantajosa) — situação rara, que normalmente exige reavaliar se a avaliação dos activos e passivos foi feita correctamente antes de reconhecer qualquer ganho.</div>
<p>Depois de apurado, o goodwill entra no balanço da AgroLub como um <strong>activo intangível</strong>. Diferente da maioria dos outros activos, não é amortizado de forma automática e regular — é sujeito a testes periódicos de imparidade, isto é, a empresa deve avaliar regularmente se o valor que pagou a mais continua a fazer sentido económico. Se, dois anos depois, se confirmar que a Terra Fértil perdeu grande parte da sua carteira de clientes e já não gera o retorno esperado, a AgroLub terá de reduzir o valor do goodwill no seu balanço, reconhecendo uma perda por imparidade nesse exercício.</p>
</div>
<div class="cb"><h2><i class="fas fa-door-closed"></i> Encerramento de Empresas: Liquidação e Partilha</h2>
<p>No outro extremo do ciclo de vida de uma empresa está o <strong>encerramento</strong>. Quando os sócios decidem dissolver uma sociedade, entra-se num processo de <strong>liquidação</strong>: vendem-se ou realizam-se todos os activos, pagam-se todos os credores pela ordem legal de prioridade, e só depois disso o que sobra — o <strong>activo líquido remanescente</strong> — é partilhado entre os sócios, na proporção das suas quotas.</p>
<p>Imagine que, ao encerrar uma pequena empresa em Namibe, depois de vendidos todos os activos e pagos todos os credores, sobram Kz 6.000.000 em caixa. Se os sócios detinham 70% e 30% da sociedade, a partilha é: sócio A recebe 70% × 6.000.000 = Kz 4.200.000; sócio B recebe 30% × 6.000.000 = Kz 1.800.000.</p>
<div class="hi"><strong>Regra de partilha:</strong> os credores têm sempre prioridade sobre os sócios — só se distribui aos sócios o que sobra depois de saldadas todas as dívidas da empresa.</div>
<p>Durante o próprio processo de liquidação, a contabilidade continua a funcionar normalmente, mas com um objectivo diferente: em vez de medir o desempenho de uma empresa em continuidade, mede o processo de conversão de todos os activos em dinheiro e de extinção de todos os passivos, até não sobrar nenhuma operação por concluir. Só depois de encerrada esta fase é que a sociedade pode ser formalmente cancelada no registo comercial.</p>
</div>
<div class="tl"><div class="tli"><div class="tld">1</div><div class="tlc"><h4>Avaliar activos e passivos a valor justo</h4><p>Antes de qualquer aquisição, obter uma avaliação independente e actualizada.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Calcular o valor líquido dos activos</h4><p>Activos a valor justo menos passivos a valor justo.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Apurar o goodwill (ou goodwill negativo)</h4><p>Comparar o preço pago com o valor líquido apurado.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Integrar as contas na adquirente</h4><p>Consolidar activos, passivos e goodwill no balanço da empresa compradora.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Usar o Valor Contabilístico Histórico em Vez do Valor Justo</h2>
<p>Um erro grave numa fusão ou aquisição é calcular o goodwill comparando o preço pago com o valor contabilístico histórico dos activos da empresa adquirida (o que consta dos seus livros antigos), em vez do valor justo actual. Se a Terra Fértil tivesse um terreno registado nos seus livros por Kz 2.000.000 (preço de compra há 10 anos) mas que hoje vale Kz 8.000.000 no mercado, usar o valor antigo infla artificialmente o goodwill calculado e distorce todo o balanço pós-aquisição da AgroLub.</p>
<div class="wb"><strong>Atenção:</strong> um goodwill inflado por avaliações desactualizadas é um dos pontos mais visados em auditorias pós-aquisição, porque afecta directamente os resultados futuros (o goodwill tende a ser testado quanto a imparidade nos exercícios seguintes).</div>
<div class="hi"><strong>Como evitar:</strong> exigir sempre uma avaliação independente a valor justo, feita à data da aquisição, nunca aceitar os valores contabilísticos históricos da empresa vendedora sem verificação.</div>
</div>
<div class="lawbox"><div class="lt">PGCA — Plano Geral de Contabilidade Angolano</div><blockquote>Enquadra o goodwill como um activo intangível a reconhecer numa aquisição, e as contas de capital próprio envolvidas numa liquidação e partilha.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A AgroLub pagou Kz 25.000.000 pela Terra Fértil, cujos activos líquidos a valor justo somam Kz 20.000.000 (activos de 32.000.000 menos passivos de 12.000.000). Qual o goodwill reconhecido?</div>
<div class="qo" onclick="cq(this,false)">a) Kz 25.000.000</div>
<div class="qo" onclick="cq(this,true)">b) Kz 5.000.000</div>
<div class="qo" onclick="cq(this,false)">c) Kz 12.000.000</div>
<div class="qo" onclick="cq(this,false)">d) Kz 20.000.000</div>
</div>`},
{t:'Auditoria Interna, Controlo Interno e Prevenção de Fraudes', html:`
<div class="cb"><h2><i class="fas fa-magnifying-glass"></i> O Caso da Pesca Atlântico, no Namibe</h2>
<p>A Pesca Atlântico, empresa de comercialização de pescado no Namibe, recebe muito dinheiro em espécie nas vendas directas ao público no seu balcão. No fecho do mês, o responsável financeiro decide fazer uma contagem física surpresa do caixa. O saldo contabilístico da conta Caixa indicava <strong>Kz 1.050.000</strong>, mas a contagem física encontrou apenas <strong>Kz 850.000</strong> em numerário.</p>
<div class="hi"><strong>Quebra de caixa = Saldo contabilístico − Saldo físico contado = 1.050.000 − 850.000 = Kz 200.000 em falta.</strong></div>
<p>Este tipo de diferença — chamada quebra ou desfalque de caixa — é exactamente o tipo de situação que um sistema de <strong>controlo interno</strong> bem desenhado deveria prevenir ou, pelo menos, detectar rapidamente, antes de se tornar um hábito.</p>
</div>
<div class="cb"><h2><i class="fas fa-shield"></i> O Que É Controlo Interno</h2>
<p><strong>Controlo interno</strong> é o conjunto de políticas e procedimentos que uma empresa implementa para proteger os seus activos, garantir a fiabilidade da informação contábil e assegurar o cumprimento das suas próprias regras internas. Não é sinónimo de desconfiança dos funcionários — é uma estrutura que protege tanto a empresa como os próprios trabalhadores honestos, ao tornar visível quem fez o quê.</p>
<p>Um dos pilares mais importantes é a <strong>segregação de funções</strong>: a pessoa que recebe dinheiro não deve ser a mesma que regista o recebimento na contabilidade, nem a mesma que faz a reconciliação de caixa. Na Pesca Atlântico, se o mesmo funcionário recebe o dinheiro dos clientes, regista as vendas e faz a contagem de caixa, não existe nenhum mecanismo independente capaz de detectar um desvio — seja ele erro ou fraude intencional.</p>
<div class="ib">Segregação de funções não elimina a fraude, mas obriga a que aconteça em conluio entre duas ou mais pessoas — o que a torna muito mais difícil e mais fácil de detectar.</div>
</div>
<div class="cb"><h2><i class="fas fa-user-secret"></i> Auditoria Interna: Detectar Antes da AGT ou de um Auditor Externo</h2>
<p>A <strong>auditoria interna</strong> é a função, dentro da própria empresa, responsável por testar continuamente se os controlos internos estão realmente a funcionar — não apenas se existem no papel. Diferente da auditoria externa (que valida as demonstrações financeiras para terceiros) e diferente de uma fiscalização da AGT (que verifica o cumprimento fiscal), a auditoria interna trabalha para a própria gestão, com o objectivo de encontrar e corrigir problemas antes que se tornem uma crise.</p>
<p>No caso da Pesca Atlântico, um bom trabalho de auditoria interna teria incluído contagens de caixa surpresa regulares (não apenas no fecho do mês, quando o responsável já pode antecipar e "arranjar" o saldo), reconciliações bancárias independentes, e revisão periódica de quem tem acesso físico ao dinheiro.</p>
<div class="hi"><strong>Princípio central:</strong> controlos que só acontecem em datas previsíveis (sempre no último dia do mês) são fáceis de contornar — a auditoria interna eficaz introduz um elemento de surpresa.</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> O Triângulo da Fraude</h2>
<p>Auditores usam frequentemente um modelo simples para entender por que uma pessoa comete fraude: o <strong>triângulo da fraude</strong>, composto por três elementos que costumam estar presentes em conjunto — <strong>pressão</strong> (uma necessidade financeira pessoal urgente), <strong>oportunidade</strong> (um controlo interno fraco que permite o desvio sem ser detectado) e <strong>racionalização</strong> (a pessoa convence-se de que "vai devolver depois" ou que "a empresa não vai notar"). Um sistema de controlo interno forte não elimina a pressão nem a racionalização — factores pessoais fora do alcance da empresa — mas consegue eliminar a oportunidade, que é o único dos três elementos que a gestão controla directamente.</p>
<p>Na Pesca Atlântico, a oportunidade existia porque uma só pessoa acumulava três funções incompatíveis. Corrigir isso não resolve os problemas pessoais que possam ter motivado o desvio, mas fecha a porta que os tornava possíveis.</p>
</div>
<div class="tl"><div class="tli"><div class="tld">1</div><div class="tlc"><h4>Mapear os pontos de risco</h4><p>Onde há dinheiro, existências valiosas ou decisões de compra/venda concentradas numa só pessoa?</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Implementar segregação de funções</h4><p>Separar quem autoriza, quem executa, quem regista e quem confere cada operação relevante.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Definir controlos de detecção</h4><p>Contagens surpresa, reconciliações independentes, dupla assinatura para pagamentos acima de um limite.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Investigar toda a diferença encontrada</h4><p>Nunca ajustar uma quebra directamente para gastos sem apurar a causa.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Documentar e corrigir</h4><p>Registar o incidente, aplicar medidas correctivas e reforçar o controlo que falhou.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Ajustar a Quebra Directamente para Gastos, Sem Investigar</h2>
<p>Um erro perigoso é simplesmente lançar a quebra de caixa como gasto (Débito Gastos com Quebras, Crédito Caixa) e seguir em frente, sem investigar se foi um erro de troco, um roubo pontual, ou um desvio continuado. Se a Pesca Atlântico repetir esta prática mês após mês, sem investigar, está essencialmente a "normalizar" um desvio contínuo de dinheiro, que ao fim de um ano pode somar milhões de kwanzas sem que ninguém tenha sido responsabilizado.</p>
<div class="wb"><strong>Atenção:</strong> quebras de caixa recorrentes e sempre próximas de um determinado valor são um dos sinais clássicos de fraude continuada por um único responsável, não de erro aleatório de troco.</div>
<div class="hi"><strong>Como evitar:</strong> tratar toda a quebra de caixa como um incidente a investigar, com responsável identificado, antes de qualquer regularização contábil — e nunca deixar a mesma pessoa receber, registar e reconciliar o caixa.</div>
</div>
<div class="lawbox"><div class="lt">PGCA — Plano Geral de Contabilidade Angolano</div><blockquote>Exige que os registos contábeis reflictam com fiabilidade a realidade patrimonial da empresa — uma quebra de caixa não investigada compromete essa fiabilidade.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Na Pesca Atlântico, o saldo contabilístico de Caixa era Kz 1.050.000, mas a contagem física encontrou Kz 850.000. Qual é a primeira acção correcta a tomar?</div>
<div class="qo" onclick="cq(this,false)">a) Lançar imediatamente a diferença como gasto e encerrar o assunto</div>
<div class="qo" onclick="cq(this,true)">b) Investigar a causa da diferença de Kz 200.000 antes de qualquer regularização</div>
<div class="qo" onclick="cq(this,false)">c) Ajustar o saldo contabilístico para bater com a contagem, sem mais nenhuma acção</div>
<div class="qo" onclick="cq(this,false)">d) Ignorar a diferença por ser considerada pequena</div>
</div>`},
{t:'Contabilidade para Órgãos do Estado e Entidades Públicas (SISTAC)', html:`
<div class="cb"><h2><i class="fas fa-landmark"></i> O Caso de um Instituto Público em Luanda</h2>
<p>Até aqui, todo o módulo tratou de empresas privadas, cujo objectivo final é o lucro. Um instituto público em Luanda, financiado pelo Orçamento Geral do Estado, funciona sob uma lógica diferente: o objectivo não é gerar lucro, é executar um orçamento aprovado para prestar um serviço público, e prestar contas com rigor sobre como esse dinheiro público foi gasto. A contabilidade pública angolana organiza-se em torno do <strong>SISTAC</strong>, o sistema que estrutura o registo e a prestação de contas destas entidades.</p>
</div>
<div class="cb"><h2><i class="fas fa-file-invoice-dollar"></i> Orçamento, Dotação e Execução Orçamental</h2>
<p>Uma entidade pública começa o ano com uma <strong>dotação orçamental</strong> — o montante que lhe foi atribuído para gastar durante o exercício, aprovado superiormente. Ao longo do ano, a entidade vai "executando" esse orçamento: autoriza despesas, compromete verbas, paga fornecedores. A diferença central em relação a uma empresa privada é que uma entidade pública, em regra, <strong>não pode gastar mais do que a dotação aprovada</strong> para cada rubrica, mesmo que precise.</p>
<p>O instituto público de Luanda tinha uma dotação orçamental anual de <strong>Kz 500.000.000</strong>. Até Setembro (9 meses do ano), já tinha executado <strong>Kz 320.000.000</strong>.</p>
<div class="hi"><strong>Taxa de execução orçamental = Executado ÷ Dotação = 320.000.000 ÷ 500.000.000 = 64%.</strong></div>
<div class="ib">Uma taxa de execução de 64% ao fim de 9 meses (75% do ano decorrido) pode indicar tanto boa gestão (poupança) como atraso na realização de projectos planeados — por isso este indicador é sempre analisado em conjunto com o cumprimento das metas físicas do instituto, não isoladamente.</div>
</div>
<div class="cb"><h2><i class="fas fa-coins"></i> Regime de Caixa vs. Regime de Compromisso</h2>
<p>Na contabilidade pública, é fundamental distinguir três momentos de uma despesa: o <strong>compromisso</strong> (a entidade assume a obrigação, por exemplo ao assinar um contrato ou emitir uma nota de encomenda), a <strong>liquidação</strong> (confirma-se que o bem foi entregue ou o serviço prestado, e apura-se o valor exacto a pagar) e o <strong>pagamento</strong> (a saída efectiva de dinheiro). Uma entidade pode ter comprometido uma verba sem ainda a ter paga — e é importante que o sistema contábil mostre os três momentos separadamente, para que se saiba, a qualquer altura, quanto da dotação já está "reservado" mesmo que ainda não tenha saído dinheiro do cofre.</p>
<p>Se o instituto de Luanda assina um contrato de fornecimento de equipamento informático por Kz 15.000.000 em Outubro, mas só recebe e paga o equipamento em Dezembro, o compromisso é registado em Outubro (reduzindo a dotação disponível), mas o pagamento só sai da tesouraria em Dezembro.</p>
<div class="ib">Esta separação em três fases resolve um problema muito concreto de gestão: sem ela, um gestor público poderia autorizar novos contratos usando uma rubrica que, na prática, já estava esgotada por compromissos assumidos mas ainda não pagos — gerando uma dívida orçamental invisível até chegar a factura.</div>
</div>
<div class="cb"><h2><i class="fas fa-clipboard-check"></i> Prestação de Contas ao Estado</h2>
<p>Além de registar as suas operações, uma entidade pública tem o dever de <strong>prestar contas</strong> periodicamente às entidades de tutela e de controlo do Estado, demonstrando que a dotação foi usada dentro dos limites aprovados e para os fins previstos. Isto exige uma disciplina de registo muito mais rígida do que numa empresa privada pequena: cada despesa deve estar ligada a uma rubrica orçamental específica, com documentação de suporte completa (contrato, nota de encomenda, auto de recepção, factura).</p>
<p>Esta exigência de rastreabilidade completa — de cada Kwanza gasto até ao documento que o justifica — é a principal diferença prática entre a contabilidade pública e a contabilidade de uma empresa privada semelhante em tamanho. Uma pequena empresa privada pode, em muitos casos, tolerar alguma informalidade documental sem grandes consequências imediatas; uma entidade pública não tem essa margem, porque está a prestar contas sobre dinheiro que não é seu, mas de toda a sociedade.</p>
</div>
<div class="tl"><div class="tli"><div class="tld">1</div><div class="tlc"><h4>Registar a dotação orçamental aprovada</h4><p>Por rubrica, no início do exercício.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Registar o compromisso</h4><p>No momento em que a entidade assume a obrigação (contrato, nota de encomenda).</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Registar a liquidação</h4><p>Quando o bem ou serviço é confirmado como recebido/prestado.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Registar o pagamento</h4><p>Na saída efectiva de fundos da tesouraria pública.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Prestar contas</h4><p>Reportar periodicamente a execução orçamental às entidades de tutela e controlo.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Pagar Sem Dotação Disponível na Rubrica</h2>
<p>Um erro grave na gestão pública é autorizar uma despesa numa rubrica orçamental que já não tem dotação disponível, confiando que "vai dar para ajustar depois". Se o instituto de Luanda já tinha comprometido 95% da rubrica de "material de escritório" e ainda assim autoriza uma nova compra de Kz 3.000.000 nessa rubrica, está a gerar um desvio orçamental que compromete a prestação de contas e pode gerar responsabilização do gestor público.</p>
<div class="wb"><strong>Atenção:</strong> ao contrário de uma empresa privada, que pode financiar um excesso de despesa com um empréstimo bancário, uma entidade pública normalmente não pode simplesmente "gastar mais e resolver depois" — a disciplina orçamental é um princípio central da gestão financeira pública.</div>
<div class="hi"><strong>Como evitar:</strong> verificar sempre a dotação disponível numa rubrica antes de assumir qualquer novo compromisso, e nunca autorizar despesa acima do saldo orçamental restante sem reforço formal de dotação.</div>
</div>
<div class="lawbox"><div class="lt">SISTAC</div><blockquote>Sistema que estrutura o registo contábil e a prestação de contas das entidades do sector público em Angola, organizando a execução orçamental em compromisso, liquidação e pagamento.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Um instituto público tem dotação orçamental anual de Kz 500.000.000 e já executou Kz 320.000.000 até Setembro. Qual é a taxa de execução orçamental?</div>
<div class="qo" onclick="cq(this,false)">a) 32%</div>
<div class="qo" onclick="cq(this,true)">b) 64%</div>
<div class="qo" onclick="cq(this,false)">c) 75%</div>
<div class="qo" onclick="cq(this,false)">d) 156%</div>
</div>`},
{t:'Planeamento Fiscal e Otimização Legal do Encargo Tributário', html:`
<div class="cb"><h2><i class="fas fa-chess"></i> O Caso da Metalúrgica Kianda</h2>
<p>A Metalúrgica Kianda, com fábrica em Viana, apura um lucro tributável estimado de <strong>Kz 10.000.000</strong> antes de considerar a compra planeada de uma nova máquina. O director financeiro sabe que o <strong>Imposto Industrial</strong> incide à taxa de <strong>25%</strong> sobre o lucro tributável, e quer perceber se a forma como estrutura esta compra pode reduzir, de forma totalmente legal, o imposto a pagar este ano.</p>
</div>
<div class="cb"><h2><i class="fas fa-gavel"></i> Planeamento Fiscal Legal vs. Evasão Fiscal Ilegal</h2>
<p>É essencial distinguir dois conceitos que soam parecidos mas são radicalmente diferentes. <strong>Planeamento fiscal</strong> (também chamado elisão fiscal) é a escolha, entre alternativas todas legais, daquela que resulta num encargo tributário menor — por exemplo, antecipar uma depreciação permitida, escolher entre comprar ou alugar um equipamento, ou aproveitar um benefício fiscal a que a empresa tem direito. <strong>Evasão fiscal</strong> é diferente: envolve esconder factos, falsificar documentos ou declarar operações que não correspondem à realidade, para pagar menos imposto do que realmente é devido por lei — isto é crime.</p>
<div class="hi"><strong>Regra prática:</strong> se a estratégia depende de a AGT nunca descobrir um facto real que foi escondido, é evasão. Se a estratégia depende apenas de usar de forma inteligente regras que a própria lei permite, é planeamento fiscal legítimo.</div>
<p>Um bom teste prático para qualquer gestor: se a operação fosse totalmente transparente perante a AGT — com todos os documentos apresentados sem qualquer receio — o resultado fiscal continuaria o mesmo? No planeamento fiscal legítimo, a resposta é sempre sim, porque não há nada a esconder. Na evasão fiscal, a resposta é não, porque toda a vantagem depende precisamente de a operação nunca ser examinada com atenção.</p>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo Numérico: O Efeito da Depreciação Adicional</h2>
<p>A Metalúrgica Kianda tem lucro tributável estimado de Kz 10.000.000 antes de decidir sobre a compra da máquina. Se comprar e colocar a máquina em funcionamento ainda este ano, pode reconhecer uma depreciação adicional de Kz 2.000.000 (correspondente à quota-parte de amortização do ano), o que reduz o lucro tributável antes do Imposto Industrial.</p>
<div class="tw"><table class="dt"><tr><th>Cenário</th><th>Lucro tributável</th><th>Imposto Industrial (25%)</th></tr>
<tr><td>Sem comprar a máquina este ano</td><td>Kz 10.000.000</td><td>Kz 2.500.000</td></tr>
<tr><td>Comprando e depreciando este ano</td><td>Kz 8.000.000</td><td>Kz 2.000.000</td></tr>
</table></div>
<div class="hi"><strong>Poupança fiscal legítima = 2.500.000 − 2.000.000 = Kz 500.000, apenas por antecipar uma decisão de investimento que a empresa já ia tomar de qualquer forma.</strong></div>
<p>Repare que a Kianda não deixou de investir Kz 2.000.000 em capital real (a máquina existe, foi paga, está a trabalhar) — apenas escolheu o momento fiscalmente mais eficiente para o fazer, dentro das regras normais de depreciação de activos.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Outras Alavancas Legítimas de Planeamento Fiscal</h2>
<ul>
<li><strong>Momento do reconhecimento de gastos:</strong> antecipar, dentro do exercício e das regras aplicáveis, gastos já previstos, em vez de os adiar sem necessidade.</li>
<li><strong>Escolha entre compra e locação de equipamento:</strong> cada opção tem um efeito diferente sobre o lucro tributável e o fluxo de caixa.</li>
<li><strong>Aproveitamento de deduções e créditos fiscais a que a empresa tem direito</strong>, sem exceder o que a lei permite.</li>
<li><strong>Estruturação eficiente de retenções na fonte</strong> em pagamentos a terceiros, cumprindo rigorosamente as obrigações estudadas no Módulo 2.</li>
</ul>
<p>Nenhuma destas alavancas funciona isoladamente de forma mágica — todas exigem que a decisão subjacente já fizesse sentido para o negócio, independentemente do efeito fiscal. A Metalúrgica Kianda não comprou a máquina "para pagar menos imposto": comprou a máquina porque precisava de aumentar a capacidade produtiva, e escolheu apenas o momento certo, dentro do exercício, para o fazer. É esta ordem de prioridades — primeiro a decisão de negócio, depois a optimização fiscal do timing — que distingue o planeamento fiscal saudável de uma engenharia fiscal artificial e arriscada.</p>
</div>
<div class="tl"><div class="tli"><div class="tld">1</div><div class="tlc"><h4>Projectar o lucro tributável do exercício</h4><p>Com base nos resultados já apurados e nas operações previstas até ao fecho.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Identificar decisões ainda em aberto</h4><p>Investimentos, compras, momento de facturação — que têm efeito fiscal diferente consoante o timing.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Simular cenários alternativos</h4><p>Calcular o Imposto Industrial resultante de cada opção legal disponível.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Escolher e documentar a opção mais eficiente</h4><p>Registando a justificação económica real da decisão, não só o efeito fiscal.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Confundir Planeamento com Simulação de Operações</h2>
<p>O erro mais perigoso nesta área é "criar" gastos que não correspondem a nenhuma operação económica real — por exemplo, registar uma factura de serviços que nunca foram prestados, só para reduzir o lucro tributável. Isto não é planeamento fiscal, é <strong>evasão fiscal</strong>, e transforma um erro de gestão num crime fiscal com consequências muito mais graves do que uma simples correcção de imposto.</p>
<div class="wb"><strong>Atenção:</strong> toda a decisão de planeamento fiscal deve corresponder a uma operação económica real e documentada — a máquina da Kianda existe fisicamente e está a produzir; uma factura de serviços fictícios não tem nenhuma realidade por trás.</div>
<div class="hi"><strong>Como evitar:</strong> nunca aceitar uma estratégia de "redução de imposto" que não consiga explicar com uma operação económica real, documentada e defensável perante uma fiscalização da AGT.</div>
</div>
<div class="lawbox"><div class="lt">Imposto Industrial — taxa de 25%</div><blockquote>Incide sobre o lucro tributável apurado segundo as regras contábeis e fiscais aplicáveis, sendo a base sobre a qual actua todo o planeamento fiscal legítimo.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Metalúrgica Kianda tem lucro tributável de Kz 10.000.000. Ao antecipar uma depreciação de Kz 2.000.000 sobre uma máquina real já comprada, o lucro tributável cai para Kz 8.000.000. Qual a poupança de Imposto Industrial (25%) obtida de forma legítima?</div>
<div class="qo" onclick="cq(this,false)">a) Kz 2.000.000</div>
<div class="qo" onclick="cq(this,true)">b) Kz 500.000</div>
<div class="qo" onclick="cq(this,false)">c) Kz 2.500.000</div>
<div class="qo" onclick="cq(this,false)">d) Kz 1.000.000</div>
</div>`},
{t:'Preços de Transferência e Operações com Partes Relacionadas', html:`
<div class="cb"><h2><i class="fas fa-globe"></i> O Caso da AngoMinas, Lda</h2>
<p>A AngoMinas, Lda é uma subsidiária angolana de um grupo multinacional. Compra matéria-prima de processamento directamente à sua matriz estrangeira, que também lhe é fornecedora exclusiva. O preço praticado entre as duas empresas do mesmo grupo é de <strong>Kz 800 por unidade</strong>. Uma pesquisa de mercado mostra que empresas independentes (sem qualquer relação societária entre si) compram matéria-prima equivalente, de fornecedores comparáveis, a um preço médio de <strong>Kz 600 por unidade</strong>.</p>
<p>Esta diferença não é acidental — é exactamente o tipo de situação que a matéria de <strong>preços de transferência</strong> existe para regular.</p>
</div>
<div class="cb"><h2><i class="fas fa-people-arrows"></i> O Princípio de Plena Concorrência</h2>
<p>Quando duas empresas pertencem ao mesmo grupo económico (partes relacionadas), podem ser tentadas a fixar preços entre si de forma a deslocar lucro para onde for fiscalmente mais vantajoso — por exemplo, comprando caro a uma subsidiária num país com imposto baixo, o que reduz artificialmente o lucro tributável na subsidiária angolana, sujeita a Imposto Industrial de 25%. O <strong>princípio de plena concorrência</strong> exige que as operações entre partes relacionadas sejam praticadas a preços equivalentes aos que seriam praticados entre empresas independentes, em condições comparáveis de mercado.</p>
<div class="ib">Partes relacionadas não são apenas empresas do mesmo grupo internacional — também podem ser duas empresas angolanas controladas pelos mesmos sócios, ou uma empresa e o seu sócio maioritário a título individual.</div>
<p>O objectivo deste princípio não é impedir que empresas do mesmo grupo façam negócios entre si — isso é normal e legítimo — mas garantir que essas operações internas não sejam usadas como um instrumento para deslocar lucro tributável de um país (ou de uma empresa) para outro, à margem da actividade económica real que cada uma efectivamente desempenha.</p>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo Numérico: Calculando o Ajuste</h2>
<p>Se a AngoMinas compra 10.000 unidades por ano à matriz, a Kz 800/unidade, mas o preço de mercado comparável (entre empresas independentes) é de Kz 600/unidade, o custo declarado pela AngoMinas está sobrestimado em relação ao que seria praticado em condições de plena concorrência.</p>
<div class="tw"><table class="dt"><tr><th>Elemento</th><th>Valor</th></tr>
<tr><td>Preço praticado entre partes relacionadas</td><td>Kz 800/unidade</td></tr>
<tr><td>Preço de mercado comparável (partes independentes)</td><td>Kz 600/unidade</td></tr>
<tr><td>Diferença por unidade</td><td>Kz 200/unidade</td></tr>
<tr><td>Quantidade anual</td><td>10.000 unidades</td></tr>
</table></div>
<div class="hi"><strong>Ajuste ao lucro tributável = (800 − 600) × 10.000 = Kz 2.000.000, valor que deve ser acrescido de volta ao lucro tributável da AngoMinas, mesmo tendo sido registado como custo nos seus livros.</strong></div>
<p>Este ajuste não significa que o dinheiro voltou fisicamente à AngoMinas — significa apenas que, para efeitos de apuramento do Imposto Industrial, os Kz 2.000.000 de custo excedente em relação ao preço de mercado não são aceites como gasto dedutível, aumentando a base tributável e, consequentemente, o imposto devido.</p>
</div>
<div class="cb"><h2><i class="fas fa-file-lines"></i> Documentação e Justificação</h2>
<p>Empresas com operações relevantes entre partes relacionadas devem manter documentação que demonstre que os preços praticados respeitam o princípio de plena concorrência — estudos de comparabilidade, propostas alternativas de fornecedores independentes, contratos, e a metodologia usada para chegar ao preço praticado. Sem esta documentação, é a própria empresa que fica em posição fraca para defender os seus preços perante uma fiscalização.</p>
<p>Na prática, o método mais directo de comparabilidade — e o que a AngoMinas devia ter usado desde o início — é comparar o preço praticado com propostas reais de fornecedores independentes para o mesmo tipo de matéria-prima, em quantidades e condições semelhantes. Se a empresa já tivesse pedido, todos os anos, pelo menos duas cotações de fornecedores alternativos não relacionados, teria um dossiê de comparabilidade pronto a apresentar a qualquer momento, em vez de ter de o reconstruir sob pressão depois de uma notificação da AGT.</p>
</div>
<div class="tl"><div class="tli"><div class="tld">1</div><div class="tlc"><h4>Identificar todas as operações com partes relacionadas</h4><p>Compras, vendas, empréstimos, prestação de serviços, cedência de marca.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Pesquisar preços comparáveis de mercado</h4><p>Entre empresas independentes, em condições semelhantes.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Comparar o preço praticado com o preço de mercado</h4><p>E calcular o eventual desvio.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Documentar a justificação ou corrigir o preço</h4><p>Guardar evidência de comparabilidade ou ajustar o preço praticado para o nível de mercado.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Ignorar Operações "Internas ao Grupo" Como se Não Tivessem Efeito Fiscal</h2>
<p>Um erro frequente é a gestão local tratar as compras à matriz como uma questão puramente operacional, sem perceber que têm um efeito fiscal directo e mensurável em Angola. Se a AngoMinas nunca documentar nem justificar o preço de Kz 800/unidade, corre o risco de, numa fiscalização, ver este preço integralmente questionado, com o ajuste de Kz 2.000.000/ano incidindo não apenas no ano corrente mas potencialmente em vários exercícios anteriores ainda não prescritos.</p>
<div class="wb"><strong>Atenção:</strong> ajustes de preços de transferência não corrigidos atempadamente tendem a acumular-se ao longo de vários exercícios, tornando o impacto financeiro de uma eventual fiscalização muito maior do que se tivesse sido tratado no ano em que ocorreu.</div>
<div class="hi"><strong>Como evitar:</strong> tratar toda a operação relevante com partes relacionadas como uma questão fiscal desde o início, com documentação de comparabilidade preparada antes, não depois, de uma fiscalização.</div>
</div>
<div class="lawbox"><div class="lt">Imposto Industrial — taxa de 25%</div><blockquote>Incide sobre o lucro tributável, que deve reflectir operações entre partes relacionadas a preços equivalentes aos de mercado — custos excedentes face ao preço de plena concorrência não são fiscalmente dedutíveis.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A AngoMinas compra 10.000 unidades/ano à matriz a Kz 800/unidade, quando o preço de mercado comparável é Kz 600/unidade. Qual o valor a acrescer ao lucro tributável, por ano, pelo ajuste de preços de transferência?</div>
<div class="qo" onclick="cq(this,false)">a) Kz 8.000.000</div>
<div class="qo" onclick="cq(this,true)">b) Kz 2.000.000</div>
<div class="qo" onclick="cq(this,false)">c) Kz 6.000.000</div>
<div class="qo" onclick="cq(this,false)">d) Kz 200.000</div>
</div>`},
{t:'Simulação Completa: Um Ano de Contabilidade de uma Empresa', html:`
<div class="cb"><h2><i class="fas fa-calendar-days"></i> A Kianda Confecções, Lda: Um Ano Completo</h2>
<p>Esta aula não introduz matéria nova — junta tudo o que aprendeste nos três módulos num único fio condutor: um ano inteiro de vida de uma PME angolana, a <strong>Kianda Confecções, Lda</strong>, fábrica de roupa em Viana. Vamos percorrer 8 eventos reais, mês a mês, exactamente como aconteceriam na prática, cada um com números trabalhados.</p>
</div>
<div class="cb"><h2><i class="fas fa-1"></i> Janeiro — Constituição da Empresa</h2>
<p>Dois sócios constituem a Kianda Confecções com capital social de <strong>Kz 2.000.000</strong>, todo em dinheiro, entrando 50/50.</p>
<div class="hi"><strong>Lançamento:</strong> Débito Bancos Kz 2.000.000 — Crédito Capital Social Kz 2.000.000.</div>
</div>
<div class="cb"><h2><i class="fas fa-2"></i> Fevereiro — Compra de Máquinas de Costura</h2>
<p>A empresa compra máquinas industriais de costura por <strong>Kz 1.500.000</strong>, a pagar. Aplicando uma taxa de amortização anual de 20% (vida útil de 5 anos, tal como estudado no Módulo 1):</p>
<div class="hi"><strong>Amortização anual = 1.500.000 × 20% = Kz 300.000/ano → Kz 25.000/mês.</strong></div>
</div>
<div class="cb"><h2><i class="fas fa-3"></i> Março — Vendas, Compras e Apuramento de IVA</h2>
<p>No primeiro mês de produção plena, a Kianda vende Kz 3.000.000 (sem IVA) e compra Kz 1.200.000 (sem IVA) de tecido e aviamentos, ambos à taxa normal de IVA de 14%.</p>
<div class="tw"><table class="dt"><tr><th>Operação</th><th>Base</th><th>IVA (14%)</th></tr>
<tr><td>Vendas (IVA liquidado)</td><td>Kz 3.000.000</td><td>Kz 420.000</td></tr>
<tr><td>Compras (IVA dedutível)</td><td>Kz 1.200.000</td><td>Kz 168.000</td></tr>
</table></div>
<div class="hi"><strong>IVA a pagar à AGT = 420.000 − 168.000 = Kz 252.000.</strong></div>
</div>
<div class="cb"><h2><i class="fas fa-4"></i> Abril — Processamento Salarial</h2>
<p>A Kianda tem uma costureira com salário bruto de <strong>Kz 250.000</strong>. A contribuição do trabalhador para o INSS é de 3% e a da empresa de 8%:</p>
<div class="tw"><table class="dt"><tr><th>Elemento</th><th>Cálculo</th><th>Valor</th></tr>
<tr><td>INSS trabalhador (3%)</td><td>250.000 × 3%</td><td>Kz 7.500</td></tr>
<tr><td>INSS empresa (8%)</td><td>250.000 × 8%</td><td>Kz 20.000</td></tr>
</table></div>
<div class="ib">O IRT é retido segundo a tabela progressiva por escalões estudada no Módulo 2, incidindo sobre a remuneração após a dedução da contribuição do trabalhador para o INSS.</div>
</div>
<div class="cb"><h2><i class="fas fa-5"></i> Maio — Empréstimo Bancário</h2>
<p>A empresa contrai um empréstimo de <strong>Kz 1.000.000</strong> a 20% ao ano, para reforçar o fundo de maneio.</p>
<div class="hi"><strong>Juro mensal = 1.000.000 × 20% ÷ 12 = Kz 16.667.</strong></div>
</div>
<div class="cb"><h2><i class="fas fa-6"></i> Junho — Provisão para Crédito Incobrável</h2>
<p>Um cliente que devia Kz 180.000 desde Março entra em incumprimento prolongado, sem resposta a nenhuma tentativa de cobrança. A Kianda decide constituir uma <strong>provisão</strong> para este crédito, reconhecendo o risco de não recuperar o valor sem, ainda, o anular definitivamente das contas.</p>
<div class="hi"><strong>Lançamento:</strong> Débito Gastos com Provisões Kz 180.000 — Crédito Provisões para Cobranças Duvidosas Kz 180.000.</div>
</div>
<div class="cb"><h2><i class="fas fa-7"></i> Novembro — Compra de um Segundo Lote de Máquinas (Planeamento Fiscal)</h2>
<p>Prevendo um bom resultado anual, a gerência decide antecipar para Novembro (em vez de esperar até ao ano seguinte) a compra de mais equipamento, de forma a beneficiar já este ano da respectiva amortização — uma decisão de planeamento fiscal legítimo, tal como estudado numa aula anterior deste módulo.</p>
<p>Este investimento adicional de Kz 900.000 em novo equipamento gera mais Kz 180.000/ano de amortização (20% de 900.000), reforçando a produção da Kianda para o ano seguinte e, ao mesmo tempo, reduzindo ligeiramente o lucro tributável de Dezembro — exactamente o tipo de decisão que junta uma necessidade real do negócio a uma vantagem fiscal legítima, sem qualquer operação artificial por trás.</p>
</div>
<div class="cb"><h2><i class="fas fa-8"></i> Dezembro — Apuramento do Imposto Industrial Anual</h2>
<p>No fecho do exercício, depois de todos os proveitos e gastos do ano lançados (incluindo amortizações, juros, provisões e IVA), a Kianda apura um lucro tributável de <strong>Kz 6.000.000</strong>.</p>
<div class="hi"><strong>Imposto Industrial = 6.000.000 × 25% = Kz 1.500.000, a declarar através da Declaração Liquidação Periódica (DLP) estudada no Módulo 2.</strong></div>
<div class="tw"><table class="dt"><tr><th>Evento</th><th>Mês</th><th>Efeito</th></tr>
<tr><td>Constituição</td><td>Janeiro</td><td>Capital social Kz 2.000.000</td></tr>
<tr><td>Compra de máquinas</td><td>Fevereiro</td><td>Amortização Kz 25.000/mês</td></tr>
<tr><td>Vendas e compras</td><td>Março</td><td>IVA a pagar Kz 252.000</td></tr>
<tr><td>Salários</td><td>Abril</td><td>INSS empresa Kz 20.000/mês</td></tr>
<tr><td>Empréstimo</td><td>Maio</td><td>Juro Kz 16.667/mês</td></tr>
<tr><td>Provisão de crédito</td><td>Junho</td><td>Gasto de Kz 180.000</td></tr>
<tr><td>Novo investimento</td><td>Novembro</td><td>Amortização adicional</td></tr>
<tr><td>Fecho anual</td><td>Dezembro</td><td>Imposto Industrial Kz 1.500.000</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Tratar Cada Evento Isoladamente</h2>
<p>O erro mais comum de uma contabilista iniciante é lançar cada operação do ano isoladamente, sem verificar se os efeitos se acumulam correctamente até ao fecho — por exemplo, esquecer que a amortização de Fevereiro continua a repetir-se todos os meses seguintes, ou que a provisão de Junho continua no balanço até ser resolvida.</p>
<div class="hi"><strong>Como evitar:</strong> manter um mapa de acompanhamento mensal (como a tabela acima) que mostre, evento a evento, quais os efeitos que se repetem mês a mês e quais são pontuais.</div>
</div>
<div class="cb"><h2><i class="fas fa-book"></i> Lendo o Ano na Íntegra</h2>
<p>Olhando para o ano completo da Kianda Confecções, cada evento isolado é simples — o que exige prática é vê-los todos ao mesmo tempo, tal como um contabilista faz no dia-a-dia real. A amortização iniciada em Fevereiro continua a correr em Março, Abril e em todos os meses seguintes, mesmo sem aparecer explicitamente em cada aula deste caso. O mesmo acontece com o juro do empréstimo de Maio e com a contribuição de INSS da empresa: são gastos recorrentes que se acumulam mês após mês até ao fecho de Dezembro, e é essa acumulação — não cada lançamento isolado — que determina o lucro tributável final de Kz 6.000.000.</p>
</div>
