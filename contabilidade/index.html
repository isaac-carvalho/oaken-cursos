const M2 = {
  n:2, fase:1, img:IMG.fiscalidade,
  titulo:'Fiscalidade Angolana',
  desc:'Moeda estrangeira, processamento salarial, IVA, IRT, INSS, Imposto Industrial, Imposto Predial, Retenções na Fonte, Obrigações Declarativas e muito mais. Domine a relação com a AGT.',
  aulas:[
{t:'Operações em Moeda Estrangeira e Diferenças Cambiais', html:`
<div class="cb"><h2><i class="fas fa-store"></i> Cenário: a Import Center Lda, em Viana</h2>
<p>A Import Center Lda é uma empresa de Viana que importa peças de reposição de Portugal e da África do Sul. Em Março, comprou mercadoria a um fornecedor sul-africano por 15.000 USD, a crédito, com pagamento previsto para Junho. No dia da compra, a taxa de câmbio de referência do BNA era de 920 Kz por USD. A contabilista registou a dívida em Kwanzas, como manda a lei angolana — mas sabia que, até o pagamento acontecer, aquele valor em Kz ia oscilar todos os meses, mesmo sem nenhuma transacção nova acontecer. Esta é a realidade de qualquer empresa angolana que compra, vende, empresta ou recebe em moeda estrangeira: o câmbio é uma variável viva dentro da contabilidade, e quem não sabe tratá-la correctamente distorce o resultado do exercício.</p>
</div>
<div class="cb"><h2><i class="fas fa-exchange-alt"></i> O princípio da moeda funcional</h2>
<p>Em Angola, a moeda funcional e de relato é o <strong>Kwanza (Kz)</strong>. Isto significa que, independentemente da moeda em que uma operação é negociada ou facturada, ela tem de ser <strong>convertida para Kwanzas no momento do registo contabilístico</strong>, usando a taxa de câmbio de referência publicada pelo Banco Nacional de Angola (BNA) na data da transacção. Uma factura em USD, EUR ou ZAR nunca entra directamente no diário — entra sempre convertida.</p>
<p>O desafio surge porque muitos elementos do balanço não se "resolvem" no mesmo dia em que nascem. Uma dívida a um fornecedor estrangeiro, um empréstimo em moeda estrangeira, ou uma conta bancária em USD ficam <strong>expostos ao câmbio</strong> enquanto não forem liquidados ou convertidos. É esta exposição contínua que obriga a reavaliações periódicas.</p>
<div class="hi"><strong>Regra de ouro:</strong> todo o item monetário em moeda estrangeira (contas a pagar, contas a receber, caixa, depósitos, empréstimos) tem de ser reavaliado à taxa de câmbio de fecho em cada data de relato — mensal, trimestral ou anual, conforme a periodicidade da empresa.</p></div>
</div>
<div class="cb"><h2><i class="fas fa-scale-balanced"></i> Itens monetários vs. itens não monetários</h2>
<p>Nem tudo o que está expresso originalmente em moeda estrangeira continua sujeito a reavaliação cambial. É essencial distinguir dois tipos de itens:</p>
<ul>
<li><strong>Itens monetários</strong> — direitos e obrigações a receber ou pagar em quantias fixas de dinheiro: dívidas a fornecedores, dívidas de clientes, empréstimos bancários, contas caixa e bancos em moeda estrangeira. Estes <strong>são sempre reavaliados</strong> à taxa de fecho.</li>
<li><strong>Itens não monetários</strong> — activos como existências, imobilizado ou adiantamentos já pagos, que ficam registados à taxa de câmbio da data da transacção original e <strong>não são reavaliados</strong> por variação cambial (só por outras regras, como imparidade).</li>
</ul>
<div class="ib">Uma existência comprada em USD e já paga fica "congelada" ao câmbio do dia da compra. Uma dívida ainda por pagar em USD continua a mexer com o câmbio até ser liquidada.</div>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo trabalhado: a dívida da Import Center</h2>
<p>Vamos seguir o caso da Import Center Lda passo a passo.</p>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Registo inicial (Março)</h4><p>Dívida de 15.000 USD, câmbio do dia 920 Kz/USD. Valor registado: 15.000 × 920 = <strong>13.800.000 Kz</strong>. Débito em Compras/Existências, Crédito em Fornecedores (Classe 2) por 13.800.000 Kz.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Reavaliação ao fecho (data de relato, antes do pagamento)</h4><p>O câmbio do BNA sobe para 955 Kz/USD. O valor da dívida, reavaliado, passa a ser: 15.000 × 955 = <strong>14.325.000 Kz</strong>.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Cálculo da diferença cambial</h4><p>Diferença = 14.325.000 − 13.800.000 = <strong>525.000 Kz</strong>. Como a dívida em Kz aumentou (o Kwanza desvalorizou face ao USD), isto é uma <strong>perda cambial (diferença cambial passiva/desfavorável)</strong>: Débito na Classe 6 (Gastos financeiros — diferenças de câmbio desfavoráveis), Crédito na Classe 2 (aumenta a dívida a Fornecedores).</p></div></div>
</div>
<div class="hi"><strong>Resultado:</strong> a dívida da Import Center passa de 13.800.000 Kz para 14.325.000 Kz no balanço, e reconhece-se uma perda cambial de 525.000 Kz no resultado do exercício — mesmo sem ter pago um único Kwanza a mais ao fornecedor.</div>
<p>Se, pelo contrário, o Kwanza tivesse valorizado (câmbio descesse, por exemplo, para 890 Kz/USD), a dívida reavaliada seria 15.000 × 890 = 13.350.000 Kz, ou seja, menor que o valor original — e reconhecer-se-ia um <strong>ganho cambial (diferença cambial activa/favorável)</strong>, lançado a crédito na Classe 7 (Réditos e ganhos — diferenças de câmbio favoráveis).</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Procedimento prático de reavaliação cambial</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Levantar todos os saldos em moeda estrangeira</h4><p>Listar contas a pagar, contas a receber, caixa e bancos ainda expressos ou originados em USD, EUR ou outra moeda, à data de fecho.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Obter a taxa de câmbio de referência do BNA</h4><p>Usar sempre a taxa publicada pelo Banco Nacional de Angola na data de fecho — nunca uma taxa de câmbio paralela ou de mercado informal.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Recalcular cada saldo ao novo câmbio</h4><p>Multiplicar a quantidade em moeda estrangeira pela taxa de fecho, obtendo o novo valor em Kz.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Lançar a diferença cambial</h4><p>Comparar o valor novo com o valor anterior registado nas contas. Lançar a diferença na Classe 6 (perda) ou Classe 7 (ganho), conforme o sentido da variação.</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro comum: esquecer de reavaliar contas bancárias em moeda estrangeira</h2>
<p>Um erro muito frequente em empresas angolanas com contas em USD (comum em empresas de importação, petrolíferas subcontratadas e ONGs) é reavaliar apenas as dívidas a fornecedores e esquecer o saldo da própria conta bancária em moeda estrangeira. Isto distorce o balanço, porque o saldo de caixa/bancos em Kz fica desactualizado face ao câmbio real, e a demonstração de resultados não reflecte o ganho ou a perda cambial que efectivamente ocorreu sobre esse dinheiro parado na conta. Numa auditoria ou numa inspecção da AGT, esta omissão é facilmente detectável comparando o extracto bancário em moeda estrangeira com o valor registado em Kz nas demonstrações financeiras.</p>
<div class="hi"><strong>Como evitar:</strong> incluir sistematicamente todas as contas bancárias e de caixa em moeda estrangeira na lista de itens monetários a reavaliar em cada fecho, sem excepção — mesmo que o saldo pareça pequeno ou estável.</div>
</div>
<div class="lawbox"><div class="lt">Princípio contabilístico — moeda de relato</div><blockquote>As demonstrações financeiras de entidades angolanas devem ser expressas em Kwanzas, exigindo a conversão de todas as operações em moeda estrangeira à taxa de câmbio do Banco Nacional de Angola aplicável à data de cada operação e à data de cada reavaliação de itens monetários.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Import Center Lda tem uma dívida de 15.000 USD registada a 920 Kz/USD (13.800.000 Kz). Na data de fecho, o câmbio do BNA está em 955 Kz/USD. Qual o lançamento correcto?</div>
<div class="qo" onclick="cq(this,false)">a) Ganho cambial de 525.000 Kz, lançado na Classe 7</div>
<div class="qo" onclick="cq(this,true)">b) Perda cambial de 525.000 Kz, lançado a Débito na Classe 6 e Crédito na Classe 2</div>
<div class="qo" onclick="cq(this,false)">c) Não há lançamento, porque a dívida ainda não foi paga</div>
<div class="qo" onclick="cq(this,false)">d) Perda cambial de 13.800.000 Kz, anulando a dívida original</div>
</div>`},
{t:'Processamento Salarial: Remunerações, IRT e INSS', html:`
<div class="cb"><h2><i class="fas fa-users"></i> Cenário: o processamento salarial da Huambo Distribuição</h2>
<p>É dia 25 do mês e a Huambo Distribuição, uma pequena distribuidora de bebidas no Huambo, precisa de fechar a folha de salários de Junho. O gerente de recursos humanos entrega à contabilista a lista de trabalhadores com os respectivos salários base e subsídios. Para cada trabalhador, ela tem de calcular, com exactidão, quanto vai para o Estado (IRT), quanto vai para a Segurança Social (INSS) e quanto o trabalhador efectivamente recebe na conta. Um erro de cálculo aqui não é só um problema interno — pode gerar reclamações dos trabalhadores, subentregas ao Estado (com juros de mora) ou sobre-retenções que geram processos de reembolso. Vamos usar o caso de um trabalhador da Huambo Distribuição, o técnico comercial Kiluanje, para percorrer o cálculo completo, do bruto ao líquido.</p>
</div>
<div class="cb"><h2><i class="fas fa-money-bill-wave"></i> A estrutura da remuneração</h2>
<p>Antes de calcular qualquer imposto, é preciso entender a composição do salário. A remuneração mensal de um trabalhador angolano tipicamente inclui:</p>
<ul>
<li><strong>Salário base</strong> — o valor fixo acordado no contrato de trabalho.</li>
<li><strong>Subsídios regulares</strong> — por exemplo, subsídio de função, subsídio de risco, subsídio de chefia — normalmente sujeitos a IRT e a INSS como o salário base.</li>
<li><strong>Subsídios com tratamento especial</strong> — como o subsídio de alimentação e o subsídio de transporte, que em muitas empresas têm um tratamento fiscal diferenciado consoante o seu valor e a política interna, pelo que a empresa deve confirmar, caso a caso, se determinada componente entra ou não na base tributável do mês.</li>
</ul>
<p>Para efeitos deste exercício, vamos considerar o caso mais comum: um trabalhador com <strong>salário base + subsídio de função</strong>, ambos integralmente sujeitos a IRT e INSS — o cenário típico de um técnico comercial sem outras componentes variáveis nesse mês.</p>
</div>
<div class="cb"><h2><i class="fas fa-table"></i> A tabela de IRT</h2>
<p>O <strong>IRT (Imposto sobre o Rendimento do Trabalho)</strong> é calculado por uma tabela progressiva por escalões: quanto maior o rendimento, maior a taxa marginal aplicada à parte do rendimento que cai nesse escalão. Para simplificar o cálculo, usa-se uma <strong>parcela a abater</strong>, que já incorpora o efeito da progressividade dos escalões anteriores.</p>
<div class="tw"><table class="dt"><tr><th>Rendimento mensal (Kz)</th><th>Taxa</th><th>Parcela a abater</th></tr>
<tr><td>Até 100.000</td><td>Isento</td><td>0</td></tr>
<tr><td>100.001 a 200.000</td><td>10%</td><td>10.000</td></tr>
<tr><td>200.001 a 500.000</td><td>15%</td><td>20.000</td></tr>
<tr><td>500.001 a 1.000.000</td><td>20%</td><td>45.000</td></tr>
<tr><td>Acima de 1.000.000</td><td>25%</td><td>95.000</td></tr>
</table></div>
<div class="ib">A fórmula geral é: <strong>IRT = (Rendimento tributável × Taxa do escalão) − Parcela a abater</strong>. A parcela a abater evita que se tenha de calcular o imposto escalão a escalão manualmente — o resultado é matematicamente equivalente.</div>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo trabalhado: o salário do Kiluanje</h2>
<p>O Kiluanje tem salário base de <strong>350.000 Kz</strong> e subsídio de função de <strong>40.000 Kz</strong>, ambos sujeitos a IRT e INSS.</p>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Apurar o rendimento bruto tributável</h4><p>350.000 + 40.000 = <strong>390.000 Kz</strong>.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Identificar o escalão de IRT</h4><p>390.000 Kz está no escalão "200.001 a 500.000", com taxa de 15% e parcela a abater de 20.000 Kz.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Calcular o IRT</h4><p>IRT = (390.000 × 15%) − 20.000 = 58.500 − 20.000 = <strong>38.500 Kz</strong>.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Calcular o INSS do trabalhador</h4><p>INSS = 390.000 × 3% = <strong>11.700 Kz</strong>.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Apurar o salário líquido</h4><p>Líquido = 390.000 − 38.500 − 11.700 = <strong>339.800 Kz</strong>.</p></div></div>
</div>
<div class="hi"><strong>Resultado final:</strong> o Kiluanje recebe 339.800 Kz líquidos. A empresa entrega 38.500 Kz de IRT à AGT e 11.700 Kz de INSS (parte do trabalhador) à Segurança Social, mais a contribuição patronal.</div>
<p>É importante não esquecer a <strong>contribuição da entidade empregadora</strong> para o INSS, que não sai do salário do trabalhador mas é um custo adicional da empresa: 8% sobre a mesma base — neste caso, 390.000 × 8% = 31.200 Kz, suportados integralmente pela Huambo Distribuição, além do salário pago.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Procedimento prático para processar a folha</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Recolher a base tributável de cada trabalhador</h4><p>Somar salário base e subsídios sujeitos a IRT/INSS nesse mês, excluindo componentes isentas ou não recorrentes que exijam tratamento especial.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Aplicar a tabela de IRT</h4><p>Identificar o escalão correcto e aplicar a fórmula com a parcela a abater correspondente.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Calcular o INSS (3% e 8%)</h4><p>Calcular a parte do trabalhador (retida no salário) e a parte patronal (custo adicional da empresa), sobre a mesma base tributável.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Emitir o recibo de vencimento</h4><p>Discriminar salário base, subsídios, IRT retido, INSS retido e o valor líquido a pagar, entregando cópia ao trabalhador.</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro comum: aplicar a taxa do escalão sobre o rendimento total sem abater a parcela</h2>
<p>Um erro clássico de quem está a aprender é calcular o IRT multiplicando apenas o rendimento pela taxa do escalão, esquecendo de subtrair a parcela a abater. No caso do Kiluanje, isto daria 390.000 × 15% = 58.500 Kz de IRT — um valor 20.000 Kz superior ao correcto (38.500 Kz). Este erro faz o trabalhador receber menos do que devia todos os meses, gera reclamações constantes, e se replicado em toda a folha de uma empresa com dezenas de trabalhadores, representa uma retenção indevida acumulada de valores elevados ao longo do ano — que depois é complicado corrigir e devolver.</p>
<div class="hi"><strong>Como evitar:</strong> nunca aplicar a taxa do escalão isoladamente — sempre subtrair a parcela a abater correspondente ao escalão identificado. Confirmar o cálculo com a fórmula completa: (Rendimento × Taxa) − Parcela a abater.</div>
</div>
<div class="lawbox"><div class="lt">Tabela de IRT — trabalho por conta de outrem</div><blockquote>Os rendimentos do trabalho até 100.000 Kz mensais estão isentos de IRT; acima desse valor, aplica-se uma tabela progressiva com taxas de 10%, 15%, 20% e 25%, consoante o escalão de rendimento.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Um trabalhador da Huambo Distribuição tem salário base de 350.000 Kz e subsídio de função de 40.000 Kz, ambos tributáveis. Qual o valor do IRT a reter?</div>
<div class="qo" onclick="cq(this,false)">a) 58.500 Kz</div>
<div class="qo" onclick="cq(this,true)">b) 38.500 Kz</div>
<div class="qo" onclick="cq(this,false)">c) 11.700 Kz</div>
<div class="qo" onclick="cq(this,false)">d) 20.000 Kz</div>
</div>`},
{t:'IVA: Liquidação, Dedução e Apuramento — Parte 1', html:`
<div class="cb"><h2><i class="fas fa-percent"></i> Cenário: a Ferragens Cabinda Lda fecha o mês</h2>
<p>A Ferragens Cabinda Lda vende material de construção a retalho e a empresas de Cabinda. Ao longo do mês de Maio, vendeu mercadoria no valor de 3.500.000 Kz (antes de imposto) e comprou mercadoria e serviços no valor de 1.800.000 Kz (antes de imposto) para revender e para uso corrente. No fim do mês, a contabilista tem de apurar quanto a empresa deve entregar à AGT a título de IVA. Este é o exercício mensal mais recorrente de qualquer empresa sujeita a IVA em Angola — e é também onde surgem mais erros de dedução indevida, que geram autuações em fiscalizações.</p>
</div>
<div class="cb"><h2><i class="fas fa-circle-info"></i> O que é o IVA e como funciona o mecanismo</h2>
<p>O <strong>IVA (Imposto sobre o Valor Acrescentado)</strong> é um imposto plurifásico que incide sobre o valor acrescentado em cada fase do circuito económico — produção, distribuição, venda a retalho. A taxa normal em Angola é de <strong>14%</strong>, aplicada sobre o valor da transacção (bens e serviços), salvo isenções específicas previstas na lei.</p>
<p>O mecanismo central do IVA é a <strong>não cumulatividade</strong>: a empresa liquida IVA sobre as suas vendas (chamado <strong>IVA liquidado</strong> ou IVA a favor do Estado), mas pode deduzir o IVA que pagou nas suas compras de bens e serviços relacionados com a sua actividade (chamado <strong>IVA dedutível</strong>). A diferença entre os dois é o que efectivamente é entregue — ou recuperado — junto da AGT.</p>
<div class="hi"><strong>IVA a pagar (ou a recuperar) = IVA Liquidado (sobre vendas) − IVA Dedutível (sobre compras)</strong></div>
</div>
<div class="cb"><h2><i class="fas fa-filter"></i> Nem todo o IVA pago é dedutível</h2>
<p>Um dos pontos mais mal compreendidos por quem está a aprender fiscalidade é assumir que todo o IVA suportado numa compra é automaticamente dedutível. Não é. Para que o IVA de uma compra seja dedutível, a compra tem de:</p>
<ul>
<li>Estar directamente relacionada com a actividade económica sujeita a IVA da empresa (não despesas pessoais dos sócios ou gerentes);</li>
<li>Estar documentada por uma <strong>factura ou documento equivalente emitido nos termos da Lei n.º 7/19 de 24 de Abril</strong>, que regula a facturação — com todos os elementos obrigatórios (NIF do emitente e do adquirente, descrição, valor, taxa e valor de IVA discriminados);</li>
<li>Não se enquadrar nas exclusões específicas do direito à dedução previstas na legislação do IVA (por exemplo, certas despesas de representação ou viaturas de turismo, consoante o regime aplicável).</li>
</ul>
<div class="wb"><strong>Atenção:</strong> uma factura de um fornecedor que não seja um documento válido nos termos da Lei n.º 7/19 (por exemplo, um simples talão sem NIF ou sem discriminação do IVA) não confere direito à dedução — mesmo que o IVA tenha sido efectivamente pago ao fornecedor.</div>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo trabalhado: o apuramento da Ferragens Cabinda</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Calcular o IVA liquidado sobre as vendas</h4><p>Vendas do mês: 3.500.000 Kz. IVA liquidado = 3.500.000 × 14% = <strong>490.000 Kz</strong>.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Calcular o IVA dedutível sobre as compras</h4><p>Compras do mês, com facturas válidas e relacionadas com a actividade: 1.800.000 Kz. IVA dedutível = 1.800.000 × 14% = <strong>252.000 Kz</strong>.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Apurar o IVA a entregar à AGT</h4><p>IVA a pagar = 490.000 − 252.000 = <strong>238.000 Kz</strong>.</p></div></div>
</div>
<div class="hi"><strong>Resultado:</strong> a Ferragens Cabinda Lda deve entregar 238.000 Kz à AGT relativamente às operações de Maio, através da declaração periódica do mês seguinte.</div>
<p>Se, num determinado mês, o IVA dedutível fosse superior ao IVA liquidado (por exemplo, num mês de grande investimento em stock), a empresa apuraria um <strong>crédito de imposto</strong>, que pode ser reportado para os períodos seguintes ou, em certas condições, pedido em reembolso.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Procedimento prático de apuramento mensal</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Reunir todas as facturas de venda emitidas no mês</h4><p>Somar os valores de base tributável e o IVA liquidado correspondente, separando operações a taxas diferentes, se aplicável.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Reunir todas as facturas de compra recebidas no mês</h4><p>Validar que cada uma cumpre os requisitos da Lei n.º 7/19 e está relacionada com a actividade, para confirmar o direito à dedução.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Somar e comparar</h4><p>Totalizar IVA liquidado e IVA dedutível separadamente, e calcular a diferença.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Preparar os dados para a declaração periódica</h4><p>O resultado deste apuramento alimenta directamente o Modelo 14, que será submetido no Portal do Contribuinte (ver a próxima aula).</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro comum: deduzir IVA de facturas sem os requisitos legais</h2>
<p>É frequente pequenas e médias empresas angolanas deduzirem o IVA de compras cujas facturas não têm todos os elementos exigidos pela Lei n.º 7/19 — por exemplo, facturas manuscritas, sem NIF do adquirente, ou com o IVA não discriminado separadamente do valor total. Quando a AGT fiscaliza e cruza estas facturas com o SAFT-AO submetido pela empresa, estas deduções são glosadas (recusadas), obrigando a empresa a pagar o IVA indevidamente deduzido, acrescido de juros de mora e possíveis multas — mesmo que a compra tenha sido real e paga.</p>
<div class="hi"><strong>Como evitar:</strong> antes de aceitar uma factura de um fornecedor, confirmar que ela cumpre os requisitos da Lei n.º 7/19 (NIF de ambas as partes, descrição clara, valor, taxa e montante de IVA discriminados). Recusar facturas incompletas e pedir a correcção ao fornecedor antes de as lançar como dedutíveis.</div>
</div>
<div class="lawbox"><div class="lt">Lei n.º 7/19, de 24 de Abril</div><blockquote>Regula a facturação em Angola, definindo os elementos obrigatórios que uma factura ou documento equivalente deve conter para ser fiscalmente válida, incluindo para efeitos de dedução do IVA.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Ferragens Cabinda Lda vendeu 3.500.000 Kz e comprou 1.800.000 Kz (valores antes de imposto, ambos sujeitos à taxa normal). Qual o valor de IVA a entregar à AGT?</div>
<div class="qo" onclick="cq(this,false)">a) 490.000 Kz</div>
<div class="qo" onclick="cq(this,false)">b) 252.000 Kz</div>
<div class="qo" onclick="cq(this,true)">c) 238.000 Kz</div>
<div class="qo" onclick="cq(this,false)">d) 742.000 Kz</div>
</div>`},
{t:'IVA: Declaração Periódica (Modelo 14) e Portal AGT — Parte 2', html:`
<div class="cb"><h2><i class="fas fa-file-invoice"></i> Cenário: o dia 15 está a chegar</h2>
<p>A contabilista da Ferragens Cabinda Lda já apurou o IVA de Maio: 238.000 Kz a entregar (ver aula anterior). Mas apurar o valor é só metade do trabalho — agora é preciso <strong>formalizar essa informação junto da AGT</strong>, dentro do prazo, através do canal correcto, sob pena de multas mesmo que o imposto tenha sido correctamente calculado e esteja disponível para pagamento. Esta aula percorre o processo completo: da declaração periódica ao ficheiro SAFT-AO, passando pelo próprio Portal do Contribuinte.</p>
</div>
<div class="cb"><h2><i class="fas fa-file-lines"></i> O que é o Modelo 14</h2>
<p>O <strong>Modelo 14</strong> é a declaração periódica do IVA — o documento através do qual a empresa comunica formalmente à AGT, mês a mês, o IVA liquidado nas suas vendas, o IVA dedutível nas suas compras, e o resultado do apuramento (imposto a pagar ou crédito a reportar). É a materialização, em formulário oficial, do cálculo feito internamente pela contabilidade.</p>
<div class="hi"><strong>Prazo:</strong> o Modelo 14 deve ser submetido no Portal do Contribuinte da AGT até ao dia <strong>15 do mês seguinte</strong> ao período a que respeita.</div>
<p>Isto significa que o IVA de Maio (o exemplo da Ferragens Cabinda) tem de ser declarado e pago até 15 de Junho — não há margem para "arredondar" o prazo por o dia 15 cair perto de um fim de semana ou feriado sem confirmação prévia junto da AGT.</p>
</div>
<div class="cb"><h2><i class="fas fa-database"></i> O SAFT-AO: o ficheiro que sustenta a declaração</h2>
<p>O <strong>SAFT-AO</strong> (Standard Audit File for Tax Purposes — Angola) é um ficheiro estruturado, gerado normalmente pelo software de facturação ou de gestão da empresa, que contém o detalhe de todas as transacções de vendas (e, em certos regimes, também de compras) realizadas no período. Não é um resumo — é o <strong>detalhe linha a linha</strong> de cada factura emitida, incluindo NIF do cliente, valores, taxas e IVA.</p>
<p>O SAFT-AO permite à AGT cruzar automaticamente a informação declarada no Modelo 14 com o detalhe real das operações da empresa, e também cruzar as facturas de venda de um contribuinte com as facturas de compra declaradas por outro (o seu cliente), detectando incoerências, facturação fictícia ou dedução indevida de IVA sem uma venda correspondente do outro lado.</p>
<div class="wb"><strong>Atenção:</strong> a submissão do Modelo 14 sem o SAFT-AO correspondente, ou com um SAFT-AO que não bate certo com os valores declarados, é sinalizada automaticamente pelos sistemas da AGT e pode gerar notificação, multa, e impossibilidade prática de o contribuinte deduzir o IVA que reclama.</div>
</div>
<div class="cb"><h2><i class="fas fa-shield-halved"></i> Regimes especiais e a importância de confirmar o enquadramento da empresa</h2>
<p>Nem todas as empresas angolanas estão sujeitas exactamente ao mesmo regime de IVA. Consoante o volume de negócios, a actividade e outros critérios definidos na legislação, uma empresa pode enquadrar-se no regime geral (com apuramento mensal completo, como o exemplo da Ferragens Cabinda) ou em regimes simplificados, com obrigações declarativas distintas. Antes de assumir que a sua empresa segue o procedimento "padrão" de Modelo 14 mensal com SAFT-AO, a contabilista deve confirmar junto da AGT ou de um profissional habilitado qual o regime concreto em que a empresa está enquadrada, porque submeter a declaração errada — ou no formato errado — gera os mesmos problemas de incoerência que uma declaração simplesmente em falta.</p>
<p>Esta confirmação de enquadramento não é um exercício de "uma vez e esquecer". O volume de negócios de uma empresa muda ao longo do tempo, e uma empresa que cresce pode passar de um regime simplificado para o regime geral, com todas as implicações de apuramento mensal detalhado que isso implica — incluindo a obrigatoriedade de gerar e submeter o SAFT-AO. É responsabilidade da contabilidade acompanhar essa evolução e ajustar o procedimento declarativo assim que o enquadramento da empresa mudar, em vez de continuar a aplicar o regime antigo por inércia.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Procedimento prático: submeter no Portal do Contribuinte</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Fechar o apuramento de IVA do mês</h4><p>Confirmar o valor final de IVA liquidado, IVA dedutível e o saldo a pagar ou a reportar, com todas as facturas conferidas.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Gerar o ficheiro SAFT-AO</h4><p>Extrair do sistema de facturação o ficheiro SAFT-AO do período, verificando que os totais batem certo com o apuramento manual/contabilístico.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Aceder ao Portal do Contribuinte</h4><p>Entrar com as credenciais da empresa e seleccionar a opção de submissão da declaração periódica de IVA (Modelo 14) do período correspondente.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Preencher e anexar</h4><p>Preencher os campos do Modelo 14 com os valores apurados e anexar o ficheiro SAFT-AO gerado no passo 2.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Submeter e guardar o comprovativo</h4><p>Submeter dentro do prazo (até dia 15) e guardar o comprovativo de submissão e a referência de pagamento, se houver imposto a pagar.</p></div></div>
<div class="tli"><div class="tld">6</div><div class="tlc"><h4>Efectuar o pagamento</h4><p>Pagar o valor apurado através dos meios indicados no Portal, também dentro do prazo — a submissão da declaração e o pagamento são passos distintos, ambos necessários.</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro comum: submeter a declaração mas esquecer o pagamento (ou vice-versa)</h2>
<p>Muitas empresas confundem "declarar" com "estar em dia" com a AGT. É comum uma empresa submeter o Modelo 14 dentro do prazo, mas atrasar o pagamento do imposto apurado por falta de liquidez naquele momento — ou, inversamente, fazer uma transferência para a AGT mas esquecer de formalizar a declaração no Portal. Em ambos os casos, a empresa fica em incumprimento: no primeiro, por atraso no pagamento (juros de mora); no segundo, por falta de declaração (que pode gerar multa e impede à AGT reconhecer o pagamento como referente àquele período específico).</p>
<div class="hi"><strong>Como evitar:</strong> tratar a declaração (Modelo 14 + SAFT-AO) e o pagamento como duas obrigações separadas e obrigatórias, ambas com o mesmo prazo — dia 15 do mês seguinte — e confirmar as duas no mesmo momento de fecho mensal, nunca uma sem a outra.</div>
</div>
<div class="lawbox"><div class="lt">Prazo da declaração periódica de IVA</div><blockquote>A declaração periódica de IVA (Modelo 14) deve ser submetida no Portal do Contribuinte da AGT até ao dia 15 do mês seguinte ao período a que respeita, acompanhada do ficheiro SAFT-AO.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Ferragens Cabinda submeteu o Modelo 14 de Maio dentro do prazo, mas não anexou o ficheiro SAFT-AO correspondente. Qual a consequência mais provável?</div>
<div class="qo" onclick="cq(this,false)">a) Nenhuma, porque o SAFT-AO é opcional em Angola</div>
<div class="qo" onclick="cq(this,false)">b) A declaração é automaticamente cancelada sem aviso</div>
<div class="qo" onclick="cq(this,true)">c) A submissão é sinalizada como incompleta, sujeita a multa e com risco de não ser reconhecido o IVA deduzido</div>
<div class="qo" onclick="cq(this,false)">d) O prazo é automaticamente prorrogado para o mês seguinte</div>
</div>`},
{t:'IRT e Contribuições para a Segurança Social (INSS)', html:`
<div class="cb"><h2><i class="fas fa-building"></i> Cenário: a Talatona Serviços e o cumprimento das obrigações do empregador</h2>
<p>Diferente do exercício de calcular um salário individual (que já viste na Aula 2), esta aula olha para a fiscalidade laboral do lado das <strong>obrigações do empregador perante o Estado</strong>. A Talatona Serviços é uma empresa de consultoria com 18 trabalhadores. Todos os meses, depois de fechar a folha salarial, a directora administrativa tem de garantir três coisas: que o IRT retido a todos os trabalhadores é entregue à AGT, que o INSS (parte do trabalhador + parte da empresa) é entregue à Segurança Social, e que tudo isto acontece dentro dos prazos legais — porque um atraso não afecta só a empresa, afecta directamente os direitos previdenciários dos trabalhadores.</p>
</div>
<div class="cb"><h2><i class="fas fa-scale-balanced"></i> Duas entidades, duas obrigações distintas</h2>
<p>É fundamental compreender que o IRT e o INSS, apesar de calculados sobre a mesma base salarial e retidos no mesmo recibo de vencimento, são <strong>entregues a entidades diferentes, através de canais diferentes, com prazos diferentes</strong>:</p>
<ul>
<li><strong>IRT</strong> — imposto sobre o rendimento, entregue à <strong>AGT</strong> (Administração Geral Tributária), através do <strong>Modelo 2</strong>, até ao dia <strong>15</strong> do mês seguinte.</li>
<li><strong>INSS</strong> — contribuição para a Segurança Social, entregue ao <strong>INSS</strong> (Instituto Nacional de Segurança Social), até ao dia <strong>10</strong> do mês seguinte.</li>
</ul>
<div class="hi"><strong>Atenção à ordem dos prazos:</strong> o INSS vence primeiro (dia 10), o IRT depois (dia 15). Uma empresa que planeia a tesouraria do mês tem de reservar liquidez para o INSS antes de reservar para o IRT.</div>
</div>
<div class="cb"><h2><i class="fas fa-file-signature"></i> O Modelo 2 e a declaração de retenções na fonte de IRT</h2>
<p>O <strong>Modelo 2</strong> é a declaração através da qual o empregador comunica à AGT o total de IRT retido a todos os trabalhadores num determinado mês, discriminado por trabalhador e por tipo de rendimento. Não é apenas um "resumo do total pago" — é um mapa nominal, o que significa que qualquer inconsistência entre o que consta no Modelo 2 e o que foi efectivamente processado na folha salarial (por exemplo, um trabalhador com subsídio de férias pago naquele mês, que altera pontualmente a sua base tributável) fica visível para a AGT.</p>
<p>Um caso prático: se, em determinado mês, um trabalhador da Talatona Serviços recebe, além do salário normal, o <strong>subsídio de férias</strong> integral (equivalente a mais um mês de salário), a base tributável desse trabalhador nesse mês específico sobe substancialmente, colocando-o eventualmente num escalão de IRT superior só naquele mês. O Modelo 2 tem de reflectir correctamente esse pico pontual — não se pode "diluir" o subsídio de férias ao longo do ano para suavizar o IRT: o imposto incide sobre o rendimento efectivamente pago em cada mês.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Procedimento prático mensal do empregador</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Fechar a folha salarial do mês</h4><p>Consolidar salários base, subsídios regulares e eventuais (férias, 13º mês, prémios) de todos os trabalhadores, com o IRT e INSS calculados individualmente.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Preparar e entregar o INSS até dia 10</h4><p>Somar a contribuição do trabalhador (3%) e a contribuição patronal (8%) de todos os trabalhadores, e submeter/pagar junto do INSS antes do dia 10 do mês seguinte.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Preparar e entregar o Modelo 2 até dia 15</h4><p>Discriminar o IRT retido por trabalhador no Modelo 2, submeter no Portal do Contribuinte da AGT e efectuar o pagamento correspondente até dia 15.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Arquivar comprovativos</h4><p>Guardar os comprovativos de submissão e pagamento de ambas as obrigações — são a prova de cumprimento em caso de fiscalização ou de reclamação de um trabalhador sobre os seus descontos.</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro comum: atrasar o INSS por priorizar o IRT (ou vice-versa)</h2>
<p>Como o INSS vence antes do IRT (dia 10 contra dia 15), é comum empresas com dificuldades pontuais de tesouraria priorizarem o pagamento que "ainda tem mais dias de prazo" e atrasarem o INSS. Isto é particularmente grave porque o atraso na entrega do INSS não gera apenas juros de mora para a empresa — pode comprometer o registo de contribuições dos trabalhadores junto da Segurança Social, afectando o seu direito futuro a prestações como pensão de reforma, subsídio de maternidade ou subsídio de doença, mesmo que o desconto já tenha sido retirado do salário do trabalhador naquele mês.</p>
<div class="hi"><strong>Como evitar:</strong> tratar o INSS como a obrigação de prazo mais curto e mais sensível (porque afecta directamente os direitos individuais dos trabalhadores), reservando a liquidez necessária logo no início do mês, antes mesmo de fechar o Modelo 2 do IRT.</div>
</div>
<div class="lawbox"><div class="lt">Prazos das obrigações do empregador</div><blockquote>As contribuições para a Segurança Social (INSS) devem ser entregues até ao dia 10 do mês seguinte. A declaração e entrega do IRT retido sobre rendimentos do trabalho (Modelo 2) devem ser efectuadas até ao dia 15 do mês seguinte, junto da AGT.</blockquote></div>
<div class="lawbox"><div class="lt">Contribuições INSS — repartição</div><blockquote>A contribuição para a Segurança Social é de 3% a cargo do trabalhador (retida no salário) e 8% a cargo da entidade empregadora (custo adicional da empresa), incidindo sobre a mesma base de remuneração.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Talatona Serviços tem dificuldades de tesouraria em determinado mês e só consegue pagar uma das obrigações antes do dia 10. Qual deve priorizar, e porquê?</div>
<div class="qo" onclick="cq(this,false)">a) O IRT, porque a multa da AGT é sempre mais alta</div>
<div class="qo" onclick="cq(this,true)">b) O INSS, porque vence primeiro (dia 10) e o atraso pode comprometer os direitos previdenciários dos trabalhadores</div>
<div class="qo" onclick="cq(this,false)">c) Nenhuma tem prioridade, os prazos são iguais</div>
<div class="qo" onclick="cq(this,false)">d) O IRT, porque o INSS não tem prazo legal definido</div>
</div>`},
{t:'Imposto Industrial: Apuramento, DLP e Declaração Anual', html:`
<div class="cb"><h2><i class="fas fa-industry"></i> Cenário: a Lubango Metalúrgica encerra o exercício</h2>
<p>A Lubango Metalúrgica Lda fabrica estruturas metálicas para construção civil. No fecho do exercício, o lucro contabilístico apurado nas demonstrações financeiras foi de 5.000.000 Kz. Mas o gerente sabe, pela experiência de anos anteriores, que o valor de Imposto Industrial a pagar <strong>não é simplesmente 25% desse lucro contabilístico</strong> — há ajustamentos fiscais a fazer antes de chegar ao lucro tributável real. Esta aula explica exactamente como se faz essa ponte entre o resultado contabilístico e o imposto efectivamente devido.</p>
</div>
<div class="cb"><h2><i class="fas fa-scale-balanced"></i> Lucro contabilístico vs. lucro tributável</h2>
<p>O <strong>Imposto Industrial (II)</strong> incide, à taxa de <strong>25%</strong>, sobre o <strong>lucro tributável</strong> — que raramente é igual ao lucro contabilístico apurado pela contabilidade segundo as normas contabilísticas. A diferença existe porque a lei fiscal não aceita, para efeitos de imposto, todos os gastos e proveitos reconhecidos contabilisticamente. A fórmula geral é:</p>
<div class="hi"><strong>Lucro tributável = Lucro Contabilístico + Adições fiscais − Deduções fiscais</strong></div>
<p>As <strong>adições</strong> são gastos que a contabilidade reconheceu, mas que a lei fiscal não aceita como custo dedutível (por exemplo, multas e coimas, despesas não devidamente documentadas, ou a parte de certos gastos que excede limites fiscais). As <strong>deduções</strong> são valores que a lei permite abater ao lucro, mesmo que não tenham sido gasto contabilístico do próprio exercício — o caso mais comum é o <strong>reporte de prejuízos fiscais</strong> de exercícios anteriores.</p>
</div>
<div class="cb"><h2><i class="fas fa-file-invoice-dollar"></i> A Declaração de Liquidação Provisória (DLP)</h2>
<p>Ao longo do exercício, antes de se conhecer o resultado final anual, as empresas de Imposto Industrial no regime geral efectuam <strong>pagamentos por conta</strong> através da <strong>Declaração de Liquidação Provisória (DLP)</strong> — uma estimativa antecipada do imposto devido, baseada normalmente no resultado do exercício anterior ou numa previsão do exercício corrente. Este mecanismo existe para que o Estado receba receita fiscal ao longo do ano, e não apenas numa única entrega no fecho do exercício, e para que a empresa não enfrente um valor elevado concentrado numa única data.</p>
<div class="ib">A DLP funciona como um "adiantamento": o valor pago antecipadamente é depois abatido ao imposto total apurado na Declaração Anual, evitando pagamento em duplicado.</div>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo trabalhado: o apuramento da Lubango Metalúrgica</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Partir do lucro contabilístico</h4><p>Lucro contabilístico do exercício: <strong>5.000.000 Kz</strong>.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Somar as adições fiscais</h4><p>A empresa pagou uma multa da AGT de 200.000 Kz no ano anterior (gasto não aceite fiscalmente) e registou 150.000 Kz de despesas sem documentação de suporte válida. Total de adições: 200.000 + 150.000 = <strong>350.000 Kz</strong>.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Subtrair as deduções fiscais</h4><p>A empresa tem um prejuízo fiscal reportável de um exercício anterior, no valor de <strong>300.000 Kz</strong>, dedutível neste exercício.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Apurar o lucro tributável</h4><p>Lucro tributável = 5.000.000 + 350.000 − 300.000 = <strong>5.050.000 Kz</strong>.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Aplicar a taxa de 25%</h4><p>Imposto Industrial = 5.050.000 × 25% = <strong>1.262.500 Kz</strong>.</p></div></div>
</div>
<div class="hi"><strong>Resultado:</strong> a Lubango Metalúrgica deve 1.262.500 Kz de Imposto Industrial sobre o exercício — um valor superior ao que resultaria de aplicar 25% directamente ao lucro contabilístico (que daria 1.250.000 Kz), precisamente por causa das adições e deduções fiscais.</p>
<p>Deste valor total, deve ainda ser abatido o que já foi pago ao longo do ano através da DLP, para se apurar o montante final a entregar (ou a recuperar) na Declaração Anual.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Procedimento: da apuração à Declaração Anual</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Fechar as demonstrações financeiras do exercício</h4><p>Apurar o lucro contabilístico final, com todas as regularizações e reconciliações contabilísticas concluídas.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Identificar e listar todas as adições e deduções fiscais</h4><p>Rever gasto a gasto os itens não aceites fiscalmente e confirmar prejuízos fiscais reportáveis disponíveis.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Apurar o lucro tributável e o imposto devido</h4><p>Aplicar a fórmula e a taxa de 25% ao resultado final.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Abater os pagamentos por conta (DLP) já efectuados</h4><p>Calcular o saldo final a pagar ou a recuperar.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Submeter a Declaração Anual até 31 de Maio</h4><p>Entregar a Declaração Anual do Imposto Industrial no Portal do Contribuinte da AGT, dentro do prazo legal.</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro comum: aplicar 25% directamente ao lucro contabilístico</h2>
<p>Um erro recorrente, mesmo em empresas com contabilidade organizada, é calcular o Imposto Industrial multiplicando 25% directamente pelo lucro que sai do relatório contabilístico, sem fazer o ajustamento das adições e deduções fiscais. Isto tanto pode <strong>subestimar</strong> o imposto devido (se houver adições relevantes não consideradas, como no exemplo da Lubango Metalúrgica, onde o cálculo correcto dá mais do que o cálculo simplista) como <strong>sobrestimar</strong> (se a empresa tiver prejuízos fiscais reportáveis que não foram abatidos). Em fiscalização, a AGT recalcula o lucro tributável a partir das adições e deduções previstas na lei — e qualquer diferença face ao declarado gera liquidação adicional, juros de mora e possíveis penalidades.</p>
<div class="hi"><strong>Como evitar:</strong> nunca tratar o lucro contabilístico como sinónimo de lucro tributável. Manter um mapa de apuramento fiscal, separado da contabilidade, que documente cada adição e dedução aplicada, ano após ano, com justificação.</div>
</div>
<div class="lawbox"><div class="lt">Imposto Industrial — taxa e prazo</div><blockquote>O Imposto Industrial incide, à taxa de 25%, sobre o lucro tributável apurado a partir do resultado contabilístico ajustado por adições e deduções fiscais. A Declaração Anual do Imposto Industrial deve ser submetida até 31 de Maio do ano seguinte ao exercício a que respeita.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Lubango Metalúrgica teve lucro contabilístico de 5.000.000 Kz, adições fiscais de 350.000 Kz e uma dedução por prejuízo fiscal reportável de 300.000 Kz. Qual o Imposto Industrial devido?</div>
<div class="qo" onclick="cq(this,false)">a) 1.250.000 Kz</div>
<div class="qo" onclick="cq(this,true)">b) 1.262.500 Kz</div>
<div class="qo" onclick="cq(this,false)">c) 1.337.500 Kz</div>
<div class="qo" onclick="cq(this,false)">d) 1.212.500 Kz</div>
</div>`},
{t:'Imposto Predial, Imposto do Selo e IAC', html:`
<div class="cb"><h2><i class="fas fa-house"></i> Cenário: a Benguela Imóveis e os "outros impostos" que ninguém lê com atenção</h2>
<p>A Benguela Imóveis Lda é dona do edifício onde funciona a sua sede, em Benguela, e também arrenda alguns espaços comerciais a terceiros. Além do IVA e do Imposto Industrial (que já conheces), a empresa tem de lidar com três outros impostos frequentemente esquecidos ou mal compreendidos por contabilistas menos experientes: o <strong>Imposto Predial</strong> (sobre o imóvel que possui), o <strong>Imposto do Selo</strong> (sobre determinados actos e contratos que celebra) e o <strong>IAC — Imposto sobre a Aplicação de Capitais</strong> (sobre rendimentos de capital, como juros que recebe ou paga). Esta aula explica o mecanismo de cada um, sem entrar em números específicos que a empresa deve sempre confirmar caso a caso junto da legislação em vigor e de um profissional habilitado.</p>
</div>
<div class="cb"><h2><i class="fas fa-house-chimney"></i> Imposto Predial</h2>
<p>O <strong>Imposto Predial</strong> incide sobre a propriedade de bens imóveis (prédios urbanos ou rústicos), sendo devido pelo proprietário do imóvel. Existem, em regra, duas situações distintas a considerar:</p>
<ul>
<li><strong>Imóveis não arrendados</strong> (uso próprio, como a sede da Benguela Imóveis) — o imposto incide sobre o valor patrimonial do imóvel.</li>
<li><strong>Imóveis arrendados</strong> (como os espaços comerciais que a empresa cede a terceiros) — o imposto incide sobre as rendas recebidas, sendo frequentemente objecto de retenção na fonte pelo próprio inquilino, que entrega o valor directamente à AGT em nome do senhorio.</li>
</ul>
<div class="ib">A legislação do Imposto Predial define o mecanismo de apuramento consoante o imóvel esteja ou não arrendado, e consoante o seu valor patrimonial — a empresa deve confirmar sempre a taxa e a forma de liquidação aplicável ao seu caso concreto junto da AGT ou de um contabilista certificado, dado que estes elementos podem ser actualizados pela legislação em vigor.</div>
</div>
<div class="cb"><h2><i class="fas fa-stamp"></i> Imposto do Selo</h2>
<p>O <strong>Imposto do Selo</strong> é um imposto que incide sobre determinados actos, contratos, documentos e operações — não sobre o rendimento ou o lucro da empresa, mas sobre a própria <strong>formalização</strong> desses actos. Exemplos típicos de operações sujeitas a Imposto do Selo incluem certos contratos (como contratos de arrendamento), determinadas operações financeiras (como a concessão de crédito ou garantias bancárias), e a emissão de certos documentos oficiais.</p>
<p>Uma característica importante do Imposto do Selo é que, em muitos casos, quem liquida e entrega o imposto à AGT não é directamente quem "sofre" o encargo económico — por exemplo, num contrato de crédito bancário, é frequentemente o banco que liquida o Imposto do Selo, repercutindo o custo ao cliente através das condições do crédito.</p>
<div class="wb"><strong>Atenção:</strong> muitas empresas angolanas esquecem-se de verificar se um contrato recém-assinado (de arrendamento, de financiamento, de prestação de serviços com garantias) está sujeito a Imposto do Selo, assumindo erradamente que só o IVA e o Imposto Industrial são relevantes nas suas operações do dia a dia.</div>
</div>
<div class="cb"><h2><i class="fas fa-percent"></i> IAC — Imposto sobre a Aplicação de Capitais</h2>
<p>O <strong>IAC (Imposto sobre a Aplicação de Capitais)</strong> incide sobre rendimentos gerados pela aplicação de capitais — o exemplo mais comum é o dos <strong>juros</strong>: juros recebidos de depósitos bancários a prazo, juros de empréstimos concedidos a terceiros, ou juros de suprimentos de sócios a uma empresa. Também podem estar sujeitos a IAC, consoante a operação, rendimentos como dividendos distribuídos por uma sociedade aos seus sócios ou lucros distribuídos.</p>
<p>Para uma empresa como a Benguela Imóveis, o IAC torna-se relevante sempre que ela recebe juros de uma aplicação financeira, ou sempre que distribui lucros aos seus sócios — nestes casos, é fundamental verificar se existe obrigação de retenção na fonte a aplicar antes do pagamento ao beneficiário.</p>
<div class="ib">O mecanismo do IAC funciona, tipicamente, por retenção na fonte: quem paga o rendimento de capital (o banco, a empresa que paga juros ou dividendos) retém o imposto no momento do pagamento e entrega-o directamente à AGT, entregando ao beneficiário apenas o valor líquido.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Procedimento prático: identificar exposição a estes impostos</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Mapear o património imóvel da empresa</h4><p>Listar todos os imóveis próprios, distinguindo entre uso próprio e imóveis arrendados a terceiros, para efeitos de Imposto Predial.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Rever contratos e operações recentes</h4><p>Verificar contratos de arrendamento, financiamento, garantias e outros actos formalizados no período, para identificar sujeição a Imposto do Selo.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Identificar rendimentos de capital pagos ou recebidos</h4><p>Listar juros e dividendos pagos ou recebidos no período, confirmando se existe obrigação de retenção de IAC.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Confirmar taxas e prazos actualizados junto da AGT</h4><p>Como estes impostos têm mecanismos mais variados que o IVA ou o Imposto Industrial, confirmar sempre a taxa e o prazo aplicável ao caso concreto antes de liquidar.</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro comum: tratar estes impostos como "secundários" e ignorá-los na rotina fiscal</h2>
<p>Muitas pequenas e médias empresas em Angola concentram toda a sua atenção fiscal no IVA, no IRT/INSS e no Imposto Industrial — por serem os impostos mais recorrentes e mais discutidos — e acabam por não verificar sistematicamente a sua exposição ao Imposto Predial, ao Imposto do Selo ou ao IAC. O resultado típico é uma empresa que só descobre estas obrigações quando já está em incumprimento há vários períodos, numa fiscalização ou numa notificação da AGT, altura em que os juros de mora já se acumularam significativamente sobre um valor que, tratado a tempo, teria sido simples de regularizar.</p>
<div class="hi"><strong>Como evitar:</strong> incluir uma revisão periódica (pelo menos anual) do património imóvel, dos contratos em vigor e dos rendimentos de capital pagos ou recebidos, especificamente para mapear a exposição da empresa a estes três impostos — não esperar por uma notificação da AGT para descobrir uma obrigação em atraso.</div>
</div>
<div class="lawbox"><div class="lt">Imposto Predial — mecanismo geral</div><blockquote>A legislação do Imposto Predial exige a liquidação do imposto sobre o valor patrimonial de imóveis não arrendados, e sobre as rendas efectivamente recebidas em imóveis arrendados, cabendo ao proprietário ou, consoante o caso, ao inquilino, assegurar a correcta liquidação e entrega à AGT.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Benguela Imóveis assina um novo contrato de arrendamento de um espaço comercial e recebe juros de um depósito a prazo no banco. A que impostos, além do IVA e do Imposto Industrial, a empresa deve prestar atenção nestas duas situações, respectivamente?</div>
<div class="qo" onclick="cq(this,false)">a) IRT em ambos os casos</div>
<div class="qo" onclick="cq(this,true)">b) Imposto do Selo (contrato de arrendamento) e IAC (juros do depósito)</div>
<div class="qo" onclick="cq(this,false)">c) Imposto Industrial em ambos os casos, porque já cobre tudo</div>
<div class="qo" onclick="cq(this,false)">d) INSS em ambos os casos</div>
</div>`},
{t:'Retenções na Fonte e Tributação de Não Residentes', html:`
<div class="cb"><h2><i class="fas fa-globe"></i> Cenário: a Consultoria Talatona paga dois prestadores diferentes</h2>
<p>A Consultoria Talatona Lda contratou, no mesmo mês, dois serviços de apoio técnico: um serviço de auditoria interna prestado por uma empresa angolana sediada em Luanda, no valor de 500.000 Kz, e um serviço de consultoria especializada prestado por uma empresa estrangeira, sem estabelecimento estável em Angola, no valor de 1.000.000 Kz (a título de honorários por assessoria técnica). Apesar de ambos serem "serviços prestados à empresa", o tratamento fiscal de cada pagamento é completamente diferente — e é exactamente essa diferença que esta aula explica.</p>
</div>
<div class="cb"><h2><i class="fas fa-hand-holding-dollar"></i> O mecanismo da retenção na fonte</h2>
<p>A <strong>retenção na fonte</strong> é um mecanismo em que a entidade que paga um rendimento (neste caso, a Consultoria Talatona) tem a obrigação legal de reter uma parte do valor a pagar e entregá-la directamente à AGT, em nome do beneficiário do rendimento (o prestador de serviço). O beneficiário recebe apenas o valor líquido, já descontado o imposto retido, que é considerado um pagamento por conta (ou definitivo, consoante o caso) do imposto devido por ele.</p>
<p>Este mecanismo existe porque é mais eficiente para a AGT cobrar o imposto junto de quem paga (normalmente uma entidade mais fácil de fiscalizar e com maior capacidade organizativa) do que perseguir, um a um, todos os prestadores de serviço que recebem rendimentos dispersos.</p>
</div>
<div class="cb"><h2><i class="fas fa-flag"></i> Retenção sobre serviços prestados por empresas angolanas</h2>
<p>Quando uma empresa angolana paga a outra empresa angolana pela prestação de determinados serviços (sujeitos a retenção nos termos da legislação do Imposto Industrial), aplica-se uma <strong>retenção na fonte de 6,5%</strong> sobre o valor do serviço, a título de pagamento por conta do Imposto Industrial devido pelo prestador.</p>
<div class="hi"><strong>Retenção de 6,5%</strong> — aplicável a serviços prestados por empresas angolanas sujeitas a Imposto Industrial, funcionando como adiantamento do imposto anual do prestador.</div>
</div>
<div class="cb"><h2><i class="fas fa-earth-africa"></i> Retenção sobre pagamentos a não residentes</h2>
<p>Quando o beneficiário do pagamento é uma entidade <strong>não residente</strong> em Angola, sem estabelecimento estável no país (como a empresa estrangeira de consultoria contratada pela Consultoria Talatona), a lógica muda: como a AGT não tem forma prática de tributar directamente essa entidade estrangeira mais tarde, a retenção na fonte é normalmente <strong>a forma final e definitiva</strong> de cobrar o imposto angolano sobre aquele rendimento. A taxa aplicável a estes pagamentos é de <strong>15%</strong>.</p>
<div class="hi"><strong>Retenção de 15%</strong> — aplicável a pagamentos a entidades não residentes sem estabelecimento estável em Angola, funcionando geralmente como tributação definitiva sobre o rendimento obtido em território angolano.</div>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo trabalhado: os dois pagamentos da Consultoria Talatona</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Serviço da empresa angolana (auditoria interna) — 500.000 Kz</h4><p>Retenção = 500.000 × 6,5% = <strong>32.500 Kz</strong>. A Consultoria Talatona paga 500.000 − 32.500 = <strong>467.500 Kz</strong> à empresa de auditoria, e entrega 32.500 Kz à AGT em nome dela.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Serviço da empresa estrangeira (consultoria não residente) — 1.000.000 Kz</h4><p>Retenção = 1.000.000 × 15% = <strong>150.000 Kz</strong>. A Consultoria Talatona paga 1.000.000 − 150.000 = <strong>850.000 Kz</strong> à empresa estrangeira, e entrega 150.000 Kz à AGT em nome dela.</p></div></div>
</div>
<div class="hi"><strong>Resultado:</strong> apesar de o serviço estrangeiro valer o dobro do serviço nacional, a retenção sobre ele (150.000 Kz) é quase cinco vezes maior que a retenção sobre o serviço nacional (32.500 Kz) — reflectindo a diferença entre as duas taxas (6,5% vs. 15%) e a diferença de tratamento entre residentes e não residentes.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Procedimento prático ao contratar um prestador</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Determinar a residência fiscal do prestador</h4><p>Confirmar se o prestador é uma empresa angolana (com NIF activo em Angola) ou uma entidade estrangeira sem estabelecimento estável no país.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Aplicar a taxa correcta de retenção</h4><p>6,5% para prestadores angolanos sujeitos a retenção nos termos aplicáveis; 15% para não residentes sem estabelecimento estável.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Pagar o valor líquido ao prestador</h4><p>Deduzir a retenção do valor bruto acordado e pagar apenas o líquido, emitindo o respectivo comprovativo de retenção ao prestador.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Entregar a retenção à AGT dentro do prazo</h4><p>Declarar e entregar o valor retido à AGT nos prazos e através dos formulários aplicáveis às retenções na fonte.</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro comum: não reter na fonte um pagamento a um fornecedor estrangeiro</h2>
<p>É frequente empresas angolanas, ao contratarem serviços de consultoria, software ou assessoria técnica junto de fornecedores estrangeiros, pagarem o valor integral acordado (por exemplo, via transferência internacional) sem aplicar a retenção de 15%, muitas vezes por desconhecimento da obrigação ou por o próprio contrato estrangeiro não prever expressamente o desconto. Nestes casos, a AGT pode exigir da empresa angolana (a entidade pagadora) o imposto que deveria ter sido retido — mesmo que o valor já tenha sido integralmente pago ao fornecedor estrangeiro, colocando a empresa na posição de ter de suportar do seu próprio bolso um imposto que devia ter sido descontado do fornecedor.</p>
<div class="hi"><strong>Como evitar:</strong> antes de qualquer pagamento a um fornecedor estrangeiro sem estabelecimento estável em Angola, confirmar a obrigação de retenção de 15% e aplicá-la sempre, independentemente de o contrato mencionar ou não o imposto angolano — a obrigação de retenção é da entidade pagadora angolana, por força da lei angolana, não do que o contrato estrangeiro prevê.</div>
</div>
<div class="lawbox"><div class="lt">Retenção na fonte sobre serviços — residentes</div><blockquote>Os pagamentos por serviços prestados por empresas angolanas estão sujeitos a retenção na fonte de 6,5%, a título de pagamento por conta do Imposto Industrial devido pelo prestador.</blockquote></div>
<div class="lawbox"><div class="lt">Retenção na fonte — não residentes</div><blockquote>Os pagamentos a entidades não residentes sem estabelecimento estável em Angola estão sujeitos a retenção na fonte de 15%, geralmente com carácter definitivo sobre o rendimento obtido em território angolano.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Consultoria Talatona paga 1.000.000 Kz a uma empresa estrangeira sem estabelecimento estável em Angola, por serviços de consultoria. Qual o valor da retenção na fonte e o valor líquido pago à empresa estrangeira?</div>
<div class="qo" onclick="cq(this,false)">a) Retenção de 65.000 Kz; líquido de 935.000 Kz</div>
<div class="qo" onclick="cq(this,true)">b) Retenção de 150.000 Kz; líquido de 850.000 Kz</div>
<div class="qo" onclick="cq(this,false)">c) Retenção de 250.000 Kz; líquido de 750.000 Kz</div>
<div class="qo" onclick="cq(this,false)">d) Não há retenção, porque o prestador é estrangeiro</div>
</div>`},
{t:'Obrigações Declarativas, Calendário Fiscal e Portal do Contribuinte', html:`
<div class="cb"><h2><i class="fas fa-calendar-check"></i> Cenário: a Oaken Distribuição organiza o seu calendário fiscal anual</h2>
<p>A directora financeira da Oaken Distribuição, uma empresa com operações em Luanda e um armazém em Viana, decidiu, no início do ano, construir um calendário fiscal único que reunisse todas as obrigações declarativas da empresa — em vez de tratar cada imposto isoladamente e correr o risco de esquecer um prazo no meio da rotina do mês. Esta aula consolida tudo o que já aprendeste nas aulas anteriores num só calendário de referência, e explica como usar o Portal do Contribuinte da AGT como ferramenta central de gestão fiscal.</p>
</div>
<div class="cb"><h2><i class="fas fa-table"></i> O calendário fiscal mensal consolidado</h2>
<p>A maior parte das obrigações fiscais de uma empresa angolana no regime geral repete-se todos os meses, com prazos fixos. Consolidar estas datas num único calendário reduz drasticamente o risco de incumprimento por esquecimento.</p>
<div class="tw"><table class="dt"><tr><th>Obrigação</th><th>Prazo</th><th>Entidade</th></tr>
<tr><td>INSS (contribuições do mês anterior)</td><td>Até dia 10</td><td>INSS</td></tr>
<tr><td>Modelo 14 — Declaração periódica de IVA</td><td>Até dia 15</td><td>AGT</td></tr>
<tr><td>Modelo 2 — Retenções de IRT</td><td>Até dia 15</td><td>AGT</td></tr>
<tr><td>Declaração Anual do Imposto Industrial</td><td>Até 31 de Maio</td><td>AGT</td></tr>
</table></div>
<div class="hi"><strong>Padrão a memorizar:</strong> dia 10 é INSS; dia 15 é AGT (tanto IVA como IRT); 31 de Maio é o grande fecho anual do Imposto Industrial.</div>
</div>
<div class="cb"><h2><i class="fas fa-desktop"></i> O Portal do Contribuinte como centro de gestão fiscal</h2>
<p>O <strong>Portal do Contribuinte</strong> da AGT é o canal oficial através do qual a generalidade das declarações fiscais angolanas — Modelo 14, Modelo 2, Declaração Anual do Imposto Industrial, entre outras — são submetidas. Para uma empresa organizada, o Portal não deve ser usado apenas no "último dia do prazo" para submeter uma declaração isolada: deve ser consultado regularmente para:</p>
<ul>
<li>Confirmar o estado de submissões anteriores (aceites, pendentes, rejeitadas);</li>
<li>Verificar notificações da AGT (pedidos de esclarecimento, avisos de incumprimento, resultados de cruzamento de dados via SAFT-AO);</li>
<li>Consultar o histórico de pagamentos efectuados e eventuais saldos em aberto.</li>
</ul>
<div class="wb"><strong>Atenção:</strong> uma notificação da AGT no Portal do Contribuinte que não é lida a tempo não deixa de produzir efeitos — os prazos de resposta contam a partir da notificação, não a partir do momento em que a empresa a lê.</div>
</div>
<div class="cb"><h2><i class="fas fa-people-group"></i> Distribuir responsabilidades dentro da empresa</h2>
<p>Em empresas maiores, com departamento financeiro próprio, é boa prática distribuir claramente quem é responsável por cada obrigação do calendário fiscal — quem prepara os dados da folha salarial para o INSS e o Modelo 2, quem concilia as facturas de venda e compra para o Modelo 14, quem acompanha o Portal do Contribuinte diariamente. Em empresas pequenas, onde muitas vezes uma só pessoa acumula todas estas funções, o calendário consolidado é ainda mais importante, porque não há uma segunda pessoa a servir de rede de segurança caso um prazo seja esquecido. Nestes casos, vale a pena definir lembretes automáticos (no telemóvel, num calendário partilhado, ou no próprio sistema de gestão) com alguns dias de antecedência a cada prazo, e não apenas no próprio dia.</p>
<p>Vale ainda destacar que o calendário fiscal não substitui o acompanhamento de eventuais obrigações específicas do sector de actividade da empresa, ou de obrigações pontuais resultantes de operações especiais (como a distribuição de dividendos, sujeita a IAC, ou a assinatura de um novo contrato sujeito a Imposto do Selo, como visto na aula anterior). O calendário consolidado cobre o essencial recorrente — mas a vigilância sobre operações não recorrentes continua a ser necessária, sempre que a empresa realiza algo fora da sua rotina habitual.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Procedimento prático: montar o calendário fiscal da empresa</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Listar todas as obrigações aplicáveis à empresa</h4><p>Confirmar o regime de tributação da empresa (IVA, Imposto Industrial, retenções aplicáveis) para saber exactamente que declarações lhe são exigidas.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Marcar os prazos fixos mensais</h4><p>INSS (dia 10), Modelo 14 e Modelo 2 (dia 15) — todos os meses, sem excepção.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Marcar os prazos anuais</h4><p>Declaração Anual do Imposto Industrial (31 de Maio), e quaisquer outras obrigações anuais específicas da empresa (por exemplo, relacionadas com Imposto Predial, se aplicável).</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Definir uma janela de preparação antes de cada prazo</h4><p>Reservar, por exemplo, os primeiros 5 dias úteis do mês para fechar a informação necessária a cada declaração, em vez de deixar tudo para a véspera do prazo.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Consultar o Portal do Contribuinte regularmente</h4><p>Não apenas no dia da submissão — verificar notificações e o estado de declarações anteriores pelo menos semanalmente.</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro comum: tratar cada imposto isoladamente, sem visão de calendário</h2>
<p>Empresas que gerem cada obrigação fiscal separadamente — "agora é a vez do IVA", "agora é a vez do INSS" — sem um calendário único, tendem a descobrir sobreposições de prazos apenas quando já é tarde para as cumprir todas com qualidade. É comum, por exemplo, uma empresa perceber no dia 14 que ainda não fechou nem o Modelo 14 nem o Modelo 2, ambos com prazo no dia 15, e acabar por submeter às pressas, com maior risco de erros de cálculo ou de dados incompletos — que geram exactamente os problemas que as aulas anteriores descreveram (dedução indevida, SAFT-AO incoerente, Modelo 2 desalinhado com a folha salarial).</p>
<div class="hi"><strong>Como evitar:</strong> substituir a gestão obrigação-a-obrigação por um único calendário fiscal consolidado, revisto no início de cada mês, com uma janela de preparação de vários dias antes de cada prazo — nunca deixar duas declarações complexas para a mesma véspera.</div>
</div>
<div class="lawbox"><div class="lt">Consolidação de prazos fiscais recorrentes</div><blockquote>As contribuições de Segurança Social (INSS) vencem até ao dia 10 do mês seguinte; a declaração periódica de IVA (Modelo 14) e a declaração de retenções de IRT (Modelo 2) vencem até ao dia 15 do mês seguinte; a Declaração Anual do Imposto Industrial vence até 31 de Maio do ano seguinte ao exercício.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Oaken Distribuição está a montar o calendário fiscal de Fevereiro. Que obrigações vencem, respectivamente, no dia 10 e no dia 15 desse mês?</div>
<div class="qo" onclick="cq(this,false)">a) Dia 10: Modelo 14; Dia 15: INSS</div>
<div class="qo" onclick="cq(this,true)">b) Dia 10: INSS; Dia 15: Modelo 14 e Modelo 2</div>
<div class="qo" onclick="cq(this,false)">c) Dia 10: Declaração Anual do Imposto Industrial; Dia 15: INSS</div>
<div class="qo" onclick="cq(this,false)">d) Dia 10 e dia 15 têm sempre a mesma obrigação</div>
</div>`},
{t:'Encerramento de Contas, Demonstrações Financeiras e Análise', html:`
<div class="cb"><h2><i class="fas fa-chart-line"></i> Cenário: a Cabinda Distribuição fecha o ano e a directora quer respostas</h2>
<p>É o fecho do exercício anual da Cabinda Distribuição Lda, uma empresa de distribuição de produtos alimentares. A contabilista já tratou de todos os ajustamentos fiscais e cambiais das aulas anteriores — diferenças de câmbio, IVA, IRT, INSS, Imposto Industrial. Agora chega a fase final: fechar formalmente as contas do exercício, preparar as demonstrações financeiras, e apresentar à directora não só os números, mas o que eles <strong>significam</strong> para a saúde financeira da empresa. Esta aula fecha o módulo, ligando tudo o que foi calculado ao longo do ano a uma leitura final coerente.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-ol"></i> O processo de encerramento de contas</h2>
<p>Encerrar as contas de um exercício não é apenas "parar de lançar" no último dia do ano. É um processo estruturado que garante que o saldo de cada conta reflecte a realidade económica da empresa naquela data. As etapas típicas incluem:</p>
<ul>
<li><strong>Conferência de saldos</strong> — reconciliar bancos, caixa, contas a receber e a pagar com os respectivos extractos e documentos de suporte;</li>
<li><strong>Reavaliações finais</strong> — aplicar as reavaliações cambiais de itens monetários em moeda estrangeira à taxa de fecho do exercício (como visto na Aula 1);</li>
<li><strong>Apuramento de impostos do exercício</strong> — confirmar o valor final de Imposto Industrial devido, considerando adições, deduções e pagamentos por conta já efectuados (Aula 6);</li>
<li><strong>Apuramento do resultado líquido</strong> — transferir os saldos das contas de gastos (Classe 6) e réditos/ganhos (Classe 7) para a determinação do resultado do exercício.</li>
</ul>
</div>
<div class="cb"><h2><i class="fas fa-file-invoice"></i> As demonstrações financeiras principais</h2>
<p>Do processo de encerramento resultam as principais demonstrações financeiras que a empresa deve preparar:</p>
<ul>
<li><strong>Balanço</strong> — a fotografia da posição financeira da empresa numa data (o que possui: activo; o que deve: passivo; e o que sobra para os sócios: capital próprio).</li>
<li><strong>Demonstração de Resultados</strong> — o resumo dos réditos e gastos do exercício, culminando no resultado líquido (lucro ou prejuízo) do período.</li>
<li><strong>Demonstração de Fluxos de Caixa</strong> — o movimento efectivo de dinheiro entrado e saído da empresa, distinguindo actividades operacionais, de investimento e de financiamento.</li>
</ul>
<div class="ib">É comum uma empresa ter lucro na Demonstração de Resultados mas dificuldades de tesouraria — porque lucro contabilístico e dinheiro em caixa não são a mesma coisa (por exemplo, vendas a crédito ainda não recebidas contam como rédito, mas não como dinheiro em caixa). A Demonstração de Fluxos de Caixa existe exactamente para tornar essa diferença visível.</div>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo trabalhado: lendo os números da Cabinda Distribuição</h2>
<p>No fecho do exercício, a Cabinda Distribuição apresenta os seguintes valores: Vendas do exercício de 9.000.000 Kz, Resultado líquido do exercício de 900.000 Kz, Activo corrente (contas a receber, caixa, existências) de 12.000.000 Kz, e Passivo corrente (contas a pagar, obrigações fiscais de curto prazo) de 8.000.000 Kz.</p>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Calcular a margem líquida</h4><p>Margem líquida = Resultado líquido ÷ Vendas = 900.000 ÷ 9.000.000 = <strong>10%</strong>. De cada 100 Kz vendidos, 10 Kz ficam como lucro líquido depois de todos os gastos e impostos.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Calcular o rácio de liquidez geral</h4><p>Liquidez geral = Activo corrente ÷ Passivo corrente = 12.000.000 ÷ 8.000.000 = <strong>1,5</strong>. Por cada 1 Kz de dívida de curto prazo, a empresa tem 1,5 Kz de activo que se espera converter em dinheiro dentro de um ano.</p></div></div>
</div>
<div class="hi"><strong>Leitura conjunta:</strong> uma margem líquida de 10% mostra uma empresa rentável, e uma liquidez geral de 1,5 mostra uma empresa com folga para cumprir as suas obrigações de curto prazo — mas ambos os indicadores só fazem sentido quando comparados com exercícios anteriores da mesma empresa e com empresas semelhantes do mesmo sector, para perceber se estão a melhorar, a piorar ou a manter-se estáveis.</div>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Procedimento prático de leitura das demonstrações financeiras</h2>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Confirmar que o encerramento está completo</h4><p>Reavaliações cambiais, impostos do exercício e conciliações de saldos todos concluídos antes de extrair as demonstrações finais.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Calcular indicadores-chave</h4><p>Margem líquida, liquidez geral, e outros rácios relevantes ao sector e à dimensão da empresa.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Comparar com exercícios anteriores</h4><p>Analisar a evolução dos indicadores ao longo de pelo menos dois ou três exercícios, para identificar tendências.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Traduzir os números em decisões</h4><p>Apresentar à gestão não apenas os valores, mas o que significam para decisões concretas — por exemplo, se a liquidez está a apertar, pode ser preciso rever prazos de pagamento a fornecedores ou de cobrança a clientes.</p></div></div>
</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro comum: confundir lucro contabilístico com dinheiro disponível</h2>
<p>Um erro de leitura muito comum entre gestores (e mesmo alguns contabilistas menos experientes) é olhar para um resultado líquido positivo na Demonstração de Resultados e concluir automaticamente que a empresa "tem esse dinheiro disponível". Isto ignora que o lucro contabilístico inclui réditos ainda não recebidos (vendas a crédito) e exclui saídas de caixa que não são gasto do exercício (como o pagamento de um empréstimo ou a compra de um equipamento). Uma empresa pode fechar o ano com lucro elevado e, ao mesmo tempo, enfrentar dificuldades reais de tesouraria para pagar salários ou fornecedores no mês seguinte — e só a Demonstração de Fluxos de Caixa revela esse risco antecipadamente.</p>
<div class="hi"><strong>Como evitar:</strong> nunca tomar decisões de gestão (como distribuir lucros aos sócios) apenas com base no resultado líquido da Demonstração de Resultados — cruzar sempre com a Demonstração de Fluxos de Caixa e com o rácio de liquidez, para confirmar que a empresa tem efectivamente dinheiro disponível, e não apenas lucro registado.</div>
</div>
<div class="lawbox"><div class="lt">Princípio da imagem verdadeira e apropriada</div><blockquote>As demonstrações financeiras de encerramento do exercício devem reflectir de forma verdadeira e apropriada a posição financeira, o desempenho e os fluxos de caixa da empresa, exigindo que todas as reavaliações, apuramentos fiscais e conciliações estejam concluídos antes da sua elaboração final.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Cabinda Distribuição fecha o exercício com Resultado líquido de 900.000 Kz e Vendas de 9.000.000 Kz. Qual a margem líquida, e o que ela representa?</div>
<div class="qo" onclick="cq(this,false)">a) 90%; a empresa gasta 90% das vendas em impostos</div>
<div class="qo" onclick="cq(this,true)">b) 10%; de cada 100 Kz vendidos, 10 Kz ficam como lucro líquido</div>
<div class="qo" onclick="cq(this,false)">c) 1,5%; a empresa tem folga de tesouraria</div>
<div class="qo" onclick="cq(this,false)">d) 900%; o lucro é nove vezes maior que as vendas</div>
</div>`}
]};

const M3 = {

  aulas:[
{t:'Constituição de Empresa em Angola: Aspectos Contábeis e Fiscais', html:`
<div class="cb"><h2><i class="fas fa-building"></i> O Caso da Construnorte, Lda</h2>
<p>Dois empreendedores de Talatona, o Sr. Fernando e a Sra. Beatriz, decidem abrir a <strong>Construnorte, Lda</strong>, uma empresa de comércio de materiais de construção. Antes de emitirem a primeira factura, precisam de tomar decisões contábeis que vão marcar a empresa para sempre: quanto capital social registar, como distribuir as quotas, e como tratar as despesas do próprio processo de abertura. Este é o ponto de partida deste módulo — vamos sair da teoria isolada e ver como tudo se junta num caso real, do primeiro lançamento ao encerramento do exercício.</p>
<p>A constituição de uma sociedade em Angola não é apenas um acto jurídico. É também o primeiro facto contábil da empresa: antes de haver vendas, compras ou salários, já existe um <strong>balanço de abertura</strong>, formado pelas entradas dos sócios.</p>
</div>
<div class="cb"><h2><i class="fas fa-coins"></i> Capital Social: Entradas em Dinheiro e em Espécie</h2>
