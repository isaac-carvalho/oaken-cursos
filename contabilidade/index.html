<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Curso de Contabilidade e Fiscalidade Angolana — Oaken Cursos</title>
<meta name="description" content="Curso completo de Contabilidade e Fiscalidade Angolana. 3 módulos, aulas autodidatas com quizzes. Domine o PGCA, IVA, IRT, Imposto Industrial e muito mais.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0B1F3A;line-height:1.7;font-size:16px}
a{text-decoration:none;color:inherit}
img{max-width:100%;height:auto;display:block}
svg{max-width:100%;height:auto}
:root{--primary:#0B1F3A;--secondary:#FF6B00;--accent:#00A3A1;--light:#f0f4f8;--gray:#64748B;--green:#16a34a}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.container-sm{max-width:1000px;margin:0 auto;padding:0 16px}
header{background:var(--primary);color:#fff;padding:12px 0;position:sticky;top:0;z-index:500;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.hflex{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-size:24px;font-weight:700;letter-spacing:2px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--secondary)}
.nav{display:flex;gap:22px;align-items:center;font-weight:500;flex-wrap:wrap}
.nav a{color:#fff;font-size:15px;transition:color .2s;cursor:pointer}

.cta-top:hover{transform:scale(1.05);color:#fff!important}

.hero{background:linear-gradient(135deg,var(--primary) 0%,#1a365d 100%);color:#fff;padding:60px 0 70px;position:relative;overflow:hidden}

.hero-content{flex:1;min-width:280px}
.hero-content h1{font-size:clamp(26px,5vw,42px);font-weight:800;line-height:1.2;margin-bottom:14px}
.hero-content h1 span{color:var(--secondary)}
.sub-title{font-size:clamp(17px,3vw,22px);font-weight:600;color:var(--secondary);margin-bottom:12px}
.hero-content p{font-size:clamp(15px,2.5vw,18px);opacity:.9;margin-bottom:22px;max-width:640px}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;margin:20px 0 26px;background:rgba(255,255,255,.05);padding:18px 26px;border-radius:16px;border:1px solid rgba(255,255,255,.08)}
.stat-item{text-align:center}
.stat-number{font-size:clamp(20px,4vw,32px);font-weight:800;color:var(--secondary);display:block}

.hero-badges span{background:rgba(255,255,255,.08);padding:6px 16px;border-radius:50px;font-size:13px;border:1px solid rgba(255,255,255,.1)}
.hero-badges i{color:var(--secondary);margin-right:6px}
.cta-hero{background:var(--secondary);color:#fff;padding:16px 40px;border-radius:50px;font-size:clamp(16px,3vw,20px);font-weight:700;display:inline-block;transition:all .3s;box-shadow:0 8px 30px rgba(255,107,0,.4);border:none;cursor:pointer}
.cta-hero:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(255,107,0,.6);color:#fff}

.disclaimer-box i{color:#f59e0b;margin-right:8px}
section{padding:70px 0}
.section-title{text-align:center;font-size:clamp(24px,5vw,38px);font-weight:700;margin-bottom:12px}

.bg-white{background:#fff}

.mod-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;font-weight:800}
.mod-ic.locked{background:var(--light);color:#cbd5e1}

.mod-ic.done{background:rgba(22,163,74,.1);color:var(--green)}
.mod-info{flex:1;min-width:0}
.mod-info h4{font-size:14px;font-weight:700;margin-bottom:2px}
.mod-info span{font-size:12px;color:var(--gray)}
.mod-badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;white-space:nowrap}
.mod-badge.locked{background:var(--light);color:#94a3b8}
.mod-badge.unlocked{background:rgba(255,107,0,.1);color:var(--secondary)}
.mod-badge.done{background:rgba(22,163,74,.1);color:var(--green)}
@media(max-width:600px){.mod-list{grid-template-columns:1fr}}

.mod-hero h1 span{color:var(--secondary)}

{t:'Introdução à Contabilidade: Património, Fluxos e Equação Fundamental', html:`
<div class="cb"><h2><i class="fas fa-store"></i> Cenário: Kianda Consultoria, Lda</h2>
<p>Imagina que a Ana, residente em Talatona, decide abrir uma pequena empresa de consultoria em gestão chamada <strong>Kianda Consultoria, Lda</strong>. No dia 1 de Março, ela deposita 5.000.000 Kz da sua poupança pessoal na conta bancária da empresa, como capital social. A partir deste momento, a empresa passa a ter um <strong>património próprio</strong>, separado do património pessoal da Ana — este é o primeiro princípio que qualquer pessoa que trabalha com contabilidade precisa de interiorizar: a empresa é uma entidade distinta do seu dono, mesmo numa sociedade unipessoal ou familiar.</p>
<p>É exactamente este tipo de situação — dinheiro que entra, bens que se compram, dívidas que se assumem — que a contabilidade existe para registar, organizar e explicar. Ao longo desta aula vais aprender o vocabulário e a lógica que sustentam tudo o resto do curso.</p>
</div>
<div class="cb"><h2><i class="fas fa-book"></i> O que é a Contabilidade e o que é Património</h2>
<p>A <strong>Contabilidade</strong> é a técnica que regista, classifica e resume, em termos monetários, as operações de uma entidade económica, com o objectivo de produzir informação útil para a tomada de decisão — do próprio gestor, dos sócios, do banco, do fisco (AGT) ou de um futuro investidor. Não é burocracia por burocracia: é o sistema nervoso financeiro de uma empresa.</p>
<p>O <strong>património</strong> de uma empresa é o conjunto de tudo o que ela possui e de tudo o que ela deve, num determinado momento. Divide-se em três grandes blocos:</p>
<ul>
<li><strong>Activo</strong> — os bens e direitos da empresa: dinheiro em caixa, saldos bancários, mercadorias em armazém, viaturas, mobiliário, dívidas de clientes ainda por receber.</li>
<li><strong>Passivo</strong> — as obrigações da empresa perante terceiros: dívidas a fornecedores, empréstimos bancários, impostos a pagar à AGT, salários a pagar aos trabalhadores.</li>
<li><strong>Capital Próprio</strong> — o que sobra do Activo depois de se pagar todo o Passivo; é, na prática, o valor que pertence aos sócios ou ao dono da empresa.</li>
</ul>
</div>
<div class="cb"><h2><i class="fas fa-equals"></i> A Equação Fundamental da Contabilidade</h2>
<p>Toda a contabilidade, dos livros mais simples aos sistemas informáticos mais complexos, assenta numa única equação que nunca se pode desequilibrar:</p>
<div class="hi"><strong>Activo = Passivo + Capital Próprio</strong></div>
<p>Repara bem: isto não é uma coincidência nem uma regra imposta arbitrariamente. É uma consequência lógica de como o dinheiro entra numa empresa. Tudo o que uma empresa possui (Activo) só pode ter vindo de duas fontes: ou os sócios investiram (Capital Próprio), ou terceiros emprestaram/vendem a crédito (Passivo). Não há uma terceira fonte possível. Por isso a equação tem de bater certo sempre, em qualquer momento da vida da empresa.</p>
<p>Vamos seguir a Kianda Consultoria ao longo de três transacções e verificar, passo a passo, que a equação se mantém equilibrada em todas elas.</p>
<div class="tw"><table class="dt">
<tr><th>Transacção</th><th>Efeito no Activo</th><th>Efeito no Passivo</th><th>Efeito no Capital Próprio</th></tr>
<tr><td>1. Ana entra com 5.000.000 Kz em dinheiro (capital social)</td><td>Caixa/Banco +5.000.000</td><td>Sem alteração</td><td>+5.000.000</td></tr>
<tr><td>2. Compra de mobiliário de escritório, 800.000 Kz, pago a pronto</td><td>Caixa -800.000; Imobilizado +800.000</td><td>Sem alteração</td><td>Sem alteração</td></tr>
<tr><td>3. Compra de uma viatura por 2.500.000 Kz: metade paga a pronto, metade fica a dever ao fornecedor a 90 dias</td><td>Caixa -1.250.000; Imobilizado +2.500.000</td><td>+1.250.000 (dívida a fornecedor)</td><td>Sem alteração</td></tr>
</table></div>
<p>Depois destas três transacções, o balanço da Kianda Consultoria fica assim: Caixa = 5.000.000 - 800.000 - 1.250.000 = 2.950.000 Kz; Imobilizado = 800.000 + 2.500.000 = 3.300.000 Kz. Total do Activo = 2.950.000 + 3.300.000 = <strong>6.250.000 Kz</strong>. Do lado direito, Passivo = 1.250.000 Kz e Capital Próprio continua em 5.000.000 Kz (nenhuma das transacções 2 e 3 alterou o capital próprio, porque foram apenas trocas de um bem por outro, ou um bem financiado parcialmente por dívida).</p>
<div class="hi"><strong>Verificação:</strong> Passivo (1.250.000) + Capital Próprio (5.000.000) = 6.250.000 Kz = Activo. A equação bate certo.</div>
</div>
<div class="cb"><h2><i class="fas fa-arrows-rotate"></i> Fluxos: Variações Permutativas e Modificativas</h2>
<p>Toda a operação que a empresa realiza provoca um <strong>fluxo</strong> patrimonial, ou seja, uma alteração no Activo, no Passivo ou no Capital Próprio. Estes fluxos dividem-se em dois tipos:</p>
<ul>
<li><strong>Variações permutativas</strong> — alteram a composição do património, mas não o seu valor total. Exemplo: comprar mobiliário pagando em dinheiro (transacção 2 acima) — o Activo total não muda, apenas troca-se dinheiro por um bem.</li>
<li><strong>Variações modificativas</strong> — alteram o valor total do património, aumentando ou diminuindo o Capital Próprio. Exemplo: a empresa presta um serviço e recebe 300.000 Kz — isto é um rendimento que aumenta o Capital Próprio, porque o Activo cresce sem que o Passivo aumente.</li>
</ul>
<p>Saber distinguir estes dois tipos de variação, mesmo antes de aprenderes partidas dobradas em detalhe, ajuda-te a perceber intuitivamente se uma operação vai ou não afectar o resultado (lucro ou prejuízo) da empresa.</p>
</div>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Identifica os elementos envolvidos</h4><p>Para qualquer transacção, pergunta: que bens, direitos ou obrigações mudaram? Dinheiro, mercadoria, dívida a fornecedor, dívida de cliente?</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Classifica cada elemento</h4><p>Cada elemento pertence ao Activo (bens e direitos), ao Passivo (obrigações) ou é uma variação de Capital Próprio (rendimento ou gasto).</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Confirma o equilíbrio</h4><p>Depois de lançar a operação, soma sempre o Activo de um lado e o Passivo mais o Capital Próprio do outro. Se não bater certo, há um erro no registo.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Confundir Capital Social com Lucro</h2>
<p>Um erro muito frequente entre pessoas que começam a gerir o dinheiro de um pequeno negócio em Angola é tratar o dinheiro que entrou como capital social (o investimento inicial dos sócios) como se fosse lucro disponível para gastar livremente. Na Kianda Consultoria, os 5.000.000 Kz que a Ana investiu não são lucro — são Capital Próprio, e representam uma obrigação moral e, em caso de sociedade com outros sócios, uma obrigação contabilística de reconhecer a participação de cada um. Gastar esse dinheiro em despesas pessoais sem o registar correctamente distorce o balanço e pode causar sérios problemas quando for preciso apurar o resultado real do exercício ou apresentar contas à AGT.</p>
<div class="hi"><strong>Como evitar:</strong> nunca misturar contas pessoais com as da empresa, e registar sempre o capital social numa conta própria de Capital Próprio, separada de qualquer conta de rendimentos.</div>
</div>
<div class="lawbox"><div class="lt">Plano Geral de Contabilidade Angolano (PGCA)</div><blockquote>Toda a empresa constituída em Angola está sujeita à organização da sua contabilidade segundo o PGCA, que define de forma uniforme as classes de contas, os critérios de valorimetria e os modelos de demonstrações financeiras a apresentar.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Kianda Consultoria tinha um Activo total de 6.250.000 Kz e um Passivo de 1.250.000 Kz, depois das três transacções descritas. Se a empresa realizar uma nova operação — pagar 400.000 Kz da dívida ao fornecedor, usando dinheiro do caixa — qual passa a ser o novo Activo total?</div>
<div class="qo" onclick="cq(this,false)">a) 6.250.000 Kz, porque o Capital Próprio não mudou</div>
<div class="qo" onclick="cq(this,true)">b) 5.850.000 Kz, porque o caixa diminui 400.000 Kz e o Passivo também diminui 400.000 Kz</div>
<div class="qo" onclick="cq(this,false)">c) 6.650.000 Kz, porque pagar uma dívida aumenta o Activo</div>
<div class="qo" onclick="cq(this,false)">d) 1.250.000 Kz, porque o Passivo desaparece por completo</div>
</div>`},

{t:'O Plano Geral de Contabilidade Angolano (PGCA): Estrutura e Classes 1-5', html:`
<div class="cb"><h2><i class="fas fa-sitemap"></i> Cenário: Organizar as Contas da Kianda Consultoria</h2>
<p>Depois do primeiro mês de actividade, a Ana precisa de organizar todos os registos da Kianda Consultoria de forma padronizada, para que qualquer contabilista, auditor ou funcionário da AGT consiga ler e entender as suas contas sem confusão. É exactamente para isso que existe o <strong>Plano Geral de Contabilidade Angolano (PGCA)</strong>: um sistema uniforme de classificação de contas, obrigatório para as empresas em Angola, que organiza toda a informação contabilística em <strong>sete classes</strong> numeradas de 1 a 7.</p>
<p>Nesta aula vamos focar-nos nas classes 1 a 5, que correspondem ao <strong>Balanço Patrimonial</strong> (Activo, Passivo e Capital Próprio). As classes 6 e 7, relativas a gastos e rendimentos, serão aprofundadas mais adiante.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-ol"></i> Porque é que um Plano de Contas Uniforme é Necessário</h2>
<p>Sem um plano de contas padronizado, cada empresa poderia inventar os seus próprios nomes e códigos de conta, e nenhuma comparação entre empresas, nenhuma auditoria e nenhuma fiscalização seria praticável. O PGCA resolve este problema definindo uma estrutura de códigos comum: cada conta tem um número que começa pela classe a que pertence, seguido de subdivisões que vão detalhando a natureza exacta do bem, direito, obrigação, gasto ou rendimento em causa.</p>
<p>Isto significa que, quando um contabilista em Cabinda regista uma dívida de um cliente, e outro contabilista em Lubango faz o mesmo, ambos vão usar a mesma lógica de classe e subclasse — o que torna a informação comparável e auditável em todo o país.</p>
</div>
<div class="cb"><h2><i class="fas fa-layer-group"></i> As Cinco Primeiras Classes do PGCA</h2>
<div class="tw"><table class="dt">
<tr><th>Classe</th><th>Designação</th><th>O que inclui (exemplos)</th></tr>
<tr><td>1</td><td>Meios Monetários e Financeiros</td><td>Caixa, Depósitos à ordem em bancos, Aplicações financeiras de curto prazo</td></tr>
<tr><td>2</td><td>Terceiros</td><td>Clientes (dívidas a receber), Fornecedores (dívidas a pagar), Estado e Outros Entes Públicos (IVA, IRT, INSS), Pessoal</td></tr>
<tr><td>3</td><td>Existências</td><td>Mercadorias, Matérias-primas, Produtos acabados e em curso de fabrico</td></tr>
<tr><td>4</td><td>Imobilizações</td><td>Imobilizado corpóreo (viaturas, edifícios, equipamento, mobiliário), Imobilizado incorpóreo (software, trespasse), Imobilizado financeiro (participações)</td></tr>
<tr><td>5</td><td>Capital Próprio</td><td>Capital social, Reservas, Resultados transitados, Resultado líquido do exercício</td></tr>
</table></div>
<p>Repara que estas cinco classes cobrem exactamente os três blocos que aprendeste na aula anterior: as classes 1, 2 (parte de clientes) e 3 e 4 compõem o <strong>Activo</strong>; a classe 2 (parte de fornecedores e Estado) compõe o <strong>Passivo</strong>; e a classe 5 é o <strong>Capital Próprio</strong>. A classe 2 é especial porque contém simultaneamente contas de Activo (Clientes, o que nos devem) e contas de Passivo (Fornecedores, o que devemos) — por isso se chama "Terceiros": agrupa tudo o que envolve relações com entidades externas à empresa.</p>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo Prático de Classificação</h2>
<p>Suponhamos que, no fecho do mês, a Kianda Consultoria tem os seguintes elementos patrimoniais para classificar. Vamos atribuir a classe correcta a cada um:</p>
<div class="tw"><table class="dt">
<tr><th>Elemento</th><th>Valor (Kz)</th><th>Classe PGCA</th></tr>
<tr><td>Saldo na conta bancária</td><td>2.950.000</td><td>Classe 1 – Meios Monetários</td></tr>
<tr><td>Dívida do cliente Construtora Zenza</td><td>1.026.000</td><td>Classe 2 – Terceiros (Clientes)</td></tr>
<tr><td>Dívida à oficina que vendeu a viatura</td><td>1.250.000</td><td>Classe 2 – Terceiros (Fornecedores)</td></tr>
<tr><td>Viatura de serviço</td><td>2.500.000</td><td>Classe 4 – Imobilizações</td></tr>
<tr><td>Mobiliário de escritório</td><td>800.000</td><td>Classe 4 – Imobilizações</td></tr>
<tr><td>Capital social entregue pela Ana</td><td>5.000.000</td><td>Classe 5 – Capital Próprio</td></tr>
</table></div>
<div class="hi"><strong>Regra prática:</strong> se o elemento pode ser "tocado" ou usado directamente na actividade (dinheiro, mercadoria, viatura), normalmente é Activo (classes 1, 3 ou 4). Se envolve uma relação de dívida com alguém de fora da empresa, é classe 2. Se representa a participação dos sócios, é classe 5.</div>
</div>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Identifica a natureza do elemento</h4><p>Pergunta se é dinheiro, uma dívida, um bem físico ou uma participação dos sócios.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Atribui a classe (1º dígito do código)</h4><p>Usa a tabela acima para escolher entre 1, 2, 3, 4 ou 5.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Detalha a subclasse</h4><p>Dentro da classe, escolhe a subconta certa — por exemplo, dentro da classe 2, distingue Clientes de Fornecedores; dentro da classe 4, distingue viaturas de mobiliário.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Classificar uma Dívida a Fornecedor como Meio Monetário</h2>
<p>É frequente, entre quem está a aprender, confundir a conta "Fornecedores" (o que a empresa deve, classe 2, Passivo) com uma conta de Meios Monetários (classe 1). Isto acontece porque ambas às vezes aparecem "perto" de movimentos de caixa nos registos diários. Se um contabilista lançar por engano a dívida de 1.250.000 Kz à oficina como se fosse dinheiro disponível (classe 1) em vez de uma obrigação a pagar (classe 2), o balanço da empresa vai mostrar um Activo inflacionado e um Passivo subavaliado — o que pode levar o dono do negócio a pensar que tem mais liquidez do que realmente tem, e a tomar decisões de investimento ou de despesa que a empresa não consegue suportar.</p>
<div class="hi"><strong>Como evitar:</strong> antes de classificar qualquer valor, pergunta sempre "isto é meu, ou eu devo isto a alguém?" — a resposta determina se entra no Activo ou no Passivo, e nunca deve ser tratado como dinheiro disponível.</div>
</div>
<div class="lawbox"><div class="lt">Plano Geral de Contabilidade Angolano (PGCA)</div><blockquote>O PGCA estrutura o registo contabilístico das empresas angolanas em sete classes de contas, garantindo uniformidade na elaboração das demonstrações financeiras e facilitando a fiscalização por parte da AGT.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A contabilista de uma loja em Benguela precisa de classificar uma dívida de 350.000 Kz que um cliente ainda não pagou pela compra de material. Em que classe do PGCA deve registar este valor?</div>
<div class="qo" onclick="cq(this,false)">a) Classe 1 – Meios Monetários, porque representa dinheiro que vai entrar</div>
<div class="qo" onclick="cq(this,true)">b) Classe 2 – Terceiros, na subconta de Clientes</div>
<div class="qo" onclick="cq(this,false)">c) Classe 4 – Imobilizações, porque é um direito de longo prazo</div>
<div class="qo" onclick="cq(this,false)">d) Classe 5 – Capital Próprio, porque aumenta o valor da empresa</div>
</div>`},

{t:'Partidas Dobradas: Princípio, Regras de Débito e Crédito', html:`
<div class="cb"><h2><i class="fas fa-scale-balanced"></i> Cenário: Registar a Compra da Viatura</h2>
<p>Recorda a transacção da aula 1: a Kianda Consultoria compra uma viatura por 2.500.000 Kz, pagando 1.250.000 Kz a pronto e ficando a dever os restantes 1.250.000 Kz ao fornecedor. Já sabemos que esta operação envolve três elementos patrimoniais: a viatura (Activo), o dinheiro que saiu (Activo) e a dívida assumida (Passivo). Mas como é que isto se regista, na prática, nos livros da empresa? A resposta é o <strong>método das partidas dobradas</strong>, a técnica universal usada em contabilidade desde há séculos.</p>
</div>
<div class="cb"><h2><i class="fas fa-arrows-left-right"></i> O Princípio da Dupla Entrada</h2>
<p>O princípio das partidas dobradas diz que <strong>toda a transacção afecta pelo menos duas contas, uma a débito e outra a crédito, e o valor total debitado tem sempre de ser igual ao valor total creditado</strong>. Nunca se lança um valor de um lado sem o correspondente do outro lado. É esta regra que garante, automaticamente, que a equação fundamental (Activo = Passivo + Capital Próprio) se mantenha sempre equilibrada, transacção após transacção.</p>
<div class="hi"><strong>Regra de ouro:</strong> em cada lançamento contabilístico, Soma dos Débitos = Soma dos Créditos. Sempre, sem excepção.</div>
</div>
<div class="cb"><h2><i class="fas fa-table"></i> As Regras de Débito e Crédito por Tipo de Conta</h2>
<p>Cada classe de conta tem um comportamento próprio quando aumenta ou diminui. A tabela seguinte resume a regra que precisas de memorizar — é, provavelmente, a tabela mais importante de todo este curso:</p>
<div class="tw"><table class="dt">
<tr><th>Tipo de Conta</th><th>Aumenta com</th><th>Diminui com</th></tr>
<tr><td>Activo (classes 1, 2-Clientes, 3, 4)</td><td>Débito</td><td>Crédito</td></tr>
<tr><td>Passivo (classe 2-Fornecedores, Estado)</td><td>Crédito</td><td>Débito</td></tr>
<tr><td>Capital Próprio (classe 5)</td><td>Crédito</td><td>Débito</td></tr>
<tr><td>Gastos/Custos (classe 6)</td><td>Débito</td><td>Crédito</td></tr>
<tr><td>Rendimentos/Proveitos (classe 7)</td><td>Crédito</td><td>Débito</td></tr>
</table></div>
<p>Uma forma simples de memorizar: contas de Activo e de Gastos "gostam" do débito (aumentam a débito); contas de Passivo, Capital Próprio e Rendimentos "gostam" do crédito (aumentam a crédito). Se um dia tiveres dúvidas, volta sempre a esta tabela.</p>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo Trabalhado: Lançamento da Compra da Viatura</h2>
<p>Vamos aplicar a regra à compra da viatura de 2.500.000 Kz (1.250.000 Kz a pronto + 1.250.000 Kz a crédito):</p>
<ul>
<li>A conta <strong>Imobilizado – Viaturas</strong> (Activo) aumenta 2.500.000 Kz → regista-se a <strong>Débito</strong>.</li>
<li>A conta <strong>Caixa/Bancos</strong> (Activo) diminui 1.250.000 Kz → regista-se a <strong>Crédito</strong>.</li>
<li>A conta <strong>Fornecedores de Imobilizado</strong> (Passivo) aumenta 1.250.000 Kz → regista-se a <strong>Crédito</strong>.</li>
</ul>
<div class="tw"><table class="dt">
<tr><th>Conta</th><th>Débito (Kz)</th><th>Crédito (Kz)</th></tr>
<tr><td>Imobilizado – Viaturas</td><td>2.500.000</td><td>—</td></tr>
<tr><td>Caixa/Bancos</td><td>—</td><td>1.250.000</td></tr>
<tr><td>Fornecedores de Imobilizado</td><td>—</td><td>1.250.000</td></tr>
<tr><td><strong>Total</strong></td><td><strong>2.500.000</strong></td><td><strong>2.500.000</strong></td></tr>
</table></div>
<div class="hi"><strong>Resultado:</strong> Débitos (2.500.000) = Créditos (2.500.000). O lançamento está equilibrado e correcto.</div>
</div>
<div class="cb"><h2><i class="fas fa-file-invoice-dollar"></i> Segundo Exemplo: uma Venda a Crédito com IVA</h2>
<p>A Kianda Consultoria presta um serviço de consultoria a um cliente por 900.000 Kz, a pagar em 30 dias, com IVA à taxa normal de 14%. O IVA a acrescentar é 900.000 × 14% = 126.000 Kz. O valor total da factura é 900.000 + 126.000 = <strong>1.026.000 Kz</strong>.</p>
<div class="tw"><table class="dt">
<tr><th>Conta</th><th>Débito (Kz)</th><th>Crédito (Kz)</th></tr>
<tr><td>Clientes (Activo, classe 2)</td><td>1.026.000</td><td>—</td></tr>
<tr><td>Prestações de Serviços (Rendimento, classe 7)</td><td>—</td><td>900.000</td></tr>
<tr><td>IVA Liquidado / Estado (Passivo, classe 2)</td><td>—</td><td>126.000</td></tr>
<tr><td><strong>Total</strong></td><td><strong>1.026.000</strong></td><td><strong>1.026.000</strong></td></tr>
</table></div>
<p>Repara que a conta Clientes aumenta a débito (é Activo), a conta de rendimento aumenta a crédito, e o IVA a entregar à AGT é registado como uma dívida da empresa ao Estado (Passivo), também a crédito — porque a empresa apenas cobra o IVA em nome do Estado, não é seu.</p>
</div>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Identifica as contas envolvidas</h4><p>Lê a transacção e lista todas as contas que mudam de valor.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Classifica cada conta</h4><p>Determina se cada conta é Activo, Passivo, Capital Próprio, Gasto ou Rendimento.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Aplica a regra de débito/crédito</h4><p>Usa a tabela de regras para decidir de que lado lançar cada aumento ou diminuição.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Confirma o equilíbrio</h4><p>Soma os débitos e os créditos — têm de dar o mesmo valor. Se não derem, revê o lançamento.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Inverter Débito e Crédito numa Conta de Passivo</h2>
<p>Um erro muito comum entre principiantes é aplicar a regra do Activo (aumenta a débito) a contas de Passivo. Por exemplo, ao registar que a empresa passou a dever 1.250.000 Kz ao fornecedor da viatura, alguém menos experiente pode, por hábito, lançar esse aumento a débito — o que está errado, porque o Passivo aumenta a crédito. Se este erro passar despercebido, o balancete final não vai fechar (débitos ≠ créditos), e o contabilista vai perder horas a tentar encontrar a diferença, ou pior, vai apresentar um balanço com a dívida ao fornecedor subavaliada ou mesmo invertida.</p>
<div class="hi"><strong>Como evitar:</strong> nunca decores "débito = aumenta, crédito = diminui" como regra universal — essa regra só vale para Activo e Gastos. Para Passivo, Capital Próprio e Rendimentos, é o inverso.</div>
</div>
<div class="lawbox"><div class="lt">Plano Geral de Contabilidade Angolano (PGCA)</div><blockquote>O método das partidas dobradas é a base técnica exigida pelo PGCA para o registo de todas as operações patrimoniais das empresas angolanas, assegurando que o Activo se mantém sempre igual à soma do Passivo com o Capital Próprio.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Uma empresa em Lubango recebe 200.000 Kz de um cliente, como pagamento de uma dívida já registada em Clientes. Como se regista este recebimento em partidas dobradas?</div>
<div class="qo" onclick="cq(this,false)">a) Débito em Clientes 200.000 / Crédito em Caixa 200.000</div>
<div class="qo" onclick="cq(this,true)">b) Débito em Caixa 200.000 / Crédito em Clientes 200.000</div>
<div class="qo" onclick="cq(this,false)">c) Débito em Vendas 200.000 / Crédito em Caixa 200.000</div>
<div class="qo" onclick="cq(this,false)">d) Crédito em Caixa 200.000 / Crédito em Clientes 200.000</div>
</div>`},

{t:'Registo das Operações Correntes: Diário, Razão e Balancete', html:`
<div class="cb"><h2><i class="fas fa-calendar-days"></i> Cenário: Fechar o Primeiro Mês da Kianda Consultoria</h2>
<p>Chegou o fim do mês de Março e a Ana precisa de organizar todas as transacções da Kianda Consultoria num sistema formal, para conseguir ver rapidamente qual é a situação financeira da empresa. Nesta aula vamos percorrer os três livros/documentos centrais de qualquer sistema contabilístico: o <strong>Diário</strong>, o <strong>Razão</strong> e o <strong>Balancete</strong>, usando exactamente as cinco transacções que a Kianda realizou em Março.</p>
</div>
<div class="cb"><h2><i class="fas fa-book-open"></i> O Livro Diário</h2>
<p>O <strong>Diário</strong> é onde todas as transacções são registadas, por ordem cronológica, no momento em que acontecem, sob a forma de lançamentos em partidas dobradas (débito e crédito). É o primeiro ponto de entrada de qualquer operação no sistema contabilístico — nada entra na contabilidade sem passar primeiro pelo Diário.</p>
<div class="tw"><table class="dt">
<tr><th>Data</th><th>Descrição</th><th>Conta</th><th>Débito (Kz)</th><th>Crédito (Kz)</th></tr>
<tr><td>01/03</td><td>Capital social inicial</td><td>Caixa / Capital</td><td>5.000.000</td><td>5.000.000</td></tr>
<tr><td>05/03</td><td>Compra de mobiliário, a pronto</td><td>Imobilizado / Caixa</td><td>800.000</td><td>800.000</td></tr>
<tr><td>10/03</td><td>Compra de viatura, parte a crédito</td><td>Imobilizado / Caixa + Fornecedores</td><td>2.500.000</td><td>1.250.000 + 1.250.000</td></tr>
<tr><td>18/03</td><td>Venda de serviços a prazo, com IVA</td><td>Clientes / Vendas + IVA</td><td>1.026.000</td><td>900.000 + 126.000</td></tr>
<tr><td>27/03</td><td>Recebimento parcial do cliente</td><td>Caixa / Clientes</td><td>500.000</td><td>500.000</td></tr>
</table></div>
</div>
<div class="cb"><h2><i class="fas fa-t"></i> O Livro Razão</h2>
<p>Depois de tudo registado no Diário, cada valor precisa de ser "transportado" para a conta a que pertence, para sabermos o saldo acumulado de cada uma. É isso que o <strong>Razão</strong> faz: organiza os movimentos por conta, normalmente representados em forma de "T" (uma linha vertical que separa débitos à esquerda de créditos à direita).</p>
<p>Vamos calcular o saldo final de cada conta principal, depois das cinco transacções de Março:</p>
<ul>
<li><strong>Caixa/Bancos:</strong> +5.000.000 (capital) - 800.000 (mobiliário) - 1.250.000 (viatura) + 500.000 (recebimento) = <strong>3.450.000 Kz</strong></li>
<li><strong>Imobilizado:</strong> 800.000 (mobiliário) + 2.500.000 (viatura) = <strong>3.300.000 Kz</strong></li>
<li><strong>Clientes:</strong> 1.026.000 (venda) - 500.000 (recebimento) = <strong>526.000 Kz</strong></li>
<li><strong>Fornecedores:</strong> <strong>1.250.000 Kz</strong> (saldo credor, é uma dívida da empresa)</li>
<li><strong>Capital Próprio:</strong> <strong>5.000.000 Kz</strong> (saldo credor)</li>
<li><strong>Vendas/Prestações de Serviços:</strong> <strong>900.000 Kz</strong> (saldo credor, é um rendimento)</li>
<li><strong>IVA Liquidado (Estado):</strong> <strong>126.000 Kz</strong> (saldo credor, dívida à AGT)</li>
</ul>
</div>
<div class="cb"><h2><i class="fas fa-clipboard-check"></i> O Balancete</h2>
<p>O <strong>Balancete</strong> é a lista de todas as contas do Razão com os seus saldos, organizada para verificar que o total de débitos é igual ao total de créditos — é o "teste de integridade" do sistema contabilístico antes de se avançar para as demonstrações financeiras.</p>
<div class="tw"><table class="dt">
<tr><th>Conta</th><th>Saldo Devedor (Kz)</th><th>Saldo Credor (Kz)</th></tr>
<tr><td>Caixa/Bancos</td><td>3.450.000</td><td>—</td></tr>
<tr><td>Imobilizado</td><td>3.300.000</td><td>—</td></tr>
<tr><td>Clientes</td><td>526.000</td><td>—</td></tr>
<tr><td>Fornecedores</td><td>—</td><td>1.250.000</td></tr>
<tr><td>Capital Próprio</td><td>—</td><td>5.000.000</td></tr>
<tr><td>Vendas/Prestações de Serviços</td><td>—</td><td>900.000</td></tr>
<tr><td>IVA Liquidado</td><td>—</td><td>126.000</td></tr>
<tr><td><strong>Total</strong></td><td><strong>7.276.000</strong></td><td><strong>7.276.000</strong></td></tr>
</table></div>
<div class="hi"><strong>Verificação:</strong> 3.450.000 + 3.300.000 + 526.000 = 7.276.000 Kz de um lado; 1.250.000 + 5.000.000 + 900.000 + 126.000 = 7.276.000 Kz do outro. O balancete fecha correctamente.</div>
</div>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Regista no Diário</h4><p>Cada transacção entra por ordem cronológica, em partidas dobradas.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Transporta para o Razão</h4><p>Cada valor do Diário é lançado na conta em "T" correspondente, e vai-se acumulando o saldo.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Elabora o Balancete</h4><p>Lista-se todas as contas com o respectivo saldo devedor ou credor, e confirma-se que os totais coincidem.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Esquecer de Transportar um Lançamento para o Razão</h2>
<p>Um erro típico é registar correctamente uma transacção no Diário, mas esquecer de a transportar para uma das contas do Razão — por exemplo, lançar a venda de 1.026.000 Kz em Clientes, mas esquecer de actualizar a conta de Vendas ou de IVA. Quando isto acontece, o Balancete final não fecha: os débitos não igualam os créditos, e o contabilista tem de rever manualmente todos os lançamentos até encontrar a omissão — um processo demorado, sobretudo em empresas com muitos movimentos mensais.</p>
<div class="hi"><strong>Como evitar:</strong> depois de cada lançamento no Diário, confirma imediatamente que todas as contas envolvidas foram actualizadas no Razão, antes de passares para a transacção seguinte.</div>
</div>
<div class="ib">Vale a pena notar que o Balancete, por si só, não garante que todos os lançamentos estão correctos — apenas garante que os débitos e créditos foram registados em quantidades iguais. É perfeitamente possível classificar uma transacção na conta errada (por exemplo, lançar a compra de mobiliário como se fosse uma despesa de manutenção) e o Balancete continuar a fechar, porque o erro afecta a classificação, não o equilíbrio numérico. Por isso, além de conferir que os totais batem certo, um bom contabilista revê periodicamente se cada saldo faz sentido económico: o saldo de Caixa nunca deveria ser negativo (não é possível ter menos que zero em dinheiro físico), o saldo de Clientes deveria corresponder a facturas reais em aberto, e o saldo de Fornecedores deveria bater com os documentos de compra pendentes de pagamento. Esta verificação cruzada, feita todos os meses antes de fechar as contas, é o que separa um sistema contabilístico fiável de um que apenas "parece" fiável porque os números batem certo por coincidência.</div>
<div class="lawbox"><div class="lt">Plano Geral de Contabilidade Angolano (PGCA)</div><blockquote>O PGCA exige que as empresas mantenham registos organizados em Diário e Razão, e que produzam periodicamente um Balancete como instrumento de controlo da exactidão dos registos contabilísticos.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Se, no balancete da Kianda Consultoria, o total dos saldos devedores fosse 7.276.000 Kz mas o total dos saldos credores desse apenas 7.176.000 Kz, o que isto indicaria?</div>
<div class="qo" onclick="cq(this,false)">a) Que a empresa teve lucro de 100.000 Kz no mês</div>
<div class="qo" onclick="cq(this,true)">b) Que há um erro de registo — provavelmente um lançamento a crédito que não foi transportado correctamente para o Razão</div>
<div class="qo" onclick="cq(this,false)">c) Que o Passivo da empresa diminuiu 100.000 Kz</div>
<div class="qo" onclick="cq(this,false)">d) É normal, os balancetes não precisam de fechar exactamente</div>
</div>`},

{t:'Documentos, Facturação e Regime Jurídico das Facturas em Angola', html:`
<div class="cb"><h2><i class="fas fa-receipt"></i> Cenário: Emitir a Primeira Factura</h2>
<p>A Kianda Consultoria prestou um serviço de consultoria à empresa "Construtora Zenza", em Cabinda, e precisa agora de emitir o documento que formaliza esta venda perante o cliente e perante a AGT: a <strong>factura</strong>. Em Angola, a emissão de facturas não é uma opção nem um simples costume comercial — é uma obrigação legal, com requisitos específicos definidos pela <strong>Lei n.º 7/19, de 24 de Abril</strong>, que regula a facturação. Nesta aula vamos aprender o que é um documento contabilístico, os tipos que existem, e o que a lei exige que conste obrigatoriamente numa factura angolana.</p>
</div>
<div class="cb"><h2><i class="fas fa-folder-open"></i> Documentos Contabilísticos: Porque São a Base de Tudo</h2>
<p>Nenhum lançamento contabilístico deve ser feito "de cabeça" ou por memória — cada registo no Diário tem de ter por base um <strong>documento comprovativo</strong>: uma factura, um recibo, um extracto bancário, uma guia de remessa, um contrato. Isto é fundamental por duas razões: primeiro, para que a informação contabilística seja verificável e auditável; segundo, porque a AGT exige que as empresas consigam justificar cada valor declarado nas suas obrigações fiscais com um documento de suporte válido.</p>
<p>Os principais documentos que uma empresa angolana usa no dia a dia são:</p>
<ul>
<li><strong>Factura</strong> — documenta uma venda de bens ou prestação de serviços, com efeitos fiscais (gera IVA).</li>
<li><strong>Factura-Recibo</strong> — combina a factura com a prova de pagamento imediato.</li>
<li><strong>Nota de Crédito</strong> — usada para anular ou reduzir o valor de uma factura já emitida (por exemplo, numa devolução).</li>
<li><strong>Guia de Remessa</strong> — acompanha a mercadoria durante o transporte, antes da factura definitiva.</li>
<li><strong>Recibo</strong> — comprova apenas o recebimento de um pagamento.</li>
</ul>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> Os Elementos Obrigatórios de uma Factura (Lei n.º 7/19)</h2>
<p>A Lei n.º 7/19, de 24 de Abril, que regula a facturação em Angola, exige que toda a factura contenha, no mínimo, os seguintes elementos:</p>
<div class="tw"><table class="dt">
<tr><th>Elemento Obrigatório</th><th>Exemplo (Kianda Consultoria)</th></tr>
<tr><td>Identificação completa do emitente (nome, NIF, morada)</td><td>Kianda Consultoria, Lda — NIF 5417XXXXXX — Talatona, Luanda</td></tr>
<tr><td>Identificação do adquirente (nome, NIF)</td><td>Construtora Zenza, Lda — NIF 5401XXXXXX</td></tr>
<tr><td>Número sequencial único da factura</td><td>FT 2026/000045</td></tr>
<tr><td>Data de emissão</td><td>18/03/2026</td></tr>
<tr><td>Descrição clara dos bens ou serviços</td><td>Serviços de consultoria em gestão — Março/2026</td></tr>
<tr><td>Quantidade e preço unitário</td><td>1 serviço, 900.000 Kz</td></tr>
<tr><td>Taxa de IVA aplicada e valor do imposto</td><td>14% — 126.000 Kz</td></tr>
<tr><td>Valor total da factura</td><td>1.026.000 Kz</td></tr>
</table></div>
<p>Se qualquer um destes elementos faltar, a factura pode ser considerada inválida para efeitos fiscais — o que significa que o cliente pode não conseguir deduzir o IVA, e a AGT pode não aceitar o documento como prova de despesa ou de venda numa eventual inspecção.</p>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo Trabalhado: Factura com Desconto Comercial</h2>
<p>A Kianda Consultoria decide agora facturar um segundo serviço, no valor bruto de 500.000 Kz, mas concede um desconto comercial de 5% ao cliente por se tratar de um contrato recorrente. Vamos calcular o valor final da factura passo a passo:</p>
<ul>
<li>Valor bruto do serviço: 500.000 Kz</li>
<li>Desconto comercial de 5%: 500.000 × 5% = 25.000 Kz</li>
<li>Valor líquido (base de incidência do IVA): 500.000 - 25.000 = 475.000 Kz</li>
<li>IVA à taxa normal de 14%: 475.000 × 14% = 66.500 Kz</li>
<li>Valor total da factura: 475.000 + 66.500 = <strong>541.500 Kz</strong></li>
</ul>
<div class="hi"><strong>Regra importante:</strong> o desconto comercial reduz o valor sobre o qual o IVA é calculado. O IVA nunca incide sobre o valor bruto quando há desconto concedido na própria factura — incide sempre sobre o valor líquido depois do desconto.</div>
</div>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Confirma os dados do cliente</h4><p>Nome completo e NIF correctos — um erro aqui invalida o documento para efeitos fiscais do cliente.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Descreve o bem ou serviço com precisão</h4><p>Evita descrições vagas como "serviços diversos" — detalha o que foi efectivamente vendido ou prestado.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Calcula o valor líquido e o IVA</h4><p>Aplica primeiro qualquer desconto, depois calcula o IVA de 14% sobre o valor líquido.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Numera sequencialmente e arquiva</h4><p>Cada factura tem um número único e sequencial; nunca reutilizes nem saltes números.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Emitir Facturas Sem Numeração Sequencial Contínua</h2>
<p>Um erro grave e frequente em pequenas empresas angolanas é emitir facturas fora de ordem, saltar números, ou usar numerações diferentes em cadernos ou ficheiros diferentes. Isto quebra a exigência legal de sequencialidade e é um dos primeiros pontos que a AGT verifica numa inspecção — uma numeração com "buracos" ou desordenada levanta suspeita de facturação paralela ou omissão de vendas, e pode resultar em multas e na obrigação de reconstituir toda a contabilidade do período em causa.</p>
<div class="hi"><strong>Como evitar:</strong> usa sempre um único sistema (manual ou informático) para numerar facturas, de forma estritamente sequencial e sem interrupções, mesmo quando uma factura é anulada — nesse caso, anula-se formalmente com nota de crédito, mas não se reutiliza o número.</div>
</div>
<div class="lawbox"><div class="lt">Lei n.º 7/19, de 24 de Abril</div><blockquote>Regula a facturação das operações económicas em Angola, definindo os elementos obrigatórios que toda a factura deve conter e as regras de numeração sequencial dos documentos emitidos pelas empresas.</blockquote></div>
<div class="lawbox"><div class="lt">IVA — Taxa Normal</div><blockquote>A taxa normal do Imposto sobre o Valor Acrescentado (IVA) em Angola é de 14%, aplicável sobre o valor líquido da venda de bens ou prestação de serviços, salvo isenções específicas previstas na lei.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Uma factura tem um valor bruto de 800.000 Kz, com desconto comercial de 10% e IVA de 14% sobre o valor líquido. Qual é o valor total da factura?</div>
<div class="qo" onclick="cq(this,false)">a) 912.000 Kz</div>
<div class="qo" onclick="cq(this,true)">b) 820.800 Kz</div>
<div class="qo" onclick="cq(this,false)">c) 800.000 Kz</div>
<div class="qo" onclick="cq(this,false)">d) 720.000 Kz</div>
</div>`},

{t:'Compras, Vendas, Existências e CMV — Parte 1 (Métodos de Inventário)', html:`
<div class="cb"><h2><i class="fas fa-warehouse"></i> Cenário: Loja de Material de Construção em Benguela</h2>
<p>O Sr. Domingos gere uma loja de material de construção em Benguela e vende sacos de cimento. No início do mês, tem em armazém 100 sacos, comprados a 3.000 Kz cada (custo total de 300.000 Kz). A meio do mês, compra mais 200 sacos, mas desta vez o fornecedor subiu o preço para 3.200 Kz cada (custo total de 640.000 Kz). No fim do mês, o Sr. Domingos vendeu 150 sacos. A pergunta que qualquer comerciante precisa de responder é: qual foi o <strong>Custo das Mercadorias Vendidas (CMV)</strong> destes 150 sacos, e qual é o valor da existência que ainda resta em armazém?</p>
</div>
<div class="cb"><h2><i class="fas fa-boxes-stacked"></i> O Que São Existências e o Que É o CMV</h2>
<p><strong>Existências</strong> (classe 3 do PGCA) são os bens que a empresa compra com o objectivo de revender (mercadorias) ou de transformar e depois vender (matérias-primas, produtos em curso, produtos acabados). O <strong>Custo das Mercadorias Vendidas (CMV)</strong> é o valor, em Kz, que corresponde ao custo de aquisição das unidades efectivamente vendidas num período — e não ao preço de venda. O CMV é um gasto que reduz o resultado do exercício, e é um dos valores mais importantes para saber se um negócio de compra e venda está realmente a dar lucro.</p>
<p>O problema é que, quando compramos o mesmo produto em datas diferentes e a preços diferentes, precisamos de um <strong>método de valorimetria de existências</strong> para decidir que custo atribuir às unidades vendidas. Os dois métodos mais usados em Angola são o <strong>FIFO</strong> (First In, First Out — o primeiro que entra é o primeiro que sai) e o <strong>Custo Médio Ponderado (CMP)</strong>.</p>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo Trabalhado: FIFO vs Custo Médio Ponderado</h2>
<p>Vamos calcular o CMV dos 150 sacos vendidos pelo Sr. Domingos, usando os dois métodos:</p>
<div class="tw"><table class="dt">
<tr><th>Movimento</th><th>Quantidade</th><th>Custo Unitário</th><th>Custo Total</th></tr>
<tr><td>Existência inicial</td><td>100 sacos</td><td>3.000 Kz</td><td>300.000 Kz</td></tr>
<tr><td>Compra</td><td>200 sacos</td><td>3.200 Kz</td><td>640.000 Kz</td></tr>
<tr><td><strong>Total disponível</strong></td><td><strong>300 sacos</strong></td><td>—</td><td><strong>940.000 Kz</strong></td></tr>
</table></div>
<p><strong>Método FIFO:</strong> os primeiros sacos a sair são os mais antigos. Dos 150 sacos vendidos, saem primeiro os 100 sacos da existência inicial (a 3.000 Kz) e depois 50 sacos da compra mais recente (a 3.200 Kz):</p>
<ul>
<li>100 × 3.000 = 300.000 Kz</li>
<li>50 × 3.200 = 160.000 Kz</li>
<li>CMV (FIFO) = 300.000 + 160.000 = <strong>460.000 Kz</strong></li>
<li>Existência final = 150 sacos restantes, todos a 3.200 Kz = <strong>480.000 Kz</strong></li>
</ul>
<p><strong>Método do Custo Médio Ponderado:</strong> calcula-se um custo único médio para todas as unidades disponíveis: 940.000 Kz ÷ 300 sacos = 3.133,33 Kz por saco (arredondado).</p>
<ul>
<li>CMV (CMP) = 150 × 3.133,33 = <strong>470.000 Kz</strong></li>
<li>Existência final = 150 × 3.133,33 = <strong>470.000 Kz</strong></li>
</ul>
<div class="hi"><strong>Comparação:</strong> em época de preços a subir, o FIFO dá um CMV mais baixo (460.000 Kz) e, consequentemente, um lucro contabilístico mais alto, do que o Custo Médio Ponderado (470.000 Kz de CMV).</div>
</div>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Regista todas as entradas com data, quantidade e custo</h4><p>Mantém uma ficha de existências actualizada para cada produto.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Escolhe um método de valorimetria e aplica-o de forma consistente</h4><p>Uma vez escolhido FIFO ou CMP, usa o mesmo método em todos os períodos, para permitir comparação.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Calcula o CMV de cada venda</h4><p>Aplica a lógica do método escolhido às unidades efectivamente vendidas.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Actualiza o saldo da existência final</h4><p>O valor que resta em armazém é a base para o balanço do período seguinte.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Misturar Métodos de Valorimetria no Mesmo Período</h2>
<p>É comum, em pequenos negócios sem sistema informático, o dono calcular o CMV "à vista", usando ora o preço da última compra, ora uma média aproximada, sem seguir um método consistente. O resultado é que o CMV apurado não corresponde a nenhum método reconhecido, o valor da existência final fica sem justificação lógica, e o resultado do exercício (lucro ou prejuízo) fica distorcido — o que pode levar a decisões erradas, como achar que o negócio está a perder dinheiro quando na verdade está a ganhar, ou vice-versa.</p>
<div class="hi"><strong>Como evitar:</strong> escolhe um único método de valorimetria (FIFO ou Custo Médio Ponderado) e regista sistematicamente todas as entradas e saídas de existências com data, quantidade e custo unitário.</div>
</div>
<div class="ib">Existe ainda um terceiro conceito importante ligado às existências: a <strong>margem bruta</strong>, que mede a diferença entre o valor de venda e o CMV. No caso do Sr. Domingos, se ele vender os 150 sacos a 4.000 Kz cada (600.000 Kz de venda) e o CMV pelo método FIFO for 460.000 Kz, a margem bruta é 600.000 - 460.000 = 140.000 Kz, ou seja, cerca de 23,3% do valor de venda. Este indicador é fundamental para qualquer comerciante decidir se os seus preços de venda cobrem adequadamente o custo de reposição das mercadorias, especialmente num contexto de subida de preços como o do exemplo, em que o custo de compra passou de 3.000 para 3.200 Kz por saco. Se o Sr. Domingos continuar a vender ao mesmo preço sem rever periodicamente a sua margem, pode acabar a vender abaixo do custo de reposição sem sequer perceber, porque o seu sistema de preços não acompanhou a subida de custos dos fornecedores.</div>
<div class="lawbox"><div class="lt">Plano Geral de Contabilidade Angolano (PGCA)</div><blockquote>As existências (classe 3) devem ser valorizadas segundo um critério consistente e documentado, sendo o FIFO e o Custo Médio Ponderado os métodos mais utilizados pelas empresas angolanas para apurar o Custo das Mercadorias Vendidas.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Usando o método FIFO no exemplo do Sr. Domingos (100 sacos a 3.000 Kz + 200 sacos a 3.200 Kz, vendidos 150 sacos), qual é o valor da existência final em armazém?</div>
<div class="qo" onclick="cq(this,false)">a) 300.000 Kz</div>
<div class="qo" onclick="cq(this,false)">b) 460.000 Kz</div>
<div class="qo" onclick="cq(this,true)">c) 480.000 Kz</div>
<div class="qo" onclick="cq(this,false)">d) 640.000 Kz</div>
</div>`},

{t:'Compras, Vendas, Existências e CMV — Parte 2 (Devoluções e Ajustamentos)', html:`
<div class="cb"><h2><i class="fas fa-rotate-left"></i> Cenário: Devolução e Contagem Física na Loja do Sr. Domingos</h2>
<p>Continuando o exemplo da aula anterior: o Sr. Domingos vendeu 150 sacos de cimento a 4.000 Kz cada (preço de venda ao público), o que gerou uma venda de 600.000 Kz mais IVA. Poucos dias depois, um cliente devolve 20 sacos por defeito de fabrico. Mais tarde, no fecho do mês, o Sr. Domingos faz uma contagem física do armazém e descobre uma diferença entre o que o sistema indica e o que realmente está nas prateleiras. Esta aula ensina como tratar estas duas situações: <strong>devoluções</strong> e <strong>ajustamentos de inventário</strong>.</p>
</div>
<div class="cb"><h2><i class="fas fa-undo"></i> Devoluções de Vendas</h2>
<p>Uma <strong>devolução de venda</strong> ocorre quando o cliente devolve um bem já vendido e facturado, por defeito, erro ou desistência dentro do prazo acordado. Contabilisticamente, uma devolução tem sempre dois efeitos simultâneos: (1) anula parte da venda e do IVA associado, através de uma <strong>Nota de Crédito</strong>; e (2) faz reentrar em armazém as unidades devolvidas, ao custo pelo qual tinham saído.</p>
<p>Vamos calcular o efeito da devolução dos 20 sacos:</p>
<ul>
<li>Valor de venda anulado: 20 sacos × 4.000 Kz = 80.000 Kz</li>
<li>IVA anulado: 80.000 × 14% = 11.200 Kz</li>
<li>Valor total da Nota de Crédito ao cliente: 80.000 + 11.200 = <strong>91.200 Kz</strong></li>
<li>Reentrada em armazém, ao custo FIFO da última saída (3.200 Kz/saco): 20 × 3.200 = <strong>64.000 Kz</strong></li>
</ul>
<div class="hi"><strong>Atenção:</strong> a devolução reduz a venda e o IVA pelo valor de venda (91.200 Kz), mas a existência reentra pelo valor de custo (64.000 Kz) — são dois valores diferentes e não se deve confundir um com o outro.</div>
</div>
<div class="cb"><h2><i class="fas fa-magnifying-glass"></i> Ajustamentos de Inventário: Quebras e Perdas</h2>
<p>Além das devoluções, é normal que, ao longo do tempo, surjam diferenças entre a existência que o sistema contabilístico indica (com base nas entradas e saídas registadas) e a existência física real — por furto, deterioração, evaporação, quebra de manuseamento, ou simples erro de registo. A este processo de comparação chama-se <strong>contagem física</strong> ou <strong>inventário físico</strong>, e a diferença encontrada chama-se <strong>quebra de inventário</strong>.</p>
<p>No caso do Sr. Domingos, depois da devolução, o sistema indica 130 sacos em armazém (150 - 150 vendidos + 200 comprados - 200... vamos simplificar: após as vendas e a devolução, o sistema aponta 130 sacos). Na contagem física, encontram-se apenas 125 sacos. A diferença é de 5 sacos.</p>
<ul>
<li>Quebra: 130 - 125 = 5 sacos</li>
<li>Custo unitário (última entrada, FIFO): 3.200 Kz</li>
<li>Valor da perda por quebra: 5 × 3.200 = <strong>16.000 Kz</strong></li>
</ul>
<p>Este valor é registado como um gasto (Perdas em Existências, classe 6), reduzindo simultaneamente a conta de Existências (classe 3) e o resultado do exercício.</p>
</div>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Confirma o motivo da devolução</h4><p>Verifica se o bem devolvido está em condições de voltar ao stock vendável ou se deve ser abatido como perda.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Emite a Nota de Crédito</h4><p>Documenta formalmente a anulação parcial da venda e do IVA correspondente.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Faz a contagem física periódica</h4><p>Compara regularmente o stock físico com o stock contabilístico.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Regista o ajustamento encontrado</h4><p>Lança a diferença como perda (se física for menor) ou investiga o excesso (se física for maior).</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Não Fazer Contagens Físicas Periódicas</h2>
<p>Muitas pequenas empresas em Angola confiam apenas no registo contabilístico do stock e nunca fazem contagens físicas regulares. O resultado é que quebras, furtos ou erros de registo se vão acumulando ao longo de meses sem ninguém dar por isso, até que, numa contagem anual, aparece uma diferença enorme e inexplicável entre o que o sistema diz e o que existe fisicamente — nessa altura já não é possível identificar quando ou porquê a diferença surgiu, e o prejuízo é assumido de uma só vez, distorcendo o resultado desse período.</p>
<div class="hi"><strong>Como evitar:</strong> faz contagens físicas periódicas (idealmente mensais para produtos de alta rotação) e regista de imediato qualquer diferença encontrada, investigando a causa enquanto a informação ainda está fresca.</div>
</div>
<div class="ib">É importante distinguir entre uma <strong>devolução</strong> e um simples <strong>desconto pós-venda</strong> concedido por boa relação comercial: na devolução, a mercadoria física regressa ao armazém e a existência é reposta; num desconto pós-venda, o produto fica com o cliente e apenas se reduz o valor a receber, sem qualquer movimento de existências. Confundir estas duas situações é um erro comum — se um contabilista registar um desconto pós-venda como se fosse devolução, vai inflacionar artificialmente a existência em armazém com sacos que, na realidade, já foram consumidos pelo cliente e nunca vão voltar fisicamente à loja. Da mesma forma, quando se apura uma quebra de inventário, é boa prática documentar sempre a causa provável — furto, deterioração por chuva ou humidade (frequente no armazenamento de cimento em Angola), erro de contagem numa entrega anterior — porque isso ajuda o Sr. Domingos a corrigir processos, por exemplo reforçando a segurança do armazém ou melhorando o acondicionamento dos sacos contra a humidade.</div>
<div class="lawbox"><div class="lt">Plano Geral de Contabilidade Angolano (PGCA)</div><blockquote>As diferenças entre a existência contabilística e a existência física apurada em inventário devem ser regularizadas e reflectidas nas contas de existências e de gastos do período em que forem identificadas.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">O sistema indica 130 sacos de cimento em armazém, mas a contagem física encontra 125 sacos, ao custo unitário de 3.200 Kz. Qual é o valor da perda a registar?</div>
<div class="qo" onclick="cq(this,false)">a) 640.000 Kz</div>
<div class="qo" onclick="cq(this,true)">b) 16.000 Kz</div>
<div class="qo" onclick="cq(this,false)">c) 5.000 Kz</div>
<div class="qo" onclick="cq(this,false)">d) 400.000 Kz</div>
</div>`},

{t:'Meios Monetários, Bancos e Reconciliações Bancárias', html:`
<div class="cb"><h2><i class="fas fa-building-columns"></i> Cenário: O Extrato Bancário da Kianda Consultoria Não Bate Certo</h2>
<p>No fim de Julho, a Ana confere o saldo da conta bancária da Kianda Consultoria nos seus próprios livros (o Razão) e vê 2.260.000 Kz. Mas quando consulta o extracto emitido pelo banco, o saldo apresentado é de 2.450.000 Kz. Uma diferença de 190.000 Kz que precisa de ser explicada — e é exactamente para isso que existe a <strong>reconciliação bancária</strong>, um dos procedimentos de controlo mais importantes em qualquer empresa.</p>
</div>
<div class="cb"><h2><i class="fas fa-money-bill-wave"></i> Meios Monetários e Porque Raramente Coincidem os Saldos</h2>
<p>Os <strong>Meios Monetários</strong> (classe 1 do PGCA) incluem o dinheiro em caixa e os saldos em contas bancárias. É normal que o saldo registado nos livros da empresa e o saldo apresentado pelo extracto bancário, na mesma data, não coincidam — não porque haja necessariamente um erro, mas porque existe sempre uma diferença temporal entre o momento em que a empresa regista um movimento e o momento em que o banco o processa. As causas mais comuns são:</p>
<ul>
<li><strong>Depósitos em trânsito</strong> — a empresa já registou o depósito, mas o banco ainda não o processou.</li>
<li><strong>Cheques em trânsito (ainda não levantados)</strong> — a empresa já emitiu e registou o cheque, mas o beneficiário ainda não o depositou ou o banco ainda não o compensou.</li>
<li><strong>Taxas e encargos bancários</strong> — o banco debita comissões ou taxas de manutenção que a empresa só fica a conhecer ao ler o extracto.</li>
<li><strong>Juros e outros movimentos automáticos do banco</strong> — que a empresa não regista até ver o extracto.</li>
</ul>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo Trabalhado: Reconciliação Bancária de Julho</h2>
<p>Vamos reconciliar o saldo da Kianda Consultoria, partindo dos dois saldos que não coincidem, e ajustando cada um até chegarmos a um valor comum:</p>
<div class="tw"><table class="dt">
<tr><th>Ajuste ao Saldo do Extracto Bancário</th><th>Valor (Kz)</th></tr>
<tr><td>Saldo segundo o extracto bancário (31/07)</td><td>2.450.000</td></tr>
<tr><td>(+) Depósito em trânsito, ainda não processado pelo banco</td><td>+ 120.000</td></tr>
<tr><td>(-) Cheque emitido nº 045, ainda não levantado pelo beneficiário</td><td>- 350.000</td></tr>
<tr><td><strong>Saldo bancário ajustado</strong></td><td><strong>2.220.000</strong></td></tr>
</table></div>
<div class="tw"><table class="dt">
<tr><th>Ajuste ao Saldo Contabilístico (Razão)</th><th>Valor (Kz)</th></tr>
<tr><td>Saldo segundo o Razão (conta Bancos, 31/07)</td><td>2.260.000</td></tr>
<tr><td>(-) Taxa de manutenção de conta, debitada pelo banco e ainda não registada nos livros</td><td>- 40.000</td></tr>
<tr><td><strong>Saldo contabilístico ajustado</strong></td><td><strong>2.220.000</strong></td></tr>
</table></div>
<div class="hi"><strong>Resultado:</strong> depois dos ajustamentos, ambos os saldos chegam ao mesmo valor — 2.220.000 Kz. A reconciliação está correcta, e a Ana precisa de registar nos livros a taxa bancária de 40.000 Kz, que ainda não estava lançada.</div>
</div>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Compara os dois saldos</h4><p>Coloca lado a lado o saldo do extracto bancário e o saldo da conta Bancos no Razão, na mesma data.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Identifica os movimentos em trânsito</h4><p>Lista depósitos e cheques que já foram registados por um lado mas ainda não pelo outro.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Identifica movimentos só conhecidos pelo extracto</h4><p>Taxas, juros e encargos que o banco processa automaticamente e a empresa desconhecia.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Ajusta ambos os lados até coincidirem</h4><p>Se depois dos ajustes os saldos não baterem, há um erro de registo a investigar.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Regista nos livros o que faltava</h4><p>Lança no Diário os movimentos que só foram descobertos através do extracto (como as taxas bancárias).</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Nunca Fazer Reconciliação Bancária</h2>
<p>Muitas pequenas empresas angolanas nunca comparam formalmente o saldo dos seus livros com o extracto do banco, confiando apenas num dos dois. Isto é perigoso: sem reconciliação regular, um erro de digitação, um cheque emitido e esquecido, ou mesmo uma fraude, podem passar despercebidos durante meses. Quando finalmente se descobre a diferença, pode já ser tarde para corrigir, reclamar junto do banco, ou identificar o responsável.</p>
<div class="hi"><strong>Como evitar:</strong> faz a reconciliação bancária todos os meses, assim que o extracto estiver disponível, e investiga imediatamente qualquer diferença que não se explique por um simples movimento em trânsito.</div>
</div>
<div class="ib">Além dos meios monetários em conta bancária, muitas empresas angolanas mantêm também um <strong>fundo de maneio em caixa</strong> — uma pequena quantia física em dinheiro, guardada num cofre ou gaveta, destinada a despesas correntes de pequeno valor (combustível, material de limpeza, portes). Este fundo deve igualmente ser objecto de controlo periódico: contagem física do dinheiro existente, confrontada com o saldo que os recibos e talões de despesa justificam. Se a Kianda Consultoria mantiver, por exemplo, um fundo de maneio de 50.000 Kz e, ao contar o dinheiro físico, encontrar apenas 46.000 Kz sem recibos que expliquem a diferença de 4.000 Kz, está perante uma quebra de caixa que deve ser investigada e registada como perda, exactamente com a mesma lógica prudente usada nas quebras de existências. O princípio geral, tanto para bancos como para caixa física, é o mesmo: nunca confiar apenas no registo contabilístico sem confirmação física ou externa periódica.</div>
<div class="lawbox"><div class="lt">Plano Geral de Contabilidade Angolano (PGCA)</div><blockquote>Os saldos das contas de Meios Monetários e Financeiros (classe 1) devem ser periodicamente confirmados por reconciliação com os extractos bancários, como procedimento básico de controlo interno.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">O extracto bancário mostra 2.450.000 Kz. Há um depósito em trânsito de 120.000 Kz e um cheque emitido ainda não levantado de 350.000 Kz. Qual é o saldo bancário ajustado?</div>
<div class="qo" onclick="cq(this,false)">a) 2.920.000 Kz</div>
<div class="qo" onclick="cq(this,true)">b) 2.220.000 Kz</div>
<div class="qo" onclick="cq(this,false)">c) 2.680.000 Kz</div>
<div class="qo" onclick="cq(this,false)">d) 1.980.000 Kz</div>
</div>`},

{t:'Imobilizado, Amortizações e Reavaliações — Parte 1', html:`
<div class="cb"><h2><i class="fas fa-car"></i> Cenário: A Viatura da Kianda Consultoria Perde Valor com o Tempo</h2>
<p>A viatura que a Kianda Consultoria comprou por 2.500.000 Kz não vai manter este valor para sempre — com o uso, ela desgasta-se, perde valor de mercado e, eventualmente, terá de ser substituída. A contabilidade reflecte esta realidade económica através de um mecanismo chamado <strong>amortização</strong>. Nesta aula vamos aprender o que é o imobilizado, porque se amortiza, e como calcular a amortização pelo método mais comum: as <strong>quotas constantes</strong> (linha recta).</p>
</div>
<div class="cb"><h2><i class="fas fa-industry"></i> O Que É Imobilizado e Porque Se Amortiza</h2>
<p>O <strong>Imobilizado</strong> (classe 4 do PGCA) são os bens que a empresa adquire não para revender, mas para usar durante vários anos na sua actividade: viaturas, mobiliário, equipamento informático, edifícios, máquinas. Ao contrário das existências, estes bens não se "consomem" numa única venda — desgastam-se progressivamente ao longo da sua <strong>vida útil</strong>.</p>
<p>A <strong>amortização</strong> é o processo contabilístico que reconhece, período após período, a perda de valor do imobilizado devido ao uso, ao desgaste físico ou à obsolescência. Contabilisticamente, a amortização é um gasto (classe 6) que reduz o resultado do exercício, e simultaneamente reduz o valor líquido do bem registado no Activo.</p>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> O Método das Quotas Constantes</h2>
<p>O método mais simples e mais usado é o das <strong>quotas constantes</strong>: divide-se o valor do bem (menos o valor residual, se houver) pelo número de anos de vida útil estimada, obtendo uma quota de amortização igual todos os anos.</p>
<div class="hi"><strong>Fórmula:</strong> Quota Anual de Amortização = (Valor de Aquisição - Valor Residual) ÷ Vida Útil (anos)</div>
<p>Vamos aplicar esta fórmula à viatura da Kianda Consultoria: valor de aquisição de 2.500.000 Kz, vida útil estimada de 5 anos, sem valor residual (assume-se que, no fim, o bem não terá valor de revenda significativo).</p>
<ul>
<li>Quota anual = 2.500.000 ÷ 5 = <strong>500.000 Kz/ano</strong></li>
<li>Quota mensal = 500.000 ÷ 12 = <strong>41.666,67 Kz/mês</strong></li>
</ul>
<p>Depois de 2 anos completos de uso, a situação da viatura fica assim:</p>
<div class="tw"><table class="dt">
<tr><th></th><th>Valor (Kz)</th></tr>
<tr><td>Valor de aquisição</td><td>2.500.000</td></tr>
<tr><td>Amortização acumulada (2 anos × 500.000)</td><td>1.000.000</td></tr>
<tr><td><strong>Valor Líquido Contabilístico (VLC)</strong></td><td><strong>1.500.000</strong></td></tr>
</table></div>
<p>Fazemos o mesmo cálculo para o mobiliário de escritório, comprado por 800.000 Kz, com vida útil estimada de 10 anos: quota anual = 800.000 ÷ 10 = <strong>80.000 Kz/ano</strong>.</p>
</div>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Determina o valor de aquisição</h4><p>Inclui o preço de compra e todos os custos necessários para colocar o bem em funcionamento (transporte, instalação).</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Estima a vida útil e o valor residual</h4><p>Usa referências técnicas ou históricas do sector para definir quantos anos o bem vai durar em uso.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Calcula a quota anual</h4><p>Aplica a fórmula das quotas constantes: (valor de aquisição - valor residual) ÷ vida útil.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Regista a amortização todos os anos</h4><p>Lança a quota como gasto (classe 6) e acumula-a numa conta de amortizações acumuladas, que reduz o valor líquido do imobilizado.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Não Registar a Amortização Todos os Anos</h2>
<p>Um erro muito comum em pequenas empresas é comprar um bem, registá-lo no Activo, e nunca mais actualizar o seu valor através da amortização — deixando a viatura ou o mobiliário registados pelo valor de compra durante anos, mesmo depois de já estarem parcialmente ou totalmente desgastados. Isto sobreavalia o Activo da empresa e o resultado do exercício, dando uma imagem financeira mais optimista do que a realidade — o que pode enganar um investidor, um banco na análise de um pedido de crédito, ou até o próprio dono, que pensa ter mais património do que realmente tem.</p>
<div class="hi"><strong>Como evitar:</strong> regista a quota de amortização de cada bem do imobilizado todos os anos (ou mensalmente), desde o momento em que o bem entra em funcionamento, seguindo sempre o mesmo método e a mesma vida útil estimada inicialmente.</div>
</div>
<div class="ib">Um conceito ligado à amortização que vale a pena reter desde já é o <strong>Valor Líquido Contabilístico (VLC)</strong>: é sempre o valor de aquisição menos a amortização acumulada até à data, e é este valor — não o valor de compra original — que deve constar no balanço da empresa a cada momento. É também este VLC que serve de referência quando, no fim da vida útil ou por decisão de negócio, a empresa decide vender ou abater um bem: se a viatura da Kianda Consultoria, com VLC de 1.500.000 Kz ao fim de 2 anos, for vendida por 1.700.000 Kz, a empresa regista uma mais-valia de 200.000 Kz (ganho); se for vendida por 1.300.000 Kz, regista uma menos-valia de 200.000 Kz (perda). Compreender bem o VLC evita um erro típico de quem começa: pensar que o valor de um bem do imobilizado, no balanço, é sempre o preço que se pagou por ele — quando, na realidade, esse valor vai diminuindo todos os anos através da amortização, até eventualmente chegar a zero ou ao valor residual estimado.</div>
<div class="lawbox"><div class="lt">Plano Geral de Contabilidade Angolano (PGCA)</div><blockquote>Os bens do imobilizado corpóreo (classe 4) devem ser amortizados de forma sistemática ao longo da sua vida útil estimada, reflectindo nas demonstrações financeiras a perda de valor decorrente do uso.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Um equipamento foi comprado por 1.200.000 Kz, com vida útil estimada de 4 anos e sem valor residual. Qual é a quota anual de amortização pelo método das quotas constantes?</div>
<div class="qo" onclick="cq(this,false)">a) 400.000 Kz</div>
<div class="qo" onclick="cq(this,true)">b) 300.000 Kz</div>
<div class="qo" onclick="cq(this,false)">c) 1.200.000 Kz</div>
<div class="qo" onclick="cq(this,false)">d) 240.000 Kz</div>
</div>`},

{t:'Imobilizado, Amortizações e Reavaliações — Parte 2', html:`
<div class="cb"><h2><i class="fas fa-industry"></i> Cenário: Equipamento Industrial da Huambo Metalúrgica</h2>
<p>A "Huambo Metalúrgica", uma empresa do sector metalomecânico no Huambo, adquire um equipamento industrial por 4.000.000 Kz. Ao contrário da viatura da Kianda Consultoria, este tipo de equipamento perde mais valor nos primeiros anos de uso (por ser mais intensivo no início) do que nos últimos — por isso, a empresa opta por um método de amortização diferente das quotas constantes: o <strong>método das quotas degressivas (saldos decrescentes)</strong>. Além disso, três anos depois, a empresa decide fazer uma <strong>reavaliação</strong> deste equipamento. Vamos ver como funcionam ambos os conceitos.</p>
</div>
<div class="cb"><h2><i class="fas fa-chart-line"></i> O Método das Quotas Degressivas</h2>
<p>No método das <strong>quotas degressivas</strong>, aplica-se uma taxa fixa de amortização, mas sobre o <strong>valor líquido contabilístico</strong> do bem no início de cada ano (e não sobre o valor de aquisição original, como nas quotas constantes). Isto faz com que a quota de amortização seja mais alta nos primeiros anos e vá diminuindo progressivamente.</p>
<p>A Huambo Metalúrgica define uma taxa de amortização degressiva de 20% ao ano para o seu equipamento de 4.000.000 Kz. Vamos calcular os três primeiros anos:</p>
<div class="tw"><table class="dt">
<tr><th>Ano</th><th>Valor Líquido no Início do Ano</th><th>Quota (20%)</th><th>Valor Líquido no Fim do Ano</th></tr>
<tr><td>1</td><td>4.000.000</td><td>800.000</td><td>3.200.000</td></tr>
<tr><td>2</td><td>3.200.000</td><td>640.000</td><td>2.560.000</td></tr>
<tr><td>3</td><td>2.560.000</td><td>512.000</td><td>2.048.000</td></tr>
</table></div>
<div class="hi"><strong>Nota:</strong> repara como a quota vai diminuindo (800.000 → 640.000 → 512.000), ao contrário das quotas constantes, onde a quota seria sempre igual em todos os anos.</div>
</div>
<div class="cb"><h2><i class="fas fa-arrow-trend-up"></i> Reavaliação do Imobilizado</h2>
<p>Depois de 3 anos, o valor líquido contabilístico do equipamento é 2.048.000 Kz. Mas a Huambo Metalúrgica encomenda uma avaliação técnica independente, que conclui que o valor real de mercado deste equipamento, dado o seu estado de conservação e a procura no mercado de equipamentos industriais, é de <strong>2.400.000 Kz</strong>. A empresa decide então <strong>reavaliar</strong> o bem, actualizando o seu valor contabilístico para reflectir melhor a realidade económica.</p>
<ul>
<li>Valor líquido contabilístico antes da reavaliação: 2.048.000 Kz</li>
<li>Valor de mercado (avaliação técnica): 2.400.000 Kz</li>
<li>Aumento de valor por reavaliação: 2.400.000 - 2.048.000 = <strong>352.000 Kz</strong></li>
</ul>
<p>Este aumento de 352.000 Kz não é registado como um rendimento nem passa pelo resultado do exercício — é registado directamente numa conta de <strong>Reserva de Reavaliação</strong>, dentro do Capital Próprio (classe 5). Isto porque a reavaliação é um ajustamento de valor patrimonial, não um ganho obtido através da actividade normal da empresa.</p>
</div>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Escolhe o método de amortização adequado ao bem</h4><p>Quotas constantes para desgaste uniforme; quotas degressivas quando o desgaste é maior nos primeiros anos.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Aplica a taxa sobre o valor líquido de cada ano (degressivas)</h4><p>Recalcula a quota anualmente com base no saldo remanescente, não no valor original.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Recorre a uma avaliação técnica para reavaliar</h4><p>Nunca actualizes o valor de um bem "a olho" — usa um avaliador competente ou referências de mercado credíveis.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Regista o efeito da reavaliação em Capital Próprio</h4><p>O ganho de reavaliação vai para uma reserva, não para os rendimentos do exercício.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Registar o Ganho de Reavaliação como Lucro do Exercício</h2>
<p>Um erro conceptual sério é lançar o aumento de valor de uma reavaliação (como os 352.000 Kz do exemplo) directamente como rendimento na conta de resultados, fazendo parecer que a empresa "ganhou" esse dinheiro através da sua actividade operacional. Isto distorce gravemente os indicadores de desempenho da empresa — um investidor ou banco que olhe para o resultado do exercício pode pensar que a Huambo Metalúrgica teve uma óptima margem de lucro operacional, quando na verdade parte desse "ganho" é apenas um ajustamento contabilístico de valor, sem qualquer entrada real de caixa.</p>
<div class="hi"><strong>Como evitar:</strong> regista sempre o efeito de uma reavaliação de imobilizado directamente numa reserva de Capital Próprio (classe 5), nunca como rendimento operacional do exercício.</div>
</div>
<div class="ib">É útil comparar os dois métodos de amortização vistos neste módulo. Nas <strong>quotas constantes</strong> (aula anterior), a quota é sempre igual em todos os anos, o que é adequado para bens com desgaste regular ao longo do tempo, como mobiliário ou edifícios. Nas <strong>quotas degressivas</strong>, a quota é maior no início e diminui progressivamente, o que reflecte melhor a realidade de equipamentos industriais ou tecnológicos que perdem mais valor e mais capacidade produtiva nos primeiros anos de utilização intensiva, e que também se tornam obsoletos mais depressa face a novas tecnologias. A escolha do método não é arbitrária: deve reflectir o padrão real de consumo económico do bem, e uma vez escolhido para um determinado bem, deve manter-se consistente ao longo de toda a sua vida útil, para permitir comparação entre exercícios e evitar manipulação de resultados através da simples troca de método sempre que for conveniente para a empresa mostrar mais ou menos lucro.</div>
<div class="lawbox"><div class="lt">Plano Geral de Contabilidade Angolano (PGCA)</div><blockquote>As reavaliações do imobilizado corpóreo devem basear-se em critérios técnicos objectivos e o respectivo efeito patrimonial é reconhecido em reservas de Capital Próprio, distinto do resultado do exercício.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Um equipamento com valor líquido contabilístico de 2.048.000 Kz é reavaliado para 2.400.000 Kz. Onde deve ser registado o aumento de 352.000 Kz?</div>
<div class="qo" onclick="cq(this,false)">a) Na conta de Vendas, como rendimento operacional</div>
<div class="qo" onclick="cq(this,false)">b) Na conta de Caixa, porque aumenta a liquidez da empresa</div>
<div class="qo" onclick="cq(this,true)">c) Numa Reserva de Reavaliação, dentro do Capital Próprio</div>
<div class="qo" onclick="cq(this,false)">d) Na conta de Fornecedores, como redução de dívida</div>
</div>`},

{t:'Contas a Receber, Contas a Pagar e Provisões', html:`
<div class="cb"><h2><i class="fas fa-hand-holding-dollar"></i> Cenário: Um Cliente que Não Paga em Cabinda</h2>
<p>A "Construtora Zenza", cliente da Kianda Consultoria em Cabinda, deve à empresa 1.200.000 Kz há mais de 90 dias, sem sinais de que vá pagar em breve. Ao mesmo tempo, a Kianda Consultoria tem uma dívida de 750.000 Kz a um fornecedor de material informático, a pagar dentro de 60 dias. Esta aula fecha o Módulo 1 explicando como gerir e registar estas duas realidades — <strong>Contas a Receber</strong> e <strong>Contas a Pagar</strong> — e como a contabilidade trata o risco de um cliente nunca vir a pagar, através das <strong>provisões</strong>.</p>
</div>
<div class="cb"><h2><i class="fas fa-arrow-down"></i> Contas a Receber e Contas a Pagar</h2>
<p>As <strong>Contas a Receber</strong> (essencialmente a conta Clientes, classe 2) representam o direito da empresa a receber valores de terceiros, normalmente resultantes de vendas a crédito. As <strong>Contas a Pagar</strong> (Fornecedores e outras dívidas, também classe 2) representam a obrigação da empresa de pagar a terceiros. Gerir bem estas duas contas é essencial para a saúde financeira de qualquer negócio: receber tarde e pagar cedo cria um problema de liquidez, mesmo que a empresa seja lucrativa "no papel".</p>
<p>Um instrumento útil de gestão é o <strong>mapa de antiguidade de saldos</strong>, que organiza as dívidas de clientes por tempo em atraso (0-30 dias, 31-60 dias, 61-90 dias, mais de 90 dias), permitindo identificar rapidamente quais os clientes com maior risco de incumprimento.</p>
</div>
<div class="cb"><h2><i class="fas fa-shield-halved"></i> Provisões para Créditos de Cobrança Duvidosa</h2>
