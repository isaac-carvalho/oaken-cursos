<div class="lawbox"><div class="lt">PGCA, IVA 14%, Imposto Industrial 25%, INSS 3%/8%</div><blockquote>Todos os factos deste caso integram, num único exercício, as regras já estudadas nos três módulos do curso.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">No fecho de Dezembro, a Kianda Confecções apura um lucro tributável de Kz 6.000.000. Qual o valor do Imposto Industrial a pagar?</div>
<div class="qo" onclick="cq(this,false)">a) Kz 1.200.000</div>
<div class="qo" onclick="cq(this,true)">b) Kz 1.500.000</div>
<div class="qo" onclick="cq(this,false)">c) Kz 6.000.000</div>
<div class="qo" onclick="cq(this,false)">d) Kz 2.500.000</div>
</div>`},
{t:'Simulação de Fiscalização da AGT: Defesa e Procedimentos', html:`
<div class="cb"><h2><i class="fas fa-envelope-open-text"></i> A Notificação Chega à Kianda Confecções</h2>
<p>Em Fevereiro do ano seguinte, a Kianda Confecções (a mesma empresa da aula anterior) recebe uma <strong>notificação de fiscalização</strong> da AGT, informando que será alvo de uma inspecção aos exercícios dos últimos dois anos, com foco no apuramento do IVA e do Imposto Industrial. É natural que a gerência sinta alguma ansiedade — mas uma fiscalização bem preparada e bem conduzida não precisa de ser um pesadelo. Esta aula percorre, passo a passo, o que fazer.</p>
</div>
<div class="cb"><h2><i class="fas fa-folder-open"></i> Preparação: Reunir a Documentação</h2>
<p>Ao receber a notificação, o primeiro passo da Kianda é reunir toda a documentação de suporte dos exercícios em análise: facturas de venda e compra (conforme o regime da Lei n.º 7/19), extractos bancários, mapas de amortização, folhas de processamento salarial, comprovativos de entrega de todas as declarações periódicas de IVA e do Imposto Industrial, e os balancetes mensais.</p>
<div class="hi"><strong>Princípio central:</strong> nenhuma explicação verbal substitui um documento. Se um lançamento não tem suporte documental, é como se a operação não tivesse acontecido aos olhos do auditor.</div>
</div>
<div class="cb"><h2><i class="fas fa-people-group"></i> Durante a Fiscalização: Direitos e Deveres do Contribuinte</h2>
<p>Durante a inspecção, a Kianda tem o direito de ser tratada com correcção, de conhecer o âmbito exacto da fiscalização (que exercícios e que impostos estão a ser verificados), e de acompanhar o processo através de um representante designado — normalmente o próprio contabilista ou um consultor fiscal. Tem também o dever de facultar o acesso à documentação solicitada dentro dos prazos indicados e de responder com rigor às questões colocadas, sem prestar informação falsa.</p>
<div class="ib">Um erro estratégico comum é a gerência tentar "explicar tudo de cabeça" durante a visita, sem confirmar previamente os números com o contabilista — respostas verbais desalinhadas com os documentos geram mais suspeita do que confiança.</div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Possíveis Resultados: Correcções, Autos de Infracção e Multas</h2>
<p>No caso da Kianda, os auditores da AGT identificam que, em Junho do ano anterior, uma factura de venda de Kz 500.000 (sem IVA) foi emitida mas o IVA correspondente de Kz 70.000 (500.000 × 14%) não constava da declaração periódica desse mês — um erro de lançamento, não uma tentativa de fraude.</p>
<div class="tw"><table class="dt"><tr><th>Elemento</th><th>Valor</th></tr>
<tr><td>Venda não declarada</td><td>Kz 500.000</td></tr>
<tr><td>IVA em falta (14%)</td><td>Kz 70.000</td></tr>
</table></div>
<p>Além do imposto em falta de Kz 70.000, a AGT pode aplicar juros de mora pelo atraso no pagamento e uma coima (multa) pela declaração incorrecta — o valor exacto de juros e coimas depende das regras específicas em vigor à data, pelo que a empresa deve confirmá-lo directamente com a AGT ou um consultor fiscal licenciado, nunca assumir um valor por comparação com outros casos.</p>
<div class="hi"><strong>Diferença crucial:</strong> um erro de lançamento corrigido de boa-fé, com documentação de suporte real, tem um tratamento muito mais favorável do que uma omissão deliberada de receita sem qualquer explicação documental.</div>
</div>
<div class="cb"><h2><i class="fas fa-scale-balanced"></i> Direito de Resposta e de Reclamação</h2>
<p>Se a Kianda discordar de alguma correcção proposta pelos auditores, tem o direito de apresentar a sua posição, com fundamento e documentação, dentro do prazo definido na notificação de resultados da fiscalização. Só depois de esgotado este direito de resposta é que a liquidação adicional de imposto (se mantida) se torna definitiva e exigível.</p>
<p>É importante que a gerência entenda que discordar de uma correcção não é o mesmo que ignorá-la: exige sempre uma resposta fundamentada, com documentos concretos que sustentem a posição da empresa. Uma reclamação apresentada sem qualquer prova documental de suporte dificilmente altera a decisão dos auditores, e pode ainda transmitir a imagem de uma empresa pouco organizada.</p>
</div>
<div class="tl"><div class="tli"><div class="tld">1</div><div class="tlc"><h4>Ler a notificação com atenção</h4><p>Confirmar o âmbito exacto: que impostos e que exercícios estão a ser fiscalizados.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Reunir toda a documentação do período</h4><p>Facturas, extractos, declarações entregues, balancetes.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Designar um representante</h4><p>Contabilista ou consultor fiscal que acompanhe todo o processo.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Responder com rigor, apenas com base em documentos</h4><p>Nunca por memória ou estimativa não confirmada.</p></div></div>
<div class="tli"><div class="tld">5</div><div class="tlc"><h4>Analisar as correcções propostas</h4><p>Concordar e regularizar, ou exercer o direito de resposta com fundamento.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Esconder ou Atrasar a Entrega de Documentos</h2>
<p>O erro mais grave que uma empresa pode cometer numa fiscalização é atrasar deliberadamente a entrega de documentos solicitados, ou entregar documentação incompleta na esperança de que o problema "passe despercebido". Isto tem o efeito oposto ao pretendido: aumenta a suspeita dos auditores, pode ser interpretado como obstrução, e normalmente resulta numa fiscalização mais extensa e mais rigorosa do que a inicialmente prevista.</p>
<div class="wb"><strong>Atenção:</strong> uma empresa que colabora de forma transparente, mesmo tendo erros genuínos a corrigir, tende a ter um desfecho muito mais favorável do que uma empresa que dificulta o acesso à informação, mesmo que esta última não tenha nada de ilegal a esconder.</div>
<div class="hi"><strong>Como evitar:</strong> ter sempre a documentação organizada e actualizada como rotina do dia-a-dia (não apenas quando chega uma notificação), e responder a qualquer pedido da AGT dentro do prazo, com transparência total.</div>
</div>
<div class="lawbox"><div class="lt">Lei n.º 7/19, de 24 de Abril</div><blockquote>Toda a facturação emitida deve cumprir este regime — é a base documental mais frequentemente verificada numa fiscalização de vendas e IVA.</blockquote></div>
<div class="lawbox"><div class="lt">AGT — Administração Geral Tributária</div><blockquote>Entidade responsável por conduzir as acções de fiscalização e aplicar as correspondentes correcções, dentro dos direitos e deveres do contribuinte.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Os auditores da AGT identificam uma venda de Kz 500.000 (sem IVA) cujo IVA de 14% não foi declarado. Qual o valor de IVA em falta, antes de juros e eventual coima?</div>
<div class="qo" onclick="cq(this,false)">a) Kz 500.000</div>
<div class="qo" onclick="cq(this,true)">b) Kz 70.000</div>
<div class="qo" onclick="cq(this,false)">c) Kz 125.000</div>
<div class="qo" onclick="cq(this,false)">d) Kz 57.000</div>
</div>`},
{t:'Trabalho Final: Consultoria Contábil e Fiscal Integrada', html:`
<div class="cb"><h2><i class="fas fa-briefcase"></i> O Teu Primeiro Cliente Real</h2>
<p>Chegaste à última aula do curso. Em vez de mais matéria nova, esta aula coloca-te no papel de <strong>consultor contábil e fiscal independente</strong>, contratado por uma empresa fictícia — a "Ondjila Retalho, Lda", loja de artigos electrodomésticos em Talatona — para fazer um diagnóstico completo antes de o dono decidir se vale a pena expandir para uma segunda loja. Vais aplicar, num único exercício integrado, ferramentas dos três módulos do curso.</p>
</div>
<div class="cb"><h2><i class="fas fa-file-lines"></i> O Dossiê do Cliente</h2>
<p>A Ondjila Retalho fornece-te os seguintes dados do último exercício fechado: Activo total Kz 18.000.000; Passivo total Kz 11.000.000; Capital Próprio Kz 7.000.000; Vendas anuais Kz 25.000.000; Lucro tributável apurado Kz 3.200.000; Existências médias em armazém Kz 4.000.000; Clientes a receber Kz 2.500.000; Fornecedores a pagar Kz 1.800.000.</p>
</div>
<div class="cb"><h2><i class="fas fa-magnifying-glass-chart"></i> Diagnóstico 1 — Estrutura Patrimonial e Imposto Industrial</h2>
<div class="hi"><strong>Verificação da equação fundamental: Activo = Passivo + Capital Próprio → 18.000.000 = 11.000.000 + 7.000.000. Confirmado.</strong></div>
<div class="hi"><strong>Imposto Industrial devido = 3.200.000 × 25% = Kz 800.000.</strong></div>
<p>O primeiro passo de qualquer consultoria é confirmar que o balanço "fecha" e que o imposto sobre o lucro do último exercício foi correctamente apurado — só depois disso faz sentido analisar o resto.</p>
</div>
<div class="cb"><h2><i class="fas fa-scale-balanced"></i> Diagnóstico 2 — Nível de Endividamento</h2>
<p>Um indicador simples mas essencial antes de qualquer decisão de expansão é o <strong>rácio de endividamento</strong>: quanto do activo total da empresa é financiado por dívida (passivo) em vez de capital próprio dos sócios.</p>
<div class="hi"><strong>Rácio de endividamento = Passivo Total ÷ Activo Total = 11.000.000 ÷ 18.000.000 = 61,1%.</strong></div>
<p>Isto significa que 61,1% dos activos da Ondjila Retalho são financiados por terceiros (fornecedores, eventuais empréstimos), e apenas 38,9% pelo capital próprio dos sócios — um nível de endividamento a ter em conta antes de propor à empresa contrair mais dívida para financiar uma segunda loja.</p>
</div>
<div class="cb"><h2><i class="fas fa-rotate"></i> Diagnóstico 3 — Prazo Médio de Recebimento e Pagamento</h2>
<p>Comparar quanto tempo a empresa demora a receber dos clientes com quanto tempo demora a pagar aos fornecedores revela se o ciclo de caixa da Ondjila Retalho é saudável.</p>
<div class="hi"><strong>Prazo médio de recebimento ≈ (Clientes ÷ Vendas) × 365 = (2.500.000 ÷ 25.000.000) × 365 = 36,5 dias.</strong></div>
<p>Isto significa que, em média, a Ondjila Retalho recebe dos seus clientes cerca de 36 dias depois da venda — uma informação central para decidir se a empresa tem fôlego de tesouraria para abrir uma segunda loja sem recorrer a financiamento adicional.</p>
<p>Vale a pena cruzar este número com as existências médias em armazém, de Kz 4.000.000: juntos, o prazo de recebimento e o valor parado em stock mostram quanto capital a Ondjila Retalho tem "preso" fora do caixa, num dado momento, apenas para sustentar a operação corrente. Antes de comprometer capital numa segunda loja, o consultor deve confirmar se este capital preso na operação actual já está optimizado, ou se há margem para libertar tesouraria através de uma gestão mais apertada de existências e de cobranças.</p>
</div>
<div class="cb"><h2><i class="fas fa-list-check"></i> O Relatório de Consultoria: Checklist Final</h2>
<p>Um bom relatório de consultoria integrada não é uma lista solta de números — é uma síntese que liga cada achado a uma recomendação concreta. Para a Ondjila Retalho, o checklist final inclui:</p>
<ul>
<li><strong>Estrutura patrimonial:</strong> balanço confirmado e consistente, Imposto Industrial do último exercício correctamente apurado em Kz 800.000.</li>
<li><strong>Endividamento (61,1%):</strong> nível já elevado — recomenda-se cautela antes de contrair novo financiamento para a segunda loja, e explorar primeiro reforço de capital próprio.</li>
<li><strong>Ciclo de recebimento (36,5 dias):</strong> razoável, mas deve ser monitorizado se a empresa expandir vendas a crédito na nova loja.</li>
<li><strong>Controlo interno:</strong> confirmar segregação de funções entre quem recebe, regista e reconcilia caixa e banco na loja actual, antes de replicar o modelo numa segunda loja.</li>
<li><strong>Obrigações fiscais em dia:</strong> confirmar entrega de todas as declarações periódicas de IVA e do Imposto Industrial dos últimos exercícios, para evitar surpresas numa eventual fiscalização.</li>
<li><strong>Plano de contas preparado para crescer:</strong> avaliar se o plano de contas actual já está pronto para reportar por loja, tal como visto no caso da Distribel neste módulo, antes de a segunda loja abrir.</li>
</ul>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Dar uma Recomendação Sem Ligar os Números Entre Si</h2>
<p>O erro mais frequente de um consultor iniciante é apresentar os indicadores calculados (endividamento, prazo de recebimento, imposto) como factos soltos, sem explicar ao cliente o que eles significam em conjunto para a decisão concreta que tem de tomar — neste caso, expandir ou não para uma segunda loja. Um relatório tecnicamente correcto mas que não conclui nada de accionável não tem valor real para quem o contratou.</p>
<div class="wb"><strong>Atenção:</strong> um cliente que recebe uma lista de números sem uma conclusão clara tende a ignorar o relatório inteiro, mesmo que os cálculos estejam todos certos.</div>
<div class="hi"><strong>Como evitar:</strong> terminar sempre um relatório de consultoria com uma recomendação explícita e justificada, ligando cada indicador calculado à decisão concreta que o cliente pediu para ser ajudado a tomar.</div>
</div>
<div class="cb"><h2><i class="fas fa-graduation-cap"></i> O Que Este Módulo Preparou-te Para Fazer</h2>
<p>Ao longo destas 13 aulas, passaste por 13 empresas fictícias diferentes, espalhadas por Angola — de Talatona a Cabinda, do Namibe a Benguela — cada uma com um problema real para resolver. Não memorizaste fórmulas soltas: aplicaste-as sempre dentro de um cenário completo, com números que se verificam uns aos outros. É exactamente esta capacidade de olhar para uma empresa real, cheia de informação em bruto, e transformá-la num diagnóstico claro com recomendações accionáveis, que separa um técnico que decorou regras de um profissional de contabilidade e fiscalidade preparado para o mercado angolano.</p>
</div>
<div class="lawbox"><div class="lt">PGCA, IVA 14%, Imposto Industrial 25%</div><blockquote>Toda a análise deste trabalho final assenta nas mesmas regras contábeis e fiscais estudadas ao longo dos três módulos do curso.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">A Ondjila Retalho tem Passivo Total de Kz 11.000.000 e Activo Total de Kz 18.000.000. Qual o rácio de endividamento?</div>
<div class="qo" onclick="cq(this,false)">a) 38,9%</div>
<div class="qo" onclick="cq(this,true)">b) 61,1%</div>
<div class="qo" onclick="cq(this,false)">c) 100%</div>
<div class="qo" onclick="cq(this,false)">d) 18%</div>
</div>`}

/* ───────── ÁREA DO ALUNO ───────── */
function renderAluno(){
  if(!ST.logado){
    app.innerHTML = `
    <div class="login-wrap"><div class="login-box">
      <div class="login-icon"><i class="fas fa-calculator"></i></div>
      <h2>Área do Aluno</h2>
      <p>Entre com as suas credenciais para aceder à plataforma de estudos.</p>
      <div class="field"><label>E-mail</label><input type="email" id="li-mail" placeholder="seuemail@exemplo.com"></div>
      <div class="field"><label>Senha</label><input type="password" id="li-pass" placeholder="••••••••"></div>
      <button class="btn-login" onclick="doLogin()"><i class="fas fa-right-to-bracket"></i> Entrar na plataforma</button>
      <div class="login-alt">Ainda não é aluno? <a onclick="nav('home')">Ver mais sobre o curso</a></div>
      <div class="demo-hint"><i class="fas fa-circle-info"></i> Entrada liberada nesta fase. O seu progresso fica guardado neste dispositivo.</div>
    </div></div>`;
    const inp=document.getElementById('li-pass');
    if(inp) inp.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
    window.scrollTo(0,0); return;
  }

  const done = ST.desbloqueado-1;
  const pct = Math.round(done/3*100);
  let lista='';
  [1,2,3].forEach(f=>{
    lista += `<div class="phase-head">${FASES[f]}</div><div class="mod-list">`;
    COURSE.filter(m=>m.fase===f).forEach(m=>{
      const st = m.n<ST.desbloqueado?'done':(m.n===ST.desbloqueado?'unlocked':'locked');
      const ic = st==='done'?'<i class="fas fa-check"></i>':(st==='locked'?'<i class="fas fa-lock"></i>':m.n);
      const bd = st==='done'?'Concluído':(st==='unlocked'?'Continuar →':'Bloqueado');
      const nota = ST.notas[m.n]?` · ${ST.notas[m.n]}%`:'';
      const click = st!=='locked'?`onclick="nav('modulo-${m.n}')"`:'';
      lista += `<div class="mod-card ${st}" ${click}>
        <div class="mod-ic ${st}">${ic}</div>
        <div class="mod-info"><h4>Módulo ${m.n} — ${m.titulo}</h4>
        <span>${m.aulas.length} aulas${nota}</span></div>
        <span class="mod-badge ${st}">${bd}</span></div>`;
    });
    lista += `</div>`;
  });

  app.innerHTML = `
  <div class="dash-header"><div class="container dash-in">
    <div><h1>Olá, ${ST.nome}! 👋</h1><p>Curso de Contabilidade e Fiscalidade Angolana</p></div>
    <button class="btn-logout" onclick="doLogout()"><i class="fas fa-right-from-bracket"></i> Sair</button>
  </div></div>
  <div class="dash-body"><div class="container">
    <div class="progress-card">
      <div class="pc-head"><h3><i class="fas fa-chart-line" style="color:var(--secondary)"></i> O seu progresso</h3><span class="pct">${pct}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-stats">
        <div><b>${done}</b> de <b>3</b> módulos concluídos</div>
        <div><b>${TOTAL_AULAS}</b> aulas no curso</div>
        <div><b>70%</b> mínimo por exame</div>
      </div>
    </div>
    ${lista}
  </div></div>`;
  window.scrollTo(0,0);
}

function doLogin(){
  const mail = (document.getElementById('li-mail').value||'aluno@demo.ao').trim();
  ST.logado = true;
  ST.nome = mail.split('@')[0] || 'Aluno';
  save(); renderAluno();
}
function doLogout(){ ST.logado=false; save(); nav('aluno'); renderAluno(); }

/* ───────── VISTA DO MÓDULO ───────── */
function renderModulo(m){
  moduloAtual = m; aulaAtual = 0;
  app.innerHTML = `
  <div class="mod-hero"><div class="container-sm mh-in">
    <div class="mh-txt">
      <div class="mod-phase"><i class="fas fa-layer-group"></i> ${FASES[m.fase]}</div>
      <h1>Módulo ${m.n} — <span>${m.titulo}</span></h1>
      <p>${m.desc}</p>
      <div class="mod-meta">
        <span class="meta-tag"><i class="fas fa-book-open"></i> ${m.aulas.length} Aulas</span>
        <span class="meta-tag"><i class="fas fa-bolt"></i> Angola</span>
      </div>
    </div>
    <div class="mh-img"><img src="${m.img}" alt="${m.titulo}"></div>
  </div></div>
  <div class="mod-progress"><div class="container-sm mp-in">
    <span class="mp-lbl">Progresso do módulo:</span><div class="dots" id="dots"></div>
  </div></div>
  <div class="container-sm">
    <div class="tabs" id="tabs"></div>
    <div class="mod-layout">
      <div id="lesson"></div>
      <div class="sidebar">
        <div class="sc"><h4><i class="fas fa-list" style="color:var(--secondary)"></i> Aulas</h4><div id="slinks"></div></div>
        <div class="sc"><h4><i class="fas fa-trophy" style="color:var(--secondary)"></i> Avaliação</h4>
          <p style="font-size:12px;color:var(--gray);margin-bottom:10px">Conclua as aulas e faça o exame do módulo para desbloquear o seguinte.</p>
          <div class="sbtn orange" onclick="abrirExame(${m.n})"><i class="fas fa-pen-to-square"></i> Fazer exame</div>
        </div>
        <div class="sc"><h4><i class="fas fa-route" style="color:var(--secondary)"></i> Navegação</h4>
          ${m.n>1?`<div class="sbtn grey" onclick="nav('modulo-${m.n-1}')"><i class="fas fa-arrow-left"></i> Módulo ${m.n-1}</div>`:''}
          <div class="sbtn grey" onclick="nav('aluno')"><i class="fas fa-table-cells"></i> Todos os módulos</div>
          ${m.n<3&&ST.desbloqueado>m.n?`<div class="sbtn orange" onclick="nav('modulo-${m.n+1}')">Módulo ${m.n+1} <i class="fas fa-arrow-right"></i></div>`:''}
        </div>
      </div>
    </div>
  </div>`;

  const tabs=document.getElementById('tabs'), dots=document.getElementById('dots'), sl=document.getElementById('slinks');
  m.aulas.forEach((a,i)=>{
    const t=document.createElement('button'); t.className='tb'; t.id='tb'+i;
    t.textContent=(i+1)+'. '+a.t.split(' ').slice(0,3).join(' ')+'…';
    t.onclick=()=>irAula(i); tabs.appendChild(t);
    const d=document.createElement('div'); d.className='dot'; d.id='dt'+i; d.textContent=i+1;
    d.onclick=()=>irAula(i); dots.appendChild(d);
    const s=document.createElement('div'); s.className='sl'; s.id='sl'+i;
    s.innerHTML=`<span class="sn">${i+1}</span>${a.t}`; s.onclick=()=>irAula(i); sl.appendChild(s);
  });
  irAula(0);
  window.scrollTo(0,0);
}

function irAula(i){
  const m=moduloAtual, a=m.aulas[i]; aulaAtual=i;
  document.getElementById('lesson').innerHTML = `
  <div class="lesson">
    <div class="ltitle">Aula ${i+1} — ${a.t}</div>
    <div class="lsub"><span><i class="fas fa-clock"></i> ~15 min</span><span>Módulo ${m.n} · ${m.titulo}</span></div>
    ${a.html}
    <div class="lnav">
      <button class="nb np" onclick="irAula(${i-1})" ${i===0?'disabled':''}><i class="fas fa-arrow-left"></i> Anterior</button>
      ${i<m.aulas.length-1
        ? `<button class="nb nn" onclick="irAula(${i+1})">Próxima aula <i class="fas fa-arrow-right"></i></button>`
        : `<button class="nb nn" onclick="abrirExame(${m.n})"><i class="fas fa-trophy"></i> Fazer exame do módulo</button>`}
    </div>
  </div>`;
  m.aulas.forEach((_,j)=>{
    document.getElementById('tb'+j).classList.toggle('active',j===i);
    document.getElementById('dt'+j).className='dot '+(j<i?'done':(j===i?'active':'todo'));
    document.getElementById('sl'+j).classList.toggle('act',j===i);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function cq(el,ok){
  el.closest('.quiz').querySelectorAll('.qo').forEach(o=>{o.onclick=null;o.style.cursor='default';});
  el.classList.add(ok?'ok':'no');
}

/* ───────── SISTEMA DE EXAMES ───────── */
function gerarExame(m){
  const perg=[];
  m.aulas.forEach(a=>{
    const re=/<div class="qq">(.*?)<\/div>\s*((?:<div class="qo"[\s\S]*?<\/div>\s*)+)/g;
    let mt;
    while((mt=re.exec(a.html))!==null){
      const q=mt[1];
      const opts=[]; let ok=-1;
      const ore=/<div class="qo" onclick="cq\(this,(true|false)\)">(.*?)<\/div>/g;
      let om,k=0;
      while((om=ore.exec(mt[2]))!==null){ if(om[1]==='true') ok=k; opts.push(om[2].replace(/^[a-z]\)\s*/,'')); k++; }
      if(opts.length&&ok>=0) perg.push({q,opts,ok});
    }
  });
  return perg;
}

let EXAME=null;
function abrirExame(n){
  const m=COURSE.find(x=>x.n===n);
  EXAME={mod:m, perg:gerarExame(m)};
  document.getElementById('examMeta').textContent=`Módulo ${m.n}`;
  document.getElementById('examTitle').textContent=m.titulo;
  document.getElementById('examQCount').textContent=EXAME.perg.length;
  document.getElementById('examResult').classList.add('hidden');
  const body=document.getElementById('examBody');
  body.classList.remove('hidden');
  body.innerHTML = EXAME.perg.map((p,i)=>`
    <div class="question"><p>${i+1}. ${p.q}</p>
    ${p.opts.map((o,j)=>`<label class="option" onclick="selOpt(this)"><input type="radio" name="eq${i}" value="${j}"> ${o}</label>`).join('')}
    </div>`).join('')
    + `<button class="btn-login" onclick="submeterExame()"><i class="fas fa-paper-plane"></i> Enviar respostas</button>
       <button class="btn-logout" style="width:100%;margin-top:10px;background:#f0f4f8;color:#64748B;border:1px solid #e2e8f0" onclick="fecharExame()">Cancelar</button>`;
  document.getElementById('examOverlay').classList.add('open');
}
function selOpt(el){
  el.closest('.question').querySelectorAll('.option').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel'); el.querySelector('input').checked=true;
}
function submeterExame(){
  let cert=0;
  EXAME.perg.forEach((p,i)=>{
    const s=document.querySelector(`input[name="eq${i}"]:checked`);
    if(s&&parseInt(s.value)===p.ok) cert++;
  });
  const pct=Math.round(cert/EXAME.perg.length*100);
  const pass=pct>=70;
  const n=EXAME.mod.n;
  ST.notas[n]=pct;
  if(pass && n===ST.desbloqueado && n<3) ST.desbloqueado=n+1;
  if(pass && n===3) ST.desbloqueado=4;
  save();
  document.getElementById('examBody').classList.add('hidden');
  const r=document.getElementById('examResult');
  r.classList.remove('hidden');
  r.innerHTML=`
    <div class="res-ic">${pass?'🎉':'📚'}</div>
    <div class="res-score">${pct}%</div>
    <div class="res-lbl">${cert} de ${EXAME.perg.length} respostas correctas</div>
    <div class="res-verdict ${pass?'pass':'fail'}">
      <i class="fas fa-${pass?'circle-check':'circle-xmark'}"></i>
      ${pass?(n<3?`Aprovado! Módulo ${n+1} desbloqueado.`:'Aprovado! Curso concluído — parabéns!'):'Não atingiu 70%. Reveja o módulo e tente novamente.'}
    </div>
    <button class="btn-login" style="max-width:320px;margin:0 auto" onclick="fecharExame();nav('aluno')">
      <i class="fas fa-table-cells"></i> Voltar aos módulos</button>`;
}
function fecharExame(){ document.getElementById('examOverlay').classList.remove('open'); }
document.getElementById('examOverlay').addEventListener('click',e=>{ if(e.target.id==='examOverlay') fecharExame(); });
</script>
