<p>Quando uma dívida de cliente está em atraso há muito tempo e há um risco real de nunca vir a ser recebida, o princípio da prudência contabilística exige que a empresa reconheça esse risco desde já, através de uma <strong>provisão para créditos de cobrança duvidosa</strong> — em vez de esperar, sem qualquer registo, até se ter a certeza absoluta de que o cliente nunca vai pagar.</p>
<p>A provisão é um gasto estimado (classe 6) que reduz o resultado do exercício e cria, no Activo, uma conta redutora que diminui o valor líquido apresentado da dívida do cliente, sem eliminar o direito legal da empresa de continuar a exigir o pagamento.</p>
</div>
<div class="cb"><h2><i class="fas fa-calculator"></i> Exemplo Trabalhado: Provisão da Dívida da Construtora Zenza</h2>
<p>A Kianda Consultoria avalia que, dado o atraso de mais de 90 dias e as dificuldades financeiras conhecidas da Construtora Zenza, existe um risco elevado de não conseguir receber a totalidade da dívida. A gestora decide constituir uma provisão de 50% sobre o valor em dívida:</p>
<ul>
<li>Valor total em dívida: 1.200.000 Kz</li>
<li>Percentagem de provisão constituída: 50%</li>
<li>Valor da provisão: 1.200.000 × 50% = <strong>600.000 Kz</strong></li>
</ul>
<div class="tw"><table class="dt">
<tr><th></th><th>Valor (Kz)</th></tr>
<tr><td>Clientes (valor bruto da dívida)</td><td>1.200.000</td></tr>
<tr><td>Provisão para créditos de cobrança duvidosa</td><td>(600.000)</td></tr>
<tr><td><strong>Valor líquido apresentado no balanço</strong></td><td><strong>600.000</strong></td></tr>
</table></div>
<div class="hi"><strong>Importante:</strong> constituir a provisão não significa perdoar a dívida — a Kianda Consultoria continua legalmente a poder cobrar os 1.200.000 Kz completos ao cliente. A provisão apenas reflecte, de forma prudente, o risco real de não conseguir receber tudo.</div>
</div>
<div class="tl">
<div class="tli"><div class="tld">1</div><div class="tlc"><h4>Analisa a antiguidade dos saldos de clientes</h4><p>Identifica quais as dívidas em atraso e há quanto tempo.</p></div></div>
<div class="tli"><div class="tld">2</div><div class="tlc"><h4>Avalia o risco de incobrabilidade de cada cliente</h4><p>Considera o histórico de pagamento, a situação financeira conhecida e o tempo de atraso.</p></div></div>
<div class="tli"><div class="tld">3</div><div class="tlc"><h4>Calcula e regista a provisão adequada</h4><p>Aplica uma percentagem de provisão proporcional ao risco identificado.</p></div></div>
<div class="tli"><div class="tld">4</div><div class="tlc"><h4>Revê periodicamente as provisões constituídas</h4><p>Se o cliente pagar, reverte a provisão; se a dívida se confirmar incobrável, regista a perda definitiva.</p></div></div>
</div>
<div class="cb"><h2><i class="fas fa-triangle-exclamation"></i> Erro Comum: Nunca Constituir Provisões para Dívidas em Risco</h2>
<p>Muitas pequenas empresas em Angola mantêm no Activo, ano após ano, dívidas de clientes que, na prática, todos sabem que dificilmente serão recebidas — sem nunca constituir a provisão correspondente. Isto sobreavalia o Activo e o resultado da empresa, dando uma falsa imagem de solidez financeira. Quando finalmente se confirma que a dívida é incobrável, a perda tem de ser reconhecida de uma só vez, de forma abrupta, o que pode surpreender sócios, bancos ou investidores que confiavam nos números apresentados anteriormente.</p>
<div class="hi"><strong>Como evitar:</strong> avalia regularmente (pelo menos no fecho de cada exercício) o risco de cobrança de cada cliente em atraso significativo, e constitui provisões proporcionais ao risco identificado, em vez de esperar pela certeza total de incobrabilidade.</div>
</div>
<div class="ib">O mesmo raciocínio de prudência aplica-se, em espelho, às Contas a Pagar: a Kianda Consultoria deve manter um registo organizado de todas as suas obrigações a fornecedores, com datas de vencimento claras, para nunca ser apanhada de surpresa por um pagamento em atraso — o que, além de gerar juros de mora e desgastar a relação comercial, também pode comprometer o acesso a crédito ou a condições favoráveis em compras futuras. Uma boa prática de gestão financeira, comum em pequenas e médias empresas angolanas bem organizadas, é elaborar mensalmente um mapa comparativo entre o total de Contas a Receber previstas para os próximos 30 dias e o total de Contas a Pagar no mesmo período — isto permite antecipar eventuais dificuldades de tesouraria e negociar prazos, tanto com clientes como com fornecedores, antes que o problema se torne uma crise de liquidez real. Este módulo termina aqui a base fundamental: os módulos seguintes vão aprofundar como estes registos se transformam nas demonstrações financeiras completas e nas obrigações fiscais da empresa perante a AGT.</div>
<div class="lawbox"><div class="lt">Plano Geral de Contabilidade Angolano (PGCA)</div><blockquote>O princípio da prudência exige que as empresas reconheçam provisões para créditos de cobrança duvidosa sempre que exista risco identificado de não recebimento, reduzindo o valor líquido apresentado nas contas a receber sem extinguir o direito de cobrança.</blockquote></div>
<div class="quiz"><h3><i class="fas fa-circle-question"></i> Verificação de Aprendizagem</h3>
<div class="qq">Um cliente deve 900.000 Kz há mais de 90 dias. A empresa decide constituir uma provisão de 40% sobre esta dívida. Qual é o valor líquido da dívida que deve aparecer no balanço?</div>
<div class="qo" onclick="cq(this,false)">a) 900.000 Kz</div>
<div class="qo" onclick="cq(this,false)">b) 360.000 Kz</div>
<div class="qo" onclick="cq(this,true)">c) 540.000 Kz</div>
<div class="qo" onclick="cq(this,false)">d) 0 Kz</div>
</div>`}
]};
