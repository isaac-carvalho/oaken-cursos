<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Oaken Electrical — Curso Técnico de Instalações Eléctricas (Edição Angola)</title>
<meta name="description" content="Curso técnico de instalações eléctricas residenciais, comerciais e industriais para Angola. 18 módulos, 396 aulas, normas RTIEBT e IEC 60364, 220/380V 50Hz.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0B1F3A;line-height:1.7;font-size:16px}
a{text-decoration:none;color:inherit}
img{max-width:100%;height:auto;display:block}
svg{max-width:100%;height:auto}
:root{--primary:#0B1F3A;--secondary:#FF6B00;--accent:#00A3A1;--light:#f0f4f8;--gray:#64748B;--green:#16a34a}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.container-sm{max-width:1000px;margin:0 auto;padding:0 16px}

/* ============ HEADER ============ */
header{background:var(--primary);color:#fff;padding:12px 0;position:sticky;top:0;z-index:500;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.hflex{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-size:24px;font-weight:700;letter-spacing:2px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--secondary)}
.nav{display:flex;gap:22px;align-items:center;font-weight:500;flex-wrap:wrap}
.nav a{color:#fff;font-size:15px;transition:color .2s;cursor:pointer}
.nav a:hover{color:var(--secondary)}
.cta-top{background:var(--secondary);padding:9px 22px;border-radius:30px;font-weight:600;transition:transform .2s;display:inline-block}
.cta-top:hover{transform:scale(1.05);color:#fff!important}
@media(max-width:820px){.hflex{flex-direction:column;align-items:center}.nav{justify-content:center;gap:14px}.nav a{font-size:14px}}

/* ============ HERO ============ */
.hero{background:linear-gradient(135deg,var(--primary) 0%,#1a365d 100%);color:#fff;padding:60px 0 70px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-100px;top:-100px;width:600px;height:600px;background:radial-gradient(circle,rgba(255,107,0,.12) 0%,transparent 70%);border-radius:50%;z-index:0}
.hero-flex{display:flex;align-items:center;gap:50px;position:relative;z-index:1;flex-wrap:wrap}
.hero-content{flex:1;min-width:280px}
.hero-content h1{font-size:clamp(26px,5vw,42px);font-weight:800;line-height:1.2;margin-bottom:14px}
.hero-content h1 span{color:var(--secondary)}
.sub-title{font-size:clamp(17px,3vw,22px);font-weight:600;color:var(--secondary);margin-bottom:12px}
.hero-content p{font-size:clamp(15px,2.5vw,18px);opacity:.9;margin-bottom:22px;max-width:640px}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;margin:20px 0 26px;background:rgba(255,255,255,.05);padding:18px 26px;border-radius:16px;border:1px solid rgba(255,255,255,.08)}
.stat-item{text-align:center}
.stat-number{font-size:clamp(20px,4vw,32px);font-weight:800;color:var(--secondary);display:block}
.stat-label{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.hero-badges{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.hero-badges span{background:rgba(255,255,255,.08);padding:6px 16px;border-radius:50px;font-size:13px;border:1px solid rgba(255,255,255,.1)}
.hero-badges i{color:var(--secondary);margin-right:6px}
.cta-hero{background:var(--secondary);color:#fff;padding:16px 40px;border-radius:50px;font-size:clamp(16px,3vw,20px);font-weight:700;display:inline-block;transition:all .3s;box-shadow:0 8px 30px rgba(255,107,0,.4);border:none;cursor:pointer}
.cta-hero:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(255,107,0,.6);color:#fff}
.cta-hero i{margin-right:9px}
.hero-image{flex:0 0 380px}
.hero-image img{width:100%;height:280px;object-fit:cover;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.1)}
@media(max-width:900px){.hero-image{display:none}}
.floating-badge{display:inline-block;background:rgba(255,255,255,.08);padding:9px 20px;border-radius:50px;font-size:13px;border:1px solid rgba(255,255,255,.15);margin-bottom:16px}
.disclaimer-box{background:rgba(255,200,0,.12);border-left:4px solid #f59e0b;padding:14px 18px;border-radius:10px;margin-top:20px;font-size:14px;opacity:.9}
.disclaimer-box i{color:#f59e0b;margin-right:8px}

/* ============ SECTIONS ============ */
section{padding:70px 0}
.section-title{text-align:center;font-size:clamp(24px,5vw,38px);font-weight:700;margin-bottom:12px}
.section-title span{color:var(--secondary)}
.section-sub{text-align:center;font-size:clamp(14px,2.5vw,18px);color:var(--gray);max-width:700px;margin:0 auto 44px}
.bg-white{background:#fff}
.bg-light{background:var(--light)}

/* quick stats */
.quick-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;text-align:center}
.qs-item{background:#fff;padding:24px 14px;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.03);border-top:4px solid var(--secondary)}
.qs-item .number{font-size:clamp(24px,5vw,36px);font-weight:800;color:var(--primary);display:block}
.qs-item .label{font-size:13px;color:var(--gray)}

/* details table */
.details-table{max-width:860px;margin:36px auto 0;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.d-row{display:grid;grid-template-columns:210px 1fr}
.d-row:nth-child(odd){background:var(--light)}
.d-row:nth-child(even){background:#fff}
.d-label{padding:15px 20px;font-weight:700;color:var(--secondary);font-size:14px}
.d-value{padding:15px 20px;font-size:15px}
@media(max-width:640px){.d-row{grid-template-columns:1fr}.d-label{padding-bottom:2px}.d-value{padding-top:0;padding-bottom:15px}}

/* software */
.soft-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;margin-top:36px}
.soft-item{background:var(--light);border-radius:20px;padding:32px 28px;border-top:4px solid var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.04)}
.soft-item>i{font-size:38px;color:var(--accent);margin-bottom:14px}
.soft-item h4{font-size:19px;margin-bottom:6px}
.soft-range{display:inline-block;background:rgba(0,163,161,.12);color:var(--accent);padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px}
.soft-item p{color:var(--gray);font-size:15px}
.soft-item ul{margin-top:12px;padding-left:18px;color:var(--gray);font-size:14px}

/* module cards on landing */
.phase-label{text-align:center;text-transform:uppercase;letter-spacing:2px;font-size:13px;font-weight:700;color:var(--accent);margin:42px 0 18px}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.module-card{background:#fff;padding:24px 20px;border-radius:16px;transition:all .3s;border-left:5px solid var(--secondary);box-shadow:0 4px 10px rgba(0,0,0,.03);cursor:pointer}
.module-card:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(0,0,0,.09)}
.module-card h3{font-size:17px;margin-bottom:7px}
.module-card p{font-size:14px;color:var(--gray)}
.mod-num{display:inline-block;background:var(--secondary);color:#fff;padding:2px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:9px}
.mod-soft{display:inline-block;background:rgba(0,163,161,.12);color:var(--accent);padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-left:6px}

/* differentials */
.diff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:26px;margin-top:36px}
.diff-item{text-align:center;padding:28px 20px;background:var(--light);border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.04);transition:.3s}
.diff-item:hover{transform:scale(1.02)}
.diff-item i{font-size:42px;color:var(--secondary);margin-bottom:14px}
.diff-item h4{font-size:19px;margin-bottom:9px}
.diff-item p{color:var(--gray);font-size:15px}

/* testimonials */
.test-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:26px;margin-top:36px}
.test-item{background:#fff;padding:28px;border-radius:20px;border-bottom:4px solid var(--secondary);box-shadow:0 4px 15px rgba(0,0,0,.03)}
.test-item p{font-style:italic;margin-bottom:14px}
.author{font-weight:600}
.position{color:var(--gray);font-size:14px}
.stars{color:#f59e0b;letter-spacing:2px;margin-bottom:9px}

/* pricing */
.pricing{background:linear-gradient(135deg,rgba(11,31,58,.95) 0%,rgba(26,54,93,.95) 100%);color:#fff;text-align:center}
.pricing-box{max-width:680px;margin:0 auto;background:rgba(255,255,255,.05);padding:44px 34px;border-radius:30px;border:1px solid rgba(255,255,255,.1)}
.countdown{display:inline-block;background:rgba(255,107,0,.2);padding:8px 24px;border-radius:50px;font-weight:600;margin-bottom:18px;border:1px solid rgba(255,107,0,.3);font-size:14px}
.old-price{font-size:19px;text-decoration:line-through;opacity:.6}
.new-price{font-size:clamp(32px,7vw,52px);font-weight:800;color:var(--secondary);display:block;margin:8px 0 16px}
.price-detail{font-size:16px;opacity:.8}
.guarantee{margin-top:18px;font-size:14px;opacity:.7}
@media(max-width:600px){.pricing-box{padding:28px 18px}}

/* faq */
.faq-grid{max-width:800px;margin:0 auto}
.faq-item{border-bottom:1px solid #e2e8f0;padding:18px 0}
.faq-item h4{font-size:clamp(15px,2.5vw,18px);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.faq-item h4 i{transition:.3s;color:var(--secondary)}
.faq-item .answer{max-height:0;overflow:hidden;transition:.35s;color:var(--gray);font-size:15px}
.faq-item.active .answer{max-height:400px;padding-top:10px}
.faq-item.active h4 i{transform:rotate(180deg)}

/* footer */
footer{background:var(--primary);color:#bbb;padding:44px 0 20px}
.footer-flex{display:flex;flex-wrap:wrap;justify-content:space-between;gap:30px}
.footer-col{flex:1;min-width:190px}
.footer-col h5{color:#fff;margin-bottom:14px;font-size:18px}
.footer-col p,.footer-col a{color:#a0aec0;line-height:1.9;font-size:15px}
.footer-col a:hover{color:var(--secondary)}
.social-links a{display:inline-block;margin-right:14px;font-size:21px;color:#a0aec0}
.social-links a:hover{color:var(--secondary)}
.footer-bottom{border-top:1px solid #2d3748;margin-top:28px;padding-top:18px;text-align:center;font-size:14px}

/* ============ ÁREA DO ALUNO ============ */
.login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:44px 16px}
.login-box{background:#fff;border-radius:24px;padding:44px 38px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(11,31,58,.12);text-align:center}
.login-icon{width:68px;height:68px;background:rgba(255,107,0,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:27px;color:var(--secondary)}
.login-box h2{font-size:23px;margin-bottom:6px}
.login-box>p{color:var(--gray);font-size:14px;margin-bottom:26px}
.field{margin-bottom:15px;text-align:left}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input{width:100%;padding:12px 15px;border-radius:10px;border:2px solid #e2e8f0;background:#f8fafc;font-size:15px;transition:.2s;font-family:inherit}
.field input:focus{outline:none;border-color:var(--secondary);background:#fff}
.btn-login{width:100%;padding:14px;border:none;border-radius:30px;background:var(--secondary);color:#fff;font-weight:700;font-size:16px;cursor:pointer;transition:.2s;box-shadow:0 6px 20px rgba(255,107,0,.35);margin-top:8px;font-family:inherit}
.btn-login:hover{transform:translateY(-2px)}
.login-alt{margin-top:18px;font-size:14px;color:var(--gray)}
.login-alt a{color:var(--secondary);font-weight:600;cursor:pointer}
.demo-hint{margin-top:22px;background:var(--light);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--gray)}
.demo-hint i{color:var(--secondary);margin-right:6px}
@media(max-width:480px){.login-box{padding:30px 20px}}

.dash-header{background:var(--primary);color:#fff;padding:28px 0}
.dash-in{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.dash-header h1{font-size:clamp(18px,4vw,22px);font-weight:700}
.dash-header p{opacity:.7;font-size:14px;margin-top:3px}
.btn-logout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 20px;border-radius:30px;font-size:14px;cursor:pointer;font-family:inherit}
.btn-logout:hover{background:rgba(255,255,255,.2)}
.dash-body{padding:30px 0 70px}
.progress-card{background:#fff;border-radius:20px;padding:22px 26px;margin-bottom:26px;box-shadow:0 4px 12px rgba(0,0,0,.04);border-top:4px solid var(--secondary)}
.pc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.pc-head h3{font-size:16px;font-weight:700}
.pct{font-size:22px;font-weight:800;color:var(--secondary)}
.prog-bar{height:12px;background:var(--light);border-radius:6px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--secondary),#ff8c3a);border-radius:6px;transition:width .6s}
.prog-stats{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap;font-size:13px;color:var(--gray)}
.prog-stats b{color:var(--primary)}
.phase-head{display:flex;align-items:center;gap:12px;margin:28px 0 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--accent)}
.phase-head::after{content:'';flex:1;height:1px;background:#e2e8f0}
.mod-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.mod-card{background:#fff;border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.04);border-left:5px solid #e2e8f0;transition:.2s}
.mod-card.unlocked{border-left-color:var(--secondary);cursor:pointer}
.mod-card.unlocked:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.mod-card.done{border-left-color:var(--green);cursor:pointer}
.mod-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;font-weight:800}
.mod-ic.locked{background:var(--light);color:#cbd5e1}
.mod-ic.unlocked{background:rgba(255,107,0,.1);color:var(--secondary)}
.mod-ic.done{background:rgba(22,163,74,.1);color:var(--green)}
.mod-info{flex:1;min-width:0}
.mod-info h4{font-size:14px;font-weight:700;margin-bottom:2px}
.mod-info span{font-size:12px;color:var(--gray)}
.mod-badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;white-space:nowrap}
.mod-badge.locked{background:var(--light);color:#94a3b8}
.mod-badge.unlocked{background:rgba(255,107,0,.1);color:var(--secondary)}
.mod-badge.done{background:rgba(22,163,74,.1);color:var(--green)}
@media(max-width:600px){.mod-list{grid-template-columns:1fr}}

/* ============ VISTA DO MÓDULO ============ */
.mod-hero{background:linear-gradient(135deg,var(--primary) 0%,#1a365d 100%);color:#fff;padding:34px 0 30px}
.mh-in{display:flex;align-items:flex-start;gap:30px}
.mh-txt{flex:1;min-width:0}
.mod-phase{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);margin-bottom:8px;font-weight:700}
.mod-hero h1{font-size:clamp(21px,4vw,32px);font-weight:800;line-height:1.2;margin-bottom:10px}
.mod-hero h1 span{color:var(--secondary)}
.mod-hero>.container-sm>.mh-in>.mh-txt>p{opacity:.85;font-size:clamp(14px,2.5vw,16px);margin-bottom:18px}
.mod-meta{display:flex;flex-wrap:wrap;gap:9px}
.meta-tag{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:30px;font-size:12px}
.meta-tag i{color:var(--secondary);margin-right:5px}
.mh-img{flex:0 0 230px;border-radius:14px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.4)}
.mh-img img{width:100%;height:175px;object-fit:cover}
@media(max-width:760px){.mh-img{display:none}}

.mod-progress{background:#fff;padding:12px 0;border-bottom:2px solid var(--light)}
.mp-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mp-lbl{font-size:12px;color:var(--gray);white-space:nowrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:.2s;flex-shrink:0}
.dot.done{background:var(--accent);color:#fff}
.dot.active{background:var(--secondary);color:#fff;box-shadow:0 3px 10px rgba(255,107,0,.4)}
.dot.todo{background:var(--light);color:var(--gray);border-color:#e2e8f0}

.tabs{display:flex;overflow-x:auto;margin:22px 0 0;border-bottom:2px solid #e2e8f0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb{padding:10px 15px;border:none;background:transparent;font-weight:600;font-size:13px;color:var(--gray);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;flex-shrink:0;transition:.2s;font-family:inherit}
.tb.active{color:var(--secondary);border-bottom-color:var(--secondary)}

.mod-layout{display:grid;grid-template-columns:1fr 250px;gap:24px;align-items:start;margin-top:22px}
@media(max-width:900px){.mod-layout{grid-template-columns:1fr}.sidebar{position:static!important}}
.sidebar{position:sticky;top:74px}
.sc{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px}
.sc h4{font-size:13px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
.sl{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--light);font-size:12px;cursor:pointer;transition:.2s}
.sl:last-child{border-bottom:none}
.sl:hover{color:var(--secondary)}
.sn{width:22px;height:22px;border-radius:50%;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.sl.act .sn{background:var(--secondary);color:#fff}
.sbtn{display:block;text-align:center;padding:10px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:8px;cursor:pointer}
.sbtn.grey{background:var(--light);color:var(--primary)}
.sbtn.orange{background:var(--secondary);color:#fff}

.lesson{padding:26px 0 50px}
.ltitle{font-size:clamp(19px,3.5vw,26px);font-weight:800;margin-bottom:6px}
.lsub{color:var(--gray);font-size:13px;margin-bottom:20px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.lsub span{background:var(--light);padding:4px 10px;border-radius:20px;font-size:12px}
.cb{background:#fff;border-radius:14px;padding:clamp(18px,4vw,28px);margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.cb h2{font-size:clamp(16px,3vw,20px);font-weight:800;margin-bottom:11px}
.cb h2 i{color:var(--secondary);margin-right:7px}
.cb p{color:#374151;font-size:clamp(14px,2.5vw,15px);margin-bottom:11px}
.cb p:last-child{margin-bottom:0}
.cb ul,.cb ol{padding-left:20px;color:#374151;font-size:clamp(14px,2.5vw,15px)}
.cb li{margin-bottom:7px}
.hi{border-left:4px solid var(--secondary);background:rgba(255,107,0,.05);padding:14px 18px;border-radius:0 10px 10px 0;margin:13px 0;font-size:14px}
.hi strong{color:var(--secondary)}
.ib{border-left:4px solid var(--accent);background:rgba(0,163,161,.05);padding:14px 18px;border-radius:0 10px 10px 0;margin:13px 0;font-size:14px}
.ib strong{color:var(--accent)}
.wb{border-left:4px solid #f59e0b;background:rgba(245,158,11,.07);padding:14px 18px;border-radius:0 10px 10px 0;margin:13px 0;font-size:14px}
.lawbox{border:2px solid var(--primary);border-radius:10px;padding:16px 18px;margin:14px 0;background:rgba(11,31,58,.03)}
.lawbox .lt{font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px}
.lawbox blockquote{font-style:italic;color:#374151;font-size:14px;border-left:3px solid var(--secondary);padding-left:12px}
.fbox{background:var(--primary);color:#fff;border-radius:12px;padding:20px 22px;margin:15px 0;text-align:center}
.fbox .f{font-size:clamp(18px,4vw,27px);font-weight:800;color:var(--secondary);letter-spacing:1px;margin-bottom:6px}

A('Circuitos Mistos: Análise e Resolução de Problemas Complexos',null,[
CB(H('fa-diagram-project','Bombas de Água com Bobinas Subalimentadas')+
P('Num sistema de bombagem em Viana (3 bombas de 22kW), a bobina de um contactor não recebia tensão suficiente (160V em vez de 220V) devido a um contacto auxiliar com resistência elevada (20Ω) em série com a bobina (100Ω), com LEDs de sinalização em paralelo. O circuito de comando era misto: identificada a queda de tensão indevida, o técnico substituiu o transformador de comando e corrigiu os contactos.')),
CB(H('fa-sitemap','Método de Redução Progressiva')+
OL(['Somar as resistências em série dentro de cada grupo',

'Repetir até obter uma única resistência total',
'Calcular a corrente total (I=V/R_eq)',
'Desfazer a redução para encontrar correntes e tensões em cada parte']))+
P('<strong>Exemplo:</strong> R1=10Ω em série com (R2=20Ω ‖ R3=30Ω) em série com R4=5Ω, a 220V. R_p=(20×30)/(20+30)=12Ω → R_total=10+12+5=27Ω → I_total=220/27=<strong>8,15A</strong>. V1=81,5V, V_p=97,8V, V4=40,75V. Em R_p: I2=4,89A, I3=3,26A.')+
IB('<strong>Bobinas em paralelo, em série com contacto defeituoso:</strong> 3 bobinas de 100Ω em paralelo (R=33,33Ω) em série com contacto de 20Ω → R_total=53,33Ω → I=4,125A → tensão nas bobinas=137,5V, insuficiente para accionar contactores (exigem ≥85% da nominal, ou seja ≥187V).')+
WB('<strong>Caso real (Lubango, 2023):</strong> um no-break alimentava cargas com cosφ diferentes através de um circuito misto; o cabo de 4mm² (50m) era insuficiente para os 30A resultantes, com queda de 8V (3,6%) que colocava o no-break em modo de bateria frequentemente. <strong>Como evitar:</strong> calcular a corrente em cada secção (série e paralelo) e dimensionar o cabo comum para a corrente total.')+
IB('<strong>Normas aplicáveis:</strong> RTIEBT — Secção 5.2.3 · IEC 60364-5-52 · Lei n.º 27/15, Art. 22.º (equilíbrio de fases).')],
QZ('Num circuito misto R1(10Ω) em série com (R2‖R3=12Ω) em série com R4(5Ω), a 220V, qual a corrente total?',['8,15A — I=220/27Ω','22A','4,4A','27A'],0)),

IB('<strong>Conversão:</strong> rectificador (CA→CC, em fontes electrónicas) · inversor (CC→CA, em sistemas solares). Um sistema de 2kWp com inversor a 90% de eficiência entrega 1,8kW CA — dimensionamento crítico em Angola.')+
WB('<strong>Caso real (Huambo, 2024):</strong> uma bomba de água de 220V CA foi ligada por engano a painéis solares de 48V CC — não funcionou, e a tentativa de ligar a uma bateria de 12V ("electricidade é electricidade") não rodou o motor e arriscou queimar os enrolamentos. <strong>Como evitar:</strong> verificar sempre a placa de características (tensão e tipo de corrente) antes de ligar qualquer equipamento.')+

P('No empreendimento "Miramar Towers" na Ilha de Luanda, 120 apartamentos (6,9kVA cada) distribuídos por 3 fases sofreram desequilíbrio devido a AC de maior potência no lado poente: fase A=120A, B=105A, C=80A, gerando corrente no neutro de até 40A — perigosa para um cabo dimensionado a 100A. A ENDE exigiu correcção; o reagrupamento reduziu a corrente do neutro para menos de 10A.')),
F('V_L = √3 × V_F','380V = 1,732 × 220V — relação entre tensão de linha e de fase')+
TB(['Ligação','Tensão de linha','Corrente de linha'],[
['Estrela (Y)','V_L=√3×V_F','I_L=I_F'],

P('<strong>Motor de 15kW, 380V, cosφ=0,85, η=0,9:</strong> I_L=P/(√3×V_L×cosφ×η)=15.000/503,2=<strong>29,8A</strong>. Em estrela a corrente de fase é a mesma; em triângulo, I_F=29,8/1,732=17,2A.')+
CB(H('fa-scale-unbalanced','Desequilíbrio e o Neutro')+

P('<strong>Exemplo:</strong> fases 100A/80A/60A → I_N=√1200≈<strong>34,6A</strong>. O RTIEBT exige que o neutro seja dimensionado para a corrente de desequilíbrio, podendo chegar a 1,45× a corrente da fase mais carregada.'))+

IB('<strong>Normas aplicáveis:</strong> RTIEBT — Secção 7.2 (dimensionamento do neutro) · IEC 60364-5-52 · Decreto n.º 40/04, Anexo B.')],

P('Num armazém logístico no Zango com histórico de disparos e queima de computadores, um técnico da ENDE mediu 218V na entrada (aceitável) e, com o alicate, encontrou desequilíbrio entre fases (80A/60A/45A) e distorção por cargas não lineares. Recomendou filtros de harmónicas e balanceamento — evitando a substituição desnecessária de cabos e transformadores.')),
TB(['Instrumento','Mede','Ligação','Cuidado essencial'],[
['<strong>Multímetro</strong>','V, I(≤10A), Ω, continuidade','V em paralelo · I em série','Nunca medir Ω com circuito energizado'],

CB(H('fa-shield-halved','Categorias de Segurança')+
UL(['<strong>CAT II:</strong> equipamentos domésticos',
'<strong>CAT III:</strong> quadros de distribuição — mínimo exigido em Angola para trabalho em quadros',
'<strong>CAT IV:</strong> entradas de serviço (ramal ENDE)']))+
IB('<strong>Exemplo de medição:</strong> tensão fase-neutro esperada 220V±5% (209-231V). Corrente de arranque de motor (função "Inrush") pode ser 6-8× a nominal — essencial para dimensionar disjuntores.')+
WB('<strong>Caso real (Luanda, 2023):</strong> um técnico deixou o alicate na escala de 600A para medir 2A — leitura imprecisa (0,1A) levou à substituição desnecessária de um motor, quando o problema real era um mau contacto intermitente na fase. <strong>Como evitar:</strong> escolher sempre a escala mais baixa possível acima do valor esperado, e verificar a garra bem fechada em torno do condutor.')+

P('Na inspecção anual do Hospital Central de Luanda, o megaohmímetro revelou apenas 0,3MΩ entre fase e terra no circuito do AC de um bloco cirúrgico — muito abaixo do mínimo de 1MΩ (instalações novas) ou 0,5MΩ (em serviço). A causa: humidade e temperatura elevada no tecto técnico. A substituição preventiva do cabo evitou uma fuga que poderia disparar o DR durante uma cirurgia.')),

['&lt;0,5 MΩ','Deficiente — substituir ou localizar defeito']])+
WB('<strong>Caso real (Lubango, 2023):</strong> um técnico testou o isolamento de um motor de 5,5kW sem desligar o inversor de frequência — a alta tensão (500V) danificou os componentes electrónicos, com prejuízo de 1,2 milhões AOA. <strong>Como evitar:</strong> desconectar sempre equipamentos electrónicos (inversores, UPS, computadores) antes de aplicar o megaohmímetro.')+

A('Segurança Básica em Instalações Eléctricas: Riscos, EPI e Procedimentos',null,[

P('Em Catete, um técnico sofreu choque fatal ao tocar num barramento de 380V que julgava desligado. O disjuntor geral estava aberto, mas um gerador de emergência sem comutação automática (ATS) correcta mantinha o circuito energizado. Não usava luvas isolantes nem calçado dieléctrico. Este caso trágico sublinha a importância absoluta do LOTO e da verificação de ausência de tensão.')),
TB(['Corrente (mão-mão, 50Hz)','Efeito'],[
['0,5-1 mA','Limiar de percepção'],
['5-10 mA','Contracção — ainda consegue largar (limiar não-solta)'],
['10-30 mA','Contracção forte, dificuldade respiratória'],
['30-50 mA','Fibrilhação ventricular possível'],
['&gt;50 mA','Paragem cardíaca, queimaduras graves']])+
IB('Pele húmida reduz a resistência do corpo de ≈100.000Ω para ≈1.000Ω — a 220V, a corrente pode chegar a 220mA, muito acima do limiar de fibrilhação.')+
CB(H('fa-shield','EPI Essencial')+
UL(['<strong>Luvas isolantes</strong> (classe 1000V, testadas periodicamente)',
'<strong>Calçado dieléctrico</strong> (sola isolante, classe 500-1000V)',
'<strong>Capacete</strong> (protecção contra queda de objectos e, em alguns modelos, eléctrica)',

CB(H('fa-lock','Procedimento LOTO')+
TL([['Desligar','Disjuntor ou seccionador'],
['Bloquear','Cadeado pessoal — só quem o colocou tem a chave'],

['Verificar ausência de tensão','Multímetro/detector entre fase-neutro, fase-terra, entre fases'],
['Aterrar e curto-circuitar','Obrigatório em MT/AT']]))+
WB('<strong>Como evitar tragédias como a de Catete:</strong> verificar SEMPRE com instrumento a ausência de tensão, mesmo com o disjuntor geral desligado — geradores de emergência sem ATS correcto são uma causa real e recorrente de acidentes fatais em Angola. Nunca presumir "está desligado".')+

'<strong>Justa remuneração:</strong> direito a ser pago de acordo com as tabelas do sector',
'<strong>Formação contínua:</strong> acesso a actualização de conhecimentos e das normas',
'<strong>Defesa:</strong> em processo disciplinar, direito a apresentar defesa e recorrer',
'<strong>Identidade profissional:</strong> carteira reconhecida em todo o território nacional']))+
CB(H('fa-list-check','Os Seus Deveres')+
TB(['Dever','O que significa na prática'],[
['<strong>Competência técnica</strong>','Executar apenas trabalhos dentro da sua categoria licenciada'],
['<strong>Conformidade normativa</strong>','Cumprir RTIEBT, IEC 60364 e demais normas em vigor'],
['<strong>Dever de informação</strong>','Informar o cliente sobre âmbito, custos, riscos e limitações'],
['<strong>Sigilo profissional</strong>','Confidencialidade sobre instalações e dados dos clientes'],
['<strong>Responsabilidade civil</strong>','Responder por danos de instalações defeituosas'],
['<strong>Formação contínua</strong>','Manter-se actualizado nas normas e regulamentos'],
['<strong>Registo de obras</strong>','Arquivar memória descritiva e esquemas de cada trabalho']]))+
LAW('Decreto nº 39-04 — Princípio da Responsabilidade','O técnico de instalação eléctrica é responsável, perante os seus clientes e terceiros, pelos danos directamente resultantes de erros, omissões ou negligência no exercício das suas funções, nos termos da legislação civil e penal em vigor na República de Angola.')+
HI('<strong>Como se proteger:</strong> documente sempre tudo. Fotografe antes, durante e depois de cada trabalho. Elabore um relatório simples de cada instalação. Esta documentação é a sua principal defesa em caso de litígio futuro — e custa apenas alguns minutos por obra.')+
QZ('Se uma instalação feita por técnico licenciado causar incêndio por defeito de execução, quem responde?',['Apenas o proprietário, que contratou o serviço','A ENDE, que fornece a energia','O técnico que executou a instalação','Ninguém — é considerado caso fortuito'],2)},

{t:'Obrigações Legais em Obra',html:
CB(H('fa-helmet-safety','O Que a Lei Exige em Cada Trabalho')+
P('Além da licença e do conhecimento técnico, a legislação angolana estabelece obrigações concretas que o técnico deve cumprir em cada obra. Estas obrigações garantem a segurança dos utilizadores, a rastreabilidade das instalações e a qualidade dos trabalhos.')+
P('Muitos técnicos em Angola ignoram estas obrigações por desconhecimento ou por pressão do cliente para "fazer mais rápido e mais barato". O profissional formado conhece os seus deveres — e tem a firmeza de os cumprir.'))+
TB(['Tipo de obra','Documentação obrigatória','Quem aprova'],[
['Residência nova','Projecto eléctrico, Termo de Responsabilidade, Auto de Vistoria','MINEA / ENDE local'],
['Remodelação residencial','Relatório de inspecção, Termo de Responsabilidade','MINEA Provincial'],
['Instalação comercial','Projecto aprovado, Declaração de conformidade','MINEA + Licença Comercial'],
['Instalação industrial','Projecto por Engenheiro, inspecção obrigatória','MINEA + IRSE'],
['Posto de transformação','Projecto de MT, aprovação especial','ENDE / RNT-EP']])+
CB(H('fa-file-signature','O Termo de Responsabilidade')+
P('É o documento em que o técnico assume formalmente a responsabilidade técnica e legal pela instalação. Deve conter:')+
UL(['Identificação completa do técnico — nome, número de licença, categoria',
'Identificação do proprietário e do imóvel — morada completa',
'Descrição sumária dos trabalhos realizados',
'Declaração de conformidade com a RTIEBT e normas aplicáveis',
'Data e assinatura do técnico',
'Declaração do proprietário de que recebeu e aceitou os trabalhos'])+
HI('<strong>Prática profissional:</strong> prepare um modelo de Termo de Responsabilidade em PDF no telemóvel. Imprima duas cópias por obra — uma para o cliente, outra para o seu arquivo. Este simples gesto distingue imediatamente o técnico licenciado do trabalho informal.'))+
IS(IMG.docs,'Documentação técnica assinada — obrigação legal e protecção profissional do técnico')+
QZ('Qual documento assina o técnico assumindo responsabilidade técnica e legal pela instalação?',['Factura de serviços','Contrato de obra','Termo de Responsabilidade','Declaração do proprietário'],2)},

{t:'Fiscalização e Sanções',html:
CB(H('fa-magnifying-glass-dollar','Como Funciona a Fiscalização em Angola')+
P('A fiscalização das instalações eléctricas e dos técnicos é competência partilhada entre o <strong>MINEA</strong>, o <strong>IRSE</strong> e as <strong>Administrações Municipais</strong>. Pode ser:')+
UL(['<strong>Preventiva:</strong> aprovação de projecto e inspecção antes da ligação à rede',
'<strong>Rotineira:</strong> inspecções periódicas, sobretudo a instalações comerciais e industriais',
'<strong>Por denúncia:</strong> accionada por reclamações de vizinhos, proprietários ou entidades',
'<strong>Pós-acidente:</strong> investigação obrigatória após incêndio, electrocução ou acidente grave']))+
TB(['Infracção','Gravidade','Penalidade'],[
['Exercício sem licença','<strong style="color:#dc2626">Muito grave</strong>','Suspensão imediata, coima elevada, processo criminal'],
['Obra fora da categoria licenciada','<strong style="color:#dc2626">Grave</strong>','Suspensão temporária da licença, coima'],
['Instalação sem Termo de Responsabilidade','<strong style="color:#f59e0b">Moderada</strong>','Coima e obrigação de regularizar'],
['Incumprimento da RTIEBT','<strong style="color:#dc2626">Grave</strong>','Embargo da obra, reexecução a custo do técnico'],
['Ligação ilegal (bypass do contador)','<strong style="color:#dc2626">Muito grave</strong>','Corte, coima e processo criminal por furto de energia'],
['Falsificação de documentos','<strong style="color:#dc2626">Muito grave</strong>','Cancelamento da licença e processo criminal']])+
WB('<strong>Clientes que pedem irregularidades:</strong> em Angola é comum ouvir pedidos de ligação "sem meter", bypass de contadores ou instalação "sem papéis". Além de ser crime, <strong>o técnico é co-responsável</strong>. Recuse sempre e explique as consequências. Um cliente honesto acabará por preferir pagar a taxa de ligação regular.')+
CB(H('fa-triangle-exclamation','Em Caso de Acidente Eléctrico')+
OL(['<strong>Participação às autoridades</strong> — Polícia Nacional e MINEA notificados em 24 horas',
'<strong>Preservação do local</strong> — a instalação não deve ser tocada até inspecção oficial',
'<strong>Inspecção técnica</strong> — peritos do MINEA/IRSE elaboram relatório',
'<strong>Identificação de responsabilidade</strong> — o relatório aponta causas e responsáveis',
'<strong>Processo legal</strong> — havendo negligência técnica, o técnico pode ser indiciado criminalmente'])+
IB('<strong>Seguro de responsabilidade civil profissional:</strong> prática já comum em Portugal e no Brasil, começa a crescer em Angola. É fortemente recomendado para técnicos que executam obras de maior envergadura — o custo anual é irrisório face ao risco coberto.'))+
QZ('Um técnico sem licença executa uma instalação em Luanda. A que penalidade está sujeito?',['Apenas advertência verbal','Suspensão da actividade, coima e possível processo criminal','Obrigação de tirar a licença em 6 meses','Nenhuma — a fiscalização não é efectiva'],1)},

{t:'Hierarquia Normativa e Regulamentos do MINEA',html:
CB(H('fa-scroll','Do Topo à Base — Onde Encaixa Cada Norma')+
P('O <strong>MINEA</strong> é a entidade governamental responsável por definir, actualizar e fiscalizar as normas técnicas das instalações eléctricas em Angola. Além da Lei nº 27/15 e dos decretos, emite regularmente despachos, instruções técnicas e circulares normativas.')+
P('Acompanhar as publicações do MINEA no Diário da República é obrigação profissional. As normas podem ser actualizadas, os procedimentos de licenciamento alterados e novos requisitos técnicos introduzidos — sobretudo com a expansão das energias renováveis e da rede nacional.'))+
DG('Hierarquia normativa do sector eléctrico angolano',
`<svg viewBox="0 0 660 270" xmlns="http://www.w3.org/2000/svg"><rect x="180" y="10" width="300" height="42" rx="10" fill="#0B1F3A"/><text x="330" y="28" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">CONSTITUIÇÃO DA REPÚBLICA</text><text x="330" y="44" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.7)">Acesso universal à energia</text><line x1="330" y1="52" x2="330" y2="70" stroke="#64748B" stroke-width="2"/><rect x="140" y="70" width="380" height="42" rx="10" fill="#FF6B00"/><text x="330" y="88" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">LEI Nº 27/15 — Lei Geral de Electricidade</text><text x="330" y="104" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.85)">Diploma-mãe do sector</text><line x1="330" y1="112" x2="330" y2="130" stroke="#64748B" stroke-width="2"/><rect x="80" y="130" width="500" height="42" rx="10" fill="#1a365d"/><text x="330" y="148" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">DECRETOS PRESIDENCIAIS E EXECUTIVOS</text><text x="330" y="164" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.7)">Dec. 40/04 (Licenciamento) · Dec. 39-04 (Estatuto)</text><line x1="330" y1="172" x2="330" y2="190" stroke="#64748B" stroke-width="2"/><rect x="40" y="190" width="580" height="42" rx="10" fill="#00A3A1"/><text x="330" y="208" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">REGULAMENTOS E NORMAS TÉCNICAS — MINEA</text><text x="330" y="224" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.85)">RTIEBT · IEC 60364 · Despachos e circulares</text><line x1="330" y1="232" x2="330" y2="248" stroke="#64748B" stroke-width="2"/><rect x="10" y="248" width="640" height="16" rx="4" fill="#f0f4f8" stroke="#e2e8f0"/><text x="330" y="260" text-anchor="middle" font-size="10" fill="#64748B">NORMAS EMPRESARIAIS — ENDE · RNT-EP · Concessionárias provinciais</text></svg>`)+
CB(H('fa-book','A RTIEBT — o Código Técnico do Electricista')+
P('As <strong>Regras Técnicas das Instalações Eléctricas de Baixa Tensão</strong> são o principal instrumento normativo técnico em Angola, baseadas na norma europeia e na IEC 60364. Definem com detalhe como devem ser concebidas e executadas todas as instalações de BT (até 1.000 V).')+
UL(['<strong>Parte 1</strong> — Âmbito, finalidade e princípios fundamentais',
'<strong>Parte 2</strong> — Protecção para garantir a segurança (choques eléctricos)',
'<strong>Parte 3</strong> — Determinação das características gerais',
'<strong>Parte 4</strong> — Protecção contra sobreintensidades e sobretensões',
'<strong>Parte 5</strong> — Escolha e instalação de equipamentos e materiais',
'<strong>Parte 6</strong> — Verificação das instalações',
'<strong>Parte 7</strong> — Instalações e locais especiais'])+
HI('<strong>Quando um técnico diz "fiz segundo as normas" em Angola</strong>, significa que seguiu a <strong>RTIEBT</strong>. Não seguir a RTIEBT equivale, na prática, a não cumprir a lei angolana — com todas as consequências que isso acarreta.'))+
QZ('Na hierarquia normativa angolana, qual documento está acima da RTIEBT?',['Lei nº 27/15','IEC 60364','Normas da ENDE','A RTIEBT está no topo'],0)},

{t:'ENDE — Ligações, Vistorias e Procedimentos',html:
CB(H('fa-plug','A Empresa com Quem Mais Vai Trabalhar')+
P('A <strong>ENDE</strong> distribui a electricidade desde as subestações até às residências, escritórios e fábricas angolanas. É a entidade com quem o técnico electricista mais interage no dia-a-dia — em ligações novas, aumentos de potência e vistorias.'))+
TB(['Situação','Procedimento','Documentos necessários'],[
['Nova ligação (habitação)','Solicitar após vistoria aprovada','Auto de Vistoria, Termo de Responsabilidade, BI do proprietário'],
['Aumento de potência','Pedido de reclassificação tarifária','Projecto actualizado, Termo de Responsabilidade'],
['Mudança de titularidade','Requerimento no balcão ENDE','BI, contrato de compra/arrendamento'],
['Avaria na rede pública','Participar à ENDE — fora do âmbito do técnico privado','—'],
['Ligação ilegal (bypass)','<strong style="color:#dc2626">NUNCA executar</strong> — crime de furto de energia','—']])+
CB(H('fa-clipboard-check','O Auto de Vistoria — O Que a ENDE Verifica')+
P('Antes de ligar um novo imóvel à rede, a ENDE realiza uma vistoria técnica. Preparar a instalação para passar à primeira é sinal de profissionalismo — e evita atrasos que prejudicam a sua reputação.')+
UL(['<strong>Quadro de contagem:</strong> posição acessível, protecção adequada, dimensão correcta',
'<strong>Disjuntor geral e diferencial:</strong> instalados, calibrados e funcionais',
'<strong>Ligação à terra:</strong> eléctrodo instalado, resistência dentro do exigido para o DR',
'<strong>Secção dos condutores:</strong> adequada à potência contratada',
'<strong>Cores dos condutores:</strong> castanho/preto (L), azul (N), verde-amarelo (PE)',
'<strong>Protecção mecânica:</strong> cabos em calha, conduta ou embebidos'])+
IB('<strong>Dica que poupa tempo:</strong> antes de solicitar a vistoria da ENDE, faça você mesmo uma auto-inspecção com esta checklist. Vistorias falhadas atrasam a ligação do cliente em semanas e prejudicam a sua credibilidade profissional.'))+
IS(IMG.rede,'Ligação à rede da ENDE — último passo após aprovação da vistoria técnica')+
QZ('Antes de a ENDE ligar uma habitação nova à rede, o que é obrigatório?',['Apenas pagar a taxa de ligação','Vistoria técnica aprovada com Auto de Vistoria e Termo de Responsabilidade','Apenas a assinatura do proprietário','Nada — a ligação é automática'],1)},

{t:'Responsabilidade Civil e Garantias',html:
CB(H('fa-shield-halved','Até Onde Vai a Sua Responsabilidade')+
P('O Decreto nº 39-04, em articulação com o Código Civil angolano, estabelece que o técnico responde pelos danos resultantes de erros, omissões ou negligência. Compreender os limites e prazos desta responsabilidade é essencial para se proteger — e para definir correctamente as garantias que oferece ao cliente.'))+
TB(['Tipo de dano','Responsabilidade','Prazo típico'],[
['<strong>Danos materiais</strong>','Incêndio, avaria de equipamentos, destruição de bens','Período de garantia acordado'],
['<strong>Danos pessoais</strong>','Electrocução, queimaduras, lesões','Responsabilidade civil + eventual processo criminal'],
['<strong>Defeitos de execução</strong>','Ligações mal feitas, cabos soltos, disjuntores mal calibrados','Mínimo 1 ano (prática do sector)'],
['<strong>Vícios ocultos</strong>','Isolamento degradado, terra insuficiente','Até 5 anos'],
['<strong>Equipamentos</strong>','Garantia do fabricante','2 anos (material de qualidade)']])+
CB(H('fa-file-contract','Como Definir a Garantia por Escrito')+
P('Inclua sempre no Termo de Responsabilidade uma cláusula de garantia clara. Isto protege-o de reclamações abusivas e dá segurança ao cliente:')+
UL(['<strong>Prazo:</strong> defina o período (recomendado: 12 meses para execução)',
'<strong>Âmbito:</strong> especifique que cobre defeitos de execução, não mau uso',
'<strong>Exclusões:</strong> sobrecargas provocadas pelo cliente, danos por descargas atmosféricas sem DPS instalado, intervenções de terceiros',
'<strong>Condições:</strong> a garantia cessa se outra pessoa intervier na instalação'])+
HI('<strong>Protecção prática:</strong> tire fotografias detalhadas do quadro concluído, com todos os disjuntores etiquetados e visíveis. Registe as medições de isolamento e de terra. Se um ano depois surgir uma reclamação, estes registos provam o estado em que entregou a obra.'))+
QZ('Qual é o prazo mínimo de garantia recomendado pelas boas práticas do sector para defeitos de execução em Angola?',['30 dias','6 meses','1 ano','10 anos'],2)},

{t:'Segurança do Trabalho e Legislação Laboral',html:
CB(H('fa-user-shield','O Enquadramento Legal da Segurança')+
P('Além das normas técnicas, o técnico electricista está sujeito à legislação laboral angolana em matéria de segurança e saúde no trabalho. Isto aplica-se tanto ao trabalhador por conta de outrem como ao técnico independente que contrata ajudantes.')+
UL(['<strong>Fornecimento de EPI:</strong> o empregador é obrigado a fornecer gratuitamente o equipamento de protecção individual adequado',
'<strong>Formação em segurança:</strong> todo o trabalhador deve receber formação sobre os riscos da sua função',
'<strong>Participação de acidentes:</strong> acidentes de trabalho devem ser participados às autoridades competentes',
'<strong>Seguro de acidentes de trabalho:</strong> obrigatório para trabalhadores por conta de outrem',
'<strong>Exames médicos:</strong> admissão e periódicos, conforme o risco da actividade']))+
CB(H('fa-list-check','Responsabilidades do Técnico Independente')+
P('Se trabalha por conta própria e contrata ajudantes — situação muito comum em Angola — passa a ter obrigações de empregador:')+
TB(['Obrigação','O que fazer na prática'],[
['Fornecer EPI','Luvas isolantes, óculos, calçado dieléctrico para cada ajudante'],
['Formar','Explicar os riscos e as 5 Regras de Ouro antes do primeiro trabalho'],
['Supervisionar','Não deixar ajudante sem formação intervir em circuito energizado'],
['Segurar','Contratar seguro de acidentes de trabalho'],
['Delimitar zonas','Sinalizar e isolar a área de trabalho de terceiros']])+
WB('<strong>Risco frequentemente ignorado:</strong> muitos técnicos em Angola levam ajudantes sem formação nem EPI para obras. Se ocorrer um acidente, a responsabilidade legal e civil recai <strong>integralmente sobre o técnico</strong>. Nunca coloque alguém sem formação a trabalhar em circuitos eléctricos.'))+
QZ('Um técnico independente em Angola contrata um ajudante. Quem é responsável por fornecer o EPI?',['O ajudante compra o seu próprio EPI','O técnico que o contratou','O cliente da obra','O MINEA'],1)},

{t:'Ética Profissional e Relação com o Cliente',html:
CB(H('fa-handshake','O Que Distingue o Profissional')+
P('Num mercado onde o sector informal ainda é dominante, a ética profissional é o maior diferencial competitivo do técnico licenciado em Angola. Clientes que já foram enganados por trabalhos mal feitos valorizam enormemente quem é transparente, documenta o trabalho e assume responsabilidade.'))+
CB(H('fa-comments','Como Comunicar com o Cliente')+
UL(['<strong>Orçamento por escrito antes de começar</strong> — discriminando material e mão de obra separadamente',
'<strong>Explique a lei ao cliente</strong> — muitos pedem irregularidades por puro desconhecimento; eduque-os',
'<strong>Seja transparente sobre limitações</strong> — se a instalação existente tem problemas graves, documente e informe por escrito',
'<strong>Não prometa o que não pode cumprir</strong> — prazos irrealistas destroem a confiança',
'<strong>Explique o que fez</strong> — no fim da obra, mostre o quadro, explique cada disjuntor e o funcionamento do DR',
'<strong>Defina a garantia claramente</strong> — por escrito, com âmbito e exclusões']))+
CB(H('fa-ban','Situações a Recusar Sempre')+
TB(['Pedido do cliente','Resposta profissional'],[
['"Ligue sem passar pelo contador"','Recusar — é crime de furto de energia; explicar as consequências'],
['"Não precisa de papéis"','Recusar — o Termo de Responsabilidade protege ambos'],
['"Use cabo mais fino para poupar"','Recusar — risco de incêndio; explicar P = I²R'],
['"Não é preciso terra"','Recusar — é exigência da RTIEBT e da vistoria ENDE'],
['"Faz sem licença que eu não digo"','Recusar — a responsabilidade é sempre do técnico']])+
HI('<strong>Argumento que funciona com clientes angolanos:</strong> "Se a sua casa arder por causa de uma instalação irregular, a seguradora não paga nada. E se alguém se electrocutar, a responsabilidade criminal é minha — mas o luto é seu." A explicação honesta do risco convence mais do que a insistência.'))+
IS(IMG.entrega,'Comunicação clara e documentação entregue — o diferencial do técnico profissional em Angola')+
QZ('Um cliente pede uma ligação "sem papéis e mais barata". Qual a resposta profissional correcta?',['Aceitar — o cliente tem sempre razão','Fazer mas guardar os documentos sem entregar','Recusar, explicar as consequências legais e propor a solução correcta','Executar sem licença e cobrar menos'],2)},

{t:'Formalização do Negócio em Angola',html:
CB(H('fa-briefcase','De Técnico a Empresário')+
P('Muitos técnicos electricistas em Angola trabalham de forma informal — o que limita o acesso a obras maiores, a clientes empresariais e a contratos públicos. A formalização abre portas a um mercado muito mais rentável.'))+
CB(H('fa-list-ol','Passos para Formalizar')+
TL([['Obter a licença profissional','Decreto nº 40/04 — categoria adequada ao tipo de trabalho que pretende executar'],
['Registar actividade','Como empresário em nome individual ou constituindo sociedade (Lda.)'],
['Obter NIF','Número de Identificação Fiscal junto da Administração Geral Tributária'],
['Emitir facturas','Obrigação fiscal e requisito para trabalhar com empresas'],
['Abrir conta bancária empresarial','Separar as finanças pessoais das do negócio'],
['Considerar seguro de responsabilidade civil','Proteger o património pessoal em caso de sinistro']]))+
CB(H('fa-chart-line','O Que a Formalização Permite')+
TB(['Sem formalização','Com formalização'],[
['Apenas clientes particulares','Empresas, condomínios, instituições e Estado'],
['Sem emissão de factura','Factura legal — requisito de qualquer empresa'],
['Sem acesso a concursos públicos','Pode concorrer a concursos do Estado'],
['Sem crédito bancário para o negócio','Acesso a financiamento e leasing de equipamento'],
['Preços comprimidos pela concorrência informal','Posicionamento premium justificado']])+
IB('<strong>Realidade do mercado angolano:</strong> nenhuma empresa, condomínio ou instituição pública contrata um técnico que não possa emitir factura. Ao formalizar, deixa de competir por preço com o sector informal e passa a competir por qualidade num segmento muito mais rentável.'))+
QZ('O que permite ao técnico angolano trabalhar com empresas e concorrer a obras públicas?',['Apenas ter muitos anos de experiência','Formalizar a actividade com licença, NIF e capacidade de emitir factura','Ter as melhores ferramentas','Cobrar o preço mais baixo do mercado'],1)},

{t:'Orçamentação de Trabalhos Eléctricos',html:
CB(H('fa-calculator','Como Orçamentar Sem Perder Dinheiro')+
P('Orçamentar mal é a causa nº 1 de fracasso de técnicos independentes em Angola. Orçamentos feitos "de cabeça" esquecem custos que depois saem do bolso do técnico. Um orçamento profissional discrimina tudo.'))+
CB(H('fa-list-check','Estrutura de um Orçamento Completo')+
TB(['Rubrica','O que incluir'],[
['<strong>1. Material eléctrico</strong>','Cabos, disjuntores, DR, DPS, quadro, tomadas, interruptores, luminárias'],
['<strong>2. Material de instalação</strong>','Tubagem, calhas, caixas, buchas, fita, terminais, abraçadeiras'],
['<strong>3. Mão de obra</strong>','Horas de trabalho × valor/hora × número de técnicos'],
['<strong>4. Deslocações</strong>','Combustível, transporte de material, número de viagens'],
['<strong>5. Serviços externos</strong>','Roços na parede, reboco, pintura de reparação, se aplicável'],
['<strong>6. Documentação</strong>','Elaboração de projecto, esquema unifilar, Termo de Responsabilidade'],
['<strong>7. Margem de imprevistos</strong>','10 a 15% — obras antigas reservam sempre surpresas'],

      <button class="btn-login" onclick="doLogin()"><i class="fas fa-right-to-bracket"></i> Entrar na plataforma</button>
      <div class="login-alt">Ainda não é aluno? <a onclick="nav('home');jump('preco')">Inscreva-se aqui</a></div>
      <div class="demo-hint"><i class="fas fa-circle-info"></i> Use qualquer e-mail e senha para aceder à demonstração. O seu progresso fica guardado neste dispositivo.</div>
    </div></div>`;
    const inp=document.getElementById('li-pass');
    if(inp) inp.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
    window.scrollTo(0,0); return;
  }

  // DESBLOQUEIO TEMPORÁRIO: todos os módulos disponíveis para edição/revisão de conteúdo.
  // Para reativar a progressão sequencial normal, trocar a linha do `st` abaixo de volta para:
  // const st = m.n<ST.desbloqueado?'done':(m.n===ST.desbloqueado?'unlocked':'locked');
  const done = Object.values(ST.notas).filter(v=>v>=70).length;
  const pct = Math.round(done/18*100);
  let lista='';
  [1,2,3].forEach(f=>{
    lista += `<div class="phase-head">${FASES[f]}</div><div class="mod-list">`;
    COURSE.filter(m=>m.fase===f).forEach(m=>{
      const st = (ST.notas[m.n]>=70)?'done':'unlocked';
      const ic = st==='done'?'<i class="fas fa-check"></i>':(st==='locked'?'<i class="fas fa-lock"></i>':m.n);
      const bd = st==='done'?'Concluído':(st==='unlocked'?'Continuar →':'Bloqueado');
      const nota = ST.notas[m.n]?` · ${ST.notas[m.n]}%`:'';

  <div class="dash-header"><div class="container dash-in">

/* ───────── VISTA DO MÓDULO ───────── */
function renderModulo(m){
  moduloAtual = m; aulaAtual = 0;
  const softTag = m.soft?`<span class="meta-tag"><i class="fas ${m.soft==='EWS'?'fa-mobile-screen-button':'fa-laptop-code'}"></i> ${m.soft}</span>`:'';
  app.innerHTML = `
  <div class="mod-hero"><div class="container-sm mh-in">
    <div class="mh-txt">
      <div class="mod-phase"><i class="fas fa-layer-group"></i> ${FASES[m.fase]}</div>
      <h1>Módulo ${m.n} — <span>${m.titulo}</span></h1>
      <p>${m.desc}</p>
      <div class="mod-meta">
        <span class="meta-tag"><i class="fas fa-book-open"></i> ${m.aulas.length} Aulas</span>
        <span class="meta-tag"><i class="fas fa-clock"></i> 9 Horas</span>
        ${softTag}
        <span class="meta-tag"><i class="fas fa-bolt"></i> 220/380 V · 50 Hz</span>
      </div>
    </div>
    <div class="mh-img"><img src="${m.img}" alt="${m.titulo}"></div>
  </div></div>
  <div class="mod-progress"><div class="container-sm mp-in">
    <span class="mp-lbl">Progresso do módulo:</span><div class="dots" id="dots"></div>
  </div></div>
  <div class="container-sm">
    <div class="tabs" id="tabs"></div>
    <div class="mod-layout">
      <div id="lesson"></div>
      <div class="sidebar">
        <div class="sc"><h4><i class="fas fa-list" style="color:var(--secondary)"></i> Aulas</h4><div id="slinks"></div></div>
        <div class="sc"><h4><i class="fas fa-trophy" style="color:var(--secondary)"></i> Avaliação</h4>
          <p style="font-size:12px;color:var(--gray);margin-bottom:10px">Conclua as aulas e faça o exame do módulo para desbloquear o seguinte.</p>
          <div class="sbtn orange" onclick="abrirExame(${m.n})"><i class="fas fa-pen-to-square"></i> Fazer exame</div>
        </div>
        <div class="sc"><h4><i class="fas fa-route" style="color:var(--secondary)"></i> Navegação</h4>
          ${m.n>1?`<div class="sbtn grey" onclick="nav('modulo-${m.n-1}')"><i class="fas fa-arrow-left"></i> Módulo ${m.n-1}</div>`:''}
          <div class="sbtn grey" onclick="nav('aluno')"><i class="fas fa-table-cells"></i> Todos os módulos</div>
          ${m.n<18?`<div class="sbtn orange" onclick="nav('modulo-${m.n+1}')">Módulo ${m.n+1} <i class="fas fa-arrow-right"></i></div>`:''}
        </div>
      </div>
    </div>
  </div>`;

  const tabs=document.getElementById('tabs'), dots=document.getElementById('dots'), sl=document.getElementById('slinks');
  m.aulas.forEach((a,i)=>{
    const t=document.createElement('button'); t.className='tb'; t.id='tb'+i;
    t.textContent=(i+1)+'. '+a.t.split(' ').slice(0,3).join(' ')+'…';
    t.onclick=()=>irAula(i); tabs.appendChild(t);
    const d=document.createElement('div'); d.className='dot'; d.id='dt'+i; d.textContent=i+1;
    d.onclick=()=>irAula(i); dots.appendChild(d);
    const s=document.createElement('div'); s.className='sl'; s.id='sl'+i;
    s.innerHTML=`<span class="sn">${i+1}</span>${a.t}`; s.onclick=()=>irAula(i); sl.appendChild(s);
  });
  irAula(0);
  window.scrollTo(0,0);
}

function irAula(i){
  const m=moduloAtual, a=m.aulas[i]; aulaAtual=i;
  const sw = a.sw?`<span><i class="fas ${a.sw==='EWS'?'fa-mobile-screen-button':'fa-laptop-code'}" style="color:var(--secondary)"></i> COM ${a.sw}</span>`:'';
  document.getElementById('lesson').innerHTML = `
  <div class="lesson">
    <div class="ltitle">Aula ${i+1} — ${a.t}</div>
    <div class="lsub"><span><i class="fas fa-clock"></i> ~25 min</span><span>Módulo ${m.n} · ${m.titulo}</span>${sw}</div>
    ${a.html}
    <div class="lnav">
      <button class="nb np" onclick="irAula(${i-1})" ${i===0?'disabled':''}><i class="fas fa-arrow-left"></i> Anterior</button>
      ${i<m.aulas.length-1
        ? `<button class="nb nn" onclick="irAula(${i+1})">Próxima aula <i class="fas fa-arrow-right"></i></button>`
        : `<button class="nb nn" onclick="abrirExame(${m.n})"><i class="fas fa-trophy"></i> Fazer exame do módulo</button>`}
    </div>
  </div>`;
  m.aulas.forEach((_,j)=>{
    document.getElementById('tb'+j).classList.toggle('active',j===i);
    document.getElementById('dt'+j).className='dot '+(j<i?'done':(j===i?'active':'todo'));
    document.getElementById('sl'+j).classList.toggle('act',j===i);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function cq(el,ok){
  el.closest('.quiz').querySelectorAll('.qo').forEach(o=>{o.onclick=null;o.style.cursor='default';});
  el.classList.add(ok?'ok':'no');
}

/* ───────── SISTEMA DE EXAMES ───────── */
function gerarExame(m){
  const perg=[];
  m.aulas.forEach(a=>{
    const re=/<div class="qq">(.*?)<\/div>((?:<div class="qo"[\s\S]*?<\/div>)+)/g;
    let mt;
    while((mt=re.exec(a.html))!==null){
      const q=mt[1];
      const opts=[]; let ok=-1;
      const ore=/<div class="qo" onclick="cq\(this,(true|false)\)">(.*?)<\/div>/g;
      let om,k=0;
      while((om=ore.exec(mt[2]))!==null){ if(om[1]==='true') ok=k; opts.push(om[2].replace(/^[a-z]\)\s*/,'')); k++; }
      if(opts.length&&ok>=0) perg.push({q,opts,ok});
    }
  });
  return perg;
}

let EXAME=null;
function abrirExame(n){
  const m=COURSE.find(x=>x.n===n);
  EXAME={mod:m, perg:gerarExame(m)};
  document.getElementById('examMeta').textContent=`Módulo ${m.n} · ${FASES[m.fase]}`;
  document.getElementById('examTitle').textContent=m.titulo;
  document.getElementById('examQCount').textContent=EXAME.perg.length;
  document.getElementById('examResult').classList.add('hidden');
  const body=document.getElementById('examBody');
  body.classList.remove('hidden');
  body.innerHTML = EXAME.perg.map((p,i)=>`
    <div class="question"><p>${i+1}. ${p.q}</p>
    ${p.opts.map((o,j)=>`<label class="option" onclick="selOpt(this)"><input type="radio" name="eq${i}" value="${j}"> ${o}</label>`).join('')}
    </div>`).join('')
    + `<button class="btn-login" onclick="submeterExame()"><i class="fas fa-paper-plane"></i> Enviar respostas</button>
       <button class="btn-logout" style="width:100%;margin-top:10px;background:#f0f4f8;color:#64748B;border:1px solid #e2e8f0" onclick="fecharExame()">Cancelar</button>`;
  document.getElementById('examOverlay').classList.add('open');
}
function selOpt(el){
  el.closest('.question').querySelectorAll('.option').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel'); el.querySelector('input').checked=true;
}
function submeterExame(){
  let cert=0;
  EXAME.perg.forEach((p,i)=>{
    const s=document.querySelector(`input[name="eq${i}"]:checked`);
    if(s&&parseInt(s.value)===p.ok) cert++;
  });
  const pct=Math.round(cert/EXAME.perg.length*100);
  const pass=pct>=70;
  const n=EXAME.mod.n;
  ST.notas[n]=pct;
  if(pass && n===ST.desbloqueado && n<18) ST.desbloqueado=n+1;
  if(pass && n===18) ST.desbloqueado=19;
  save();
  document.getElementById('examBody').classList.add('hidden');
  const r=document.getElementById('examResult');
  r.classList.remove('hidden');
  r.innerHTML=`
    <div class="res-ic">${pass?'🎉':'📚'}</div>
    <div class="res-score">${pct}%</div>
    <div class="res-lbl">${cert} de ${EXAME.perg.length} respostas correctas</div>
    <div class="res-verdict ${pass?'pass':'fail'}">
      <i class="fas fa-${pass?'circle-check':'circle-xmark'}"></i>
      ${pass?(n<18?`Aprovado! Módulo ${n+1} desbloqueado.`:'Aprovado! Curso concluído — parabéns!'):'Não atingiu 70%. Reveja o módulo e tente novamente.'}
    </div>
    <button class="btn-login" style="max-width:320px;margin:0 auto" onclick="fecharExame();nav('aluno')">
      <i class="fas fa-table-cells"></i> Voltar aos módulos</button>`;
}
function fecharExame(){ document.getElementById('examOverlay').classList.remove('open'); }
document.getElementById('examOverlay').addEventListener('click',e=>{ if(e.target.id==='examOverlay') fecharExame(); });
</script>
