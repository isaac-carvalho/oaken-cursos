const M3 = {n:3, fase:'Confeitaria', img:'https://images.unsplash.com/photo-1583338917451-face2751d8d5?w=700&q=80', titulo:"Confeitaria e Doçaria: Do Básico ao Fino", desc:"Do domínio dos ingredientes essenciais à produção de doces finos para venda: técnicas, recheios, coberturas e decoração de confeitaria.", aulas:[{"t":"Ingredientes Essenciais da Confeitaria e as Suas Funções","html":"\n<div class=\"cb\"><h2><i class=\"fas fa-seedling\"></i> Confeitar é Química, Não Improviso</h2>\n<p>Um cozinheiro de cozinha quente pode, muitas vezes, corrigir um prato a meio do processo — provar, ajustar o sal, adicionar mais líquido. Em confeitaria isso raramente é possível: quando uma massa entra no forno, o resultado já está praticamente decidido. É por isso que um técnico em gastronomia que se especializa em confeitaria precisa de compreender <strong>a função técnica de cada ingrediente</strong>, e não apenas seguir receitas de forma mecânica. Saber porque é que a farinha, o açúcar, a gordura, os ovos e os agentes levedantes se comportam de determinada forma permite adaptar receitas, corrigir erros antes que aconteçam e trabalhar com confiança em qualquer cozinha profissional do mundo, independentemente da marca de produtos disponível localmente.</p>\n<p>Esta aula estabelece o vocabulário técnico e os princípios físico-químicos que vais usar em todas as dez aulas seguintes deste módulo.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-wheat-awn\"></i> Farinhas: Força do Glúten e Escolha Certa</h2>\n<p>A farinha de trigo contém duas proteínas — glutenina e gliadina — que, quando hidratadas e trabalhadas, formam o <strong>glúten</strong>: uma rede elástica que dá estrutura a massas. A quantidade de proteína na farinha determina a sua \"força\":</p>\n<ul>\n<li><strong>Farinha fraca</strong> (cerca de 8-9% de proteína) — pouco glúten, ideal para bolos macios, biscoitos e massas quebradas, onde se quer ternura e não elasticidade.</li>\n<li><strong>Farinha média</strong> (cerca de 10-11% de proteína) — uso geral, equilíbrio entre estrutura e maciez.</li>\n<li><strong>Farinha forte</strong> (11-13% ou mais de proteína) — ideal para massas que precisam de estrutura elástica, como massas folhadas e pão.</li>\n</ul>\n<p>Peneirar a farinha antes de usar não é apenas para remover grumos: incorpora ar, o que ajuda na leveza final da massa, e uniformiza a mistura com o fermento em pó, evitando bolsas concentradas de agente levedante.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-cube\"></i> Açúcares: Doçura, Estrutura e Conservação</h2>\n<p>O açúcar refinado (sacarose) desempenha, em confeitaria, pelo menos quatro funções além de adoçar: é <strong>higroscópico</strong> (retém humidade, prolongando a maciez de bolos e biscoitos), interfere na formação do glúten tornando a massa mais tenra, contribui para a cor através da caramelização e reação de Maillard durante a cozedura, e, quando batido com gordura, ajuda a incorporar bolhas de ar que servem de base à aeração da massa.</p>\n<p>Nem todos os açúcares são iguais em confeitaria profissional:</p>\n<ul>\n<li><strong>Açúcar granulado / cristal fino</strong> — uso geral, dissolve com relativa facilidade.</li>\n<li><strong>Açúcar de confeiteiro (impalpável)</strong> — moído muito fino, com um pouco de amido misturado; ideal para coberturas lisas e massas quebradas.</li>\n<li><strong>Açúcar mascavado / moreno</strong> — contém melaço residual, acrescenta humidade e sabor mais profundo, comum em biscoitos macios.</li>\n</ul>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1583338917451-face2751d8d5?w=900&q=80\" alt=\"Ingredientes de confeitaria organizados numa bancada\"><div class=\"ic\">Farinha, açúcar, ovos e manteiga: os quatro pilares da confeitaria clássica</div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-egg\"></i> Ovos, Gorduras e Agentes Levedantes</h2>\n<p>Os <strong>ovos</strong> cumprem três funções simultâneas: as proteínas coagulam com o calor e dão estrutura; a gema contém lecitina, um emulsionante natural que ajuda a ligar gordura e líquidos numa massa homogénea; e as claras, quando batidas, incorporam ar e conferem leveza. As <strong>gorduras</strong> — sobretudo a manteiga — trazem sabor, maciez (ao \"encurtar\" as cadeias de glúten, impedindo-as de se ligarem demasiado) e, através da técnica de cremagem, também aeração. Os <strong>agentes levedantes químicos</strong>, como o fermento em pó (uma mistura de bicarbonato de sódio com um ácido em pó) ou o bicarbonato de sódio isolado (que precisa de um ácido presente na receita, como iogurte ou sumo de limão, para reagir), libertam dióxido de carbono que expande as bolhas de ar já existentes na massa, criando a estrutura porosa final.</p>\n<div class=\"tw\"><table class=\"dt\">\n<tr><th>Ingrediente</th><th>Função principal</th><th>Efeito se em excesso ou defeito</th></tr>\n<tr><td>Farinha</td><td>Estrutura (rede de glúten)</td><td>Excesso: massa dura e seca. Defeito: massa não sustenta a forma</td></tr>\n<tr><td>Açúcar</td><td>Doçura, maciez, retenção de humidade</td><td>Excesso: massa não sobe, fica pesada. Defeito: seca depressa</td></tr>\n<tr><td>Ovos</td><td>Estrutura, emulsão, aeração</td><td>Excesso: textura de borracha. Defeito: massa desmancha</td></tr>\n<tr><td>Gordura</td><td>Sabor, maciez, aeração (cremagem)</td><td>Excesso: massa oleosa e densa. Defeito: fica seca e dura</td></tr>\n<tr><td>Fermento em pó</td><td>Expansão de volume</td><td>Excesso: cresce e desaba, sabor metálico. Defeito: bolo baixo e denso</td></tr>\n</table></div>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1534432182912-63863115e106?w=900&q=80\" alt=\"Ovos e manteiga prontos a usar numa receita de confeitaria\"><div class=\"ic\">Ovos e manteiga à temperatura ambiente antes de iniciar a cremagem</div></div>\n</div>\n<div class=\"tl\">\n<div class=\"tli\"><div class=\"tld\">1</div><div class=\"tlc\"><h4>Identifica o tipo de farinha necessário</h4><p>Pergunta se a receita pede leveza (farinha fraca) ou estrutura elástica (farinha forte) e ajusta em função do teor de proteína disponível.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">2</div><div class=\"tlc\"><h4>Avalia a proporção açúcar/farinha</h4><p>Uma proporção alta de açúcar em relação à farinha resulta numa massa mais macia e húmida; uma proporção baixa resulta numa textura mais firme.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">3</div><div class=\"tlc\"><h4>Confirma a função dos ovos</h4><p>Verifica se os ovos entram inteiros (estrutura e emulsão) ou separados (aeração das claras), pois isso determina a técnica de preparo.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">4</div><div class=\"tlc\"><h4>Verifica o rácio de gordura</h4><p>Mais gordura em relação à farinha significa mais maciez, mas também menos estrutura — útil para saber quando reforçar ou reduzir.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">5</div><div class=\"tlc\"><h4>Confere a quantidade de fermento</h4><p>Como regra geral de referência, uma proporção próxima de 5g de fermento em pó por cada 250g de farinha costuma ser um bom ponto de partida em massas de bolo amanteigado.</p></div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-triangle-exclamation\"></i> Erro Comum: Usar Farinha Forte num Bolo Macio</h2>\n<p>É frequente, em cozinhas com stock limitado, usar-se a única farinha disponível para tudo — inclusive farinha forte, própria para pão, num bolo que devia ficar leve e macio. O resultado é um bolo denso, com miolo apertado e uma textura quase \"borrachuda\", porque o excesso de glúten desenvolvido cria uma rede demasiado forte para o gás do fermento conseguir expandir com facilidade. Este erro é ainda mais evidente quando a massa é batida por mais tempo do que o necessário, desenvolvendo ainda mais glúten.</p>\n<div class=\"hi\"><strong>Como evitar:</strong> sempre que só houver farinha forte disponível, substitui uma pequena parte por amido de milho (por exemplo, 20g de amido de milho por cada 250g de farinha) para diluir a concentração de glúten, e mistura a massa apenas até os ingredientes se unirem, sem bater em excesso.</div>\n</div>\n<div class=\"quiz\"><h3><i class=\"fas fa-circle-question\"></i> Verificação de Aprendizagem</h3>\n<div class=\"qq\">Um confeiteiro está a preparar um bolo esponja que precisa de ficar leve e macio, mas só tem disponível farinha com cerca de 12% de proteína (farinha forte, própria para pão). O que deve fazer para aproximar o resultado do que a receita pede?</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">a) Usar a farinha tal como está, sem qualquer alteração</div>\n<div class=\"qo\" onclick=\"cq(this,true)\">b) Substituir uma parte da farinha por amido de milho, reduzindo a proporção efetiva de glúten na mistura</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">c) Aumentar a quantidade de fermento em pó para compensar a farinha forte</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">d) Amassar a massa por mais tempo, para desenvolver ainda mais o glúten</div>\n</div>"},{"t":"Técnicas Fundamentais: Cremagem, Claras em Neve e Pontos de Açúcar","html":"\n<div class=\"cb\"><h2><i class=\"fas fa-flask\"></i> Três Técnicas, Centenas de Receitas</h2>\n<p>Se dominares apenas três técnicas manuais — cremagem de manteiga com açúcar, montagem de claras em neve e controlo dos pontos de açúcar — consegues executar a esmagadora maioria das receitas deste módulo e de qualquer cozinha de confeitaria profissional. São técnicas físicas, não apenas intelectuais: exigem prática de mão, sensibilidade ao ponto certo e, sobretudo, o hábito de observar a textura em vez de confiar apenas no relógio. Esta aula ensina-as em detalhe, com os valores técnicos exatos que precisas de memorizar.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-blender\"></i> Cremagem de Manteiga e Açúcar</h2>\n<p>A cremagem consiste em bater manteiga (à temperatura ambiente, entre 18°C e 21°C — nem derretida, nem dura) com açúcar até a mistura ficar esbranquiçada, leve e volumosa. Este processo mecânico introduz milhares de pequenas bolhas de ar na gordura, que mais tarde se expandem no forno com a ajuda do fermento, dando origem à estrutura porosa do bolo amanteigado.</p>\n<p><strong>Técnica de referência:</strong> para 250g de manteiga e 250g de açúcar refinado, bate em velocidade média durante 4 a 5 minutos, parando a meio para raspar as laterais da tigela com uma espátula, até a mistura clarear visivelmente de cor e aumentar de volume.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-wind\"></i> Claras em Neve: Estágios e Erros</h2>\n<p>Bater claras de ovo incorpora ar em torno da proteína <strong>albumina</strong>, que se desenrola e estabiliza as bolhas formadas. Há três estágios a reconhecer visualmente:</p>\n<ul>\n<li><strong>Picos moles</strong> — a espuma forma picos que caem de imediato quando se levanta o batedor; ainda brilhante e fluida.</li>\n<li><strong>Picos firmes</strong> — os picos mantêm-se eretos, a espuma é densa e brilhante; ponto ideal para a maioria dos merengues e massas aeradas.</li>\n<li><strong>Ponto passado</strong> — a espuma perde o brilho, fica granulada e começa a separar líquido; já não é recuperável.</li>\n</ul>\n<p><strong>Técnica de referência:</strong> para 4 claras (cerca de 120g), junta uma pitada de sal ou algumas gotas de sumo de limão para estabilizar a espuma, e bate em velocidade média-alta até picos firmes e brilhantes; se fores adicionar açúcar (para merengue), faz isso aos poucos, uma vez atingidos picos moles.</p>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1609590981063-d495e2914ce4?w=900&q=80\" alt=\"Claras de ovo batidas em picos firmes brilhantes\"><div class=\"ic\">Claras batidas até ao ponto de picos firmes, brilhantes e estáveis</div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-thermometer-half\"></i> Pontos de Açúcar: A Tabela Que Todo Confeiteiro Deve Saber</h2>\n<p>O açúcar cozido em calda muda de comportamento físico consoante a temperatura, porque a proporção de água vai diminuindo. Um termómetro de confeitaria é a ferramenta mais fiável para identificar cada ponto — a observação visual só se torna precisa com muitos anos de prática.</p>\n<div class=\"tw\"><table class=\"dt\">\n<tr><th>Ponto de açúcar</th><th>Temperatura aproximada</th><th>Uso típico</th></tr>\n<tr><td>Fio (thread)</td><td>110°C</td><td>Caldas para embeber bolos</td></tr>\n<tr><td>Bala mole (soft ball)</td><td>115°C</td><td>Merengue italiano, buttercream italiano</td></tr>\n<tr><td>Bala firme (firm ball)</td><td>119°C</td><td>Caramelos moles, fudge</td></tr>\n<tr><td>Bala dura (hard ball)</td><td>125°C</td><td>Nougat, marshmallow firme</td></tr>\n<tr><td>Quebradiço mole (soft crack)</td><td>138°C</td><td>Caramelos duros macios, puxa-puxa</td></tr>\n<tr><td>Quebradiço duro (hard crack)</td><td>150°C</td><td>Rebuçados, decorações crocantes de açúcar</td></tr>\n<tr><td>Caramelo</td><td>165°C a 178°C</td><td>Cobertura de caramelo, sabor e cor de caramelização</td></tr>\n</table></div>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1702742322469-36315505728f?w=900&q=80\" alt=\"Caramelo dourado a ferver numa panela com termómetro\"><div class=\"ic\">Controlo de temperatura durante a cozedura de um caramelo</div></div>\n</div>\n<div class=\"tl\">\n<div class=\"tli\"><div class=\"tld\">1</div><div class=\"tlc\"><h4>Aquece o açúcar com água</h4><p>Usa cerca de 200g de açúcar para 60ml de água, em lume médio, sem mexer depois de o açúcar se dissolver, para evitar cristalização.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">2</div><div class=\"tlc\"><h4>Acompanha com termómetro</h4><p>Introduz o termómetro sem tocar no fundo da panela e observa a cor a par da temperatura.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">3</div><div class=\"tlc\"><h4>Retira no ponto certo</h4><p>Para um caramelo médio de cor âmbar, retira do lume por volta dos 170°C — a temperatura continua a subir por inércia alguns segundos após retirar do calor.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">4</div><div class=\"tlc\"><h4>Interrompe a cozedura</h4><p>Mergulha rapidamente o fundo da panela em água fria durante alguns segundos para travar a subida de temperatura.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">5</div><div class=\"tlc\"><h4>Usa de imediato</h4><p>O caramelo solidifica rapidamente ao arrefecer, por isso verte ou molda logo a seguir a interromper a cozedura.</p></div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-triangle-exclamation\"></i> Erro Comum: Cremagem com Manteiga Fria ou Derretida</h2>\n<p>Quando a manteiga está demasiado fria e dura, o batedor não consegue incorporar ar de forma eficiente, e a mistura fica pesada e pouco volumosa. Quando está demasiado quente ou parcialmente derretida, a estrutura de gordura sólida que retém as bolhas de ar colapsa, e a cremagem simplesmente não acontece — a massa final fica densa, com miolo apertado, mesmo que o resto da receita esteja tecnicamente correto.</p>\n<div class=\"hi\"><strong>Como evitar:</strong> retira a manteiga da refrigeração com 30 a 60 minutos de antecedência (dependendo da temperatura ambiente) até ceder à pressão de um dedo sem derreter, e nunca aceleres o processo no micro-ondas sem vigilância constante.</div>\n</div>\n<div class=\"quiz\"><h3><i class=\"fas fa-circle-question\"></i> Verificação de Aprendizagem</h3>\n<div class=\"qq\">Segundo a tabela de pontos de açúcar desta aula, qual é a temperatura aproximada do ponto de bala mole (soft ball), usado sobretudo na preparação de merengue italiano e buttercream italiano?</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">a) 110°C, o ponto de fio</div>\n<div class=\"qo\" onclick=\"cq(this,true)\">b) 115°C, o ponto de bala mole</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">c) 150°C, o ponto de quebradiço duro</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">d) 178°C, próprio de um caramelo escuro</div>\n</div>"},{"t":"Bolos Simples: Massas Base e Recheios","html":"\n<div class=\"cb\"><h2><i class=\"fas fa-cake-candles\"></i> A Base de Todo o Cardápio de Confeitaria</h2>\n<p>Antes de avançar para trufas, bombons ou decorações elaboradas, um confeiteiro profissional precisa de dominar por completo o bolo simples: a massa base, o recheio e a montagem. É frequentemente este tipo de produto — vendido em fatias, em bolos inteiros por encomenda ou como base de sobremesas mais complexas — que sustenta o volume de vendas diário de uma pastelaria, precisamente por ser rápido de produzir e de custo controlado quando a técnica está bem dominada.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-utensils\"></i> Massa Base de Bolo Amanteigado</h2>\n<p><strong>Ingredientes:</strong> 250g de manteiga à temperatura ambiente, 250g de açúcar refinado, 4 ovos (cerca de 200g), 250g de farinha de trigo, 10g de fermento em pó, 60ml de leite, 5ml de essência de baunilha.</p>\n<p><strong>Modo de preparo:</strong> cremar a manteiga com o açúcar durante 4 minutos até clarear e ganhar volume; adicionar os ovos um a um, batendo bem entre cada adição para manter a emulsão; peneirar a farinha com o fermento em pó; incorporar a farinha alternadamente com o leite, começando e terminando com a farinha, misturando apenas até unir; verter numa forma untada e enfarinhada; assar a 180°C durante 35 a 40 minutos, confirmando o ponto com um palito que deve sair limpo do centro.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-layer-group\"></i> Recheios Simples para Bolos</h2>\n<div class=\"tw\"><table class=\"dt\">\n<tr><th>Tipo de recheio</th><th>Textura</th><th>Quando usar</th></tr>\n<tr><td>Calda de embeber (ponto de fio, 110°C, diluída com água)</td><td>Líquida, fina</td><td>Hidratar camadas de bolo antes de rechear</td></tr>\n<tr><td>Compota de fruta cozida</td><td>Espessa, com pedaços</td><td>Contraste ácido com recheios doces</td></tr>\n<tr><td>Ganache simples (proporção 1:1 chocolate:natas)</td><td>Cremosa, firme depois de fria</td><td>Recheio rico, combina com quase todos os bolos</td></tr>\n</table></div>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1643944471768-2d2eac3afb6d?w=900&q=80\" alt=\"Camadas de bolo com recheio cremoso entre elas\"><div class=\"ic\">Camadas de bolo intercaladas com recheio cremoso e calda de embeber</div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-layer-group\"></i> Montagem Básica de um Bolo em Camadas</h2>\n<p>A montagem bem executada é o que separa um bolo caseiro de um bolo com padrão profissional: camadas niveladas, quantidade uniforme de recheio e humedecimento equilibrado, sem excesso que amoleça demasiado a estrutura.</p>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1621303837174-89787a7d4729?w=900&q=80\" alt=\"Bolo em camadas sendo montado com espátula\"><div class=\"ic\">Alisamento das camadas durante a montagem do bolo</div></div>\n</div>\n<div class=\"tl\">\n<div class=\"tli\"><div class=\"tld\">1</div><div class=\"tlc\"><h4>Nivela o topo do bolo</h4><p>Corta a \"cúpula\" superior com uma faca serrilhada longa para obter uma superfície plana.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">2</div><div class=\"tlc\"><h4>Corta em camadas iguais</h4><p>Divide o bolo em 2 a 3 camadas de espessura semelhante, usando um fio de corte ou faca serrilhada guiada.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">3</div><div class=\"tlc\"><h4>Embebe cada camada</h4><p>Aplica a calda com um pincel de forma uniforme, sem encharcar ao ponto de a camada perder estrutura.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">4</div><div class=\"tlc\"><h4>Aplica o recheio</h4><p>Distribui uma quantidade consistente, por exemplo 150g a 200g por camada, até à borda, com uma espátula.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">5</div><div class=\"tlc\"><h4>Empilha e alinha</h4><p>Verifica o alinhamento vertical das camadas a cada etapa, corrigindo antes de a pilha ficar demasiado alta para ajustar.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">6</div><div class=\"tlc\"><h4>Refrigera antes de cobrir</h4><p>Deixa o bolo montado 30 minutos na geladeira para firmar antes de aplicar qualquer cobertura externa.</p></div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-triangle-exclamation\"></i> Erro Comum: Adicionar Todos os Ovos de Uma Vez</h2>\n<p>Uma receita bem escrita pede que os ovos sejam incorporados um a um durante a cremagem, precisamente para manter a emulsão entre a gordura e o líquido. Quando todos os ovos são despejados de uma só vez sobre a manteiga batida com açúcar, o líquido em excesso não consegue ser absorvido pela fase gorda de forma gradual: a mistura \"corta\" ou \"talha\", separando-se visivelmente em grumos de gordura e líquido, e perde-se grande parte do ar que tinha sido incorporado durante a cremagem inicial.</p>\n<div class=\"hi\"><strong>Como evitar:</strong> adiciona os ovos um a um, batendo bem entre cada adição até a mistura voltar a ficar homogénea antes de juntar o seguinte; se a massa começar a talhar, adiciona uma colher de sopa da farinha da receita para ajudar a reestabilizar a emulsão.</div>\n</div>\n<div class=\"quiz\"><h3><i class=\"fas fa-circle-question\"></i> Verificação de Aprendizagem</h3>\n<div class=\"qq\">Uma receita de bolo amanteigado pede que os 4 ovos sejam incorporados um a um durante a cremagem. Um confeiteiro despeja todos os ovos de uma só vez na manteiga já batida com açúcar. Qual é a consequência mais provável?</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">a) Nenhuma, o resultado final do bolo é idêntico ao previsto na receita</div>\n<div class=\"qo\" onclick=\"cq(this,true)\">b) A massa corta (talha): a manteiga separa-se da fase líquida e perde-se parte do ar que tinha sido incorporado</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">c) O bolo fica com mais fermento em pó do que o necessário</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">d) A cor final do bolo fica mais escura</div>\n</div>"},{"t":"Bolos Amanteigados vs. Bolos Aerados: Quando Usar Cada Um","html":"\n<div class=\"cb\"><h2><i class=\"fas fa-scale-balanced\"></i> Duas Famílias, Duas Finalidades</h2>\n<p>Praticamente todos os bolos do mundo pertencem a uma de duas grandes famílias técnicas: os <strong>bolos amanteigados</strong>, construídos a partir da cremagem de gordura sólida com açúcar, e os <strong>bolos aerados</strong> (também chamados de massas batidas ou tipo pão de ló), construídos a partir da incorporação de ar em ovos batidos, com pouca ou nenhuma gordura sólida. Um confeiteiro profissional não escolhe entre eles por preferência pessoal, mas em função do que a encomenda exige: peso da decoração, formato final, tempo de conservação e até o orçamento de ingredientes disponível.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-cube\"></i> Bolos Amanteigados: Densidade com Propósito</h2>\n<p>Construídos pelo método de cremagem já estudado na aula anterior, os bolos amanteigados têm uma miga mais densa, rica em sabor por causa da gordura, e uma estrutura física capaz de suportar recheios pesados e coberturas espessas como buttercream ou pasta de açúcar. É a escolha natural para bolos de aniversário, bolos de casamento em andares e qualquer peça que precise de \"aguentar\" peso estrutural sem desabar.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-feather\"></i> Bolos Aerados: Leveza pela Aeração de Ovos</h2>\n<p>Nos bolos aerados, o volume vem quase exclusivamente do ar batido nos ovos (inteiros ou separados), muitas vezes sem qualquer fermento químico. A massa é delicada, leve e ligeiramente elástica, ideal para bolos enrolados (do tipo rocambole), bases de sobremesas em camadas finas e trifles.</p>\n<p><strong>Receita base de pão de ló:</strong> 4 ovos (cerca de 200g), 120g de açúcar refinado, 120g de farinha de trigo peneirada. Bate os ovos com o açúcar em banho-maria morno (cerca de 40°C, apenas para acelerar a formação de espuma) até triplicar de volume e formar uma fita espessa ao levantar o batedor; retira do calor e continua a bater até arrefecer; incorpora a farinha peneirada em três adições, dobrando delicadamente de baixo para cima para não perder o ar; verte em forma untada e assa a 180°C durante 20 a 25 minutos.</p>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1691052252990-4cd1fdda73dc?w=900&q=80\" alt=\"Massa de pão de ló leve e aerada sendo dobrada com uma espátula\"><div class=\"ic\">Incorporação delicada da farinha numa massa aerada, preservando o ar batido</div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-table\"></i> Comparação Direta</h2>\n<div class=\"tw\"><table class=\"dt\">\n<tr><th>Critério</th><th>Bolo Amanteigado</th><th>Bolo Aerado</th></tr>\n<tr><td>Fonte principal de volume</td><td>Cremagem de gordura + fermento químico</td><td>Ar batido em ovos</td></tr>\n<tr><td>Densidade</td><td>Média a alta</td><td>Baixa (muito leve)</td></tr>\n<tr><td>Capacidade de suportar peso</td><td>Alta</td><td>Baixa</td></tr>\n<tr><td>Conservação fora de refrigeração</td><td>Mais longa, pela gordura</td><td>Mais curta, seca com facilidade</td></tr>\n<tr><td>Melhor uso</td><td>Bolos decorados, andares, encomendas de peso</td><td>Rocamboles, camadas finas, sobremesas montadas</td></tr>\n</table></div>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1586985289688-ca3cf47d3e6e?w=900&q=80\" alt=\"Bolo amanteigado decorado em camadas com cobertura espessa\"><div class=\"ic\">Um bolo amanteigado denso o suficiente para suportar cobertura pesada</div></div>\n</div>\n<div class=\"tl\">\n<div class=\"tli\"><div class=\"tld\">1</div><div class=\"tlc\"><h4>Avalia o peso da decoração final</h4><p>Coberturas pesadas como pasta de açúcar ou elementos estruturais pedem um bolo amanteigado.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">2</div><div class=\"tlc\"><h4>Verifica se o bolo será enrolado</h4><p>Formatos enrolados exigem a flexibilidade típica de uma massa aerada fina.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">3</div><div class=\"tlc\"><h4>Considera o tempo de conservação necessário</h4><p>Encomendas que viajam ou ficam expostas várias horas beneficiam da maior durabilidade do bolo amanteigado.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">4</div><div class=\"tlc\"><h4>Confirma o orçamento de ingredientes</h4><p>Bolos aerados usam menos gordura, o que pode ser relevante para produtos de menor custo.</p></div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-triangle-exclamation\"></i> Erro Comum: Usar Bolo Aerado sob Cobertura Pesada</h2>\n<p>Um bolo aerado, precisamente por depender do ar batido nos ovos para se manter de pé, não tem estrutura interna suficiente para suportar o peso de uma cobertura espessa de pasta de açúcar ou de várias camadas de recheio denso. O resultado mais comum é o desabamento parcial da estrutura, rachaduras visíveis na cobertura ou um afundamento no centro do bolo horas depois de montado, já em exposição.</p>\n<div class=\"hi\"><strong>Como evitar:</strong> reserva os bolos aerados para formatos leves (rocamboles, camadas finas em sobremesas montadas em taça) e escolhe sempre um bolo amanteigado quando a encomenda envolver coberturas pesadas ou estruturas de vários andares.</div>\n</div>\n<div class=\"quiz\"><h3><i class=\"fas fa-circle-question\"></i> Verificação de Aprendizagem</h3>\n<div class=\"qq\">Um cliente encomenda um bolo de três andares, coberto com pasta de açúcar pesada e decorado com elementos estruturais adicionais. Que tipo de massa base é tecnicamente mais indicado?</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">a) Bolo aerado tipo pão de ló, por ser mais leve</div>\n<div class=\"qo\" onclick=\"cq(this,true)\">b) Bolo amanteigado, pela maior densidade e capacidade de suportar peso</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">c) Qualquer um dos dois, o tipo de massa não influencia a estrutura final</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">d) Massa de biscoito, apenas porque tende a ser mais barata</div>\n</div>"},{"t":"Trufas, Bombons e Doces para Vender","html":"\n<div class=\"cb\"><h2><i class=\"fas fa-gem\"></i> Pequenos Doces, Grande Margem</h2>\n<p>Trufas e bombons ocupam um lugar especial no negócio de confeitaria: exigem pouca área de produção, ingredientes relativamente concentrados e um tempo de preparo por unidade baixo quando produzidos em lote, o que costuma resultar numa margem de lucro atrativa quando vendidos avulsos ou em caixas para presente. Dominar a temperagem de chocolate é a competência técnica central desta aula, e é também uma das mais valorizadas em qualquer cozinha profissional de confeitaria.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-circle\"></i> Trufas de Chocolate: Receita Base</h2>\n<p><strong>Ingredientes:</strong> 200g de chocolate meio amargo picado, 100ml de natas para bater (35% de gordura), cacau em pó, coco ralado ou chocolate temperado para finalizar.</p>\n<p><strong>Modo de preparo:</strong> aquecer as natas até cerca de 80°C (perto da fervura, sem ferver); verter sobre o chocolate picado e deixar repousar 2 minutos sem mexer, para que o calor derreta o chocolate uniformemente; misturar delicadamente do centro para fora até obter uma ganache lisa e brilhante; deixar arrefecer à temperatura ambiente e depois refrigerar cerca de 2 horas, até a ganache ficar moldável mas firme; formar bolas de aproximadamente 15g com as mãos ou uma colher medidora; finalizar passando cada bola em cacau em pó, coco ralado ou mergulhando em chocolate temperado.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-thermometer-half\"></i> Temperagem de Chocolate: A Curva de Temperatura</h2>\n<p>Temperar chocolate significa controlar a cristalização da manteiga de cacau, para que o chocolate final fique brilhante, quebre com um estalido limpo e não derreta com facilidade ao toque. Cada tipo de chocolate tem uma curva de temperatura própria:</p>\n<div class=\"tw\"><table class=\"dt\">\n<tr><th>Tipo de chocolate</th><th>Derreter a</th><th>Arrefecer a</th><th>Temperatura de trabalho</th></tr>\n<tr><td>Meio amargo</td><td>45-50°C</td><td>27-28°C</td><td>31-32°C</td></tr>\n<tr><td>Ao leite</td><td>40-45°C</td><td>26-27°C</td><td>29-30°C</td></tr>\n<tr><td>Branco</td><td>40-45°C</td><td>25-26°C</td><td>28-29°C</td></tr>\n</table></div>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1567941723610-db0bcb4cca67?w=900&q=80\" alt=\"Chocolate meio amargo temperado brilhante sendo trabalhado numa bancada de mármore\"><div class=\"ic\">Chocolate temperado, brilhante e maleável, pronto para moldar bombons</div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-boxes-stacked\"></i> Bombons Moldados e Bombons de Garfo</h2>\n<p>Os <strong>bombons moldados</strong> usam formas de policarbonato: uma fina camada de chocolate temperado reveste a forma, recebe um recheio (ganache, praliné, caramelo) já frio, e é selada com mais uma camada de chocolate. Os <strong>bombons de garfo (dipped)</strong> partem de um centro já formado — como as trufas desta aula — que é mergulhado em chocolate temperado com o auxílio de um garfo de confeitaria, escorrendo o excesso antes de solidificar sobre papel vegetal. Ambos têm validade curta, tipicamente cerca de duas semanas guardados em local fresco e seco, sem qualquer conservante artificial, precisamente por serem produtos frescos e artesanais.</p>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1581016327131-6cf17ab1f2c1?w=900&q=80\" alt=\"Bombons de chocolate dispostos numa caixa de apresentação\"><div class=\"ic\">Bombons finalizados, prontos para embalagem de venda</div></div>\n</div>\n<div class=\"tl\">\n<div class=\"tli\"><div class=\"tld\">1</div><div class=\"tlc\"><h4>Derrete dois terços do chocolate</h4><p>Derrete cerca de 130g de chocolate meio amargo em banho-maria até 46°C, evitando qualquer contacto com água ou vapor.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">2</div><div class=\"tlc\"><h4>Adiciona a semente</h4><p>Junta o terço restante, já picado, mexendo continuamente até derreter e a temperatura descer.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">3</div><div class=\"tlc\"><h4>Atinge a temperatura de trabalho</h4><p>Continua a mexer até estabilizar entre 31°C e 32°C para chocolate meio amargo.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">4</div><div class=\"tlc\"><h4>Testa a temperagem</h4><p>Mergulha a ponta de uma colher ou de uma faca no chocolate: se secar fosco e quebradiço em poucos minutos à temperatura ambiente, está bem temperado.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">5</div><div class=\"tlc\"><h4>Mantém a temperatura durante a moldagem</h4><p>Trabalha em ambiente fresco e, se necessário, reaquece ligeiramente em banho-maria para não sair da faixa de trabalho.</p></div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-triangle-exclamation\"></i> Erro Comum: Chocolate que \"Quebra\" (Fat Bloom)</h2>\n<p>Quando o chocolate temperado incorretamente, ou sujeito a choques de temperatura depois de pronto, desenvolve uma camada esbranquiçada e perde o brilho e o estalido característicos — um fenómeno chamado <strong>fat bloom</strong>, causado pela migração e recristalização desorganizada da manteiga de cacau. É um defeito visual e de textura, não um problema de segurança alimentar, mas compromete totalmente a apresentação profissional do produto.</p>\n<div class=\"hi\"><strong>Como evitar:</strong> controla sempre a curva de temperatura com um termómetro fiável, evita variações bruscas de temperatura depois de moldado (por exemplo, tirar da geladeira direto para um ambiente quente e húmido), e nunca deixes o chocolate em fusão entrar em contacto com qualquer vestígio de água ou vapor.</div>\n</div>\n<div class=\"quiz\"><h3><i class=\"fas fa-circle-question\"></i> Verificação de Aprendizagem</h3>\n<div class=\"qq\">Um confeiteiro está a temperar chocolate meio amargo pelo método de inoculação (seeding). Depois de derreter a maior parte a 46°C e juntar a semente picada, a que temperatura de trabalho deve estabilizar a massa antes de moldar os bombons?</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">a) 40°C</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">b) 35°C</div>\n<div class=\"qo\" onclick=\"cq(this,true)\">c) 31°C a 32°C</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">d) 20°C</div>\n</div>"},{"t":"Biscoitos e Bolachas: Técnicas e Conservação","html":"\n<div class=\"cb\"><h2><i class=\"fas fa-cookie\"></i> Volume, Variedade e Longa Vida de Prateleira</h2>\n<p>Os biscoitos ocupam um lugar único no cardápio de uma confeitaria profissional: são fáceis de produzir em grandes lotes, permitem enorme variedade de sabores e formatos a partir de poucas massas base, e — ao contrário de bolos e doces frescos — toleram bem o armazenamento e o transporte, o que os torna ideais para venda em caixas variadas, retalho e envio a longa distância.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-utensils\"></i> Massa Base Tipo Shortbread (Amanteigada)</h2>\n<p><strong>Ingredientes:</strong> 200g de manteiga fria em cubos, 100g de açúcar de confeiteiro peneirado, 300g de farinha de trigo, uma pitada de sal.</p>\n<p><strong>Modo de preparo:</strong> misturar a manteiga fria com o açúcar e a farinha usando as pontas dos dedos ou um batedor em velocidade baixa, apenas até formar uma massa homogénea — sem bater em excesso, para não incorporar ar demais, o que faria a massa espalhar-se no forno; envolver em filme e deixar descansar na refrigeração durante 30 minutos; estender, cortar nas formas desejadas e assar a 160°C durante 12 a 15 minutos, até as bordas ganharem uma leve cor dourada.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-cookie-bite\"></i> Massa com Fermento e a Diferença entre Crocante e Macio</h2>\n<p>Biscoitos do tipo \"drop cookie\", que levam fermento químico e são colocados em porções diretamente na assadeira, têm uma textura que depende muito do tipo de açúcar usado: o <strong>açúcar mascavado</strong>, por reter mais humidade, produz biscoitos mais macios e maleáveis; o <strong>açúcar refinado</strong>, com menos capacidade higroscópica, produz biscoitos mais finos e crocantes. A proporção entre gordura sólida (manteiga) e gordura líquida também influencia: mais gordura líquida tende a espalhar mais a massa no forno.</p>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1670819916757-e8d5935a6c65?w=900&q=80\" alt=\"Biscoitos recém-assados numa grade de arrefecimento\"><div class=\"ic\">Biscoitos a arrefecer sobre grade antes de embalar</div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-boxes-stacked\"></i> Conservação por Tipo de Biscoito</h2>\n<div class=\"tw\"><table class=\"dt\">\n<tr><th>Tipo de biscoito</th><th>Método de conservação</th><th>Validade aproximada</th></tr>\n<tr><td>Shortbread / amanteigado seco</td><td>Recipiente hermético, temperatura ambiente</td><td>2 a 3 semanas</td></tr>\n<tr><td>Drop cookie macio</td><td>Recipiente hermético, temperatura ambiente</td><td>5 a 7 dias</td></tr>\n<tr><td>Com recheio de creme fresco</td><td>Refrigerado, recipiente fechado</td><td>2 a 3 dias</td></tr>\n</table></div>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1540337706094-da10342c93d8?w=900&q=80\" alt=\"Biscoitos organizados numa caixa de apresentação para venda\"><div class=\"ic\">Biscoitos embalados por tipo, prontos para venda ou envio</div></div>\n</div>\n<div class=\"tl\">\n<div class=\"tli\"><div class=\"tld\">1</div><div class=\"tlc\"><h4>Pesa todos os ingredientes com precisão</h4><p>Pequenas variações de peso têm impacto proporcionalmente maior em massas de biscoito do que em massas de bolo.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">2</div><div class=\"tlc\"><h4>Mistura sem excesso</h4><p>Une os ingredientes apenas até à consistência necessária, evitando desenvolver glúten ou incorporar ar em excesso.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">3</div><div class=\"tlc\"><h4>Padroniza o tamanho das porções</h4><p>Usa uma boleadora ou porcionador para garantir cozedura uniforme entre unidades.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">4</div><div class=\"tlc\"><h4>Espaça bem na assadeira</h4><p>Deixa espaço suficiente entre porções para a expansão natural da massa durante a cozedura.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">5</div><div class=\"tlc\"><h4>Controla o tempo, não só a cor</h4><p>Cronometra a cozedura e confirma visualmente, porque cores muito claras nem sempre indicam que o biscoito está pronto por dentro.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">6</div><div class=\"tlc\"><h4>Arrefece antes de embalar</h4><p>Deixa arrefecer por completo sobre uma grade antes de guardar em recipiente fechado.</p></div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-triangle-exclamation\"></i> Erro Comum: Biscoitos que Espalham Demais no Forno</h2>\n<p>Um lote de biscoitos amanteigados que devia manter a forma sai do forno fino, irregular e quebradiço, tendo perdido a forma original do corte. Esta situação costuma acontecer quando a manteiga estava demasiado mole no momento de ir ao forno, ou quando a massa não foi refrigerada antes da cozedura: sem o tempo de descanso, a gordura derrete cedo demais assim que entra no calor do forno, antes de a estrutura de farinha e amido conseguir firmar.</p>\n<div class=\"hi\"><strong>Como evitar:</strong> respeita sempre o tempo de descanso na refrigeração antes de assar, e garante que a manteiga usada está fria o suficiente para manter a forma do corte até ao momento de entrar no forno.</div>\n</div>\n<div class=\"quiz\"><h3><i class=\"fas fa-circle-question\"></i> Verificação de Aprendizagem</h3>\n<div class=\"qq\">Um lote de biscoitos amanteigados espalhou demais no forno, ficando fino e quebradiço em vez de manter a forma do corte. A causa mais provável está relacionada com qual etapa do processo?</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">a) A massa descansou 30 minutos na geladeira antes de ser cortada e assada</div>\n<div class=\"qo\" onclick=\"cq(this,true)\">b) A manteiga estava demasiado mole e a massa não foi refrigerada antes de assar, deixando a gordura derreter cedo demais no forno</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">c) O forno foi pré-aquecido a 160°C conforme indicado na receita</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">d) Os biscoitos foram espaçados cerca de 5 cm entre si na assadeira</div>\n</div>"},{"t":"Cremes e Recheios: Confeiteiro, Chantilly e Ganache","html":"\n<div class=\"cb\"><h2><i class=\"fas fa-blender\"></i> Os Três Cremes que Sustentam Toda a Confeitaria</h2>\n<p>Se retirares o creme de confeiteiro, o chantilly e a ganache de qualquer pastelaria do mundo, praticamente todo o cardápio de sobremesas colapsa: tartes, éclairs, bolos recheados, mousses e coberturas dependem, direta ou indiretamente, de pelo menos um destes três cremes base. Dominar as suas proporções e os pontos críticos de cada técnica é o que permite a um confeiteiro improvisar sobremesas novas com confiança, em vez de depender sempre de uma receita escrita.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-egg\"></i> Creme de Confeiteiro (Pastry Cream)</h2>\n<p><strong>Ingredientes:</strong> 500ml de leite, 100g de açúcar refinado (dividido), 4 gemas (cerca de 80g), 40g de amido de milho, 5ml de essência de baunilha.</p>\n<p><strong>Modo de preparo:</strong> aquecer o leite com metade do açúcar até quase ferver; à parte, bater as gemas com o açúcar restante e o amido de milho até obter um creme claro; temperar as gemas despejando o leite quente aos poucos, sem parar de mexer, para igualar a temperatura gradualmente; voltar tudo ao lume em fogo médio-baixo, mexendo continuamente, até engrossar e ferver suavemente durante 1 a 2 minutos — este tempo de fervura é o que cozinha por completo o amido, evitando sabor a farinha crua; passar por peneira fina, cobrir com filme em contacto direto com a superfície (para não formar película) e arrefecer rapidamente.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-icicles\"></i> Chantilly: Natas Batidas</h2>\n<p>O chantilly exige natas com pelo menos 35% de teor de gordura, bem geladas, batidas com açúcar (cerca de 10% do peso das natas) até atingir picos moles ou firmes, consoante o uso. É fundamental parar de bater assim que se atinge o ponto desejado: continuar a bater além do ponto certo transforma o chantilly em manteiga batida, separando a gordura do soro.</p>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1591538001662-0d5a25234305?w=900&q=80\" alt=\"Natas batidas em picos firmes e brilhantes prontas para uso\"><div class=\"ic\">Chantilly no ponto certo, firme mas ainda brilhante e liso</div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-droplet\"></i> Ganache: Proporções por Finalidade</h2>\n<div class=\"tw\"><table class=\"dt\">\n<tr><th>Finalidade</th><th>Proporção chocolate : natas</th><th>Resultado</th></tr>\n<tr><td>Cobertura brilhante para verter sobre bolos</td><td>1:1</td><td>Fluida, lisa, brilhante</td></tr>\n<tr><td>Recheio firme / base de trufas</td><td>2:1</td><td>Firme depois de fria, moldável</td></tr>\n<tr><td>Creme leve tipo chantininho de chocolate</td><td>1:2</td><td>Macia, fácil de bater e aerar</td></tr>\n</table></div>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1670843840225-2ffcaf483c01?w=900&q=80\" alt=\"Ganache de chocolate brilhante sendo vertida sobre um bolo\"><div class=\"ic\">Ganache na proporção 1:1, fluida o suficiente para cobrir um bolo com acabamento espelhado</div></div>\n</div>\n<div class=\"tl\">\n<div class=\"tli\"><div class=\"tld\">1</div><div class=\"tlc\"><h4>Tempera as gemas gradualmente</h4><p>Despeja o leite quente sobre as gemas aos poucos, mexendo sempre, para igualar a temperatura sem coagular a proteína de repente.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">2</div><div class=\"tlc\"><h4>Volta ao lume em fogo médio-baixo</h4><p>Mexe sem parar, raspando o fundo da panela para evitar que o creme agarre e queime.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">3</div><div class=\"tlc\"><h4>Deixa ferver brandamente 1 a 2 minutos</h4><p>Este tempo é necessário para cozinhar completamente o amido de milho e eliminar o sabor a cru.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">4</div><div class=\"tlc\"><h4>Passa por peneira</h4><p>Remove qualquer grumo residual, garantindo uma textura completamente lisa.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">5</div><div class=\"tlc\"><h4>Arrefece rapidamente, coberto</h4><p>Cobre com filme em contacto direto com a superfície do creme e refrigera o quanto antes, para reduzir o risco de proliferação bacteriana.</p></div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-triangle-exclamation\"></i> Erro Comum: Creme de Confeiteiro Talhado (com Grumos)</h2>\n<p>Se o leite fervente for despejado de uma só vez, sem controlo, sobre as gemas batidas, a proteína do ovo coagula de forma súbita e desigual devido ao choque térmico, formando pequenos grumos cozidos que já não se conseguem dissolver de volta numa textura lisa — mesmo passando por peneira, o creme perde parte da sua cremosidade original.</p>\n<div class=\"hi\"><strong>Como evitar:</strong> tempera sempre as gemas de forma gradual, despejando o leite quente em fio fino no início, e nunca deixes de mexer durante todo o processo de aquecimento do creme.</div>\n</div>\n<div class=\"quiz\"><h3><i class=\"fas fa-circle-question\"></i> Verificação de Aprendizagem</h3>\n<div class=\"qq\">Durante o preparo do creme de confeiteiro, o confeiteiro despeja o leite fervente diretamente sobre as gemas batidas, de uma só vez e sem mexer, e o creme fica cheio de grumos cozidos. Qual foi o erro técnico?</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">a) Usar amido de milho em vez de farinha de trigo</div>\n<div class=\"qo\" onclick=\"cq(this,true)\">b) Não temperar as gemas de forma gradual antes de as expor a calor elevado, causando coagulação súbita da proteína do ovo</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">c) Usar gemas em vez de ovos inteiros na receita</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">d) Coar o creme depois de já estar pronto</div>\n</div>"},{"t":"Doces em Miniatura para Eventos","html":"\n<div class=\"cb\"><h2><i class=\"fas fa-champagne-glasses\"></i> A Escala do Evento Muda a Técnica</h2>\n<p>Doces em miniatura — mini tartes, trufas, macarons, verrines e petit-fours — são hoje um pilar do mercado de eventos: casamentos, receções corporativas e festas privadas em qualquer parte do mundo pedem cada vez mais mesas de doces variados em porções pequenas, fáceis de comer em pé e de sabor concentrado. Produzir para eventos exige, além das técnicas já vistas, competências de planeamento, logística e controlo de quantidade que esta aula introduz.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-ruler-combined\"></i> Princípios da Miniaturização</h2>\n<p>Reduzir uma receita à escala miniatura não é apenas \"fazer mais pequeno\": os tempos de cozedura encurtam consideravelmente devido à menor massa térmica, o sabor precisa de ser mais concentrado porque cada porção é consumida em uma ou duas dentadas, e a apresentação ganha peso relativo — numa porção pequena, cada detalhe visual é proporcionalmente mais visível do que numa fatia grande.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-utensils\"></i> Receita Exemplo: Mini Tartaletes</h2>\n<p><strong>Massa quebrada (pâte sucrée):</strong> 200g de farinha de trigo, 120g de manteiga gelada em cubos, 80g de açúcar de confeiteiro, 1 ovo, uma pitada de sal.</p>\n<p><strong>Modo de preparo:</strong> misturar a farinha com a manteiga gelada pelo método de sablage (esfregando entre os dedos até parecer areia grossa); juntar o açúcar e o sal; incorporar o ovo até formar uma massa homogénea, sem amassar em excesso; refrigerar 30 minutos; forrar formas mini (cerca de 5cm de diâmetro); assar em branco (com peso sobre papel vegetal, para não deformar) a 170°C durante 12 a 15 minutos; rechear já frias com creme de confeiteiro e finalizar com fruta fresca.</p>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1582461833047-2aeb4f8af173?w=900&q=80\" alt=\"Mini tartaletes com fruta fresca dispostas numa travessa\"><div class=\"ic\">Mini tartaletes prontas para uma mesa de doces de evento</div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-clock\"></i> Planeamento de Produção por Antecedência</h2>\n<div class=\"tw\"><table class=\"dt\">\n<tr><th>Tipo de doce</th><th>Antecedência possível</th><th>Cuidado principal</th></tr>\n<tr><td>Trufas / bombons</td><td>Até 1 semana antes</td><td>Armazenar em local fresco, longe de humidade</td></tr>\n<tr><td>Bases de tartaletes (sem recheio)</td><td>2 a 3 dias antes</td><td>Guardar em recipiente hermético</td></tr>\n<tr><td>Recheio de creme fresco / fruta</td><td>No dia do evento</td><td>Montar o mais próximo possível do horário de serviço</td></tr>\n</table></div>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1574936423169-82494c75f01f?w=900&q=80\" alt=\"Mesa de doces variados em miniatura organizada para um evento\"><div class=\"ic\">Mesa de doces com variedade de texturas e formatos em porções pequenas</div></div>\n</div>\n<div class=\"tl\">\n<div class=\"tli\"><div class=\"tld\">1</div><div class=\"tlc\"><h4>Calcula o número de unidades</h4><p>Uma regra prática comum em eventos de cerca de 2 horas é planear entre 3 e 5 doces por convidado.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">2</div><div class=\"tlc\"><h4>Escolhe um mix equilibrado</h4><p>Combina sabores e texturas complementares: algo cítrico, algo intenso em chocolate, algo crocante e algo cremoso.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">3</div><div class=\"tlc\"><h4>Planeia o cronograma de produção</h4><p>Distribui as tarefas ao longo dos dias anteriores conforme o prazo de conservação de cada item.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">4</div><div class=\"tlc\"><h4>Embala e transporta com cuidado</h4><p>Usa caixas com divisórias para evitar choques entre peças e mantém a cadeia de frio sempre que necessário.</p></div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-triangle-exclamation\"></i> Erro Comum: Montar Cedo Demais Componentes Frescos</h2>\n<p>Montar sobremesas com cremes frescos, chantilly ou fruta muito antes do horário do evento, sem controlo rigoroso de refrigeração, leva à perda de textura (chantilly a desfazer, bases de massa a amolecer com a humidade do recheio) e, em casos mais graves, a deterioração do produto por tempo prolongado fora de refrigeração adequada.</p>\n<div class=\"hi\"><strong>Como evitar:</strong> monta os componentes finais — cremes frescos, frutas, elementos crocantes — o mais próximo possível do horário de serviço, e mantém a refrigeração constante durante todo o transporte até ao local do evento.</div>\n</div>\n<div class=\"quiz\"><h3><i class=\"fas fa-circle-question\"></i> Verificação de Aprendizagem</h3>\n<div class=\"qq\">Um evento com 80 convidados vai durar cerca de 2 horas e o cliente pede uma mesa de doces em miniatura. Seguindo a regra prática de pelo menos 3 doces por pessoa apresentada nesta aula, qual o número mínimo aproximado de unidades a produzir?</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">a) 80 unidades</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">b) 160 unidades</div>\n<div class=\"qo\" onclick=\"cq(this,true)\">c) 240 unidades, considerando 3 doces por pessoa como mínimo</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">d) 500 unidades, sem relação direta com o número de convidados</div>\n</div>"},{"t":"Coberturas e Decoração Básica de Bolos","html":"\n<div class=\"cb\"><h2><i class=\"fas fa-palette\"></i> A Apresentação é Parte da Receita</h2>\n<p>Num ambiente profissional, um bolo tecnicamente perfeito por dentro mas mal acabado por fora perde valor comercial de forma imediata: a primeira impressão, seja numa vitrine, numa fotografia ou à mesa de um evento, é sempre visual. Esta aula ensina as técnicas de cobertura e decoração básica que qualquer confeiteiro precisa de dominar antes de avançar para trabalhos mais artísticos.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-utensils\"></i> Buttercream Simples (Creme de Manteiga Básico)</h2>\n<p><strong>Ingredientes:</strong> 250g de manteiga à temperatura ambiente, 500g de açúcar de confeiteiro peneirado, 30 a 45ml de leite ou natas, 5ml de essência de baunilha.</p>\n<p><strong>Modo de preparo:</strong> bater a manteiga sozinha durante 2 a 3 minutos até ficar clara e cremosa; adicionar o açúcar de confeiteiro aos poucos, alternando com o líquido, batendo em velocidade baixa no início (para não levantar pó) e depois em velocidade média até obter um creme leve, liso e espalhável. Esta é a cobertura mais versátil para trabalhar tanto a camada de proteção interna (crumb coat) quanto o acabamento final.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-droplet\"></i> Ganache para Cobertura Lisa e Espelhada</h2>\n<p>Usando a proporção 1:1 de chocolate para natas (ver aula anterior), a ganache de cobertura deve ser trabalhada a uma temperatura próxima de 30°C a 32°C: fluida o suficiente para se espalhar com facilidade, mas não tão quente que escorra sem controlo pelas laterais. O alisamento final é feito com uma espátula reta e um raspador lateral (bench scraper), girando o bolo sobre uma base giratória para obter uma superfície uniforme.</p>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1603532553059-3facb851d937?w=900&q=80\" alt=\"Espátula alisando cobertura de um bolo sobre uma base giratória\"><div class=\"ic\">Alisamento da cobertura final com espátula sobre base giratória</div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-table\"></i> Técnicas Básicas com Saco de Confeitar</h2>\n<div class=\"tw\"><table class=\"dt\">\n<tr><th>Bico</th><th>Efeito</th><th>Uso comum</th></tr>\n<tr><td>Liso redondo</td><td>Linhas, pontos, escrita</td><td>Contornos e mensagens</td></tr>\n<tr><td>Estrela aberta</td><td>Rosetas texturizadas</td><td>Topo de cupcakes, bordas decorativas</td></tr>\n<tr><td>Estrela fechada</td><td>Conchas (shell border)</td><td>Bordas contínuas na base do bolo</td></tr>\n</table></div>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1655411880489-2f0d18785863?w=900&q=80\" alt=\"Saco de confeitar aplicando rosetas de creme sobre um bolo\"><div class=\"ic\">Aplicação de rosetas com bico de estrela aberta</div></div>\n</div>\n<div class=\"tl\">\n<div class=\"tli\"><div class=\"tld\">1</div><div class=\"tlc\"><h4>Aplica o crumb coat</h4><p>Uma camada fina de cobertura sobre todo o bolo, apenas para prender as migalhas soltas.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">2</div><div class=\"tlc\"><h4>Refrigera até firmar</h4><p>Deixa o crumb coat firmar na geladeira durante 15 a 20 minutos antes de continuar.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">3</div><div class=\"tlc\"><h4>Aplica a camada final generosa</h4><p>Cobre por completo com uma camada mais espessa, já sem risco de arrastar migalhas.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">4</div><div class=\"tlc\"><h4>Alisa girando o bolo</h4><p>Usa a espátula e o raspador lateral enquanto giras o bolo numa base giratória, para um acabamento uniforme.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">5</div><div class=\"tlc\"><h4>Decora com o saco de confeitar</h4><p>Só depois de a base estar fria e firme, para que os detalhes não escorreguem ou se deformem.</p></div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-triangle-exclamation\"></i> Erro Comum: Saltar o Crumb Coat</h2>\n<p>Aplicar a cobertura final diretamente sobre um bolo recém-cortado, sem qualquer camada prévia, arrasta inevitavelmente migalhas soltas para dentro da cobertura — o acabamento final fica com pontos escuros visíveis e uma textura irregular, mesmo que a receita da cobertura esteja tecnicamente correta.</p>\n<div class=\"hi\"><strong>Como evitar:</strong> aplica sempre uma camada fina de crumb coat primeiro, refrigera até firmar, e só depois aplica a camada final de cobertura.</div>\n</div>\n<div class=\"quiz\"><h3><i class=\"fas fa-circle-question\"></i> Verificação de Aprendizagem</h3>\n<div class=\"qq\">Um confeiteiro aplica a camada final de buttercream diretamente sobre um bolo recém-cortado, sem qualquer camada prévia, e nota que a cobertura fica cheia de migalhas escuras misturadas na superfície. Que etapa do processo foi ignorada?</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">a) A temperagem do chocolate</div>\n<div class=\"qo\" onclick=\"cq(this,true)\">b) O crumb coat, a camada fina inicial que prende as migalhas antes da cobertura final</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">c) A pesagem do açúcar de confeiteiro</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">d) O uso da base giratória</div>\n</div>"},{"t":"Sobremesas sem Forno: Rápidas e Rentáveis","html":"\n<div class=\"cb\"><h2><i class=\"fas fa-snowflake\"></i> Produção Sem Depender do Forno</h2>\n<p>Sobremesas sem forno — cheesecakes de geladeira, mousses e verrines em camadas — poupam tempo e capacidade de forno, o que as torna especialmente rentáveis em cozinhas de alto volume onde o forno é um recurso disputado entre várias produções em simultâneo. São também sobremesas populares em cafetarias e serviços de catering, precisamente pela rapidez de preparo e pela apresentação individual elegante.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-utensils\"></i> Cheesecake Sem Forno: Receita Base</h2>\n<p><strong>Base:</strong> 200g de bolacha triturada, 80g de manteiga derretida. Misturar e prensar no fundo de uma forma, refrigerar 20 minutos.</p>\n<p><strong>Recheio:</strong> 400g de queijo creme, 100g de açúcar de confeiteiro, 200ml de natas batidas em chantilly firme, 8g de gelatina em folha (ou o equivalente em pó) hidratada e dissolvida.</p>\n<p><strong>Modo de preparo:</strong> bater o queijo creme com o açúcar até ficar liso; dissolver a gelatina já hidratada num pouco de natas mornas; incorporar essa mistura ao creme de queijo; envolver delicadamente o chantilly batido à parte, com movimentos de baixo para cima, para preservar o ar; verter sobre a base já fria; refrigerar no mínimo 4 horas, ou de um dia para o outro, até firmar por completo.</p>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1621303837383-77d809baf08b?w=900&q=80\" alt=\"Cheesecake sem forno cortado em fatias mostrando as camadas\"><div class=\"ic\">Cheesecake de geladeira, com base crocante e recheio cremoso firme</div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-tint\"></i> Técnica de Uso da Gelatina</h2>\n<p>A gelatina em folha deve ser hidratada em água fria (cerca de cinco vezes o seu peso) durante 5 a 10 minutos, depois escorrida e dissolvida num líquido morno, entre 40°C e 50°C — nunca em líquido a ferver, porque temperaturas acima de cerca de 60°C começam a comprometer a estrutura proteica da gelatina, reduzindo a sua capacidade de gelificar corretamente.</p>\n<div class=\"tw\"><table class=\"dt\">\n<tr><th>Forma</th><th>Equivalência aproximada</th><th>Hidratação</th></tr>\n<tr><td>Gelatina em folha</td><td>1 folha ≈ 2g</td><td>Água fria, 5 a 10 minutos</td></tr>\n<tr><td>Gelatina em pó</td><td>Mesma proporção em peso</td><td>5 vezes o seu peso em água fria, 5 a 10 minutos</td></tr>\n</table></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-wine-glass\"></i> Mousse Simples de Chocolate</h2>\n<p>Uma mousse rápida sem forno parte de uma ganache leve (proporção próxima de 1:2 chocolate:natas), que se dobra delicadamente em claras em neve ou em natas batidas já frias, preservando o máximo de ar possível através de movimentos suaves de baixo para cima, nunca circulares vigorosos que expulsariam o ar já incorporado.</p>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1530006261244-0ae043004358?w=900&q=80\" alt=\"Mousse de chocolate servida em taças individuais\"><div class=\"ic\">Mousse de chocolate leve, servida em porções individuais</div></div>\n</div>\n<div class=\"tl\">\n<div class=\"tli\"><div class=\"tld\">1</div><div class=\"tlc\"><h4>Prepara as bases com antecedência</h4><p>Bases de bolacha duram vários dias refrigeradas, por isso podem ser feitas antes do resto.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">2</div><div class=\"tlc\"><h4>Hidrata e dissolve a gelatina corretamente</h4><p>Segue sempre a sequência de hidratação em frio e dissolução em morno.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">3</div><div class=\"tlc\"><h4>Mistura o recheio sem bater em excesso</h4><p>Envolve os componentes batidos com movimentos suaves para não perder o ar incorporado.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">4</div><div class=\"tlc\"><h4>Refrigera o tempo suficiente</h4><p>Respeita o tempo mínimo indicado antes de desenformar, normalmente várias horas.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">5</div><div class=\"tlc\"><h4>Desenforma com cuidado</h4><p>Aquece ligeiramente as laterais do aro com um pano morno para soltar sem danificar as bordas.</p></div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-triangle-exclamation\"></i> Erro Comum: Dissolver Gelatina em Líquido a Ferver</h2>\n<p>Uma sobremesa à base de gelatina que não firma depois de várias horas de refrigeração é, na maioria das vezes, sinal de que a gelatina foi dissolvida num líquido demasiado quente — a proteína da gelatina, quando exposta a temperaturas próximas ou acima da fervura, perde parte da sua capacidade de formar a rede que dá firmeza à sobremesa, mesmo que a quantidade usada estivesse tecnicamente correta.</p>\n<div class=\"hi\"><strong>Como evitar:</strong> dissolve sempre a gelatina já hidratada num líquido morno, entre 40°C e 50°C, e nunca em líquido a ferver.</div>\n</div>\n<div class=\"quiz\"><h3><i class=\"fas fa-circle-question\"></i> Verificação de Aprendizagem</h3>\n<div class=\"qq\">Uma sobremesa sem forno à base de gelatina não firmou depois de 4 horas na geladeira. O confeiteiro tinha dissolvido a gelatina hidratada diretamente num creme ainda a ferver, a mais de 90°C. Qual é a explicação técnica mais provável?</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">a) A gelatina precisa de passar pelo forno para ativar</div>\n<div class=\"qo\" onclick=\"cq(this,true)\">b) A temperatura excessiva danificou a estrutura proteica da gelatina, reduzindo a sua capacidade de gelificação</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">c) A quantidade de açúcar usada estava incorreta</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">d) O tempo de geladeira foi insuficiente, bastaria esperar mais 24 horas</div>\n</div>"},{"t":"Exercício Integrador: Linha de Doces para Encomenda","html":"\n<div class=\"cb\"><h2><i class=\"fas fa-clipboard-check\"></i> Aplicar Tudo o Que Foi Aprendido</h2>\n<p>Esta última aula do módulo simula uma situação real de trabalho: um cliente encomenda uma linha variada de doces para um evento, e o confeiteiro precisa de planear, produzir e entregar tudo dentro do prazo, aplicando em conjunto as técnicas estudadas nas dez aulas anteriores — massas base, cremes, chocolate temperado, coberturas e miniaturas.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-file-lines\"></i> O Briefing da Encomenda</h2>\n<p>Considera o seguinte pedido, típico de uma encomenda de médio porte para um evento: 100 trufas de chocolate variadas, 60 mini tartaletes de fruta, e um bolo decorado de duas camadas para corte, com entrega marcada para a manhã de um sábado. O confeiteiro dispõe de três dias completos de produção antes da entrega. O primeiro passo profissional não é começar a cozinhar — é planear o cronograma, distribuindo cada componente pelo dia em que faz mais sentido ser produzido, de acordo com o seu prazo de conservação e o tempo de repouso que cada técnica exige.</p>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-list-check\"></i> Planeamento de Tempo por Componente</h2>\n<div class=\"tw\"><table class=\"dt\">\n<tr><th>Item</th><th>Etapas antecipáveis</th><th>Etapas de última hora</th></tr>\n<tr><td>Trufas de chocolate</td><td>Ganache, moldagem, temperagem (até 5-6 dias antes)</td><td>Embalagem final</td></tr>\n<tr><td>Mini tartaletes</td><td>Massa e cozedura das bases (2-3 dias antes)</td><td>Recheio de creme e fruta (no dia da entrega)</td></tr>\n<tr><td>Bolo decorado</td><td>Massas assadas e cremes preparados (1-2 dias antes)</td><td>Montagem, cobertura e decoração final (véspera/manhã da entrega)</td></tr>\n</table></div>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1606757870492-9fc7cf1e736d?w=900&q=80\" alt=\"Bancada de confeitaria organizada com vários doces em produção simultânea\"><div class=\"ic\">Produção organizada de uma linha de doces variados para uma encomenda</div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-magnifying-glass\"></i> Lista de Controlo de Qualidade Antes da Entrega</h2>\n<p>Antes de qualquer encomenda sair da cozinha, um confeiteiro profissional confirma sistematicamente: o sabor está equilibrado e consistente entre unidades do mesmo tipo; a temperatura de conservação de cada item está correta até ao momento da entrega; a embalagem protege contra choques e variações de temperatura durante o transporte; a aparência de cada peça corresponde ao que foi combinado com o cliente; e todas as unidades do mesmo tipo têm tamanho e acabamento consistentes entre si, sinal de um processo controlado e não de produção apressada.</p>\n<div class=\"is\"><img src=\"https://images.unsplash.com/photo-1635888070574-beb32aa9b06d?w=900&q=80\" alt=\"Caixas de doces embaladas e prontas para entrega\"><div class=\"ic\">Encomenda embalada e organizada, pronta para transporte até ao evento</div></div>\n</div>\n<div class=\"tl\">\n<div class=\"tli\"><div class=\"tld\">1</div><div class=\"tlc\"><h4>Dia 1 — bases duráveis</h4><p>Ganache e moldagem de trufas, massas de tartaletes e de bolo, tudo o que aguenta vários dias de conservação.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">2</div><div class=\"tlc\"><h4>Dia 2 — cremes e montagem parcial</h4><p>Creme de confeiteiro, cremagens e cortes de bolo, recheios que precisam de tempo de refrigeração mas ainda não são o acabamento final.</p></div></div>\n<div class=\"tli\"><div class=\"tld\">3</div><div class=\"tlc\"><h4>Dia 3 (manhã da entrega) — acabamento final</h4><p>Recheio de fruta fresca nas tartaletes, decoração final do bolo, embalagem de todos os itens e controlo de qualidade antes do transporte.</p></div></div>\n</div>\n<div class=\"cb\"><h2><i class=\"fas fa-triangle-exclamation\"></i> Erro Comum: Deixar Tudo para o Último Dia</h2>\n<p>Um confeiteiro que decide preparar massas, cremes, montagem e decoração inteiramente na véspera da entrega sobrecarrega uma única etapa de trabalho com tarefas que, tecnicamente, exigem tempos de descanso e refrigeração distintos entre si. O resultado mais comum é uma queda visível na qualidade: cremes mal refrigerados, coberturas aplicadas antes do tempo, decoração apressada e, em casos mais graves, atraso na própria entrega.</p>\n<div class=\"hi\"><strong>Como evitar:</strong> planeia sempre um cronograma escalonado a partir do primeiro dia disponível, distribuindo cada tarefa de acordo com o prazo de conservação e o tempo de repouso técnico que cada componente exige.</div>\n</div>\n<div class=\"quiz\"><h3><i class=\"fas fa-circle-question\"></i> Verificação de Aprendizagem</h3>\n<div class=\"qq\">Um confeiteiro recebe uma encomenda com entrega marcada para sábado de manhã e decide preparar tudo — massas, cremes, montagem e decoração — apenas na sexta-feira à noite. Qual o maior risco desta decisão, considerando os princípios de planeamento apresentados nesta aula?</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">a) Nenhum risco relevante, desde que os ingredientes usados sejam de boa qualidade</div>\n<div class=\"qo\" onclick=\"cq(this,true)\">b) Sobrecarga de tempo numa única etapa, aumentando erros e comprometendo componentes que precisam de tempo de descanso ou refrigeração, além do acabamento final</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">c) O risco só existiria se a encomenda incluísse um bolo aerado</div>\n<div class=\"qo\" onclick=\"cq(this,false)\">d) O risco só existiria se a encomenda envolvesse temperagem de chocolate</div>\n</div>"}]};

          <div class="sbtn grey" onclick="nav('aluno')"><i class="fas fa-table-cells"></i> Todos os módulos</div>

function irAula(i){
  const m=moduloAtual, a=m.aulas[i]; aulaAtual=i;
  document.getElementById('lesson').innerHTML = `
  <div class="lesson">
    <div class="ltitle">Aula ${i+1} — ${a.t}</div>

    ${a.html}
    <div class="lnav">
      <button class="nb np" onclick="irAula(${i-1})" ${i===0?'disabled':''}><i class="fas fa-arrow-left"></i> Anterior</button>
      ${i<m.aulas.length-1
        ? `<button class="nb nn" onclick="irAula(${i+1})">Próxima aula <i class="fas fa-arrow-right"></i></button>`
        : `<button class="nb nn" onclick="abrirExame(${m.n})"><i class="fas fa-trophy"></i> Fazer exame do módulo</button>`}
    </div>
  </div>`;
  m.aulas.forEach((_,j)=>{
    document.getElementById('tb'+j).classList.toggle('active',j===i);
    document.getElementById('dt'+j).className='dot '+(j<i?'done':(j===i?'active':'todo'));
    document.getElementById('sl'+j).classList.toggle('act',j===i);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function cq(el,ok){
  el.closest('.quiz').querySelectorAll('.qo').forEach(o=>{o.onclick=null;o.style.cursor='default';});
  el.classList.add(ok?'ok':'no');
}

/* ───────── SISTEMA DE EXAMES ───────── */
function gerarExame(m){
  const perg=[];
  m.aulas.forEach(a=>{
    const re=/<div class="qq">(.*?)<\/div>\s*((?:<div class="qo"[\s\S]*?<\/div>\s*)+)/g;
    let mt;
    while((mt=re.exec(a.html))!==null){
      const q=mt[1];
      const opts=[]; let ok=-1;
      const ore=/<div class="qo" onclick="cq\(this,(true|false)\)">(.*?)<\/div>/g;
      let om,k=0;
      while((om=ore.exec(mt[2]))!==null){ if(om[1]==='true') ok=k; opts.push(om[2].replace(/^[a-z]\)\s*/,'')); k++; }
      if(opts.length&&ok>=0) perg.push({q,opts,ok});
    }
  });
  return perg;
}

let EXAME=null;
function abrirExame(n){
  const m=COURSE.find(x=>x.n===n);
  if(!m) return;
  EXAME={mod:m, perg:gerarExame(m)};
  document.getElementById('examMeta').textContent=`Módulo ${m.n}`;
  document.getElementById('examTitle').textContent=m.titulo;
  document.getElementById('examQCount').textContent=EXAME.perg.length;
  document.getElementById('examResult').classList.add('hidden');
  const body=document.getElementById('examBody');
  body.classList.remove('hidden');
  body.innerHTML = EXAME.perg.map((p,i)=>`
    <div class="question"><p>${i+1}. ${p.q}</p>
    ${p.opts.map((o,j)=>`<label class="option" onclick="selOpt(this)"><input type="radio" name="eq${i}" value="${j}"> ${o}</label>`).join('')}
    </div>`).join('')
    + `<button class="btn-login" onclick="submeterExame()"><i class="fas fa-paper-plane"></i> Enviar respostas</button>
       <button class="btn-logout" style="width:100%;margin-top:10px;background:#f0f4f8;color:#64748B;border:1px solid #e2e8f0" onclick="fecharExame()">Cancelar</button>`;
  document.getElementById('examOverlay').classList.add('open');
}
function selOpt(el){
  el.closest('.question').querySelectorAll('.option').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel'); el.querySelector('input').checked=true;
}
function submeterExame(){
  let cert=0;
  EXAME.perg.forEach((p,i)=>{
    const s=document.querySelector(`input[name="eq${i}"]:checked`);
    if(s&&parseInt(s.value)===p.ok) cert++;
  });
  const pct=Math.round(cert/EXAME.perg.length*100);
  const pass=pct>=70;
  const n=EXAME.mod.n;
  ST.notas[n]=pct;
  save();
  document.getElementById('examBody').classList.add('hidden');
  const r=document.getElementById('examResult');
  r.classList.remove('hidden');
  r.innerHTML=`
    <div class="res-ic">${pass?'🎉':'📚'}</div>
    <div class="res-score">${pct}%</div>
    <div class="res-lbl">${cert} de ${EXAME.perg.length} respostas correctas</div>
    <div class="res-verdict ${pass?'pass':'fail'}">
      <i class="fas fa-${pass?'circle-check':'circle-xmark'}"></i>
      ${pass?'Aprovado! Módulo certificado.':'Não atingiu 70%. Reveja o módulo e tente novamente.'}
    </div>
    <button class="btn-login" style="max-width:320px;margin:0 auto" onclick="fecharExame();nav('aluno')">
      <i class="fas fa-table-cells"></i> Voltar aos módulos</button>`;
}
function fecharExame(){ document.getElementById('examOverlay').classList.remove('open'); }
document.getElementById('examOverlay').addEventListener('click',e=>{ if(e.target.id==='examOverlay') fecharExame(); });
</script>
